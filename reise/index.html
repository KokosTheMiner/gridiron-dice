<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>Reisetagebuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#2b2420;--mut:#857a6e;--acc:#0e7c7b;--acc2:#e0603a;--line:#e6dccb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600}
header#top{position:sticky;top:0;z-index:50;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#title{flex:1;font:600 20px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:13px;color:var(--mut);white-space:nowrap}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:60}
nav#tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font:11px system-ui;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav#tabs button b{font-size:22px;line-height:1;font-weight:400;filter:grayscale(1);opacity:.7}
nav#tabs button.on{color:var(--acc);font-weight:700}
nav#tabs button.on b{filter:none;opacity:1}
nav#tabs .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 15px system-ui;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#ece2d0;color:var(--ink)}
.btn.warn{background:var(--acc2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
input,textarea,select{font:16px system-ui;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
input[type=time]{width:auto}
textarea{min-height:180px;font:17px/1.55 Georgia,serif;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label.ck{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:14px system-ui;color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.day{cursor:pointer}
.day .d{font:700 12px system-ui;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.day h3{margin:4px 0;font-size:19px}
.day p{margin:4px 0;color:#4a4038;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:Georgia,serif;white-space:pre-line}
.day.empty{opacity:.65;padding:10px 14px}
.strip{display:flex;gap:4px;overflow:hidden;margin-top:8px}
.strip img{height:62px;width:62px;object-fit:cover;border-radius:8px;flex:none;background:#eee7db}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .ph{position:relative;cursor:pointer}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:#eee7db}
.ph .fav{position:absolute;top:2px;right:5px;color:#ffd34d;text-shadow:0 0 3px #000;font-size:18px}
.ph .np{position:absolute;bottom:3px;left:5px;font-size:14px;text-shadow:0 0 3px #fff}
.ph .ed{position:absolute;bottom:3px;right:5px;font-size:13px;background:#fffc;border-radius:6px;padding:0 3px}
.ph.sel img{outline:4px solid var(--acc);outline-offset:-4px}
.ph .num{position:absolute;top:4px;left:4px;background:var(--acc);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font:700 13px system-ui}
#sheet{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none}
#sheet.open{display:block}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:500}
.shead h2{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{padding:12px 12px 60px;max-width:760px;margin:0 auto}
#map{height:calc(100vh - 230px);min-height:300px;border-radius:var(--r);border:1px solid var(--line)}
.minimap{height:220px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.dot{width:14px;height:14px;border-radius:50%;background:#bbb;flex:none}
.dot.live{background:#e0403a;animation:pulse 1.2s infinite}
.dot.bg{background:#2a9d8f}
@keyframes pulse{50%{opacity:.25}}
.badge{background:var(--acc2);color:#fff;border-radius:99px;padding:1px 7px;font:700 12px system-ui}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it.done .grow{text-decoration:line-through;opacity:.55}
.check{width:24px!important;height:24px;flex:none;accent-color:var(--acc)}
.x{border:0;background:none;font-size:18px;color:var(--mut);padding:4px 6px;cursor:pointer}
.com{background:#f3ece0;border-radius:12px;padding:8px 10px;margin:6px 0}
.com.own{background:#dff0ee}
.com b{font-size:13px}
.com .mut{font-size:12px}
.seg{display:flex;background:#ebe2d2;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;font:600 12px/1.25 system-ui;color:var(--mut);white-space:nowrap}
.seg button i{display:block;font-style:normal;font-size:18px}
.seg button.on{background:#fff;color:var(--ink)}
.pmark img{width:42px;height:42px;object-fit:cover;border:2px solid #fff;border-radius:8px;box-shadow:0 1px 5px #0007;background:#eee7db}
.emark{background:var(--acc2);color:#fff;border:2px solid #fff;border-radius:50%;display:grid!important;place-items:center;font:700 12px system-ui;box-shadow:0 1px 4px #0006}
.smark{background:#fff;border:2px solid var(--acc);border-radius:50%;display:grid!important;place-items:center;font-size:14px;box-shadow:0 1px 4px #0006}
#pv{position:fixed;inset:0;background:#000;z-index:250;display:none;flex-direction:column;color:#fff}
#pv.open{display:flex}
#pv .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#pv img{max-width:100%;max-height:100%;object-fit:contain}
#pv .bar{display:flex;gap:6px;padding:10px;flex-wrap:wrap;justify-content:center;background:#111}
#pv .bar .btn{background:#2a2a2a}
#pv .cap{padding:8px 12px;background:#111}
#pv .cap input{background:#222;color:#fff;border-color:#333}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 16px;border-radius:12px;z-index:900;font-size:15px;display:none;max-width:90vw;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:600 24px Georgia,serif}
.kpi span{font-size:13px;color:var(--mut)}
.bar2{height:8px;background:#ece2d0;border-radius:9px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--acc)}
.hero{background:linear-gradient(135deg,#0e7c7b,#2a9d8f);color:#fff;border:0}
.hero .mut{color:#d8f1ee}
.hero .btn{background:#fff;color:var(--acc)}
.note{background:#fff7e0;border-color:#f0dca0}
.mic.on{background:var(--acc2)!important;color:#fff!important}
.pbook{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pbook .pw{cursor:pointer}
.pbook .pw .mut{font-size:12px;text-align:center;margin-top:3px}
.who{font:700 12px system-ui;color:var(--acc);margin:14px 0 4px;display:flex;align-items:center;gap:6px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 11px system-ui;flex:none}
code.path{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;word-break:break-all;margin:6px 0}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tools .btn{text-align:left;padding:12px}
/* ---- Fotobuch-Seiten ---- */
.pg{position:relative;background:#fff;overflow:hidden;container-type:size;aspect-ratio:var(--ar,297/210);box-shadow:0 2px 10px #0003;color:#2b2420;font-family:Georgia,serif}
.pg .in{position:absolute;inset:0;display:grid;gap:2cqmin;padding:5cqmin;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.pg .pc{position:relative;min-height:0;min-width:0;overflow:hidden;background:#eee7db;border-radius:.5cqmin}
.pg .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg .pc .ph0{position:absolute;inset:0;display:grid;place-items:center;font:3cqmin system-ui;color:#a89b8a}
.pg .tx{overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pg .tt{font-size:6cqmin;margin:0 0 1cqmin;line-height:1.15;font-weight:600}
.pg .dt{font:700 2.4cqmin system-ui;color:#0e7c7b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.6cqmin}
.pg .bd{font-size:var(--fs,3.3cqmin);line-height:1.5;white-space:pre-wrap;overflow:hidden}
.pg .cp{position:absolute;left:0;right:0;bottom:0;padding:1.5cqmin 2.5cqmin;background:linear-gradient(transparent,#0008);color:#fff;font-size:2.6cqmin}
.l-text .in{padding:10cqmin 13cqmin}
.l-text1 .in,.l-photo2 .in{grid-template-columns:1fr 1fr}
.l-text2 .in{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.l-text2 .tx{grid-row:1/3;grid-column:2}
.l-photo1 .in,.l-cover .in{padding:0}
.l-photo3 .in{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.l-photo3 .in>:first-child{grid-row:1/3}
.l-photo4 .in{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.l-cover .pc{border-radius:0}
.l-cover .ov{position:absolute;left:0;right:0;bottom:0;padding:7cqmin 6cqmin 6cqmin;background:linear-gradient(transparent,#000b);color:#fff}
.l-cover .tt{font-size:10cqmin}
.l-cover .dt{color:#fff;opacity:.9}
.l-map .in{grid-template-rows:auto 1fr}
.l-map .tt{font-size:5cqmin}
.port.l-text1 .in,.port.l-photo2 .in{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.port.l-text2 .in{grid-template-columns:1fr 1fr;grid-template-rows:1.15fr 1fr}
.port.l-text2 .tx{grid-row:2;grid-column:1/3}
.port.l-photo3 .in{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr}
.port.l-photo3 .in>:first-child{grid-row:1;grid-column:1/3}
/* ---- Druckansicht ---- */
#print{position:fixed;inset:0;z-index:300;background:#d9d4cc;overflow:auto;display:none}
#print.open{display:block}
#print .pbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#2b2420;color:#fff;flex-wrap:wrap}
#print .pbar .grow{flex:1;font-size:14px}
#print .pages{padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
#print .pages .pg{width:min(100%,900px)}
.diary{background:#fff;max-width:800px;margin:14px auto;padding:30px 36px;font-family:Georgia,serif;color:#2b2420}
.diary h1{font-size:34px;margin:0}
.diary .dday{margin-top:28px}
.diary .dday h2{font-size:22px;margin:0 0 2px;break-after:avoid}
.diary .meta{font:13px system-ui;color:#857a6e;margin-bottom:8px;break-after:avoid}
.diary .txt{white-space:pre-wrap;line-height:1.6;font-size:15px}
.diary .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.diary .pics img{width:100%;aspect-ratio:4/3;object-fit:cover;break-inside:avoid;display:block}
.diary .cm{font:13px system-ui;color:#555;margin-top:6px;border-left:3px solid #e6dccb;padding-left:8px}
.diary .mapimg{width:100%;margin:14px 0;border-radius:6px}
/* ---- Diashow ---- */
#show{position:fixed;inset:0;z-index:400;background:#000;display:none;overflow:hidden;color:#fff;cursor:pointer}
#show.open{display:block}
#show .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
#show .sl.vis{opacity:1}
#show .sl img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:kb var(--dur,5s) ease-out forwards;transform-origin:var(--ox,50%) var(--oy,50%)}
#show .sl img.blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(30px) brightness(.45)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(var(--z,1.12))}}
#show .cap{position:absolute;z-index:1000;left:0;right:0;bottom:0;padding:40px 24px 28px;background:linear-gradient(transparent,#000a);font:20px/1.4 Georgia,serif;text-align:center}
#show .card2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#show .card2 .k{font:700 15px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#7fd6cf;margin-bottom:12px}
#show .card2 h1{font-size:clamp(34px,8vw,80px);margin:0 0 10px;line-height:1.1}
#show .card2 .s{font-size:clamp(16px,3vw,24px);opacity:.85}
#show .smap{position:absolute;inset:0}
#show .ctl{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;padding:12px;justify-content:center;background:linear-gradient(#000a,transparent);transition:opacity .3s;flex-wrap:wrap}
#show .ctl.hide{opacity:0;pointer-events:none}
#show .ctl .btn{background:#ffffff22;color:#fff;backdrop-filter:blur(4px)}
#show .prog{position:absolute;left:0;bottom:0;height:3px;background:#7fd6cf;transition:width .3s}
/* ---- Freunde-Ansicht ---- */
.vhead{text-align:center;padding:26px 10px 10px}
.vhead h1{margin:0;font-size:30px}
.vpics{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:10px}
.vpics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:pointer;background:#eee7db}
.vpics img:first-child:nth-last-child(odd){grid-column:1/3;aspect-ratio:16/10}
.likes{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:15px;cursor:pointer}
.likes.on{background:#fde3dc;border-color:#f3b4a2}
@media print{
  body>*:not(#print){display:none!important}
  html,body{background:#fff}
  #print{position:static;display:block!important;background:#fff;overflow:visible}
  #print .pbar{display:none}
  #print .pages{padding:0;gap:0;display:block}
  #print .pages .pg{width:var(--pw);height:var(--ph);aspect-ratio:auto;box-shadow:none;break-after:page;page-break-after:always}
  .diary{margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<header id="top">
  <div id="title">Reisetagebuch</div>
  <span id="sync"></span>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="tage"><b>📖</b>Tagebuch</button>
  <button data-tab="karte"><b>🗺️</b>Karte</button>
  <button data-tab="fotos"><b>📷</b>Fotos</button>
  <button data-tab="plan"><b>🧭</b>Planen</button>
  <button data-tab="mehr"><b>☰</b>Mehr</button>
</nav>
<div id="sheet"></div>
<div id="pv"></div>
<div id="print"></div>
<div id="show"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="camPick" accept="image/*" capture="environment" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>
<input type="file" id="gpxPick" accept=".gpx,application/gpx+xml,text/xml" hidden>
<input type="file" id="musicPick" accept="audio/*" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ================= Grundlagen ================= */
const FB = (localStorage.rt_db || "https://nfl-tippspiel-df32c-default-rtdb.europe-west1.firebasedatabase.app").replace(/\/+$/,"");
const FB_BASE = "tippspiel/reise";
const PAGES_URL = "https://kokostheminer.github.io/gridiron-dice/reise/";
const HS_URL = "https://heimserver.tail3903ae.ts.net/reise/";
const ON_HS = /heimserver|^192\.168\.133\.167$/.test(location.hostname);
const SRV = (ON_HS ? location.origin : (localStorage.rt_srv || "")).replace(/\/+$/,"");
const TILE = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const GEO_URL = "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_110m_admin_0_countries.geojson";
const COLORS = ["#0e7c7b","#e0603a","#6b5bd2","#c48a12"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (n=10) => { const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const pad = n => String(n).padStart(2,"0");
const ymd = d => { d = new Date(d); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const today = () => ymd(new Date());
const dayDate = s => new Date(s+"T12:00");
const fmtDay = (s,o={weekday:"long",day:"numeric",month:"long"}) => dayDate(s).toLocaleDateString("de-AT",o);
const fmtShort = s => dayDate(s).toLocaleDateString("de-AT",{day:"numeric",month:"short"});
const fmtDT = t => new Date(t).toLocaleString("de-AT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const daysBetween = (a,b) => { const r=[]; const d=dayDate(a), e=dayDate(b); while (d<=e && r.length<400) { r.push(ymd(d)); d.setDate(d.getDate()+1); } return r; };
const diffDays = (a,b) => Math.round((dayDate(b)-dayDate(a))/864e5);
const num = (x,d=0) => Number(x||0).toLocaleString("de-AT",{minimumFractionDigits:d,maximumFractionDigits:d});
const flag = cc => cc&&cc.length===2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))) : "🏳️";
function dist(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r; const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none", ms); }
const debounce = (fn,ms) => { let h; return (...a) => { clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; };
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };
const MOODS = ["😄","🙂","😌","😐","😴","🥵","🥶","😢","🤩","❤️"];
const WMO = c => c==null ? "" : c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌧️":c<=86?"🌨️":"⛈️";
const CATS = ["🍝 Essen","🛏️ Unterkunft","🚗 Transport","🎟️ Eintritt","🛍️ Einkauf","☕ Sonstiges"];

const SYNC = ["trips","entries","texts","photos","plan","money","track"];
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("reisetagebuch",2);
    r.onupgradeneeded=()=>{ const d=r.result;
      for (const n of [...d.objectStoreNames]) d.deleteObjectStore(n);
      for (const s of ["trips","blobs","orig","kv"]) d.createObjectStore(s,{keyPath:"id"});
      for (const s of ["entries","texts","photos","plan","money","track"]) d.createObjectStore(s,{keyPath:"id"}).createIndex("trip","trip"); };
    r.onsuccess=()=>{ DB.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  req(store,mode,fn){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,mode); const q=fn(tx.objectStore(store)); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); },
  all(s){ return DB.req(s,"readonly",o=>o.getAll()); },
  byTrip(s,trip){ return DB.req(s,"readonly",o=>o.index("trip").getAll(trip)); },
  get(s,id){ return DB.req(s,"readonly",o=>o.get(id)); },
  put(s,v){ return DB.req(s,"readwrite",o=>o.put(v)); },
  del(s,id){ return DB.req(s,"readwrite",o=>o.delete(id)); },
};

async function sync(){
  if (!SRV||!S.trip||!S.trip.key||!me||syncing||!navigator.onLine) return;
  syncing=true; const t=S.trip; let changed=false;
  try{
    if (!LS.get("rt_srvtrip_"+t.id,false)){ await api("create",{method:"POST",body:JSON.stringify({title:t.title})}); LS.set("rt_srvtrip_"+t.id,true); }
    // 1. eigene Änderungen hochladen
    const out=[]; for (const s of SYNC){ const all = s==="trips" ? [await DB.get("trips",t.id)] : await DB.byTrip(s,t.id); for (const r of all) if (r && !r.sy) out.push([s,r]); }
    for (let i=0;i<out.length;i+=400){ const chunk=out.slice(i,i+400);
      await api("changes",{method:"POST",body:JSON.stringify({au:me.id,an:me.name,recs:chunk.map(([s,r])=>{ const {sy,...data}=r; return r.del?{s,id:r.id,upd:r.upd,del:1}:{s,id:r.id,upd:r.upd,data}; })})});
      for (const [s,r] of chunk){ const cur=await DB.get(s,r.id); if (cur && cur.upd===r.upd){ cur.sy=1; await DB.put(s,cur); } } }
    // 2. Änderungen der anderen holen
    let since=+localStorage["rt_seq_"+t.id]||0, more=true, res;
    while (more){ res=await (await api("changes?since="+since)).json();
      for (const rec of res.recs){ const local=await DB.get(rec.s,rec.id);
        if (local && !local.sy && local.upd>rec.upd) continue;
        if (local && local.sy && local.upd===rec.upd) continue;
        await DB.put(rec.s, rec.del ? {id:rec.id,trip:t.id,del:1,upd:rec.upd,sy:1} : {...rec.data,upd:rec.upd,sy:1}); changed=true; }
      since=res.seq; more=res.more; localStorage["rt_seq_"+t.id]=since; }
    S.files=res.files||{}; if (res.folder) localStorage["rt_folder_"+t.id]=res.folder; S.members=res.members||{};
    srvOk=true; setSync(out.length||changed?"✓ abgeglichen":"✓");
    if (changed){ S.mapImg=null; if (busy()) needReload=true; else { await loadTrips(); await loadTrip(t.id); render(); } }
    fileJobs().catch(e=>console.warn(e));
  }catch(e){ srvOk=false; setSync("⚠ Heimserver nicht erreichbar"); console.warn(e); }
  syncing=false;
}

      const needEd = p.ed && (!b || b.ed!==p.ed), unEd = !p.ed && b && b.ed;
      if ((!p.th || needEd || unEd) && n<15 && (f.includes("o")||f.includes("e")||f.includes("a"))){

        const bmp=await createImageBitmap(await r.blob());
        const blob=await resize(bmp,2400,0.86), th=await resize(bmp,420,0.72,true); p.w=p.w||bmp.width; p.h=p.h||bmp.height; bmp.close&&bmp.close();
        await DB.put("blobs",{id:p.id,b:blob,ed:p.ed||0}); if (blobUrls[p.id]) { URL.revokeObjectURL(blobUrls[p.id]); delete blobUrls[p.id]; }
        p.th=th; await put("photos",p);
        if (!(S.files[p.id]||"").includes("a") && !p.ed){ await api(`file/${p.id}?v=app`,{method:"PUT",body:blob}); S.files[p.id]+="a"; }
        if (!busy()) render(); else needRender=true;
      }
    }
    if (n) setSync("✓ abgeglichen");
  }catch(e){ console.warn(e); }
  jobsRunning=false;
}

function exif(buf){
  try{ const v=new DataView(buf); if (v.getUint16(0)!==0xFFD8) return {}; let o=2;
    while (o < v.byteLength-10){ const m=v.getUint16(o); if ((m&0xFF00)!==0xFF00) break; if (m===0xFFE1 && v.getUint32(o+4)===0x45786966) return tiff(v,o+10); o += 2+v.getUint16(o+2); }
  }catch(e){} return {};
}
function tiff(v,t){
  const le=v.getUint16(t)===0x4949, u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le), SZ={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  const ifd=off=>{ const n=u16(t+off), r={}; for (let i=0;i<n;i++){ const e=t+off+2+i*12, type=u16(e+2), cnt=u32(e+4); r[u16(e)]={type,cnt,vo:(SZ[type]||1)*cnt>4 ? t+u32(e+8) : e+8}; } return r; };
  const str=x=>{ let s=""; for (let i=0;i<x.cnt-1;i++) s+=String.fromCharCode(v.getUint8(x.vo+i)); return s; };
  const rat=(x,i)=>u32(x.vo+i*8)/(u32(x.vo+i*8+4)||1);
  const out={}, i0=ifd(u32(t+4));
  if (i0[0x8769]) { const ex=ifd(u32(i0[0x8769].vo)); if (ex[0x9003]) out.date=str(ex[0x9003]); }
  if (!out.date && i0[0x0132]) out.date=str(i0[0x0132]);
  if (i0[0x8825]) { const g=ifd(u32(i0[0x8825].vo));
    if (g[2]&&g[4]&&g[2].cnt===3) { const dms=x=>rat(x,0)+rat(x,1)/60+rat(x,2)/3600; let lat=dms(g[2]), lon=dms(g[4]);
      if (g[1] && String.fromCharCode(v.getUint8(g[1].vo))==="S") lat=-lat; if (g[3] && String.fromCharCode(v.getUint8(g[3].vo))==="W") lon=-lon;
      if (lat||lon) { out.lat=lat; out.lon=lon; } } }
  if (out.date) { const m=out.date.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):?(\d\d)?/); out.t = m ? new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime() : null; }
  return out;
}
async function resize(src, max, q, asDataUrl){
  const w0=src.width, h0=src.height, k=Math.min(1, max/Math.max(w0,h0));
  const c=document.createElement("canvas"); c.width=Math.round(w0*k); c.height=Math.round(h0*k);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  if (asDataUrl) return c.toDataURL("image/jpeg",q);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
function nearestTrack(t){ let best=null, bd=Infinity; for (const p of S.track){ const d=Math.abs(p.t-t); if (d<bd){ bd=d; best=p; } } return bd<45*60000 ? best : null; }
async function addPhotos(files, forcedDay){
  if (!files.length) return;
  toast(`📷 ${files.length} Foto(s) werden eingelesen …`, 60000);
  let n=0; const days=new Set();
  for (const f of files){
    try{
      const ex = exif(await f.slice(0,256*1024).arrayBuffer());
      const bmp = await createImageBitmap(f);
      const blob = await resize(bmp, 2400, 0.86), th = await resize(bmp, 420, 0.72, true);
      const t = ex.t || f.lastModified || Date.now(), d = forcedDay || ymd(t);
      const p = { id:uid(12), trip:S.trip.id, d, t, th, w:bmp.width, h:bmp.height, cap:"", fav:false, ed:0 };
      bmp.close && bmp.close();
      if (ex.lat!=null){ p.lat=ex.lat; p.lon=ex.lon; }
      else { const tp=nearestTrack(t); if (tp){ p.lat=tp.lat; p.lon=tp.lon; } else { const e=entryOf(d); if (e&&e.pl){ p.lat=e.pl.lat; p.lon=e.pl.lon; } } }
      await DB.put("blobs",{id:p.id,b:blob,ed:0});
      if (SRV) await DB.put("orig",{id:p.id,b:f,name:f.name||"foto.jpg"});
      await put("photos",p); S.photos.push(p); n++; days.add(d);
    }catch(e){ console.error(e); }
  }
  toast(`✅ ${n} Foto(s) hinzugefügt`+(days.size>1?` (nach Aufnahmedatum auf ${days.size} Tage verteilt)`:""));
  markDirty(); return n;
}
const blobUrls={};
async function fullUrl(id){
  const p=byId(id); const r=await DB.get("blobs",id);
  if (r && (!p || (r.ed||0)===(p.ed||0))) return blobUrls[id] || (blobUrls[id]=URL.createObjectURL(r.b));
  if (SRV && navigator.onLine) return fileUrl(id, p&&p.ed?"best":"view");
  if (r) return blobUrls[id] || (blobUrls[id]=URL.createObjectURL(r.b));
  return p ? p.th : "";
}
async function printUrl(id){ const f=S.files[id]||""; if (SRV && srvOk && (f.includes("e")||f.includes("o"))) return fileUrl(id,"best"); return fullUrl(id); }
async function photoBlob(id){ const p=byId(id), r=await DB.get("blobs",id); if (r && (r.ed||0)===((p&&p.ed)||0)) return r.b; if (SRV){ const x=await fetch(fileUrl(id,p&&p.ed?"best":"view")); if (x.ok) return x.blob(); } return r?r.b:null; }

    return { name: a.city||a.town||a.village||a.hamlet||a.suburb||a.municipality||a.county||j.name||"", country:a.country||"", cc:(a.country_code||"").toUpperCase() };

async function weatherFor(d,lat,lon){
  const age=diffDays(d,today()); if (age<-14) return null;
  const base = age>80 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  const r=await fetch(`${base}?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${d}&end_date=${d}`);
  const j=await r.json(); if (!j.daily) return null;
  return { c:j.daily.weather_code[0], max:Math.round(j.daily.temperature_2m_max[0]), min:Math.round(j.daily.temperature_2m_min[0]) };
}

/* ================= GPS-Aufzeichnung ================= */
let watchId=null, wakeLock=null, lastFix=null;
const tracking = () => watchId!==null;
const bgGps = () => localStorage.rt_bg==="1";
async function startTracking(quiet){
  if (!navigator.geolocation||!S.trip) return quiet||toast("Dieses Gerät hat kein GPS");
  if (tracking()) return;
  localStorage.rt_tracking=S.trip.id;
  watchId = navigator.geolocation.watchPosition(onFix, err=>{ if (!quiet||err.code===1) toast("GPS: "+(err.code===1?"Standort-Zugriff verweigert – bitte in den Browser-Einstellungen erlauben":err.message)); if (err.code===1) stopTracking(); }, {enableHighAccuracy:true,maximumAge:5000,timeout:60000});
  if (localStorage.rt_wake!=="0") requestWake();
  if (!busy()) render();
}
async function requestWake(){ try{ if ("wakeLock" in navigator && document.visibilityState==="visible" && tracking()) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function stopTracking(){ if (watchId!==null) navigator.geolocation.clearWatch(watchId); watchId=null; localStorage.removeItem("rt_tracking"); localStorage["rt_trkoff_"+today()]="1"; try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; render(); }
function autoTrack(){ if (!S.trip||!me||tracking()||phase()!=="waehrend"||bgGps()) return; if (localStorage.rt_auto==="0"||localStorage["rt_trkoff_"+today()]) return; startTracking(true); }
async function onFix(p){
  const c=p.coords; lastFix={lat:c.latitude,lon:c.longitude,acc:c.accuracy,t:p.timestamp};
  if (c.accuracy>75 || !me) return updTrackInfo();
  const mine=S.track.filter(x=>x.au===me.id), last=mine[mine.length-1];
  const pt={id:`${me.id}_${p.timestamp}`,trip:S.trip.id,t:p.timestamp,lat:+c.latitude.toFixed(6),lon:+c.longitude.toFixed(6),acc:Math.round(c.accuracy)};
  if (c.altitude!=null) pt.alt=Math.round(c.altitude);
  if (last && !last.stop){ const dd=dist(last,pt); if (dd<Math.max(12,c.accuracy*0.8) && p.timestamp-last.t<5*60000) return updTrackInfo(); }
  await put("track",pt); S.track.push(pt); updTrackInfo();
  if (S.tab==="karte" && liveLine) liveLine.addLatLng([pt.lat,pt.lon]);
}
function segments(pts){ const by={}; for (const p of pts) (by[p.au||"x"]=by[p.au||"x"]||[]).push(p); const segs=[];
  for (const [au,list] of Object.entries(by)){ list.sort((a,b)=>a.t-b.t); let cur=[]; for (const p of list){ const prev=cur[cur.length-1]; if (prev && (p.t-prev.t>40*60000 || dist(prev,p)>30000)) { if (cur.length) segs.push(Object.assign(cur,{au})); cur=[]; } cur.push(p); } if (cur.length) segs.push(Object.assign(cur,{au})); }
  return segs; }
function km(pts){ const per={}; for (const s of segments(pts)) { let m=0; for (let i=1;i<s.length;i++) m+=dist(s[i-1],s[i]); per[s.au]=(per[s.au]||0)+m; } return Math.max(0,...Object.values(per))/1000; }

/* ================= Statische Karte (Druck, Fotobuch) ================= */
async function staticMap(segs, marks, W, H){
  const pts=[...segs.flat(), ...marks]; if (!pts.length) return null;
  const px=(lat,lon,z)=>{ const n=256*2**z, s=Math.sin(lat*Math.PI/180); return [ (lon+180)/360*n, (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n ]; };
  let la0=90,la1=-90,lo0=180,lo1=-180; for (const p of pts){ la0=Math.min(la0,p.lat); la1=Math.max(la1,p.lat); lo0=Math.min(lo0,p.lon); lo1=Math.max(lo1,p.lon); }
  let z=15; const padd=60;
  while (z>2){ const a=px(la1,lo0,z), b=px(la0,lo1,z); if (b[0]-a[0] <= W-2*padd && b[1]-a[1] <= H-2*padd) break; z--; }
  const a=px(la1,lo0,z), b=px(la0,lo1,z), cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2, x0=cx-W/2, y0=cy-H/2, n=2**z;
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); g.fillStyle="#eee7db"; g.fillRect(0,0,W,H);
  const jobs=[];
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue;
    jobs.push(new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>{ g.drawImage(im, tx*256-x0, ty*256-y0); res(); }; im.onerror=res; im.src=TILE.replace("{z}",z).replace("{x}",((tx%n)+n)%n).replace("{y}",ty); }));
  }
  await Promise.race([Promise.all(jobs), new Promise(r=>setTimeout(r,12000))]);
  g.fillStyle="rgba(255,253,248,.25)"; g.fillRect(0,0,W,H); g.lineJoin=g.lineCap="round";
  for (const s of segs){ if (s.length<2) continue; for (const [w,col] of [[13,"#fff"],[7,colorOf(s.au)]]){ g.lineWidth=w; g.strokeStyle=col; g.beginPath(); s.forEach((p,i)=>{ const q=px(p.lat,p.lon,z); i?g.lineTo(q[0]-x0,q[1]-y0):g.moveTo(q[0]-x0,q[1]-y0); }); g.stroke(); } }
  g.font="600 22px Georgia, serif"; g.textBaseline="middle";
  for (const m of marks){ const q=px(m.lat,m.lon,z), X=q[0]-x0, Y=q[1]-y0; g.fillStyle="#e0603a"; g.strokeStyle="#fff"; g.lineWidth=4; g.beginPath(); g.arc(X,Y,10,0,7); g.fill(); g.stroke();
    if (m.label){ g.lineWidth=6; g.strokeStyle="rgba(255,255,255,.9)"; g.strokeText(m.label,X+16,Y); g.fillStyle="#2b2420"; g.fillText(m.label,X+16,Y); } }
  g.font="14px system-ui"; g.fillStyle="rgba(255,255,255,.8)"; const at="© OpenStreetMap"; const tw=g.measureText(at).width; g.fillRect(W-tw-12,H-22,tw+12,22); g.fillStyle="#555"; g.fillText(at,W-tw-6,H-11);
  try{ return c.toDataURL("image/jpeg",0.9); }catch(e){ return null; }
}
function routeMarks(){ const seen=new Set(), marks=[]; for (const e of [...S.entries].sort((a,b)=>a.d.localeCompare(b.d))) if (e.pl&&e.pl.name&&!seen.has(e.pl.name)){ seen.add(e.pl.name); marks.push({lat:e.pl.lat,lon:e.pl.lon,label:e.pl.name}); }
  for (const p of S.track) if (p.stop&&!seen.has(p.stop)){ seen.add(p.stop); marks.push({lat:p.lat,lon:p.lon,label:p.stop}); } return marks; }
async function tripMapImg(){ if (S.mapImg) return S.mapImg; const segs=segments(S.track.filter(p=>!p.stop)); let marks=routeMarks(); if (!segs.length&&!marks.length) marks=S.photos.filter(p=>p.lat!=null).map(p=>({lat:p.lat,lon:p.lon}));

async function fb(path, method="GET", body){

  if (!r.ok) throw new Error(r.status===401||r.status===403 ? "Server verweigert den Zugriff" : "Server-Fehler "+r.status);

}

const autoPublish = debounce(()=>{ if (S.trip&&S.trip.share&&S.trip.share.on&&navigator.onLine) publish(true); }, 10000);
let publishing=false;
async function publish(silent){
  const t=S.trip; if (!t||!t.share||!t.share.on||publishing) return; publishing=true; setSync("⏳ teile …");
  try{
    const code=t.share.code, up=t.share.up||(t.share.up={});
    const sh=S.entries.filter(e=>e.sh).sort((a,b)=>a.d.localeCompare(b.d));
    const E={}, need=new Set();
    for (const e of sh){ const ph=photosOf(e.d).filter(p=>!p.np); ph.forEach(p=>need.add(p.id+"_"+(p.ed||0)));
      E[e.id]={d:e.d,ti:e.ti||"",x:dayText(e.d),m:dayMoods(e.d),w:e.w||null,pl:e.pl&&e.pl.name?e.pl.name+(e.pl.country?", "+e.pl.country:""):"",ph:ph.map(p=>({i:p.id+"_"+(p.ed||0),c:p.cap||""}))}; }
    await fb(code+"/t","PUT",{ti:t.title,a:t.start,b:t.end,o:t.share.name||"",u:{".sv":"timestamp"}});
    await fb(code+"/e","PUT",E);
    let k=0, upChanged=false;
    for (const key of need){ if (up[key]) continue; const id=key.split("_")[0]; const b=await photoBlob(id); if (!b) continue;
      const bmp=await createImageBitmap(b); const du=await resize(bmp,1400,0.74,true); bmp.close&&bmp.close();
      await fb(code+"/p/"+key,"PUT",du); up[key]=1; upChanged=true; k++; setSync(`⏳ Foto ${k} …`); }
    for (const key of Object.keys(up)) if (!need.has(key)){ await fb(code+"/p/"+key,"DELETE"); delete up[key]; upChanged=true; }
    if (t.share.route){ const sg=segments(S.track.filter(p=>!p.stop)), tot=sg.reduce((s,x)=>s+x.length,0)||1;
      const segs=sg.filter(s=>s.length>1).map(s=>thin(s,Math.max(2,Math.round(1500*s.length/tot))).map(p=>[+p.lat.toFixed(5),+p.lon.toFixed(5)]));
      await fb(code+"/r","PUT",segs.length?segs:null); } else await fb(code+"/r","DELETE");
    t.share.last=Date.now(); await saveTrip(); dirty=false; setSync("✓ geteilt");
    if (!silent) toast(`✅ ${sh.length} Tag(e) für Freunde aktualisiert`);
  }catch(e){ setSync("⚠ nicht geteilt"); if (!silent) toast("Teilen fehlgeschlagen: "+e.message, 5000); }
  publishing=false;
}
function thin(s,max){ if (s.length<=max) return s; const st=s.length/max, r=[]; for (let i=0;i<s.length;i+=st) r.push(s[Math.floor(i)]); r.push(s[s.length-1]); return r; }

function b64ToU8(s){ const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }

      document.querySelectorAll("#sheet textarea[data-tid]").forEach(ta=>{ ta.oninput=()=>{ const id=ta.dataset.tid, x=tmap[id]; x.x=ta.value; (saveT[id]=saveT[id]||debounce(()=>saveText(x),600))(); }; });
      const sh=$("#eSh"); if (sh) sh.onchange=()=>{ cur.sh=sh.checked; saveEntry(cur); openDay(d); };
    });
  if (sharing && S.comments[e.id]) markSeen();
  if (!e.pl && d===today() && navigator.permissions){ try{ const st=await navigator.permissions.query({name:"geolocation"}); if (st.state==="granted") fetchMeta(true); }catch(x){} }
  else if (e.pl && !e.w) fetchMeta(true);
}
function metaTxt(e){ return (e.pl?`📍 ${esc(e.pl.name||"Standort")}${e.pl.country?", "+esc(e.pl.country):""}`:`<span class="mut">noch kein Ort</span>`)+(e.w?` · ${WMO(e.w.c)} ${e.w.min}° / ${e.w.max}°`:""); }

async function fetchMeta(quiet){
  const e=cur; if (!e) return;
  try{
    let pos=dayPos(e.d); if (!pos && e.d===today()) pos=await getPos();
    if (!pos){ if (!quiet) toast("Für diesen Tag gibt es keinen Standort (keine Route, keine Fotos mit Ort)"); return; }
    if (!e.pl){ const g=await geoName(pos.lat,pos.lon); e.pl={lat:pos.lat,lon:pos.lon,name:g.name,country:g.country,cc:g.cc}; }
    if (!e.w){ try{ e.w=await weatherFor(e.d,e.pl.lat,e.pl.lon); }catch(x){} }
    await saveEntry(e); const m=$("#eMeta"); if (m&&cur===e) m.innerHTML=metaTxt(e);
  }catch(err){ if (!quiet) toast("Standort nicht verfügbar: "+(err.message||err)); }
}
function dictate(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) return toast("Diktieren geht hier nicht – nutze das 🎤 auf der Handy-Tastatur");
  if (rec){ rec.stop(); return; }
  rec=new SR(); rec.lang="de-AT"; rec.continuous=true; rec.interimResults=false;
  btn.classList.add("on"); btn.textContent="⏹ Stopp";
  rec.onresult=ev=>{ const ta=$("#eX"); for (let i=ev.resultIndex;i<ev.results.length;i++) if (ev.results[i].isFinal){ let s=ev.results[i][0].transcript.trim(); if (!s) continue; const v=ta.value; s=(v&&!/\s$/.test(v)?" ":"")+s.charAt(0).toUpperCase()+s.slice(1); ta.value=v+s; } ta.oninput(); };
  rec.onend=()=>{ rec=null; btn.classList.remove("on"); btn.textContent="🎤 Diktieren"; };
  rec.onerror=ev=>toast("Diktieren: "+ev.error);
  rec.start();
}

  for (const p of S.photos.filter(p=>p.lat!=null&&sel(p.d))){ bounds.push([p.lat,p.lon]); L.marker([p.lat,p.lon],{icon:L.divIcon({className:"pmark",html:`<img src="${p.th||""}">`,iconSize:[42,42]})}).addTo(map).on("click",()=>viewPhoto(p.id,S.photos.filter(x=>x.lat!=null&&sel(x.d)).map(x=>x.id))); }
  if (!S.mapDay) for (const p of S.plan.filter(p=>p.k==="ort"&&p.lat!=null)){ L.circleMarker([p.lat,p.lon],{radius:7,color:"#e0603a",fillColor:p.done?"#ccc":"#ffd34d",fillOpacity:1,weight:2}).addTo(map).bindPopup(`☆ ${esc(p.ti)}${p.done?" ✓":""}`); if (!bounds.length) bounds.push([p.lat,p.lon]); }

const FMT={a4q:{ar:"297/210",w:"297mm",h:"210mm",n:"A4 quer"},a4h:{ar:"210/297",w:"210mm",h:"297mm",n:"A4 hoch"},q21:{ar:"1/1",w:"210mm",h:"210mm",n:"Quadrat 21 cm"}};
const LAYS={cover:"Titelseite",map:"Routenkarte",text:"Nur Text",text1:"Text + 1 Foto",text2:"Text + 2 Fotos",photo1:"1 großes Foto",photo2:"2 Fotos",photo3:"3 Fotos",photo4:"4 Fotos"};
const LAYN={cover:1,map:0,text:0,text1:1,text2:2,photo1:1,photo2:2,photo3:3,photo4:4};
function autoBook(fmt){
  const t=S.trip, pages=[], favs=S.photos.filter(p=>p.fav);
  const cover=(favs[0]||S.photos[0]); pages.push({id:uid(),lay:"cover",ph:cover?[cover.id]:[],ti:t.title,x:`${fmtDay(t.start,{day:"numeric",month:"long"})} – ${fmtDay(t.end,{day:"numeric",month:"long",year:"numeric"})}`});
  if (S.track.length||S.entries.some(e=>e.pl)) pages.push({id:uid(),lay:"map",ti:"Unsere Route"});
  for (const d of tripDays()){
    if (!hasDay(d)) continue; const e=entryOf(d); let ph=photosOf(d);
    const f=ph.filter(p=>p.fav); ph = f.length ? f : ph.slice(0,6);
    const txt=dayText(d), n=diffDays(t.start,d)+1;
    const head={id:uid(),d,ti:(e&&e.ti)||(e&&e.pl&&e.pl.name)||fmtDay(d),x:txt,dt:`Tag ${n} · ${fmtDay(d)}`};
    if (txt.length>1400||!ph.length) pages.push({...head,lay:"text",ph:[]});
    else { const k=txt.length>700?1:Math.min(2,ph.length); pages.push({...head,lay:k===1?"text1":"text2",ph:ph.splice(0,k).map(p=>p.id)}); }
    while (ph.length){ const k=ph.length>=4?4:ph.length; pages.push({id:uid(),d,lay:"photo"+k,ph:ph.splice(0,k).map(p=>p.id)}); }
  }
  t.book={fmt:fmt||"a4q",pages}; saveTrip();
}
function pageHTML(pg, fmt, src){

  const pics=Array.from({length:n},(_,i)=>{ const p=byId(ph[i]); return `<div class="pc">${p?`<img src="${src(p)}" alt="">${pg.lay==="photo1"&&p.cap?`<div class="cp">${esc(p.cap)}</div>`:""}`:`<div class="ph0">Foto wählen</div>`}</div>`; }).join("");
  const tx=`<div class="tx">${pg.dt?`<div class="dt">${esc(pg.dt)}</div>`:""}${pg.ti?`<div class="tt">${esc(pg.ti)}</div>`:""}${pg.x?`<div class="bd">${esc(pg.x)}</div>`:""}</div>`;
  let inner;
  if (pg.lay==="cover") inner=`${pics}<div class="ov"><div class="tt">${esc(pg.ti||"")}</div><div class="dt">${esc(pg.x||"")}</div></div>`;
  else if (pg.lay==="map") inner=`<div class="tt">${esc(pg.ti||"Unsere Route")}</div><div class="pc">${S.mapImg?`<img src="${S.mapImg}" alt="">`:`<div class="ph0">Karte wird erstellt …</div>`}</div>`;

  return `<div class="pg l-${pg.lay} ${fmt==="a4h"?"port":""}" style="--ar:${FMT[fmt].ar}"><div class="in">${inner}</div></div>`;
}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function coverDraw(g,im,x,y,w,h){ const k=Math.max(w/im.width,h/im.height), sw=w/k, sh=h/k; g.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,w,h); }
function wrap(g,text,maxW){ const out=[]; for (const para of String(text).split("\n")){ let line=""; for (const w of para.split(/\s+/)){ const t=line?line+" "+w:w; if (g.measureText(t).width>maxW&&line){ out.push(line); line=w; } else line=t; } out.push(line); } return out; }

  } else {

    g.fillStyle="#fff"; g.shadowColor="rgba(0,0,0,.25)"; g.shadowBlur=20; g.fillRect(50,60,1000,1080); g.shadowBlur=0;
    coverDraw(g,im,70,80,960,1040);
    g.strokeStyle="#d8ccb6"; g.lineWidth=3; g.beginPath(); g.moveTo(1110,120); g.lineTo(1110,1080); g.stroke();
    // Briefmarke
    const sx=1540,sy=70,sw=200,sh=240; g.fillStyle="#fff"; g.fillRect(sx,sy,sw,sh);

    coverDraw(g,im,sx+16,sy+16,sw-32,sh-80); g.fillStyle="#2b2420"; g.textAlign="center"; g.font="bold 26px system-ui"; g.fillText(flag(P.cc)+" "+(P.country||"").toUpperCase().slice(0,12),sx+sw/2,sy+sh-26);
    // Poststempel
    g.save(); g.translate(1470,250); g.rotate(-0.25); g.strokeStyle="rgba(40,60,120,.55)"; g.lineWidth=5; g.beginPath(); g.arc(0,0,95,0,7); g.stroke(); g.beginPath(); g.arc(0,0,72,0,7); g.stroke();
    g.fillStyle="rgba(40,60,120,.6)"; g.font="bold 24px system-ui"; g.textAlign="center"; g.fillText((P.place||"").toUpperCase().slice(0,12),0,-8); g.font="20px system-ui"; g.fillText(dateTxt,0,24);

    g.restore();

function animateMap(div,dur){
  const m=L.map(div,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false}); L.tileLayer(TILE,{maxZoom:17}).addTo(m);
  const segs=segments(S.track.filter(p=>!p.stop)); const all=segs.flat(); m.fitBounds(all.map(p=>[p.lat,p.lon]),{padding:[60,60]});
  const lines=segs.map(s=>({s,l:L.polyline([],{color:colorOf(s.au),weight:6}).addTo(m)})); const total=all.length; const t0=performance.now();
  const step=now=>{ if (!SH||!document.body.contains(div)) return; const k=Math.min(1,(now-t0)/dur); let n=Math.floor(k*total);
    for (const {s,l} of lines){ const take=Math.min(s.length,n); l.setLatLngs(s.slice(0,take).map(p=>[p.lat,p.lon])); n-=take; }
    if (k<1) requestAnimationFrame(step); };
  setTimeout(()=>requestAnimationFrame(step),600);
}

const b64 = blob => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
async function backup(){
  toast("Sicherung wird erstellt …",30000);
  const t=S.trip, out={app:"reisetagebuch",v:2,trip:t,entries:S.entries,texts:S.texts,photos:S.photos,plan:S.plan,money:S.money,track:S.track,countries:LS.get("rt_countries",[]),blobs:{}};
  for (const p of S.photos){ const b=await photoBlob(p.id); if (b) out.blobs[p.id]=await b64(b); }

  const name=`Reisetagebuch-${t.title.replace(/[^\wäöüÄÖÜß-]+/g,"_")}-${today()}.json`;
  const file=new File([blob],name,{type:"application/json"});

}
async function restore(file){

    toast("Sicherung wird geladen …",30000);

  pNp:a=>{ const p=byId(a); p.np=!p.np; put("photos",p); markDirty(); viewPhoto(a,$("#pv")._ids); },
  pDay:a=>{ const p=byId(a); const d=prompt("Neues Datum (JJJJ-MM-TT):",p.d); if (d&&/^\d{4}-\d\d-\d\d$/.test(d)){ p.d=d; put("photos",p); markDirty(); viewPhoto(a,$("#pv")._ids); } },
  async pShare(a){ const b=await photoBlob(a); if (!b) return; const f=new File([b],"foto.jpg",{type:"image/jpeg"}); const p=byId(a); if (navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],text:p.cap||""}).catch(()=>{}); else toast("Senden wird hier nicht unterstützt"); },
  async pDel(a){ if (!confirm("Foto aus dem Tagebuch entfernen? (Das Original in der Galerie bleibt.)")) return; await deletePhoto(a); closePv(); },
  trkStart:()=>{ localStorage.removeItem("rt_trkoff_"+today()); startTracking(); }, trkStop:()=>stopTracking(), checkIn:()=>checkIn(),
  gpx:()=>$("#gpxPick").click(),
  mapDay:a=>{ S.mapDay=a||null; render(); },
  planSeg:a=>{ S.planSeg=a; render(); },
  async pSearch(){ const q=$("#pq").value.trim(); if (!q) return; const box=$("#pRes"); box.innerHTML='<div class="mut">Suche …</div>';
    try{ const r=await placeSearch(q); S._res=r; box.innerHTML=r.map((x,i)=>`<div class="it"><div class="grow"><b>${esc(x.name||x.display_name.split(",")[0])}</b><div class="mut small">${esc(x.display_name)}</div></div><button class="btn sm" data-act="pPick" data-a="${i}">＋</button></div>`).join("")||'<div class="mut">Nichts gefunden.</div>'; }catch(e){ box.innerHTML='<div class="mut">Keine Verbindung.</div>'; } },
  async pPick(a){ const x=S._res[+a]; await addPlan({k:"ort",ti:x.name||x.display_name.split(",")[0],note:x.display_name.split(",").slice(1,3).join(",").trim(),lat:+x.lat,lon:+x.lon}); toast("📍 Gemerkt"); render(); },
  async pAdd(){ const v=$("#pAdd").value.trim(); if (!v) return; await addPlan({k:S.planSeg,ti:v}); render(); $("#pAdd").focus(); },
  async addDayItem(d){ const i=document.querySelector(`[data-add-day="${d}"]`), v=i.value.trim(); if (!v) return; await addPlan({k:"tag",ti:v,d}); render(); },
  async packTpl(){ for (const [cat,items] of Object.entries(PACK)) for (const ti of items) await addPlan({k:"pack",ti,cat}); render(); },
  async pDone(a,b){ const p=S.plan.find(x=>x.id===a); p.done=b.checked; await put("plan",p); render(); },
  async pDel2(a){ S.plan=S.plan.filter(x=>x.id!==a); await remove("plan",a); render(); },
  shareOn:async()=>{ const t=S.trip; t.share={on:true,code:uid(20),name:"",auto:false,route:false,up:{}}; await saveTrip(); await publish(); render(); toast("Teilen ist an. Jetzt bei jedem Tag „mit Freunden teilen“ anhaken – oder „Alle bisherigen Tage teilen“.",6000); },
  async shareAll(){ for (const e of S.entries){ e.sh=true; await put("entries",e); } for (const d of new Set(S.texts.map(x=>x.d))) if (!entryOf(d)){ const e=ensureEntry(d); e.sh=true; await saveEntry(e); } await publish(); render(); },
  async shareOff(){ if (!confirm("Teilen beenden? Der Link funktioniert dann nicht mehr und alle geteilten Daten samt Kommentaren werden vom Server gelöscht. Euer Tagebuch bleibt.")) return;
    try{ await fb(S.trip.share.code,"DELETE"); }catch(e){ return toast("Löschen fehlgeschlagen: "+e.message); } S.trip.share=null; await saveTrip(); S.comments={}; render(); toast("Teilen beendet"); },
  shareLink:async()=>{ const u=shareLink(S.trip.share.code); const txt=`Unser Reisetagebuch „${S.trip.title}“ – schau rein und schreib uns einen Kommentar:`;
    if (navigator.share) navigator.share({title:S.trip.title,text:txt,url:u}).catch(()=>{}); else { await navigator.clipboard.writeText(u); toast("Link kopiert"); } },
  publish:()=>publish(),
  allComments:()=>allComments(),
  async reply(){ const i=$("#eReply"), v=i.value.trim(); if (!v) return; try{ await postComment(cur.id,v,true); i.value=""; await pullComments(); $("#eCom").innerHTML=commentsHTML(S.comments[cur.id],cur.id,true); }catch(e){ toast(e.message); } },
  async delCom(a,b,ev){ if (!confirm("Kommentar löschen?")) return; const btn=ev.target.closest("[data-b]"); await fb(`${S.trip.share.code}/c/${a}/${btn.dataset.b}`,"DELETE"); await pullComments(); if (cur&&$("#eCom")) $("#eCom").innerHTML=commentsHTML(S.comments[cur.id],cur.id,true); else if ($("#sheet").classList.contains("open")) allComments(); },
  money:()=>moneySheet(),
  mCat:(a,b)=>{ S._cat=a; document.querySelectorAll("#mCats .chip").forEach(c=>c.classList.toggle("on",c===b)); },
  async mAdd(){ const v=parseFloat(($("#mAmt").value||"").replace(",",".")); if (!v) return toast("Betrag eingeben"); const m={id:uid(),trip:S.trip.id,t:Date.now(),d:today(),eur:v,cat:S._cat,note:$("#mNote").value.trim()}; S.money.push(m); await put("money",m); moneySheet(); toast("💶 Gespeichert"); },
  async mDel(a){ S.money=S.money.filter(x=>x.id!==a); await remove("money",a); moneySheet(); },
  book:()=>openBook(),
  bFmtPick:(a,b)=>{ S._fmt=a; document.querySelectorAll('[data-act="bFmtPick"]').forEach(c=>c.classList.toggle("on",c===b)); },
  bAuto:()=>{ autoBook(S._fmt); openBook(); },
  bReset:()=>{ if (confirm("Alle Seiten verwerfen und einen neuen Vorschlag erstellen?")){ const f=S.trip.book.fmt; S.trip.book=null; saveTrip(); S._fmt=f; openBook(); } },
  bEdit:a=>bookEdit(+a),
  bLay:(a,b)=>{ const pg=S.trip.book.pages[+a]; pg.lay=b; pg.ph=(pg.ph||[]).slice(0,LAYN[b]||0); if (b==="map") pg.ti=pg.ti||"Unsere Route"; saveTrip(); bookEdit(+a); },
  bPh:(a,b,ev)=>{ const i=+a, pg=S.trip.book.pages[i], id=ev.target.closest("[data-b]").dataset.b, n=LAYN[pg.lay]||0; pg.ph=pg.ph||[]; const k=pg.ph.indexOf(id);
    if (k>=0) pg.ph.splice(k,1); else { if (pg.ph.length>=n) pg.ph.shift(); pg.ph.push(id); } saveTrip(); const y=$("#sheet").scrollTop; bookEdit(i); $("#sheet").scrollTop=y; },
  bMove:(a,b)=>{ const P=S.trip.book.pages, i=+a, j=i+(+b); [P[i],P[j]]=[P[j],P[i]]; saveTrip(); bookEdit(j); },
  bDup:a=>{ const P=S.trip.book.pages, i=+a; P.splice(i+1,0,{id:uid(),d:P[i].d,lay:"photo2",ph:[]}); saveTrip(); bookEdit(i+1); },
  bAdd:()=>{ const P=S.trip.book.pages; P.push({id:uid(),lay:"text",ti:"Ende",x:""}); saveTrip(); bookEdit(P.length-1); },
  bDel:a=>{ if (!confirm("Seite löschen?")) return; S.trip.book.pages.splice(+a,1); saveTrip(); openBook(); },
  bPrint:()=>printBook(), printDiary:()=>printDiary(),
  printClose:()=>history.back(), doPrint:()=>window.print(),
  backup:()=>backup(), restore:()=>$("#jsonPick").click(),
  invite:async()=>{ const u=`${HS_URL}#join=${S.trip.id}.${S.trip.key}`; const txt=`Schreib mit mir im Reisetagebuch „${S.trip.title}“! (Tailscale muss verbunden sein)`;
    if (navigator.share) navigator.share({title:"Reisetagebuch",text:txt,url:u}).catch(()=>{}); else { await navigator.clipboard.writeText(u); toast("Einladungs-Link kopiert"); } },
  syncNow:async()=>{ await sync(); toast(srvOk?"✓ Abgeglichen":"Heimserver nicht erreichbar – ist Tailscale verbunden?"); },
  scanNow:async()=>{ try{ await api("scan",{method:"POST"}); await sync(); toast("✓ Fertig"); }catch(e){ toast(e.message); } },
  async pushSave(){ const c={on:true,rem:$("#pRem").checked?$("#pRemT").value:null,gps:$("#pGps").checked?$("#pGpsT").value:null,pa:$("#pPa").checked,cm:$("#pCm").checked};
    try{ await pushSubscribe(c); LS.set("rt_push",c); toast("🔔 Erinnerungen sind eingestellt"); render(); }catch(e){ toast(e.message,5000); } },
  async pushTest(){ try{ const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); if (!sub) throw new Error("Nicht eingeschaltet"); const r=await fetch(SRV+"/reise-api/push/test",{method:"POST",body:JSON.stringify({sub:sub.toJSON()})}); toast(r.ok?"Test gesendet – kommt gleich":"Senden fehlgeschlagen"); }catch(e){ toast(e.message); } },
  async pushOff(){ try{ const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); if (sub){ await fetch(SRV+"/reise-api/push/sub",{method:"DELETE",body:JSON.stringify({sub:sub.toJSON()})}); await sub.unsubscribe(); } }catch(e){} LS.set("rt_push",{...pushCfg(),on:false}); render(); toast("Erinnerungen aus"); },
  bgSetup:()=>bgSetup(),
  copyOt:async()=>{ await navigator.clipboard.writeText($("#otUrl").textContent); toast("Adresse kopiert"); },
  postcard:a=>postcard(a),
  pcStyle:a=>{ S.pc.style=a; document.querySelectorAll('[data-act="pcStyle"]').forEach(c=>c.classList.toggle("on",c.dataset.a===a)); drawPostcard(); },
  pcPhoto:(a,b)=>{ S.pc.pid=a; document.querySelectorAll('[data-act="pcPhoto"]').forEach(c=>c.classList.toggle("sel",c===b)); drawPostcard(); },
  async pcShare(){ const c=$("#pcC"); const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9)); const f=new File([blob],"Postkarte.jpg",{type:"image/jpeg"});
    if (navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{}); else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Postkarte.jpg"; a.click(); } },
  show:()=>{ if (!S.photos.length&&!S.texts.length) return toast("Noch nichts für eine Diashow da"); startShow(); },
  shNext:()=>{ nextSlide(1); hideCtlSoon(); }, shPrev:()=>{ nextSlide(-1); hideCtlSoon(); },
  shPause:()=>{ SH.paused=!SH.paused; $("#shP").textContent=SH.paused?"▶":"⏸"; if (SH.paused){ clearTimeout(SH.timer); SH.audio&&SH.audio.pause(); } else { SH.audio&&SH.audio.play(); nextSlide(1); } hideCtlSoon(); },
  shSpeed:()=>{ SH.speed=SH.speed===1?1.5:SH.speed===1.5?0.7:1; $("#shSp").textContent=(SH.speed===0.7?"0,7":SH.speed===1.5?"1,5":"1")+"×"; hideCtlSoon(); },
  shMusic:()=>$("#musicPick").click(),
  shFull:()=>{ document.fullscreenElement?document.exitFullscreen():$("#show").requestFullscreen().catch(()=>{}); },
  shClose:()=>history.back(),
  countries:()=>countriesSheet(),
  // Freunde-Ansicht
  vLike:a=>vLike(a), vSend:a=>vSend(a), vPhoto:(a,b)=>vPhoto(b), vName:()=>vAskName(true), vReload:()=>viewerLoad(),
};
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("#tabs button"); if (tb){ ACT.tab(tb.dataset.tab); return; }
  const el=ev.target.closest("[data-act]");
  if (!el){ if (SH && ev.target.closest("#show")) { if ($("#shCtl").classList.contains("hide")) hideCtlSoon(); else nextSlide(1); } return; }
  if (el.tagName==="A") ev.preventDefault();
  const f=ACT[el.dataset.act]; if (f) f(el.dataset.a, el.dataset.b!==undefined&&!["bPh","delCom"].includes(el.dataset.act)?el.dataset.b:el, ev);
});
document.addEventListener("change",async ev=>{
  const s=ev.target.closest("[data-pday]"); if (s){ const p=S.plan.find(x=>x.id===s.dataset.pday); p.d=s.value||null; await put("plan",p); }
});
const refreshEditorPhotos = () => { if (cur&&$("#eFotos")) $("#eFotos").innerHTML=photosOf(cur.d).map(phTile).join(""); else render(); };
$("#filePick").onchange=async e=>{ const f=[...e.target.files]; e.target.value=""; await addPhotos(f,pickTarget.day); refreshEditorPhotos(); };
$("#camPick").onchange=async e=>{ const f=[...e.target.files]; e.target.value=""; await addPhotos(f,pickTarget.day||today()); refreshEditorPhotos(); };
$("#jsonPick").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if (f) restore(f); };
$("#gpxPick").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if (f) importGpx(f); };
$("#musicPick").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if (!f||!S.trip) return; await DB.put("kv",{id:"music_"+S.trip.id,b:f,name:f.name}); if (SH){ SH.audio&&SH.audio.pause(); SH.audio=new Audio(URL.createObjectURL(f)); SH.audio.loop=true; SH.audio.play().catch(()=>{}); } toast("🎵 "+f.name); };
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible"&&!VIEW){ if (tracking()) requestWake(); else autoTrack(); pullComments(); sync(); if (dirty) autoPublish(); } });
window.addEventListener("online",()=>{ sync(); if (dirty) autoPublish(); });

/* ================= Freunde-Ansicht (#s=CODE) ================= */
const VIEW=(location.hash.match(/s=([a-z0-9]{16,})/)||[])[1]||null;
const V={t:null,e:{},r:null,c:{},l:{},pics:{}};
async function viewerInit(){
  $("#tabs").style.display="none"; $("#top").innerHTML=`<div id="title">Reisetagebuch</div><button class="btn sm sec" data-act="vReload">⟳</button>`;
  await viewerLoad(); setInterval(()=>{ if (document.visibilityState==="visible") viewerLoad(true); }, 90000);
}
async function viewerLoad(soft){
  const v=$("#view");
  try{ const [t,e,r,c,l]=await Promise.all(["t","e","r","c","l"].map(k=>fb(VIEW+"/"+k)));
    if (!t){ v.innerHTML=`<div class="card">Dieses Reisetagebuch gibt es nicht (mehr). Vielleicht wurde das Teilen beendet.</div>`; return; }
    V.t=t; V.e=e||{}; V.r=r; V.c=c||{}; V.l=l||{};
  }catch(err){ if (!soft) v.innerHTML=`<div class="card">Konnte nicht laden: ${esc(err.message)}</div>`; return; }
  const y=scrollY; renderViewer(); if (soft) scrollTo(0,y);
}
function renderViewer(){
  const t=V.t, me2=localStorage.rt_name||"", meKey=nameKey(me2);
  $("#title").textContent=t.ti;
  const ents=Object.entries(V.e).sort((a,b)=>b[1].d.localeCompare(a[1].d));
  $("#view").innerHTML=`<div class="vhead"><h1>${esc(t.ti)}</h1><div class="mut">${fmtDay(t.a,{day:"numeric",month:"long"})} – ${fmtDay(t.b,{day:"numeric",month:"long",year:"numeric"})}${t.o?` · von ${esc(t.o)}`:""}</div></div>
   ${V.r&&V.r.length?`<div id="vmap" class="minimap" style="height:260px;margin-bottom:12px"></div>`:""}
   ${ents.map(([id,e])=>{ const lk=V.l[id]||{}, nl=Object.keys(lk).length, mine=meKey&&lk[meKey];
     return `<div class="card"><div class="row"><span class="grow" style="font:700 12px system-ui;color:var(--acc);text-transform:uppercase">Tag ${diffDays(t.a,e.d)+1} · ${fmtDay(e.d)}</span><span>${e.w?WMO(e.w.c)+" "+e.w.max+"°":""} ${e.m||""}</span></div>
      <h2 style="margin:4px 0 6px;font-size:22px">${esc(e.ti||e.pl||"")}</h2>${e.pl?`<div class="mut small">📍 ${esc(e.pl)}</div>`:""}
      ${e.x?`<div style="white-space:pre-wrap;font:17px/1.6 Georgia,serif;margin-top:8px">${esc(e.x)}</div>`:""}
      ${e.ph&&e.ph.length?`<div class="vpics">${e.ph.map(p=>`<img data-pid="${p.i}" data-act="vPhoto" data-b="${p.i}" alt="${esc(p.c)}" ${V.pics[p.i]?`src="${V.pics[p.i]}"`:""}>`).join("")}</div>`:""}
      <div class="row" style="margin-top:10px"><button class="likes ${mine?"on":""}" data-act="vLike" data-a="${id}">❤️ ${nl||""}</button>${nl?`<span class="mut small">${esc(Object.values(lk).slice(0,4).join(", "))}${nl>4?" …":""}</span>`:""}</div>
      <div>${commentsHTML(V.c[id],id,false)}</div>
      <div class="row" style="margin-top:6px"><input class="grow" id="vc_${id}" placeholder="${me2?`Kommentar als ${esc(me2)} …`:"Kommentar schreiben …"}"><button class="btn sm" data-act="vSend" data-a="${id}">Senden</button></div></div>`; }).join("")||`<div class="card mut">Noch keine Einträge geteilt – schau bald wieder vorbei!</div>`}
   <div class="mut small" style="text-align:center;margin:20px 0">${me2?`Du schreibst als <b>${esc(me2)}</b> · <a href="#" data-act="vName">ändern</a>`:""}</div>`;
  if (V.r&&V.r.length){ const m=L.map("vmap",{scrollWheelZoom:false}); L.tileLayer(TILE,{maxZoom:18,attribution:OSM_ATTR}).addTo(m); const b=[]; for (const s of V.r){ L.polyline(s,{color:"#0e7c7b",weight:4}).addTo(m); b.push(...s); } m.fitBounds(b,{padding:[20,20]}); }
  lazyPics();
}
let io=null;
function lazyPics(){ io&&io.disconnect(); const imgs=[...document.querySelectorAll(".vpics img:not([src])")];
  if (!("IntersectionObserver" in window)) { imgs.forEach(loadPic); return; }
  io=new IntersectionObserver(es=>{ for (const en of es) if (en.isIntersecting){ io.unobserve(en.target); loadPic(en.target); } },{rootMargin:"600px"}); imgs.forEach(im=>io.observe(im)); }
async function loadPic(im){ const id=im.dataset.pid; try{ if (!V.pics[id]) V.pics[id]=await fb(VIEW+"/p/"+id); if (V.pics[id]) im.src=V.pics[id]; }catch(e){} }
function vPhoto(id){ const src=V.pics[id]; if (!src) return; const pv=$("#pv"); pv.innerHTML=`<div class="bar"><button class="btn sm" data-act="pvClose">✕ Schließen</button></div><div class="img"><img src="${src}"></div>`; pv.classList.add("open"); history.pushState({pv:1},""); }
const nameKey = n => n.toLowerCase().replace(/[.#$\[\]\/]/g,"").trim().slice(0,40);
function vAskName(force){ if (localStorage.rt_name&&!force) return localStorage.rt_name; const n=(prompt("Wie heißt du? (wird bei deinen Kommentaren angezeigt)",localStorage.rt_name||"")||"").trim().slice(0,40); if (n){ localStorage.rt_name=n; if (force) renderViewer(); } return n; }
async function vLike(id){ const n=vAskName(); if (!n) return; const k=nameKey(n); if (!k) return; const has=V.l[id]&&V.l[id][k];
  try{ await fb(`${VIEW}/l/${id}/${k}`, has?"DELETE":"PUT", has?undefined:n); await viewerLoad(true); }catch(e){ toast(e.message); } }
async function vSend(id){ const i=$("#vc_"+id), x=i.value.trim(); if (!x) return; const n=vAskName(); if (!n) return;
  try{ await postComment(id,x.slice(0,2000),false); i.value=""; await viewerLoad(true); toast("💬 Danke für deinen Kommentar!"); }catch(e){ toast(e.message); } }

/* ================= Start ================= */
async function joinTrip(id,key){
  if (!SRV) return toast("Die Einladung funktioniert nur über den Heimserver");
  if (!me) return askName(()=>joinTrip(id,key));
  toast("Reise wird geladen …",30000);
  try{
    const r=await fetch(`${SRV}/reise-api/t/${id}/changes?since=0&k=${encodeURIComponent(key)}`); if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"Fehler");
    const j=await r.json(); const tr=j.recs.find(x=>x.s==="trips"&&x.id===id); if (!tr) throw new Error("Reise noch leer – bitte später nochmal");
    await DB.put("trips",{...tr.data,key,upd:tr.upd,sy:1}); LS.set("rt_srvtrip_"+id,true);
    await loadTrips(); await loadTrip(id); await sync(); S.tab="tage"; render(); toast(`✅ Du schreibst jetzt mit bei „${S.trip.title}“`); pushRefresh();
  }catch(e){ toast("Einladung fehlgeschlagen: "+e.message,6000); }
}
function handleHash(){
  const h=location.hash; if (!h||VIEW) return;
  history.replaceState(null,"",location.pathname+location.search);
  let m;
  if ((m=h.match(/join=([a-z0-9]+)\.([a-z0-9]+)/))) return joinTrip(m[1],m[2]);
  if (!S.trip) return;
  if ((m=h.match(/day=(\d{4}-\d\d-\d\d)/))) return openDay(m[1]);
  if (h.includes("track")) { localStorage.removeItem("rt_trkoff_"+today()); return startTracking(); }
  if (h.includes("comments")) return allComments();
}
(async function start(){
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if (VIEW) return viewerInit();
  try{ await DB.open(); }catch(e){ $("#view").innerHTML=`<div class="card">Speicher nicht verfügbar: ${esc(e.message)}</div>`; return; }
  if (navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  await loadTrips();
  const want=localStorage.rt_trip; await loadTrip(S.trips.some(t=>t.id===want)?want:(S.trips[0]&&S.trips[0].id));
  render(); updBadge(); handleHash();
  if (S.trip && localStorage.rt_tracking===S.trip.id && phase()!=="nach" && !bgGps()) startTracking(true); else autoTrack();
  sync(); pullComments();
  setInterval(()=>{ if (document.visibilityState==="visible"){ sync(); pullComments(); } }, 45000);
  navigator.serviceWorker && navigator.serviceWorker.addEventListener("message",ev=>{ if (ev.data&&ev.data.url){ location.hash=ev.data.url.split("#")[1]||""; handleHash(); } });
  window.addEventListener("hashchange",handleHash);
})();
</script>
