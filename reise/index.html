<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>Reisetagebuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#2b2420;--mut:#857a6e;--acc:#0e7c7b;--acc2:#e0603a;--line:#e6dccb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600}
header#top{position:sticky;top:0;z-index:50;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#title{flex:1;font:600 20px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:13px;color:var(--mut)}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:60}
nav#tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font:11px system-ui;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav#tabs button b{font-size:22px;line-height:1;font-weight:400;filter:grayscale(1);opacity:.7}
nav#tabs button.on{color:var(--acc);font-weight:700}
nav#tabs button.on b{filter:none;opacity:1}
nav#tabs .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 15px system-ui;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#ece2d0;color:var(--ink)}
.btn.warn{background:var(--acc2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
input,textarea,select{font:16px system-ui;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:200px;font:17px/1.55 Georgia,serif;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:14px system-ui;color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.day{cursor:pointer}
.day .d{font:700 12px system-ui;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.day h3{margin:4px 0;font-size:19px}
.day p{margin:4px 0;color:#4a4038;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:Georgia,serif}
.day.empty{opacity:.65;padding:10px 14px}
.strip{display:flex;gap:4px;overflow:hidden;margin-top:8px}
.strip img{height:62px;width:62px;object-fit:cover;border-radius:8px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .ph{position:relative;cursor:pointer}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.ph .fav{position:absolute;top:2px;right:5px;color:#ffd34d;text-shadow:0 0 3px #000;font-size:18px}
.ph .np{position:absolute;bottom:3px;left:5px;font-size:14px;text-shadow:0 0 3px #fff}
.ph.sel img{outline:4px solid var(--acc);outline-offset:-4px}
.ph .num{position:absolute;top:4px;left:4px;background:var(--acc);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font:700 13px system-ui}
#sheet{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none}
#sheet.open{display:block}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:500}
.shead h2{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{padding:12px 12px 60px;max-width:760px;margin:0 auto}
#map{height:calc(100vh - 230px);min-height:300px;border-radius:var(--r);border:1px solid var(--line)}
.minimap{height:220px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.dot{width:14px;height:14px;border-radius:50%;background:#bbb;flex:none}
.dot.live{background:#e0403a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.badge{background:var(--acc2);color:#fff;border-radius:99px;padding:1px 7px;font:700 12px system-ui}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it.done .grow{text-decoration:line-through;opacity:.55}
.check{width:24px!important;height:24px;flex:none;accent-color:var(--acc)}
.x{border:0;background:none;font-size:18px;color:var(--mut);padding:4px 6px;cursor:pointer}
.com{background:#f3ece0;border-radius:12px;padding:8px 10px;margin:6px 0}
.com.own{background:#dff0ee}
.com b{font-size:13px}
.com .mut{font-size:12px}
.seg{display:flex;background:#ebe2d2;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;font:600 12px/1.25 system-ui;color:var(--mut);white-space:nowrap}
.seg button i{display:block;font-style:normal;font-size:18px}
.seg button.on{background:#fff;color:var(--ink)}
.pmark img{width:42px;height:42px;object-fit:cover;border:2px solid #fff;border-radius:8px;box-shadow:0 1px 5px #0007}
.emark{background:var(--acc2);color:#fff;border:2px solid #fff;border-radius:50%;display:grid!important;place-items:center;font:700 12px system-ui;box-shadow:0 1px 4px #0006}
.smark{background:#fff;border:2px solid var(--acc);border-radius:50%;display:grid!important;place-items:center;font-size:14px;box-shadow:0 1px 4px #0006}
#pv{position:fixed;inset:0;background:#000;z-index:250;display:none;flex-direction:column;color:#fff}
#pv.open{display:flex}
#pv .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#pv img{max-width:100%;max-height:100%;object-fit:contain}
#pv .bar{display:flex;gap:6px;padding:10px;flex-wrap:wrap;justify-content:center;background:#111}
#pv .bar .btn{background:#2a2a2a}
#pv .cap{padding:8px 12px;background:#111}
#pv .cap input{background:#222;color:#fff;border-color:#333}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 16px;border-radius:12px;z-index:400;font-size:15px;display:none;max-width:90vw;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:600 24px Georgia,serif}
.kpi span{font-size:13px;color:var(--mut)}
.bar2{height:8px;background:#ece2d0;border-radius:9px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--acc)}
.hero{background:linear-gradient(135deg,#0e7c7b,#2a9d8f);color:#fff;border:0}
.hero .mut{color:#d8f1ee}
.hero .btn{background:#fff;color:var(--acc)}
.mic.on{background:var(--acc2)!important;color:#fff!important}
.pbook{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pbook .pw{cursor:pointer}
.pbook .pw .mut{font-size:12px;text-align:center;margin-top:3px}
/* ---- Fotobuch-Seiten ---- */
.pg{position:relative;background:#fff;overflow:hidden;container-type:size;aspect-ratio:var(--ar,297/210);box-shadow:0 2px 10px #0003;color:#2b2420;font-family:Georgia,serif}
.pg .in{position:absolute;inset:0;display:grid;gap:2cqmin;padding:5cqmin;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.pg .pc{position:relative;min-height:0;min-width:0;overflow:hidden;background:#eee7db;border-radius:.5cqmin}
.pg .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg .pc .ph0{position:absolute;inset:0;display:grid;place-items:center;font:3cqmin system-ui;color:#a89b8a}
.pg .tx{overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pg .tt{font-size:6cqmin;margin:0 0 1cqmin;line-height:1.15;font-weight:600}
.pg .dt{font:700 2.4cqmin system-ui;color:#0e7c7b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.6cqmin}
.pg .bd{font-size:var(--fs,3.3cqmin);line-height:1.5;white-space:pre-wrap;overflow:hidden}
.pg .cp{position:absolute;left:0;right:0;bottom:0;padding:1.5cqmin 2.5cqmin;background:linear-gradient(transparent,#0008);color:#fff;font-size:2.6cqmin}
.l-text .in{padding:10cqmin 13cqmin}
.l-text .tx{text-align:left}
.l-text1 .in,.l-photo2 .in{grid-template-columns:1fr 1fr}
.l-text2 .in{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.l-text2 .tx{grid-row:1/3;grid-column:2}
.l-photo1 .in,.l-cover .in{padding:0}
.l-photo3 .in{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.l-photo3 .in>:first-child{grid-row:1/3}
.l-photo4 .in{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.l-cover .pc{border-radius:0}
.l-cover .ov{position:absolute;left:0;right:0;bottom:0;padding:7cqmin 6cqmin 6cqmin;background:linear-gradient(transparent,#000b);color:#fff}
.l-cover .tt{font-size:10cqmin}
.l-cover .dt{color:#fff;opacity:.9}
.l-map .in{grid-template-rows:auto 1fr}
.l-map .tt{font-size:5cqmin}
.port.l-text1 .in,.port.l-photo2 .in{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.port.l-text2 .in{grid-template-columns:1fr 1fr;grid-template-rows:1.15fr 1fr}
.port.l-text2 .tx{grid-row:2;grid-column:1/3}
.port.l-photo3 .in{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr}
.port.l-photo3 .in>:first-child{grid-row:1;grid-column:1/3}
/* ---- Druckansicht ---- */
#print{position:fixed;inset:0;z-index:300;background:#d9d4cc;overflow:auto;display:none}
#print.open{display:block}
#print .pbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#2b2420;color:#fff;flex-wrap:wrap}
#print .pbar .grow{flex:1;font-size:14px}
#print .pages{padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
#print .pages .pg{width:min(100%,900px)}
.diary{background:#fff;max-width:800px;margin:14px auto;padding:30px 36px;font-family:Georgia,serif;color:#2b2420}
.diary h1{font-size:34px;margin:0}
.diary .dday{margin-top:28px;break-inside:auto}
.diary .dday h2{font-size:22px;margin:0 0 2px;break-after:avoid}
.diary .meta{font:13px system-ui;color:#857a6e;margin-bottom:8px;break-after:avoid}
.diary .txt{white-space:pre-wrap;line-height:1.6;font-size:15px}
.diary .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.diary .pics img{width:100%;aspect-ratio:4/3;object-fit:cover;break-inside:avoid;display:block}
.diary .cm{font:13px system-ui;color:#555;margin-top:6px;border-left:3px solid #e6dccb;padding-left:8px}
.diary .mapimg{width:100%;margin:14px 0;border-radius:6px}
/* ---- Freunde-Ansicht ---- */
.vhead{text-align:center;padding:26px 10px 10px}
.vhead h1{margin:0;font-size:30px}
.vpics{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:10px}
.vpics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:pointer;background:#eee7db}
.vpics img:first-child:nth-last-child(odd){grid-column:1/3;aspect-ratio:16/10}
.likes{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:15px;cursor:pointer}
.likes.on{background:#fde3dc;border-color:#f3b4a2}
@media print{
  body>*:not(#print){display:none!important}
  html,body{background:#fff}
  #print{position:static;display:block!important;background:#fff;overflow:visible}
  #print .pbar{display:none}
  #print .pages{padding:0;gap:0;display:block}
  #print .pages .pg{width:var(--pw);height:var(--ph);aspect-ratio:auto;box-shadow:none;break-after:page;page-break-after:always}
  .diary{margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<header id="top">
  <div id="title">Reisetagebuch</div>
  <span id="sync"></span>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="tage"><b>📖</b>Tagebuch</button>
  <button data-tab="karte"><b>🗺️</b>Karte</button>
  <button data-tab="fotos"><b>📷</b>Fotos</button>
  <button data-tab="plan"><b>🧭</b>Planen</button>
  <button data-tab="mehr"><b>☰</b>Mehr</button>
</nav>
<div id="sheet"></div>
<div id="pv"></div>
<div id="print"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="camPick" accept="image/*" capture="environment" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>
<input type="file" id="gpxPick" accept=".gpx,application/gpx+xml,text/xml" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ================= Grundlagen ================= */
const FB = (localStorage.rt_db || "https://nfl-tippspiel-df32c-default-rtdb.europe-west1.firebasedatabase.app").replace(/\/+$/,"");
const FB_BASE = "tippspiel/reise";
const TILE = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (n=10) => { const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const pad = n => String(n).padStart(2,"0");
const ymd = d => { d = new Date(d); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const today = () => ymd(new Date());
const dayDate = s => new Date(s+"T12:00");
const fmtDay = (s,o={weekday:"long",day:"numeric",month:"long"}) => dayDate(s).toLocaleDateString("de-AT",o);
const fmtShort = s => dayDate(s).toLocaleDateString("de-AT",{day:"numeric",month:"short"});
const fmtTime = t => new Date(t).toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
const fmtDT = t => new Date(t).toLocaleString("de-AT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const daysBetween = (a,b) => { const r=[]; const d=dayDate(a), e=dayDate(b); while (d<=e && r.length<400) { r.push(ymd(d)); d.setDate(d.getDate()+1); } return r; };
const diffDays = (a,b) => Math.round((dayDate(b)-dayDate(a))/864e5);
const num = (x,d=0) => Number(x||0).toLocaleString("de-AT",{minimumFractionDigits:d,maximumFractionDigits:d});
function dist(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r; const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none", ms); }
const debounce = (fn,ms) => { let h; return (...a) => { clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; };
const MOODS = ["😄","🙂","😌","😐","😴","🥵","🥶","😢","🤩","❤️"];
const WMO = c => c==null ? "" : c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌧️":c<=86?"🌨️":"⛈️";
const CATS = ["🍝 Essen","🛏️ Unterkunft","🚗 Transport","🎟️ Eintritt","🛍️ Einkauf","☕ Sonstiges"];
const PACK = {"Dokumente":["Reisepass / Ausweis","Führerschein","E-Card / Versicherungskarte","Tickets & Buchungen","Bankomatkarte & Bargeld"],"Technik":["Handy-Ladekabel","Powerbank","Kopfhörer","Reiseadapter"],"Kleidung":["Unterwäsche","Socken","T-Shirts","Hosen","Pullover / Jacke","Regenjacke","Schlafgewand","Badesachen","Schuhe"],"Hygiene":["Zahnbürste & Zahnpasta","Duschgel / Shampoo","Deo","Sonnencreme","Medikamente","Erste-Hilfe-Set"],"Sonstiges":["Sonnenbrille","Trinkflasche","Proviant für die Fahrt","Buch / Spiele"]};

/* ================= Datenbank (IndexedDB, alles bleibt am Handy) ================= */
const STORES = ["trips","entries","photos","blobs","plan","money","track"];
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("reisetagebuch",1);
    r.onupgradeneeded=()=>{ const d=r.result;
      d.createObjectStore("trips",{keyPath:"id"}); d.createObjectStore("blobs",{keyPath:"id"});
      for (const s of ["entries","photos","plan","money"]) d.createObjectStore(s,{keyPath:"id"}).createIndex("trip","trip");
      d.createObjectStore("track",{keyPath:"id",autoIncrement:true}).createIndex("trip","trip"); };
    r.onsuccess=()=>{ DB.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  req(store,mode,fn){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,mode); const q=fn(tx.objectStore(store)); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); },
  all(s){ return DB.req(s,"readonly",o=>o.getAll()); },
  byTrip(s,trip){ return DB.req(s,"readonly",o=>o.index("trip").getAll(trip)); },
  get(s,id){ return DB.req(s,"readonly",o=>o.get(id)); },
  put(s,v){ return DB.req(s,"readwrite",o=>o.put(v)); },
  del(s,id){ return DB.req(s,"readwrite",o=>o.delete(id)); },
};

const S = { trips:[], trip:null, entries:[], photos:[], plan:[], money:[], track:[], tab:"tage", mapDay:null, planSeg:"ort", comments:{}, likes:{}, mapImg:null };
const entryOf = d => S.entries.find(e=>e.d===d);
const photosOf = d => S.photos.filter(p=>p.d===d).sort((a,b)=>(a.t||0)-(b.t||0));
const byId = id => S.photos.find(p=>p.id===id);

async function loadTrips(){ S.trips = (await DB.all("trips")).sort((a,b)=>(b.start||"").localeCompare(a.start||"")); }
async function loadTrip(id){
  S.trip = S.trips.find(t=>t.id===id) || null; S.mapImg=null; S.comments={}; S.likes={};
  if (!S.trip) { localStorage.removeItem("rt_trip"); return; }
  localStorage.rt_trip = id;
  [S.entries,S.photos,S.plan,S.money,S.track] = await Promise.all(["entries","photos","plan","money","track"].map(s=>DB.byTrip(s,id)));
  S.track.sort((a,b)=>a.t-b.t);
}
const saveTrip = () => DB.put("trips", S.trip);
async function saveEntry(e){ e.upd=Date.now(); if (!S.entries.includes(e)) S.entries.push(e); await DB.put("entries",e); markDirty(); }
function ensureEntry(d){ return entryOf(d) || { id:S.trip.id+"_"+d, trip:S.trip.id, d, ti:"", x:"", mood:"", sh:!!(S.trip.share&&S.trip.share.auto) }; }

/* tripDays: alle Tage der Reise (+ Tage mit Inhalt außerhalb) */
function tripDays(){
  const t=S.trip; const set=new Set(daysBetween(t.start, t.end));
  for (const e of S.entries) set.add(e.d); for (const p of S.photos) set.add(p.d);
  return [...set].sort();
}
function phase(){ const t=S.trip, d=today(); return d<t.start ? "vor" : d>t.end ? "nach" : "waehrend"; }

/* ================= Fotos ================= */
function exif(buf){
  try{
    const v=new DataView(buf); if (v.getUint16(0)!==0xFFD8) return {};
    let o=2;
    while (o < v.byteLength-10){ const m=v.getUint16(o); if ((m&0xFF00)!==0xFF00) break;
      if (m===0xFFE1 && v.getUint32(o+4)===0x45786966) return tiff(v,o+10);
      o += 2+v.getUint16(o+2); }

  const pt={trip:S.trip.id,t:p.timestamp,lat:+c.latitude.toFixed(6),lon:+c.longitude.toFixed(6),acc:Math.round(c.accuracy)};

/* ================= Statische Karte (für Druck, Fotobuch) ================= */
async function staticMap(segs, marks, W, H){

  while (z>2){ const a=px(la1,lo0,z), b=px(la0,lo1,z); if (b[0]-a[0] <= W-2*padd && b[1]-a[1] <= H-2*padd) break; z--; }

  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); g.fillStyle="#eee7db"; g.fillRect(0,0,W,H);

    if (ty<0||ty>=n) continue;

  }
  await Promise.race([Promise.all(jobs), new Promise(r=>setTimeout(r,12000))]);

  for (const s of segs){ if (s.length<2) continue; for (const [w,col] of [[13,"#fff"],[7,"#0e7c7b"]]){ g.lineWidth=w; g.strokeStyle=col; g.beginPath(); s.forEach((p,i)=>{ const q=px(p.lat,p.lon,z); i?g.lineTo(q[0]-x0,q[1]-y0):g.moveTo(q[0]-x0,q[1]-y0); }); g.stroke(); } }
  g.font="600 22px Georgia, serif"; g.textBaseline="middle";
  for (const m of marks){ const q=px(m.lat,m.lon,z), X=q[0]-x0, Y=q[1]-y0; g.fillStyle="#e0603a"; g.strokeStyle="#fff"; g.lineWidth=4; g.beginPath(); g.arc(X,Y,10,0,7); g.fill(); g.stroke();
    if (m.label){ g.lineWidth=6; g.strokeStyle="rgba(255,255,255,.9)"; g.strokeText(m.label,X+16,Y); g.fillStyle="#2b2420"; g.fillText(m.label,X+16,Y); } }
  g.font="14px system-ui"; g.fillStyle="rgba(255,255,255,.8)"; const at="© OpenStreetMap"; const tw=g.measureText(at).width; g.fillRect(W-tw-12,H-22,tw+12,22); g.fillStyle="#555"; g.fillText(at,W-tw-6,H-11);

}
function routeMarks(){ const seen=new Set(), marks=[]; for (const e of [...S.entries].sort((a,b)=>a.d.localeCompare(b.d))) if (e.pl&&e.pl.name&&!seen.has(e.pl.name)){ seen.add(e.pl.name); marks.push({lat:e.pl.lat,lon:e.pl.lon,label:e.pl.name}); }

let publishing=false;
async function publish(silent){
  const t=S.trip; if (!t||!t.share||!t.share.on||publishing) return; publishing=true; setSync("⏳ teile …");
  try{
    const code=t.share.code, up=t.share.up||(t.share.up={});
    const sh=S.entries.filter(e=>e.sh).sort((a,b)=>a.d.localeCompare(b.d));
    const E={}, need=new Set();

      E[e.id]={d:e.d,ti:e.ti||"",x:e.x||"",m:e.mood||"",w:e.w||null,pl:e.pl&&e.pl.name?e.pl.name+(e.pl.country?", "+e.pl.country:""):"",ph:ph.map(p=>({i:p.id,c:p.cap||""}))}; }

    await fb(code+"/e","PUT",E);
    let k=0;
    for (const id of need){ if (up[id]) continue; const r=await DB.get("blobs",id); if (!r) continue;
      const bmp=await createImageBitmap(r.b); const du=await resize(bmp,1400,0.74,true); bmp.close&&bmp.close();
      await fb(code+"/p/"+id,"PUT",du); up[id]=1; k++; setSync(`⏳ Foto ${k} …`); await saveTrip(); }
    for (const id of Object.keys(up)) if (!need.has(id)){ await fb(code+"/p/"+id,"DELETE"); delete up[id]; }
    if (t.share.route){ const sg=segments(S.track.filter(p=>!p.stop)), tot=sg.reduce((s,x)=>s+x.length,0)||1;
      const segs=sg.filter(s=>s.length>1).map(s=>thin(s,Math.max(2,Math.round(1500*s.length/tot))).map(p=>[+p.lat.toFixed(5),+p.lon.toFixed(5)]));
      await fb(code+"/r","PUT",segs.length?segs:null); }
    else await fb(code+"/r","DELETE");
    t.share.last=Date.now(); await saveTrip(); dirty=false; setSync("✓ geteilt");
    if (!silent) toast(`✅ ${sh.length} Tag(e) für Freunde aktualisiert`);
  }catch(e){ setSync("⚠ nicht geteilt"); if (!silent) toast("Teilen fehlgeschlagen: "+e.message, 5000); }
  publishing=false;
}

let cur=null, rec=null;
async function openDay(d){
  const e=ensureEntry(d); cur=e; const n=diffDays(S.trip.start,d)+1;
  const sharing=S.trip.share&&S.trip.share.on;
  openSheet(`${n>0?`Tag ${n} · `:""}${fmtShort(d)}`, `
    <div class="mut">${fmtDay(d)}</div>
    <label>Überschrift</label><input id="eTi" value="${esc(e.ti)}" placeholder="z. B. Bootsausflug zur Blauen Grotte">

    <textarea id="eX" placeholder="Erzähl deinem Tagebuch vom Tag …">${esc(e.x)}</textarea>
    <label>Stimmung</label><div class="chips" id="moods">${MOODS.map(m=>`<button class="chip ${e.mood===m?"on":""}" data-act="mood" data-a="${m}">${m}</button>`).join("")}<button class="chip ${e.hl?"on":""}" data-act="hl">⭐ Highlight-Tag</button></div>
    <label>Ort &amp; Wetter</label>
    <div class="row"><div class="grow" id="eMeta">${metaTxt(e)}</div><button class="btn sm sec" data-act="fetchMeta">📍 holen</button></div>
    <label>Fotos (${photosOf(d).length})</label>
    <div class="grid" id="eFotos">${photosOf(d).map(phTile).join("")}</div>
    <div class="row" style="margin-top:8px"><button class="btn sec" data-act="pick" data-a="${d}">🖼️ Aus Galerie</button><button class="btn sec" data-act="cam" data-a="${d}">📸 Kamera</button></div>
    ${sharing?`<label>Freunde</label><label style="display:flex;gap:10px;align-items:center;margin:0;color:var(--ink);font-size:15px"><input type="checkbox" class="check" id="eSh" ${e.sh?"checked":""}> Diesen Tag mit Freunden teilen</label>
      <div id="eCom">${commentsHTML(S.comments[e.id],e.id,true)}</div>
      ${e.sh?`<div class="row"><input class="grow" id="eReply" placeholder="Antworten …"><button class="btn sm" data-act="reply">Senden</button></div>`:""}`:""}
    <div class="row" style="margin-top:22px"><button class="btn big" data-act="closeDay">✓ Fertig</button></div>`, ()=>{
      const save=debounce(()=>saveEntry(cur), 600);
      $("#eTi").oninput=e2=>{ cur.ti=e2.target.value; save(); };
      $("#eX").oninput=e2=>{ cur.x=e2.target.value; save(); };
      const sh=$("#eSh"); if (sh) sh.onchange=()=>{ cur.sh=sh.checked; saveEntry(cur); openDay(d); };
    });
  if (sharing && S.comments[e.id]) markSeen();
  if (!e.pl && d===today() && navigator.permissions){ try{ const st=await navigator.permissions.query({name:"geolocation"}); if (st.state==="granted") fetchMeta(true); }catch(x){} }
  else if (e.pl && !e.w) fetchMeta(true);
}
function metaTxt(e){ return (e.pl?`📍 ${esc(e.pl.name||"Standort")}${e.pl.country?", "+esc(e.pl.country):""}`:`<span class="mut">noch kein Ort</span>`)+(e.w?` · ${WMO(e.w.c)} ${e.w.min}° / ${e.w.max}°`:""); }
function phTile(p){ return `<div class="ph" data-act="viewPhoto" data-a="${p.id}"><img src="${p.th}" loading="lazy" alt="">${p.fav?'<span class="fav">★</span>':""}${p.np?'<span class="np">🔒</span>':""}</div>`; }
async function fetchMeta(quiet){
  const e=cur; if (!e) return;
  try{
    let pos=dayPos(e.d);
    if (!pos && e.d===today()) pos=await getPos();
    if (!pos){ if (!quiet) toast("Für diesen Tag gibt es keinen Standort (keine Route, keine Fotos mit Ort)"); return; }
    if (!e.pl){ const g=await geoName(pos.lat,pos.lon); e.pl={lat:pos.lat,lon:pos.lon,name:g.name,country:g.country}; }
    if (!e.w){ try{ e.w=await weatherFor(e.d,e.pl.lat,e.pl.lon); }catch(x){} }
    await saveEntry(e); const m=$("#eMeta"); if (m&&cur===e) m.innerHTML=metaTxt(e);
  }catch(err){ if (!quiet) toast("Standort nicht verfügbar: "+(err.message||err)); }
}
function dictate(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) return toast("Diktieren wird von diesem Browser nicht unterstützt – nutze das 🎤 auf der Handy-Tastatur");
  if (rec){ rec.stop(); return; }
  rec=new SR(); rec.lang="de-AT"; rec.continuous=true; rec.interimResults=false;
  btn.classList.add("on"); btn.textContent="⏹ Stopp";
  rec.onresult=ev=>{ const ta=$("#eX"); for (let i=ev.resultIndex;i<ev.results.length;i++) if (ev.results[i].isFinal){ let s=ev.results[i][0].transcript.trim(); if (!s) continue; const v=ta.value; s=(v&&!/\s$/.test(v)?" ":"")+s.charAt(0).toUpperCase()+s.slice(1); ta.value=v+s; } cur.x=ta.value; saveEntry(cur); };
  rec.onend=()=>{ rec=null; btn.classList.remove("on"); btn.textContent="🎤 Diktieren"; };
  rec.onerror=ev=>toast("Diktieren: "+ev.error);
  rec.start();
}

function rKarte(v){
  const days=tripDays().filter(d=>S.track.some(p=>ymd(p.t)===d)||photosOf(d).some(p=>p.lat!=null)||(entryOf(d)&&entryOf(d).pl));
  v.innerHTML=`<div class="chips" style="margin-bottom:8px;overflow-x:auto;flex-wrap:nowrap"><button class="chip ${!S.mapDay?"on":""}" data-act="mapDay" data-a="">Ganze Reise</button>${days.map(d=>`<button class="chip ${S.mapDay===d?"on":""}" data-act="mapDay" data-a="${d}" style="white-space:nowrap">${fmtShort(d)}</button>`).join("")}</div>
  <div id="map"></div>
  <div class="row mut small" style="margin-top:6px"><span class="grow" id="mapInfo"></span><button class="btn sm sec" data-act="checkIn">📍 Ort merken</button><button class="btn sm sec" data-act="gpx">GPX importieren</button></div>`;
  map=L.map("map",{zoomControl:true}); L.tileLayer(TILE,{maxZoom:19,attribution:OSM_ATTR}).addTo(map);
  const sel=d=>!S.mapDay||d===S.mapDay;
  const tr=S.track.filter(p=>!p.stop&&sel(ymd(p.t))); const segs=segments(tr); const bounds=[];
  segs.forEach((s,i)=>{ const ll=s.map(p=>[p.lat,p.lon]); bounds.push(...ll); const pl=L.polyline(ll,{color:"#0e7c7b",weight:5,opacity:.85}).addTo(map); if (i===segs.length-1 && tracking() && (!S.mapDay||S.mapDay===today())) liveLine=pl; });
  if (!liveLine && tracking()) liveLine=L.polyline([],{color:"#0e7c7b",weight:5}).addTo(map);
  for (const p of S.track.filter(p=>p.stop&&sel(ymd(p.t)))){ bounds.push([p.lat,p.lon]); L.marker([p.lat,p.lon],{icon:L.divIcon({className:"smark",html:"📍",iconSize:[28,28]})}).addTo(map).bindPopup(`<b>${esc(p.stop)}</b><br>${fmtDT(p.t)}`); }
  for (const e of S.entries.filter(e=>e.pl&&sel(e.d))){ bounds.push([e.pl.lat,e.pl.lon]); const n=diffDays(S.trip.start,e.d)+1; L.marker([e.pl.lat,e.pl.lon],{icon:L.divIcon({className:"emark",html:String(n),iconSize:[26,26]})}).addTo(map).bindPopup(`<b>${esc(e.ti||e.pl.name||"")}</b><br>${fmtDay(e.d)}<br><a href="#" onclick="ACT.openDay('${e.d}');return false">Eintrag öffnen</a>`); }
  for (const p of S.photos.filter(p=>p.lat!=null&&sel(p.d))){ bounds.push([p.lat,p.lon]); L.marker([p.lat,p.lon],{icon:L.divIcon({className:"pmark",html:`<img src="${p.th}">`,iconSize:[42,42]})}).addTo(map).on("click",()=>viewPhoto(p.id,S.photos.filter(x=>x.lat!=null&&sel(x.d)).map(x=>x.id))); }
  if (!S.mapDay) for (const p of S.plan.filter(p=>p.k==="ort"&&p.lat!=null)){ L.circleMarker([p.lat,p.lon],{radius:7,color:"#e0603a",fillColor:p.done?"#ccc":"#ffd34d",fillOpacity:1,weight:2}).addTo(map).bindPopup(`☆ ${esc(p.ti)}${p.done?" ✓":""}`); if (!bounds.length) bounds.push([p.lat,p.lon]); }
  if (bounds.length) map.fitBounds(bounds,{padding:[30,30],maxZoom:15}); else if (lastFix) map.setView([lastFix.lat,lastFix.lon],13); else map.setView([47.5,13.5],6);
  $("#mapInfo").textContent=`${num(km(tr),1)} km Route · ${S.photos.filter(p=>p.lat!=null&&sel(p.d)).length} Fotos mit Ort`;
  setTimeout(()=>map&&map.invalidateSize(),100);
}

const b64 = blob => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
async function backup(){
  toast("Sicherung wird erstellt …",30000);
  const t=S.trip, out={app:"reisetagebuch",v:1,trip:t,entries:S.entries,photos:S.photos,plan:S.plan,money:S.money,track:S.track.map(({id,...r})=>r),blobs:{}};
  for (const p of S.photos){ const r=await DB.get("blobs",p.id); if (r) out.blobs[p.id]=await b64(r.b); }
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const name=`Reisetagebuch-${t.title.replace(/[^\wäöüÄÖÜß-]+/g,"_")}-${today()}.json`;
  const file=new File([blob],name,{type:"application/json"});
  if (navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); toast("✅ Sicherung übergeben"); return; }catch(e){ if (e.name==="AbortError") return toast("Abgebrochen"); } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); toast(`✅ ${name} gespeichert (${num(blob.size/1048576,1)} MB)`);
}
async function restore(file){
  try{
    toast("Sicherung wird geladen …",30000);
    const j=JSON.parse(await file.text()); if (j.app!=="reisetagebuch") throw new Error("Das ist keine Reisetagebuch-Sicherung");
    if (S.trips.some(t=>t.id===j.trip.id) && !confirm(`„${j.trip.title}“ gibt es hier schon. Mit der Sicherung überschreiben?`)) return;
    const old=await DB.byTrip("track",j.trip.id); for (const p of old) await DB.del("track",p.id);
    await DB.put("trips",j.trip);
    for (const s of ["entries","photos","plan","money"]) for (const x of j[s]||[]) await DB.put(s,x);
    for (const p of j.track||[]) await DB.put("track",p);
    for (const [id,du] of Object.entries(j.blobs||{})) await DB.put("blobs",{id,b:await (await fetch(du)).blob()});
    await loadTrips(); await loadTrip(j.trip.id); S.tab="tage"; render(); toast("✅ Sicherung geladen");
  }catch(e){ toast("Fehler: "+e.message,5000); }
}

/* ================= Aktionen ================= */
const pickTarget={day:null};
const ACT={
  tab:a=>{ S.tab=a; render(); scrollTo(0,0); },
  tripForm:a=>tripForm(a),
  async tripSave(a){
    const ti=$("#tTi").value.trim(), s=$("#tA").value, e=$("#tB").value, bud=+$("#tBud").value||0;
    if (!ti||!s||!e) return toast("Bitte Name und beide Daten ausfüllen"); if (e<s) return toast("„Bis“ liegt vor „Von“");
    let t=a?S.trips.find(x=>x.id===a):null;
    if (t){ Object.assign(t,{title:ti,start:s,end:e,budget:bud}); } else { t={id:uid(),title:ti,start:s,end:e,budget:bud,created:Date.now()}; }
    await DB.put("trips",t); await loadTrips(); await loadTrip(t.id); closeSheet(); toast("✅ Gespeichert"); markDirty();
  },
  async tripDel(a){ const t=S.trips.find(x=>x.id===a); if (!confirm(`„${t.title}“ mit allen Einträgen, Fotos und der Route endgültig von diesem Handy löschen? Das kann nicht rückgängig gemacht werden.`)) return;
    if (t.share&&t.share.on){ try{ await fb(t.share.code,"DELETE"); }catch(e){} }
    for (const s of ["entries","photos","plan","money","track"]) for (const x of await DB.byTrip(s,a)){ await DB.del(s,x.id); if (s==="photos") await DB.del("blobs",x.id); }
    await DB.del("trips",a); await loadTrips(); await loadTrip(S.trips[0]&&S.trips[0].id); closeSheet(); },
  async openTrip(a){ await loadTrip(a); S.tab="tage"; closeSheet(); render(); pullComments(); },
  openDay:a=>{ if (map) map.closePopup(); openDay(a); },
  closeDay:()=>closeSheet(), closeSheet:()=>closeSheet(),
  mood:a=>{ cur.mood=cur.mood===a?"":a; saveEntry(cur); document.querySelectorAll("#moods .chip").forEach(c=>c.classList.toggle("on",c.dataset.a===cur.mood&&c.dataset.act==="mood")); },
  hl:(a,b)=>{ cur.hl=!cur.hl; saveEntry(cur); b.classList.toggle("on",cur.hl); },
  fetchMeta:()=>{ if (cur){ cur.pl=null; cur.w=null; } fetchMeta(false); },
  dictate:(a,b)=>dictate(b),
  pick:a=>{ pickTarget.day=a||null; $("#filePick").click(); },
  cam:a=>{ pickTarget.day=a||null; $("#camPick").click(); },
  addPhotosToday:()=>{ pickTarget.day=today(); $("#filePick").click(); },
  viewPhoto:a=>viewPhoto(a, $("#pv")._ids), viewPhotoAll:a=>viewPhoto(a, S.photos.slice().sort((x,y)=>x.d.localeCompare(y.d)||(x.t-y.t)).map(p=>p.id)),
  pvClose:()=>closePv(),
  pFav:a=>{ const p=byId(a); p.fav=!p.fav; DB.put("photos",p); viewPhoto(a,$("#pv")._ids); },
  pNp:a=>{ const p=byId(a); p.np=!p.np; DB.put("photos",p); markDirty(); viewPhoto(a,$("#pv")._ids); },
  pDay:a=>{ const p=byId(a); const d=prompt("Neues Datum (JJJJ-MM-TT):",p.d); if (d&&/^\d{4}-\d\d-\d\d$/.test(d)){ p.d=d; DB.put("photos",p); markDirty(); viewPhoto(a,$("#pv")._ids); } },
  async pShare(a){ const r=await DB.get("blobs",a); const f=new File([r.b],"foto.jpg",{type:"image/jpeg"}); const p=byId(a); if (navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],text:p.cap||""}).catch(()=>{}); else toast("Senden wird hier nicht unterstützt"); },
  async pDel(a){ if (!confirm("Foto aus dem Tagebuch entfernen? (Das Original in deiner Galerie bleibt.)")) return; await deletePhoto(a); closePv(); },
  trkStart:()=>startTracking(), trkStop:()=>stopTracking(), checkIn:()=>checkIn(),
  gpx:()=>$("#gpxPick").click(),
  mapDay:a=>{ S.mapDay=a||null; render(); },
  planSeg:a=>{ S.planSeg=a; render(); },
  async pSearch(){ const q=$("#pq").value.trim(); if (!q) return; const box=$("#pRes"); box.innerHTML='<div class="mut">Suche …</div>';
    try{ const r=await placeSearch(q); S._res=r; box.innerHTML=r.map((x,i)=>`<div class="it"><div class="grow"><b>${esc(x.name||x.display_name.split(",")[0])}</b><div class="mut small">${esc(x.display_name)}</div></div><button class="btn sm" data-act="pPick" data-a="${i}">＋</button></div>`).join("")||'<div class="mut">Nichts gefunden.</div>'; }catch(e){ box.innerHTML='<div class="mut">Keine Verbindung.</div>'; } },
  async pPick(a){ const x=S._res[+a]; await addPlan({k:"ort",ti:x.name||x.display_name.split(",")[0],note:x.display_name.split(",").slice(1,3).join(",").trim(),lat:+x.lat,lon:+x.lon}); toast("📍 Gemerkt"); render(); },
  async pAdd(){ const i=$("#pAdd"), v=i.value.trim(); if (!v) return; await addPlan({k:S.planSeg,ti:v}); render(); $("#pAdd").focus(); },
  async addDayItem(d){ const i=document.querySelector(`[data-add-day="${d}"]`), v=i.value.trim(); if (!v) return; await addPlan({k:"tag",ti:v,d}); render(); },
  async packTpl(){ for (const [cat,items] of Object.entries(PACK)) for (const ti of items) await addPlan({k:"pack",ti,cat}); render(); },
  async pDone(a,b){ const p=S.plan.find(x=>x.id===a); p.done=b.checked; await DB.put("plan",p); render(); },
  async pDel2(a){ S.plan=S.plan.filter(x=>x.id!==a); await DB.del("plan",a); render(); },
  shareOn:async()=>{ const t=S.trip; t.share={on:true,code:uid(20),name:"",auto:false,route:false,up:{},seen:0}; await saveTrip(); await publish(); render(); toast("Teilen ist an. Jetzt bei jedem Tag „mit Freunden teilen“ anhaken – oder unten „Alle bisherigen Tage teilen“.",6000); },
  async shareAll(){ for (const e of S.entries){ e.sh=true; await DB.put("entries",e); } await publish(); render(); },
  async shareOff(){ if (!confirm("Teilen beenden? Der Link funktioniert dann nicht mehr und alle geteilten Daten samt Kommentaren werden vom Server gelöscht. Dein Tagebuch am Handy bleibt.")) return;
    try{ await fb(S.trip.share.code,"DELETE"); }catch(e){ return toast("Löschen fehlgeschlagen: "+e.message); } S.trip.share=null; await saveTrip(); S.comments={}; render(); toast("Teilen beendet"); },
  shareLink:async()=>{ const u=shareLink(S.trip.share.code); const txt=`Mein Reisetagebuch „${S.trip.title}“ – schau rein und schreib mir einen Kommentar:`;
    if (navigator.share) navigator.share({title:S.trip.title,text:txt,url:u}).catch(()=>{}); else { await navigator.clipboard.writeText(u); toast("Link kopiert"); } },
  publish:()=>publish(),
  allComments:()=>allComments(),
  async reply(){ const i=$("#eReply"), v=i.value.trim(); if (!v) return; try{ await postComment(cur.id,v,true); i.value=""; await pullComments(); $("#eCom").innerHTML=commentsHTML(S.comments[cur.id],cur.id,true); }catch(e){ toast(e.message); } },
  async delCom(a,b,ev){ if (!confirm("Kommentar löschen?")) return; const btn=ev.target.closest("[data-b]"); await fb(`${S.trip.share.code}/c/${a}/${btn.dataset.b}`,"DELETE"); await pullComments(); if (cur&&$("#eCom")) $("#eCom").innerHTML=commentsHTML(S.comments[cur.id],cur.id,true); else if ($("#sheet").classList.contains("open")) allComments(); },
  money:()=>moneySheet(),
  mCat:(a,b)=>{ S._cat=a; document.querySelectorAll("#mCats .chip").forEach(c=>c.classList.toggle("on",c===b)); },
  async mAdd(){ const v=parseFloat(($("#mAmt").value||"").replace(",",".")); if (!v) return toast("Betrag eingeben"); const m={id:uid(),trip:S.trip.id,t:Date.now(),d:today(),eur:v,cat:S._cat,note:$("#mNote").value.trim()}; S.money.push(m); await DB.put("money",m); moneySheet(); toast("💶 Gespeichert"); },
  async mDel(a){ S.money=S.money.filter(x=>x.id!==a); await DB.del("money",a); moneySheet(); },
  book:()=>openBook(),
  bFmtPick:(a,b)=>{ S._fmt=a; document.querySelectorAll('[data-act="bFmtPick"]').forEach(c=>c.classList.toggle("on",c===b)); },
  bAuto:()=>{ autoBook(S._fmt); openBook(); },
  bReset:()=>{ if (confirm("Alle Seiten verwerfen und einen neuen Vorschlag erstellen?")){ const f=S.trip.book.fmt; S.trip.book=null; S._fmt=f; openBook(); } },
  bEdit:a=>bookEdit(+a),
  bLay:(a,b)=>{ const pg=S.trip.book.pages[+a]; pg.lay=b; pg.ph=(pg.ph||[]).slice(0,LAYN[b]||0); if (b==="map") pg.ti=pg.ti||"Unsere Route"; saveTrip(); bookEdit(+a); },
  bPh:(a,b,ev)=>{ const i=+a, pg=S.trip.book.pages[i], id=ev.target.closest("[data-b]").dataset.b, n=LAYN[pg.lay]||0; pg.ph=pg.ph||[]; const k=pg.ph.indexOf(id);
    if (k>=0) pg.ph.splice(k,1); else { if (pg.ph.length>=n) pg.ph.shift(); pg.ph.push(id); } saveTrip(); const y=$("#sheet").scrollTop; bookEdit(i); $("#sheet").scrollTop=y; },
  bMove:(a,b)=>{ const P=S.trip.book.pages, i=+a, j=i+(+b); [P[i],P[j]]=[P[j],P[i]]; saveTrip(); bookEdit(j); },
  bDup:a=>{ const P=S.trip.book.pages, i=+a; P.splice(i+1,0,{id:uid(),d:P[i].d,lay:"photo2",ph:[]}); saveTrip(); bookEdit(i+1); },
  bAdd:()=>{ const P=S.trip.book.pages; P.push({id:uid(),lay:"text",ti:"Ende",x:""}); saveTrip(); bookEdit(P.length-1); },
  bDel:a=>{ if (!confirm("Seite löschen?")) return; S.trip.book.pages.splice(+a,1); saveTrip(); openBook(); },
  bPrint:()=>printBook(), printDiary:()=>printDiary(),
  printClose:()=>history.back(), doPrint:()=>window.print(),
  backup:()=>backup(), restore:()=>$("#jsonPick").click(),
  // Freunde-Ansicht
  vLike:a=>vLike(a), vSend:a=>vSend(a), vPhoto:(a,b)=>vPhoto(b), vName:()=>vAskName(true), vReload:()=>viewerLoad(),
};
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("#tabs button"); if (tb){ ACT.tab(tb.dataset.tab); return; }
  const el=ev.target.closest("[data-act]"); if (!el) return;
  if (el.tagName==="A") ev.preventDefault();
  const f=ACT[el.dataset.act]; if (f) f(el.dataset.a, el.dataset.b!==undefined&&el.dataset.act!=="bPh"&&el.dataset.act!=="delCom"?el.dataset.b:el, ev);
});
document.addEventListener("change",async ev=>{
  const s=ev.target.closest("[data-pday]"); if (s){ const p=S.plan.find(x=>x.id===s.dataset.pday); p.d=s.value||null; await DB.put("plan",p); }
});
$("#filePick").onchange=async e=>{ const f=[...e.target.files]; e.target.value=""; await addPhotos(f,pickTarget.day); if (cur&&$("#eFotos")){ $("#eFotos").innerHTML=photosOf(cur.d).map(phTile).join(""); } else render(); };
$("#camPick").onchange=async e=>{ const f=[...e.target.files]; e.target.value=""; await addPhotos(f,pickTarget.day||today()); if (cur&&$("#eFotos")) $("#eFotos").innerHTML=photosOf(cur.d).map(phTile).join(""); else render(); };
$("#jsonPick").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if (f) restore(f); };
$("#gpxPick").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if (f) importGpx(f); };
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible"){ if (tracking()) requestWake(); pullComments(); if (dirty) autoPublish(); } });
window.addEventListener("online",()=>{ if (dirty) autoPublish(); });

/* ================= Freunde-Ansicht (#s=CODE) ================= */
const VIEW=(location.hash.match(/s=([a-z0-9]{16,})/)||[])[1]||null;
const V={t:null,e:{},r:null,c:{},l:{},pics:{}};
async function viewerInit(){
  document.body.classList.add("viewer"); $("#tabs").style.display="none"; $("#top").innerHTML=`<div id="title">Reisetagebuch</div><button class="btn sm sec" data-act="vReload">⟳</button>`;
  await viewerLoad(); setInterval(()=>{ if (document.visibilityState==="visible") viewerLoad(true); }, 90000);
}
async function viewerLoad(soft){
  const v=$("#view");
  try{
    const [t,e,r,c,l]=await Promise.all(["t","e","r","c","l"].map(k=>fb(VIEW+"/"+k)));
    if (!t){ v.innerHTML=`<div class="card">Dieses Reisetagebuch gibt es nicht (mehr). Vielleicht wurde das Teilen beendet.</div>`; return; }
    V.t=t; V.e=e||{}; V.r=r; V.c=c||{}; V.l=l||{};
  }catch(err){ if (!soft) v.innerHTML=`<div class="card">Konnte nicht laden: ${esc(err.message)}</div>`; return; }
  const y=scrollY; renderViewer(); if (soft) scrollTo(0,y);
}
function renderViewer(){
  const t=V.t, me=localStorage.rt_name||"", meKey=nameKey(me);
  $("#title").textContent=t.ti;
  const ents=Object.entries(V.e).sort((a,b)=>b[1].d.localeCompare(a[1].d));
  $("#view").innerHTML=`<div class="vhead"><h1>${esc(t.ti)}</h1><div class="mut">${fmtDay(t.a,{day:"numeric",month:"long"})} – ${fmtDay(t.b,{day:"numeric",month:"long",year:"numeric"})}${t.o?` · von ${esc(t.o)}`:""}</div></div>
   ${V.r&&V.r.length?`<div id="vmap" class="minimap" style="height:260px;margin-bottom:12px"></div>`:""}
   ${ents.map(([id,e])=>{ const lk=V.l[id]||{}, nl=Object.keys(lk).length, mine=meKey&&lk[meKey];
     return `<div class="card"><div class="row"><span class="d grow" style="font:700 12px system-ui;color:var(--acc);text-transform:uppercase">Tag ${diffDays(t.a,e.d)+1} · ${fmtDay(e.d)}</span><span>${e.w?WMO(e.w.c)+" "+e.w.max+"°":""} ${e.m||""}</span></div>
      <h2 style="margin:4px 0 6px;font-size:22px">${esc(e.ti||e.pl||"")}</h2>${e.pl?`<div class="mut small">📍 ${esc(e.pl)}</div>`:""}
      ${e.x?`<div style="white-space:pre-wrap;font:17px/1.6 Georgia,serif;margin-top:8px">${esc(e.x)}</div>`:""}
      ${e.ph&&e.ph.length?`<div class="vpics">${e.ph.map(p=>`<img data-pid="${p.i}" data-act="vPhoto" data-b="${p.i}" alt="${esc(p.c)}" ${V.pics[p.i]?`src="${V.pics[p.i]}"`:""}>`).join("")}</div>`:""}
      <div class="row" style="margin-top:10px"><button class="likes ${mine?"on":""}" data-act="vLike" data-a="${id}">❤️ ${nl||""}</button>${nl?`<span class="mut small">${esc(Object.values(lk).slice(0,4).join(", "))}${nl>4?" …":""}</span>`:""}</div>
      <div>${commentsHTML(V.c[id],id,false)}</div>
      <div class="row" style="margin-top:6px"><input class="grow" id="vc_${id}" placeholder="${me?`Kommentar als ${esc(me)} …`:"Kommentar schreiben …"}"><button class="btn sm" data-act="vSend" data-a="${id}">Senden</button></div></div>`; }).join("")||`<div class="card mut">Noch keine Einträge geteilt – schau bald wieder vorbei!</div>`}
   <div class="mut small" style="text-align:center;margin:20px 0">${me?`Du schreibst als <b>${esc(me)}</b> · <a href="#" data-act="vName">ändern</a>`:""}</div>`;
  if (V.r&&V.r.length){ const m=L.map("vmap",{scrollWheelZoom:false}); L.tileLayer(TILE,{maxZoom:18,attribution:OSM_ATTR}).addTo(m); const b=[]; for (const s of V.r){ L.polyline(s,{color:"#0e7c7b",weight:4}).addTo(m); b.push(...s); } m.fitBounds(b,{padding:[20,20]}); }
  lazyPics();
}
let io=null;
function lazyPics(){ io&&io.disconnect(); io=new IntersectionObserver(es=>{ for (const en of es) if (en.isIntersecting){ io.unobserve(en.target); loadPic(en.target); } },{rootMargin:"400px"}); document.querySelectorAll(".vpics img:not([src])").forEach(im=>io.observe(im)); }
async function loadPic(im){ const id=im.dataset.pid; try{ if (!V.pics[id]) V.pics[id]=await fb(VIEW+"/p/"+id); if (V.pics[id]) im.src=V.pics[id]; }catch(e){} }
function vPhoto(id){ const src=V.pics[id]; if (!src) return; const pv=$("#pv"); pv.innerHTML=`<div class="bar"><button class="btn sm" data-act="pvClose">✕ Schließen</button></div><div class="img"><img src="${src}"></div>`; pv.classList.add("open"); history.pushState({pv:1},""); }
const nameKey = n => n.toLowerCase().replace(/[.#$\[\]\/]/g,"").trim().slice(0,40);
function vAskName(force){ if (localStorage.rt_name&&!force) return localStorage.rt_name; const n=(prompt("Wie heißt du? (wird bei deinen Kommentaren angezeigt)",localStorage.rt_name||"")||"").trim().slice(0,40); if (n){ localStorage.rt_name=n; if (force) renderViewer(); } return n; }
async function vLike(id){ const n=vAskName(); if (!n) return; const k=nameKey(n); if (!k) return; const has=V.l[id]&&V.l[id][k];
  try{ await fb(`${VIEW}/l/${id}/${k}`, has?"DELETE":"PUT", has?undefined:n); await viewerLoad(true); }catch(e){ toast(e.message); } }
async function vSend(id){ const i=$("#vc_"+id), x=i.value.trim(); if (!x) return; const n=vAskName(); if (!n) return;
  try{ await postComment(id,x.slice(0,2000),false); i.value=""; await viewerLoad(true); toast("💬 Danke für deinen Kommentar!"); }catch(e){ toast(e.message); } }

/* ================= Start ================= */
(async function start(){
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if (VIEW) return viewerInit();
  try{ await DB.open(); }catch(e){ $("#view").innerHTML=`<div class="card">Speicher nicht verfügbar: ${esc(e.message)}</div>`; return; }
  if (navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  await loadTrips();
  const want=localStorage.rt_trip; await loadTrip(S.trips.some(t=>t.id===want)?want:(S.trips[0]&&S.trips[0].id));
  render(); updBadge();
  if (S.trip && localStorage.rt_tracking===S.trip.id && phase()!=="nach") startTracking();
  pullComments(); setInterval(()=>{ if (document.visibilityState==="visible") pullComments(); }, 60000);
})();
</script>
