<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f16">
<title>Gridiron Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f16; --panel: #141c27; --panel2: #1b2533; --line: #ffffff14;
    --text: #eef3f8; --muted: #8a9bb0;
    --home: #18b4a0; --away: #9b5de5;
    --off: #2f7de1; --def: #e0413a; --gold: #f2b705; --gold-text: #ffe28a; --tac: #e0409f;
    --marker: #ffe600; --chain: #ff7a1a;
    --display: "Oswald", "Arial Narrow", Impact, sans-serif;
    /* Kartengröße: passt sich an Breite und Höhe an, damit nichts scrollt */
    --cw: clamp(60px, min(calc((50vw - 210px) / 4.9), 12.6vh), 136px);
    --ch: calc(var(--cw) * 1.46);
    --mw: calc(var(--cw) * .46);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Inter", system-ui, "Segoe UI", sans-serif; color: var(--text); overflow: hidden;
         background: radial-gradient(ellipse at top, #16243a 0%, var(--bg) 60%); }
  button { font-family: inherit; }

  /* ---------- App-Gitter ---------- */
  .app { height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px;
         padding: 8px 12px 10px; max-width: 1760px; margin: 0 auto; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(260px, 21vw, 350px) minmax(0, 1fr); gap: 10px; min-height: 0; }

  /* ---------- Kopfzeile ---------- */
  .top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
  .logo { font: 700 1.35rem var(--display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .logo span { color: var(--marker); }
  .top-actions { display: flex; gap: 6px; }
  .icon-btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .icon-btn:hover { background: var(--panel2); }
  .scorebug { display: grid; grid-template-columns: 1fr auto 1fr; border-radius: 12px; overflow: hidden; max-width: 720px; width: 100%; justify-self: center;
              background: linear-gradient(#1b2433, #0c1118); border: 1px solid var(--line); box-shadow: 0 8px 20px #0009; }
  .sb-team { --tc: var(--home); display: flex; align-items: center; gap: 10px; padding: 4px 14px; position: relative;
             background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 30%, transparent), transparent 85%); }
  .sb-team.t1 { --tc: var(--away); flex-direction: row-reverse; background: linear-gradient(270deg, color-mix(in srgb, var(--tc) 30%, transparent), transparent 85%); }
  .sb-team::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 5px; background: var(--tc); }
  .sb-team.t1::before { left: auto; right: 0; }
  .sb-name { font: 600 1rem var(--display); letter-spacing: .12em; text-transform: uppercase; }
  .sb-score { font: 700 1.9rem var(--display); line-height: 1; margin-left: auto; }
  .sb-team.t1 .sb-score { margin-left: 0; margin-right: auto; }
  .sb-poss { font-size: .6rem; font-weight: 800; letter-spacing: .08em; color: #1a1400; background: var(--marker); border-radius: 99px; padding: 2px 7px; opacity: 0; transform: scale(.6); transition: .3s; white-space: nowrap; }
  .sb-team.has-ball .sb-poss { opacity: 1; transform: scale(1); }
  /* Timeouts: 3 Punkte + Button im Scorebug */
  .sb-to { display: inline-flex; align-items: center; gap: 3px; padding: 3px 6px; border-radius: 6px; border: 1px solid #ffffff2a; background: #00000040;
           color: var(--text); font: 700 .58rem var(--display); letter-spacing: .08em; cursor: pointer; white-space: nowrap; }
  .sb-to i { width: 7px; height: 7px; border-radius: 50%; background: var(--marker); box-shadow: 0 0 4px var(--marker); }
  .sb-to i.used { background: #ffffff22; box-shadow: none; }
  .sb-to:not(:disabled):hover { background: #ffffff20; border-color: var(--marker); }
  .sb-to:disabled { cursor: default; opacity: .75; }
  .sb-to:disabled .to-l { opacity: .45; }
  .sb-to.live { border-color: var(--marker); animation: clockpulse 1.4s ease-in-out infinite; }
  .lay-landscape .sb-to, .lay-portrait .sb-to { padding: 2px 4px; gap: 2px; }
  .lay-landscape .sb-to .to-l, .lay-portrait .sb-to .to-l { display: none; }
  .lay-landscape .sb-to i, .lay-portrait .sb-to i { width: 6px; height: 6px; }
  .sb-clock em { font-style: normal; color: var(--marker); font-size: .62rem; }
  /* Two-Minute-Warning-Banner im Overlay */
  .period.twomin .ev-ic { font-size: 2.6rem; }
  .sb-team.has-ball { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 55%, transparent), transparent 90%); }
  .sb-team.t1.has-ball { background: linear-gradient(270deg, color-mix(in srgb, var(--tc) 55%, transparent), transparent 90%); }
  .sb-mid { background: #070a0f; padding: 4px 20px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .sb-dd { font: 700 1.35rem var(--display); color: var(--marker); letter-spacing: .04em; line-height: 1.1; white-space: nowrap; }
  .sb-spot { font-size: .62rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .sb-spot b { color: var(--text); }
  /* Spielzeit im Scorebug */
  .sb-clock { display: flex; align-items: center; justify-content: center; gap: 7px; font: 700 .78rem/1.2 var(--display); letter-spacing: .08em; }
  .sb-clock b { color: #fff; background: #ffffff1c; padding: 0 6px; border-radius: 4px; font-weight: 700; }
  .sb-clock span { color: #7fe3ff; font-size: .95rem; min-width: 3.1em; text-align: left; font-variant-numeric: tabular-nums; }
  .sb-clock.low span { color: #ff5a4a; animation: clockpulse 1s ease-in-out infinite; }
  .sb-clock.ot b { background: var(--gold); color: #2a1d00; }
  .sb-clock.final b { background: var(--def); }
  @keyframes clockpulse { 50% { opacity: .5; } }
  .lay-landscape .sb-clock, .lay-portrait .sb-clock { font-size: .62rem; gap: 4px; }
  .lay-landscape .sb-clock span, .lay-portrait .sb-clock span { font-size: .75rem; }

  /* ---------- Spielfeld ---------- */
  .field { position: relative; display: flex; height: clamp(80px, 15vh, 180px); border-radius: 10px; overflow: hidden; border: 3px solid #e9efe9; box-shadow: 0 0 0 5px #0f3b1c, 0 12px 28px #000a; }
  .endzone { width: 8%; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, #ffffff10 0 10px, transparent 10px 20px), var(--tc); }
  .endzone span { writing-mode: vertical-rl; font: 700 clamp(.8rem, 2vh, 1.4rem) var(--display); letter-spacing: .3em; color: #ffffffe0; text-shadow: 0 2px 4px #0006; }
  .endzone.ez0 { --tc: color-mix(in srgb, var(--home) 70%, #000); }
  .endzone.ez0 span { transform: rotate(180deg); }
  .endzone.ez1 { --tc: color-mix(in srgb, var(--away) 70%, #000); }
  .turf { position: relative; flex: 1; overflow: hidden; background: radial-gradient(ellipse at center, #ffffff08, transparent 70%), repeating-linear-gradient(90deg, #1a5a29 0 5%, #154d23 5% 10%); }
  .yl { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffffffc8; }
  .yl.goal { width: 4px; margin-left: -2px; background: #fff; }
  .hash { position: absolute; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, #ffffffaa 0 1.5px, transparent 1.5px 1%); }
  .num { position: absolute; transform: translateX(-50%); font: 700 clamp(.75rem, 2vh, 1.3rem) var(--display); color: #ffffffd8; letter-spacing: .08em; pointer-events: none; }
  .num.top { top: 12%; transform: translateX(-50%) rotate(180deg); }
  .num.bot { bottom: 12%; }
  .fd { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--chain); box-shadow: 0 0 8px var(--chain); transition: left .7s cubic-bezier(.3,.8,.3,1), opacity .3s; z-index: 2; }
  .fd span { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); background: var(--chain); color: #1a0a00; font: 700 .58rem var(--display); letter-spacing: .1em; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .los { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2.5px; background: var(--marker); z-index: 3; box-shadow: 0 0 10px var(--marker), 0 0 26px #ffe60099; transition: left .7s cubic-bezier(.3,.8,.3,1); }
  .ballchip { position: absolute; top: 50%; left: 50%; width: 40px; height: 24px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse at 35% 30%, #fff9b0, var(--marker) 45%, #d9b800); border: 2px solid #3d3300; box-shadow: 0 4px 10px #000a; }
  .ballchip::before { content: ""; position: absolute; left: 10px; right: 10px; top: 9px; height: 2px; background: #3d3300; }
  .ballchip::after { content: ""; position: absolute; left: 13px; right: 13px; top: 6px; height: 8px; background: repeating-linear-gradient(90deg, #3d3300 0 2px, transparent 2px 5px); }
  .chev { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 900; letter-spacing: -3px; text-shadow: 0 0 6px #000; white-space: nowrap; }
  .los.right .chev { left: 28px; } .los.left .chev { right: 28px; }
  .announce { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) skewX(-8deg) scale(.6); z-index: 10; font: 700 clamp(1.3rem, 4vh, 2.4rem) var(--display); letter-spacing: .06em; white-space: nowrap; padding: 4px 24px; border-radius: 6px; opacity: 0; pointer-events: none; text-transform: uppercase; }
  .announce.show { animation: announce 2s ease forwards; }
  .announce.good { background: var(--marker); color: #1a1400; box-shadow: 0 0 40px #ffe60088; }
  .announce.bad { background: var(--def); color: #fff; box-shadow: 0 0 40px #d93f3f88; }
  .announce.info { background: #eef3f8; color: #0a0f16; }
  @keyframes announce { 0% { opacity: 0; transform: translate(-50%, -50%) skewX(-8deg) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) skewX(-8deg) scale(1.08); } 20%, 78% { opacity: 1; transform: translate(-50%, -50%) skewX(-8deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) skewX(-8deg) scale(1); } }

  /* ---------- Mittelspalte ---------- */
  .center { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 10px; border-radius: 14px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); }
  .dice-pair { display: flex; gap: 14px; justify-content: center; padding: 2px 0 4px; }
  .dice-stage { width: 50px; height: 50px; perspective: 400px; transition: opacity .3s, filter .3s; }
  .dice-stage.off { opacity: .15; filter: grayscale(1); }
  .dice-stage.hop { animation: hop 1s cubic-bezier(.3,.7,.4,1); }
  @keyframes hop { 0% { transform: translateY(0); } 30% { transform: translateY(-18px); } 60% { transform: translateY(0); } 75% { transform: translateY(-5px); } 100% { transform: translateY(0); } }
  .dice-tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-16deg) rotateY(22deg); }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.15,.85,.25,1); }
  .face { position: absolute; inset: 0; border-radius: 10px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; background: linear-gradient(145deg, #fff, #dfe4ea); box-shadow: inset 0 0 0 1px #0001, inset 0 -5px 10px #0002; }
  .face i { width: 74%; aspect-ratio: 1; border-radius: 50%; place-self: center; background: radial-gradient(circle at 35% 35%, #444, #0b0b0b); }
  .face.f1 i { background: radial-gradient(circle at 35% 35%, #ff6b6b, #b30000); width: 90%; }
  .f1 { transform: translateZ(25px); } .f6 { transform: rotateY(180deg) translateZ(25px); }
  .f2 { transform: rotateY(90deg) translateZ(25px); } .f5 { transform: rotateY(-90deg) translateZ(25px); }
  .f3 { transform: rotateX(90deg) translateZ(25px); } .f4 { transform: rotateX(-90deg) translateZ(25px); }
  #controls { display: flex; flex-direction: column; gap: 6px; }
  .btn-row { display: flex; gap: 6px; } .btn-row > * { flex: 1; }
  .play-btn { font: 700 1rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border: 0; border-radius: 10px; cursor: pointer; color: #1a1400; line-height: 1.15; background: linear-gradient(#fff066, #f2c400); box-shadow: 0 4px 0 #a88600, 0 8px 16px #0008; display: flex; flex-direction: column; align-items: center; transition: transform .08s, box-shadow .08s; }
  .play-btn small { font: 600 .62rem "Inter"; letter-spacing: 0; text-transform: none; opacity: .75; }
  .play-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #a88600; }
  .play-btn.ready { animation: ready 1.8s ease-in-out infinite; }
  @keyframes ready { 50% { box-shadow: 0 4px 0 #a88600, 0 0 0 6px #ffe60030, 0 8px 22px #ffe60055; } }
  .play-btn.alt { background: linear-gradient(#f7f9fc, #cdd6e1); color: #0d1520; box-shadow: 0 4px 0 #7e8a99, 0 8px 16px #0008; }
  .play-btn:disabled { opacity: .35; cursor: default; animation: none; }
  .seg { display: flex; background: #0b1017; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 5px 6px; cursor: pointer; font: 700 .82rem var(--display); letter-spacing: .05em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .seg button small { font: 600 .58rem "Inter"; letter-spacing: 0; text-transform: none; opacity: .8; }
  .seg button.on { background: #eef3f8; color: #0a0f16; }
  .seg button.on.risky { background: linear-gradient(#ff8a5c, #e0452b); color: #fff; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .react { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: linear-gradient(90deg, #5c171755, #d93f3f22); border: 1px solid #d93f3f88; }
  .react-t { font: 700 .9rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: #ffd23f; }
  .react-t small { display: block; font: 600 .64rem "Inter"; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .bar { height: 7px; border-radius: 99px; background: #0007; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd23f, var(--def)); transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .calc { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-weight: 700; color: var(--muted); font-size: .78rem; min-height: 26px; }
  .chip { display: inline-flex; align-items: center; padding: 3px 7px; border-radius: 6px; font: 600 .76rem var(--display); letter-spacing: .03em; color: #fff; white-space: nowrap; }
  .chip.die { background: #eef3f8; color: #0a0f16; }
  .chip.off { background: var(--off); }
  .chip.off.strike { background: #34465e; color: #9fb0c4; text-decoration: line-through; }
  .chip.def { background: var(--def); color: #ffd23f; }
  .chip.gold { background: var(--gold); color: #2a1d00; }
  .chip.tac { background: var(--tac); }
  .chip.res { background: var(--marker); color: #1a1400; font-size: .95rem; }
  .chip.bad { background: var(--def); }
  .chip.wait { background: #ffffff14; color: var(--muted); }
  .hint { color: var(--muted); font-size: .7rem; line-height: 1.35; }
  .pbp { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #0b1017; border: 1px solid var(--line); border-radius: 10px; }
  .pbp h3 { margin: 0; padding: 5px 10px; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 6px; font-size: .7rem; }
  .log div { padding: 4px 0 4px 10px; border-bottom: 1px solid #ffffff0a; position: relative; line-height: 1.35; }
  .log div::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--tc, var(--muted)); }
  .log div.t0 { --tc: var(--home); } .log div.t1 { --tc: var(--away); }
  .log div:first-child { color: #fff; font-weight: 600; }

  /* ---------- Team-Panels ---------- */
  .team { --tc: var(--home); display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; padding: 0 10px 8px; background: var(--panel); border-radius: 14px; border: 1px solid var(--line); transition: box-shadow .4s; }
  .team.t1 { --tc: var(--away); }
  .team.active { box-shadow: 0 0 0 2px var(--tc), 0 0 30px -8px var(--tc); }
  .team-head { display: flex; align-items: center; gap: 8px; margin: 0 -10px; padding: 6px 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 40%, transparent), transparent); border-bottom: 1px solid var(--line); }
  .team-name { font: 700 1.1rem var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .role { font-size: .58rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 99px; }
  .role.off { background: var(--off); color: #fff; } .role.def { background: var(--def); color: #ffd23f; }
  .team-score { margin-left: auto; font: 700 1.5rem var(--display); }
  .boost-pill { font: 700 .66rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: linear-gradient(135deg, #6b4d00, var(--gold)); color: #fff6d6; border: 1px solid var(--gold); white-space: nowrap; }
  .boost-btn { font: 700 .66rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 0; cursor: pointer; color: #2a1d00; background: linear-gradient(#ffd84d, var(--gold)); animation: ready 1.5s infinite; white-space: nowrap; }
  .zone-l { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .zone-l .r { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .sum { font: 700 .82rem var(--display); letter-spacing: .04em; padding: 1px 7px; border-radius: 5px; color: #fff; }
  .sum.off { background: var(--off); } .sum.def { background: var(--def); color: #ffd23f; }
  .star-hint { color: var(--gold-text); }
  .row { display: flex; gap: 6px; align-items: flex-start; }
  .hand { gap: 0; }
  .hand > .card:not(:last-child) { margin-right: min(6px, calc((100% - var(--n) * var(--cw)) / (var(--n) - 1))); }
  .hand > .card:hover { z-index: 4; }
  .stk { display: inline-flex; align-items: center; gap: 4px; }
  .stk i { display: inline-block; width: 9px; height: 12px; border-radius: 2px; background: repeating-linear-gradient(45deg, var(--tac) 0 2px, #4a0e37 2px 4px); box-shadow: 1px 1px 0 #0007, 2px 2px 0 #0004; }
  .stk.dis i { background: #3a4656; }
  .bench { margin-top: auto; display: flex; gap: 6px; align-items: stretch; }
  .pool { flex: 1; display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 10px; min-width: 0; overflow: hidden; min-height: calc(var(--mw) * 1.46 + 10px); border: 1px dashed #ffffff1c; background: repeating-linear-gradient(135deg, #ffffff05 0 7px, transparent 7px 14px), #0b1017; }
  .pool-l { font-size: .56rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7b8899; line-height: 1.2; flex: none; width: 54px; }
  .pool-l small { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; color: #5d6b7d; }
  .kader-btn { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 4px 8px; border-radius: 10px; cursor: pointer; background: #0b1017; border: 1px solid var(--line); color: var(--text); font: 700 .6rem "Inter"; letter-spacing: .1em; text-transform: uppercase; }
  .kader-btn:hover { background: #111a24; }
  .cnt { display: flex; gap: 3px; }
  .cnt b { padding: 1px 5px; border-radius: 4px; font: 700 .64rem var(--display); color: #fff; }
  .cnt .q { background: #1a56b0; box-shadow: inset 0 0 0 1px var(--gold); } .cnt .o { background: var(--off); } .cnt .d { background: var(--def); color: #ffd23f; }

  /* =====================================================================
     SAMMELKARTEN nach Vorlage – alle Innenmaße in cqw (skalieren mit der Kartenbreite)
     ===================================================================== */
  .card { --acc: var(--off); --jersey: #1f56c4; --helmet: #1846a6; --trim: #ffffff;
          --frame: linear-gradient(125deg, #f2f2f2 0%, #ffc6e8 10%, #c4f2ff 22%, #fff3b4 34%, #e0caff 46%, #bdf6e4 58%, #ffd2c2 70%, #d6e2ff 84%, #f2f2f2 100%);
          container-type: inline-size; position: relative; flex: none; user-select: none;
          width: var(--cw); height: var(--ch); padding: max(3px, calc(var(--cw) * .036)); border-radius: calc(var(--cw) * .065);
          background: var(--frame); box-shadow: 0 6px 16px #000c, 0 0 0 1px #0009, inset 0 0 0 1px #ffffffb0;
          transition: transform .2s, box-shadow .15s, filter .3s, opacity .3s; }
  .card.t1 { --jersey: #c41f2d; --helmet: #a3141f; }
  .card.def { --acc: var(--def); }
  .card.qb { --acc: var(--gold); }
  .card.tac { --acc: var(--tac); --jersey: var(--tac);
              --frame: linear-gradient(125deg, #ffe4f5 0%, #ff6ec7 14%, #ffb8e8 28%, #c43aa2 42%, #ff9ad9 56%, #ffd6f1 70%, #b02c86 85%, #ffe4f5 100%); }
  .card.react-card { --frame: linear-gradient(125deg, #ffe4f5 0%, #ff6ec7 16%, #ff9a8a 34%, #c4304f 50%, #ff9ad9 66%, #ffd6f1 80%, #b02c64 92%, #ffe4f5 100%); }
  /* holografischer Glanz */
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
                 background: linear-gradient(115deg, transparent 30%, #ffffff55 42%, #a8fff477 48%, #ffb8f477 53%, transparent 64%);
                 background-size: 260% 100%; mix-blend-mode: overlay; animation: holo 7s linear infinite; }
  @keyframes holo { from { background-position: 130% 0; } to { background-position: -130% 0; } }
  .c-in { height: 100%; display: flex; flex-direction: column; gap: 2cqw; padding: 2.6cqw 2.6cqw 1.6cqw; overflow: hidden;
          border-radius: calc(var(--cw) * .04);
          background: radial-gradient(ellipse 90% 40% at 50% 0%, #ffffff12, transparent 70%),
                      repeating-linear-gradient(60deg, #ffffff06 0 1px, transparent 1px 5px),
                      repeating-linear-gradient(-60deg, #ffffff06 0 1px, transparent 1px 5px),
                      linear-gradient(180deg, #2a2e35, #16191d 60%, #111316);
          box-shadow: inset 0 0 0 1.5px #000, inset 0 0 0 2.5px #ffffff26; }

  /* Namensschild mit abgeschrägten Ecken */
  .c-head { flex: 0 0 13%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 4cqw .6cqw;
            background: linear-gradient(180deg, #555b64, #30343b 40%, #1e2126); box-shadow: inset 0 1px 0 #ffffff40;
            clip-path: polygon(0 0, 100% 0, 100% 64%, 93% 100%, 7% 100%, 0 64%); }
  .c-name { max-width: 100%; font: italic 700 var(--nf, 8cqw)/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 #000, 0 2px 5px #000b; }
  .c-name .short { display: none; }
  .c-sub { max-width: 100%; font: 600 4.5cqw/1.15 var(--display); letter-spacing: .07em; text-transform: uppercase; color: #c6cbd2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Spielerbild: Flutlicht-Stadion bei Nacht */
  .c-photo { --h: 212; flex: 0 0 43%; position: relative; overflow: hidden; border-radius: 1.4cqw;
             border: max(1.5px, .8cqw) solid #6f757e; box-shadow: 0 1cqw 2.5cqw #000b;
             background:
               radial-gradient(ellipse 13% 8% at 15% 17%, #ffffff 0 30%, #fff6d0 50%, transparent 72%),
               radial-gradient(ellipse 13% 8% at 85% 17%, #ffffff 0 30%, #fff6d0 50%, transparent 72%),
               radial-gradient(ellipse 34% 30% at 15% 17%, #fff3c466, transparent 70%),
               radial-gradient(ellipse 34% 30% at 85% 17%, #fff3c466, transparent 70%),
               radial-gradient(ellipse 80% 24% at 50% 66%, #ffffff2a, transparent 70%),
               radial-gradient(ellipse 60% 45% at 50% 100%, color-mix(in srgb, var(--jersey) 35%, transparent), transparent 70%),
               linear-gradient(180deg, hsl(var(--h) 40% 24%) 0%, hsl(var(--h) 45% 11%) 50%, #1f5f2c 62%, #154c22 100%); }
  .c-photo::before { content: ""; position: absolute; left: 0; right: 0; top: 36%; height: 26%;   /* Ränge mit Lichtern */
                     background: radial-gradient(circle, #ffffffaa 0 .35px, transparent .8px) 0 0 / 2.6cqw 1.8cqw, linear-gradient(180deg, #0004, #000b 70%, #0000); opacity: .8; }
  .c-photo::after { content: ""; position: absolute; left: -20%; right: -20%; bottom: 0; height: 40%;   /* Yard-Linien */
                    background: repeating-linear-gradient(90deg, transparent 0 15%, #ffffff40 15% 16%);
                    transform: perspective(30cqw) rotateX(58deg); transform-origin: bottom; opacity: .7; }
  .c-player { position: absolute; left: 50%; bottom: 0; height: 97%; width: auto; transform: translateX(-50%); z-index: 1;
              filter: drop-shadow(0 0 1.5cqw #fff4cc55) drop-shadow(0 1.5cqw 2cqw #000d); }
  .c-icon { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; }
  .c-icon span { width: 46cqw; height: 46cqw; border-radius: 50%; display: grid; place-items: center; font-size: 25cqw; line-height: 1;
                 background: radial-gradient(circle, color-mix(in srgb, var(--tac) 60%, #fff) 0, var(--tac) 42%, #4a0e37 76%);
                 box-shadow: 0 0 6cqw #ff6ec7aa, inset 0 -2cqw 4cqw #0006, 0 0 0 1cqw #ffffff22; }
  .c-pos { display: none; position: absolute; top: 2cqw; left: 2cqw; z-index: 2; font: 700 max(8px, 10cqw)/1 var(--display); letter-spacing: .03em; color: #fff;
           padding: .8cqw 2.4cqw; border-radius: 1.6cqw; background: var(--acc); box-shadow: 0 1cqw 2cqw #000a; }
  .card.qb .c-pos { color: #2a1d00; }

  /* Werte-Zeile: goldener Würfel + Bonus | goldenes Y + Base Yards */
  .c-stats { flex: 0 0 15%; display: flex; align-items: center; gap: 2.2cqw; padding: 0 1cqw; min-height: 0; }
  .die3d { flex: none; width: 15cqw; height: 15cqw; border-radius: 3cqw; transform: rotate(-8deg);
           background: radial-gradient(circle at 27% 27%, #3a2600 9%, transparent 11%), radial-gradient(circle at 73% 73%, #3a2600 9%, transparent 11%),
                       radial-gradient(circle at 73% 27%, #3a2600 9%, transparent 11%), radial-gradient(circle at 27% 73%, #3a2600 9%, transparent 11%),
                       radial-gradient(circle at 50% 50%, #3a2600 9%, transparent 11%),
                       linear-gradient(140deg, #fff3b8 0%, #f5c83a 35%, #c98d0c 70%, #8a5a00 100%);
           box-shadow: inset -1cqw -1.2cqw 1.5cqw #0005, inset 1cqw 1cqw 1.2cqw #fff6, 0 1.2cqw 2cqw #000c; }
  .s-ico { flex: none; width: 15cqw; height: 15cqw; border-radius: 50%; display: grid; place-items: center; font-size: 9cqw; line-height: 1;
           background: radial-gradient(circle at 35% 30%, #fff3b8, #f5c83a 45%, #8a5a00); box-shadow: 0 1.2cqw 2cqw #000c; }
  .s-txt { flex: 1; min-width: 0; }
  .s-l { font: 700 4.6cqw/1.1 var(--display); color: #fff; letter-spacing: .03em; text-transform: uppercase; }
  .s-v { font: 700 5.6cqw/1.05 var(--display); color: #ffc23a; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
  .s-v .short { display: none; }
  .s-div { flex: none; width: 1px; align-self: stretch; margin: 2cqw 0; background: linear-gradient(transparent, #ffffff66, transparent); }
  .s-y { flex: none; font: 700 15cqw/1 var(--display); background: linear-gradient(180deg, #ffe9a0, #f2b705 50%, #a06a00);
         -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #000) drop-shadow(0 1cqw 1cqw #000a); }
  .s-yards { flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .s-yl { font: 700 4.3cqw/1.05 var(--display); color: #fff; text-transform: uppercase; letter-spacing: .03em; }
  .s-yn { font: 700 9cqw/1 var(--display); color: #fff; text-shadow: 0 1px 3px #000; }
  .s-side { font-size: 10cqw; line-height: 1; filter: drop-shadow(0 1cqw 1cqw #000); }

  /* Goodie-Box mit Reiter */
  .c-goodie { flex: 1 1 auto; min-height: 0; position: relative; margin-top: 2.4cqw; padding: 4.4cqw 3cqw 2.4cqw;
              display: flex; align-items: center; justify-content: center; text-align: center;
              border: max(1px, .7cqw) solid #e3b03a; border-radius: 2.8cqw; background: #0b0d10ee; box-shadow: 0 0 3cqw #f2b70533, inset 0 0 3cqw #000; }
  .g-tab { position: absolute; top: 0; left: 50%; transform: translate(-50%, -55%); white-space: nowrap;
           font: 700 4.3cqw/1.1 var(--display); letter-spacing: .06em; color: #ffd56a; padding: .6cqw 3.2cqw; border-radius: 99px;
           background: linear-gradient(#30353c, #15181c); border: max(1px, .6cqw) solid #e3b03a; }
  .g-txt { margin: 0; font: 600 4.5cqw/1.3 "Inter"; color: #f1f1f1; overflow: hidden; }
  .g-txt b { font: 700 4.9cqw/1.2 var(--display); letter-spacing: .03em; text-transform: uppercase; color: #ffc23a; }

  /* Kartenfuß: Wappen, Helm, Schuh, Nummer */
  .c-foot { flex: 0 0 7%; display: flex; align-items: center; justify-content: space-between; padding: 0 1cqw; }
  .f-crest { height: 7.5cqw; width: auto; }
  .f-icons { display: flex; align-items: center; gap: 3cqw; }
  .f-icons svg { height: 5.4cqw; width: auto; }
  .f-no { font: 700 4.8cqw/1 var(--display); color: #cdd2d8; letter-spacing: .04em; }

  /* Kompakt (Spielbrett): kurze, gut lesbare Texte – alle Details in der Großansicht */
  @container (max-width: 190px) {
    .c-in { gap: 1.8cqw; padding: 2.2cqw; }
    .c-head { flex-basis: 14%; padding-bottom: 0; clip-path: polygon(0 0, 100% 0, 100% 70%, 90% 100%, 10% 100%, 0 70%); }
    .c-name { font-size: max(8px, var(--sf, 12cqw)); }
    .c-name .full, .s-v .full { display: none; }
    .c-name .short, .s-v .short { display: inline; }
    .c-sub, .c-foot, .g-tab, .gd, .s-l, .s-yl, .s-div { display: none; }
    .c-photo { flex-basis: 46%; border-width: 1px; }
    .c-pos { display: block; }
    .c-stats { flex-basis: 19%; gap: 2cqw; padding: 0; justify-content: space-between; }
    .die3d, .s-ico { width: 17cqw; height: 17cqw; }
    .s-ico { font-size: 10cqw; }
    .s-v { font-size: max(9px, 11cqw); line-height: 1; }
    .s-y, .s-yn { font-size: 17cqw; }
    .s-side { font-size: 14cqw; }
    .c-goodie { margin-top: 0; padding: 1.5cqw; border-width: 1px; }
    .g-txt { line-height: 1.05; }
    .g-txt b { font-size: max(8.5px, 9.5cqw); line-height: 1.05; }
  }
  /* Sehr klein (Handy-Querformat): Name, Bild, Bonus + Yards – ohne Goodie */
  @container (max-width: 72px) {
    .c-goodie, .c-pos, .die3d, .s-ico { display: none; }
    .c-in { gap: 1.5cqw; padding: 2cqw; }
    .c-head { flex-basis: 17%; }
    .c-photo { flex: 1 1 auto; }
    .c-stats { flex-basis: 22%; gap: 1cqw; }
    .s-v { font-size: max(7px, 15cqw); }
    .s-y, .s-yn { font-size: max(9px, 20cqw); }
    .s-side { font-size: 20cqw; }
  }
  /* Mini (Pausen-Pool): nur Name + Bild */
  @container (max-width: 40px) {
    .c-stats { display: none; }
    .c-head { flex-basis: 24%; }
    .c-name { font-size: 14cqw; }
  }

  .card.mini { --cw: var(--mw); --ch: calc(var(--mw) * 1.46); padding: 2px; }

  /* Kartenrückseite (verdeckte Hand) */
  .card.back { --frame: linear-gradient(125deg, #ffe4f5 0%, #ff6ec7 14%, #ffb8e8 28%, #c43aa2 42%, #ff9ad9 56%, #ffd6f1 70%, #b02c86 85%, #ffe4f5 100%); cursor: pointer; }
  .back-in { align-items: center; justify-content: center; gap: 3cqw;
             background: radial-gradient(circle at 50% 42%, #ff6ec755, transparent 55%),
                         repeating-linear-gradient(45deg, #ffffff0a 0 3cqw, transparent 3cqw 6cqw),
                         repeating-linear-gradient(-45deg, #ffffff0a 0 3cqw, transparent 3cqw 6cqw), linear-gradient(160deg, #3b0f30, #12060f); }
  .back-logo { width: 44cqw; height: 44cqw; border-radius: 50%; display: grid; place-items: center; font: italic 700 18cqw/1 var(--display); color: #fff;
               background: radial-gradient(circle at 35% 30%, #ff9ad9, #c43aa2 50%, #5a1144); border: 1.2cqw solid #ffd6f1; box-shadow: 0 0 6cqw #ff6ec7aa; }
  .back-txt { font: 700 max(7px, 8cqw)/1.05 var(--display); letter-spacing: .14em; color: #ffd6f1; text-align: center; }

  /* Spieler-Markierungen & Aufdecken */
  .who { font: 700 .62rem "Inter"; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: #ffffff1a; color: var(--text); white-space: nowrap; }
  .who.ai { background: #7c3aed; color: #fff; }
  .who.me { background: var(--marker); color: #1a1400; }
  .peek-btn { margin-left: 6px; font: 700 .6rem "Inter"; letter-spacing: .04em; text-transform: none; padding: 2px 7px; border-radius: 6px; cursor: pointer;
              background: #ffffff14; color: var(--text); border: 1px solid #ffffff2a; }
  .peek-btn:hover { background: #ffffff26; }

  /* Startbildschirm */
  .overlay.start { background: radial-gradient(ellipse at 50% 30%, #1d3a5c, #05080d 70%); backdrop-filter: blur(6px); z-index: 70; }
  .start-box { max-width: 620px; border-top-color: var(--marker); padding: 28px; }
  .start-logo { font: italic 700 3rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; text-shadow: 0 4px 20px #000; }
  .start-logo span { color: var(--marker); }
  .mode-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .mode-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 12px; border-radius: 16px; cursor: pointer; color: var(--text);
              background: linear-gradient(165deg, #263447, #121a25); border: 2px solid #ffffff22; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .mode-btn:hover { transform: translateY(-4px); border-color: var(--marker); box-shadow: 0 0 24px #ffe60044; }
  .mode-btn b { font: 700 1.5rem var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .mode-btn span { font-size: .8rem; color: var(--muted); }
  .mode-btn.home { border-color: #1f56c4aa; } .mode-btn.away { border-color: #c41f2daa; }
  .mode-btns > :nth-child(3):last-child, .mode-btns > :only-child { grid-column: 1 / -1; padding: 16px 12px; }
  /* Online-Duell */
  .join-box { margin-top: 14px; padding: 14px; border-radius: 16px; border: 2px solid #c41f2daa; background: linear-gradient(165deg, #263447, #121a25); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .join-box > b { font: 700 1.3rem var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .join-box > span { font-size: .8rem; color: var(--muted); }
  .join-row { display: flex; gap: 8px; margin-top: 8px; width: 100%; max-width: 360px; }
  .join-row input { flex: 1; min-width: 0; font: 700 1.4rem var(--display); letter-spacing: .12em; text-align: center; text-transform: uppercase; padding: 8px 10px; border-radius: 10px;
                    border: 2px solid #ffffff33; background: #0b1017; color: var(--text); }
  .join-row input:focus { outline: none; border-color: var(--marker); }
  .room-code { font: 700 3rem/1.1 var(--display); letter-spacing: .14em; color: var(--marker); margin: 6px 0 10px; user-select: all; text-shadow: 0 0 20px #ffe60055; }
  .invite { display: flex; gap: 14px; align-items: center; text-align: left; margin: 4px 0 12px; padding: 12px; border-radius: 14px; background: #0b1017; border: 1px solid var(--line); }
  .invite .qr { flex: none; width: 150px; height: 150px; background: #fff; border-radius: 10px; padding: 4px; }
  .invite .qr svg { width: 100%; height: 100%; display: block; }
  .invite-r { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .invite-r p { margin: 0; font-size: .82rem; color: #d9dee6; }
  .invite-url { width: 100%; font: 600 .78rem var(--body, sans-serif); padding: 7px 9px; border-radius: 8px; border: 1px solid #ffffff33; background: #121922; color: var(--text); }
  .invite .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .invite .play-btn { padding: 8px 14px; }
  .lay-portrait .invite { flex-direction: column; text-align: center; }
  .lay-portrait .invite .qr { width: 170px; height: 170px; }
  .lay-landscape .invite .qr { width: 110px; height: 110px; }
  .net-status { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
  .net-status .dots { margin: 0; }
  .net-err { color: #ff8a80; font-weight: 600; margin: 10px 0 0; }
  .diag { text-align: left; font-size: .78rem; line-height: 1.45; margin: 8px 0 0; padding: 10px 12px 10px 28px; border-radius: 12px; background: #0b1017; border: 1px solid #ff8a8055; color: #d9dee6; }
  .diag li { margin: 3px 0; } .diag code { background: #ffffff14; padding: 0 4px; border-radius: 4px; font-size: .74rem; }
  .net-test { text-align: left; margin: 12px 0 6px; padding: 10px 12px; border-radius: 12px; background: #0b1017; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .nt-row { display: flex; gap: 8px; align-items: flex-start; font-size: .82rem; }
  .nt-row small { display: block; color: var(--muted); font-size: .74rem; }
  .nt-verdict { margin: 4px 0 0; font-size: .8rem; font-weight: 600; }
  .start-box { max-height: calc(100vh - 20px); overflow-y: auto; }
  .net-note { font-size: .75rem; color: var(--muted); margin: 12px 0 0; }
  #netbar { position: fixed; left: 8px; bottom: 8px; z-index: 97; display: flex; gap: 6px; align-items: center; pointer-events: none; font-size: .72rem; font-weight: 700; }
  #netbar[hidden] { display: none; }
  #netbar span { padding: 4px 9px; border-radius: 99px; background: #0b1017e6; border: 1px solid var(--line); }
  #netbar .nb-shot:empty { display: none; }
  #netbar .nb-shot.mine { border-color: var(--marker); color: var(--marker); }
  #netbar .nb-shot.low { border-color: var(--def); color: #fff; background: #8b1c17e6; animation: clockpulse 1s ease-in-out infinite; }

  /* KI denkt nach */
  .overlay.ai-wait { background: #0007; backdrop-filter: none; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--marker); animation: dot 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }

  /* Kartenzustände */
  .card.playable { cursor: pointer; box-shadow: 0 0 0 2px var(--tac), 0 0 18px #e0409faa, 0 6px 14px #000c; animation: tacglow 1.6s ease-in-out infinite; }
  .card.playable:hover { transform: translateY(-5px); }
  @keyframes tacglow { 50% { box-shadow: 0 0 0 2px var(--tac), 0 0 30px #e0409fdd, 0 6px 14px #000c; } }
  .card.react-card.playable { box-shadow: 0 0 0 3px #ffd23f, 0 0 26px #ffd23faa; animation: reactglow .8s ease-in-out infinite; }
  @keyframes reactglow { 50% { box-shadow: 0 0 0 3px #ffd23f, 0 0 40px #ffd23fee; } }
  .card.armed { cursor: pointer; box-shadow: 0 0 0 3px var(--marker), 0 0 22px #ffe60088; }
  .card.dim { opacity: .3; filter: grayscale(.7); }
  .card.starable { cursor: pointer; }
  .card.starable:hover { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--gold), 0 10px 18px #000c; }
  .card.star { box-shadow: 0 0 0 3px var(--gold), 0 0 26px #f2b705dd; transform: translateY(-4px); }
  .card.tapped { transform: rotate(-5deg); filter: saturate(.35) brightness(.75); }
  .card .tag { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); z-index: 4; white-space: nowrap; pointer-events: none;
               font: 700 max(9px, calc(var(--cw) * .13)) var(--display); letter-spacing: .05em; padding: 1px 6px; border-radius: 5px; box-shadow: 0 2px 6px #000b; }
  .tag.star-t { background: var(--gold); color: #2a1d00; }
  .tag.used-t { background: #000d; color: var(--gold-text); font-size: max(8px, calc(var(--cw) * .1)); }
  .tag.armed-t { background: var(--marker); color: #1a1400; }
  /* Pausen-Pool: abgedunkelt, mit Schloss, nicht anklickbar */
  .card.paused { filter: grayscale(100%) opacity(40%); pointer-events: none; cursor: default; }
  .card.paused::after { display: none; }
  .card .lock { position: absolute; right: -3px; bottom: -3px; z-index: 5; font-size: max(10px, calc(var(--cw) * .22)); font-style: normal; filter: drop-shadow(0 1px 2px #000); }
  .card.paused.just { filter: grayscale(30%) opacity(80%); animation: justin 1.4s ease forwards; }
  @keyframes justin { to { filter: grayscale(100%) opacity(40%); } }
  .slot { width: var(--cw); height: var(--ch); flex: none; border-radius: calc(var(--cw) * .075); border: 2px dashed #ffffff22; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; background: #ffffff05; padding: 4px; }
  .slot.tac-slot { border-color: #e0409f55; color: #e0409fbb; }
  /* Joker (4. Kartenslot) */
  .slot.joker-slot { border-color: #ffd23f66; color: #ffd23fcc; }
  .card.joker { box-shadow: 0 0 0 2px var(--gold), 0 0 14px #ffd23f88; }
  .card.joker-back { --frame: linear-gradient(125deg, #fff6c8 0%, #ffd23f 18%, #b8860b 40%, #ffe98a 60%, #c9961a 80%, #fff6c8 100%); cursor: default; }
  .card.joker-back .back-logo { font-size: calc(var(--cw) * .3); }

  const DUEL_BONUS = 3;

  // mode: "pvp" = 2 Spieler an einem Bildschirm · "ai" = 1 Spieler gegen den Computer (ai = Index des KI-Teams)

  const isQB = id => cards[id].kind === "qb";
  const isReact = id => TACTICS[cards[id].tac]?.timing === "react";
  const byValue = ids => [...ids].sort((a, b) => Math.abs(cards[b].value) - Math.abs(cards[a].value) || Math.abs(cards[b].bonus || 0) - Math.abs(cards[a].bonus || 0));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const handLimit = t => BASE_HAND + (t.comeback === "kader" ? 1 : 0);
  const fanBonus = () => (offTeam().comeback === "fan" ? 1 : 0) - (defTeam().comeback === "fan" ? 1 : 0);
  const canAct = () => !state.busy && !state.modal && !state.formation && !state.call && !state.react && !state.pending && !state.event && !state.setup && !state.periodModal && !state.gameOver && !state.summary;
  const isAI = i => state.mode === "ai" && state.ai === i;

  function draw(t, n, ti) {

      const idx = crit ? 0 : state.down === 1 ? Math.floor(rest.length * 0.6) : Math.floor(rest.length * 0.3);

    }
    return { sel, joker };
  }
  // Notfall-Reset: weniger als 4 einsetzbare Karten im Kader → Pausen-Pool dieses Teams zurück
  function prepFormation() {
    const f = state.formation, ti = f.queue[0], t = teams[ti], role = roleOf(ti);

  function openFormation() { state.formation = { queue: [state.offense, 1 - state.offense], sel: [], joker: null }; prepFormation(); }
  // Nach jedem Down: alle eingesetzten Karten (3 Stamm + Joker) beider Teams in den Pausen-Pool
  function rotateToPause() {
    const moved = [];

    state.justPaused = new Set(moved); state.reveal = false;
  }
  function resetPause(why) {
    let n = 0;
    teams.forEach(t => { n += t.pause.length; t.kader.push(...t.pause); t.pause = []; });

    if (n) log(`♻️ ${why}: ${n} Karten aus den Pausen-Pools zurück im Kader.`);

  // ================= Taktik- & Konter-Karten =================
  function tacBlock(id) {
    const c = cards[id], ti = c.owner, T = TACTICS[c.tac];

    return "";
  }

    if (tacBlock(id)) return;

  // ================= Sound =================

  // ================= Drives & Ereignisse =================

  // ================= Drive-Protokoll & Down-Übersicht =================

  // Situation vor dem Spielzug (linke Spalte der Übersicht)

  function pushDrive(pre, title, desc, stats, kind, yds = 0) {

  function recordPlay(pre, res, result, kind) {

  // ================= Spielzeit =================
  // Zieht Zeit von der Uhr ab und liefert Chip (Calc-Zeile) + Text (Play-by-Play)
  function useClock(sec, note = "") {

    const txt = ` · ⏱ −${sec}s${note ? " " + note : ""} (${QTR_LABEL[q - 1]} ${clockStr(state.clock)})`;
    $("calc").insertAdjacentHTML("beforeend", chip("wait", `⏱ −${sec}s${note ? " · " + note : ""}`));

  }
  // Two-Minute Warning: nach dem laufenden Down unterbrechen und die Uhr anhalten

  }

  // ================= Ablauf eines Downs =================
  function startSnap() {
    const c = state.call, oi = state.offense;
    state.duel = { off: c.off, def: c.def }; state.call = null;
    const m = duelMatch(state.duel), txt = `${CALLS[c.off].label} vs ${CALLS[c.def].label}`;
    log(`Pre-Snap-Duell: ${teams[oi].name} ${CALLS[c.off].label} – ${teams[1 - oi].name} ${CALLS[c.def].label} → ${m ? `Defense liest den Spielzug (−${DUEL_BONUS})` : `Defense getäuscht (+${DUEL_BONUS})`}.`, oi);
    announce(txt, m ? "bad" : "good");
    // Snap: Joker-Karten beider Teams werden aufgedeckt
    state.reveal = true;
    [oi, 1 - oi].forEach(i => { const j = teams[i].joker; if (j) log(`🃏 Joker aufgedeckt: ${teams[i].name} – ${cards[j].name} (${cards[j].pos}, ${fmt(cards[j].value)} Base Yards, ${fmt(cards[j].bonus)} ${cards[j].bonusOn === "run" ? "Lauf" : "Pass"}).`, i); });
    $("calc").innerHTML = chip(m ? "def" : "off", `${CALLS[c.off].icon} ${txt.toUpperCase()} ${fmt(m ? -DUEL_BONUS : DUEL_BONUS)}`) + chip("wait", "Würfel rollen…");

  }
  function rollPlay() {
    state.busy = true; state.justPaused.clear(); render();
    const n = state.risk ? 2 : 1;
    const throws = [throwDice(n)];
    if (tacKey(state.offense) === "audible") throws.push(throwDice(n));
    const dice = throws.reduce((a, b) => (total(b) > total(a) ? b : a));
    animateDice(dice, () => {
      state.busy = false; state.pending = { dice, throws };
      const prev = computePlay(dice);
      const aud = throws.length > 1 ? chip("tac", `AUDIBLE: ${throws.map(t => t.join("+")).join(" / ")}`) : "";
      if (!prev.turnover && defTeam().hand.some(isReact)) { $("calc").innerHTML = chip("gold", "VORLÄUFIG") + aud + prev.html; openReact(); }
      else applyPending(null, aud);
    });
  }
  function openReact() { state.react = { start: Date.now(), timer: setTimeout(() => actions.noReact(), REACT_SECONDS * 1000) }; render(); sfx("info"); }
  function closeReact() { if (state.react) { clearTimeout(state.react.timer); state.react = null; } }
  function playReaction(id) {
    const c = cards[id], ti = c.owner, t = teams[ti], T = TACTICS[c.tac];

    } else if (c.tac === "tackle") applyPending(3, chip("tac", "🤚 TACKLE"));
  }

  // Ergebnis berechnen (ohne Zustand zu ändern)
  function computePlay(dice, cap = null) {
    const oi = state.offense, o = teams[oi], d = teams[1 - oi];
    const ot = tacKey(oi), dt = tacKey(1 - oi);
    const risk = dice.length > 1, sumDice = total(dice), hi = Math.max(...dice);
    const call = state.duel?.off, isPass = ot === "hail" || call === "pass";
    // Aufstellung inkl. Joker: zählt mit Base Yards, passenden Würfel-Boni und Goodies voll mit
    const oF = lineup(o, "off"), dF = lineup(d, "def");
    const diceTxt = `🎲 ${dice.join(" + ")}${risk ? ` = ${sumDice}` : ""}`;
    let saved = "";
    // Ballverlust beim Risiko-Wurf (mit Goodies: Strip/Ballhawk/Ballsicher/Sichere Hände)
    if (risk) {
      const doubleOne = dice[0] === 1 && dice[1] === 1;
      const trig = dice.includes(1) || (dice.includes(2) && hasG(dF, isPass ? "ballhawk" : "strip"));
      if (trig) {
        const prot = hasG(oF, isPass ? "hands" : "secure");
        if (!prot || doubleOne) return { turnover: isPass ? "int" : "fumble", gain: 0, html: chip("die", diceTxt) + chip("bad", isPass ? "INTERCEPTION!" : "FUMBLE!") };
        saved = chip("gold", isPass ? "🧤 SICHERE HÄNDE" : "🔒 BALLSICHER");
      }
    }
    const capIt = g => (cap !== null && g > cap ? [cap, chip("tac", `MAX ${cap}`)] : [g, ""]);
    if (ot === "hail") {
      const need = dt === "blitz" ? 6 : 5;
      const [gain, cc] = capIt(hi >= need ? 25 : 0);
      return { gain, incomplete: !gain, html: chip("die", diceTxt) + saved + chip("tac", `HAIL MARY ≥ ${need}`) + cc + "=" + chip(gain ? "res" : "bad", gain ? `${fmt(gain)} YD` : "UNVOLLSTÄNDIG") };
    }
    const die = ot === "flea" ? sumDice * 2 : ot === "screen" ? Math.max(sumDice, 4) : sumDice;
    const offRaw = starSum(oF, state.star[oi]);
    let off = offRaw, def = starSum(dF, state.star[1 - oi]);
    let ob = call ? bonusSum(oF, call) : 0;
    const db = call ? bonusSum(dF, call) : 0;
    let extra = 0;
    const notes = [];
    const blitzed = dt === "blitz" && !dice.includes(6);
    if (dt === "blitz") {
      if (blitzed) {
        const blockers = oF.filter(id => cards[id].goodie === "block");
        off = starSum(blockers, state.star[oi]); ob = 0;
        if (blockers.length) notes.push(["gold", `PASS-SCHUTZ ${fmt(off)}`]);
      } else { extra += 10; notes.push(["tac", "BLITZ GEPLATZT +10"]); }
    }
    if (dt === "goalline") def *= 2;
    if (ot === "playaction") { extra += 3; notes.push(["tac", "PLAY ACTION +3"]); }
    // Goodies (jede Art zählt einmal)
    if (call === "pass" && hasG(oF, "precise") && dice.some(x => x >= 5)) { extra += 3; notes.push(["gold", "PRECISE THROW +3"]); }
    if (call === "run" && hasG(oF, "rush") && dice.includes(6)) { extra += 3; notes.push(["gold", "FIRST DOWN RUSH +3"]); }
    if (state.down >= 3 && hasG(oF, "clutch")) { extra += 2; notes.push(["gold", "CLUTCH +2"]); }
    if (state.spot >= 80 && hasG(oF, "redzone")) { extra += 2; notes.push(["gold", "RED ZONE +2"]); }
    if (state.spot >= 80 && hasG(dF, "wall")) { extra -= 2; notes.push(["gold", "WALL −2"]); }
    if (state.down >= 3 && hasG(dF, "closer")) { extra -= 2; notes.push(["gold", "CLOSER −2"]); }
    let duel = 0, duelChip = "";
    if (state.duel) {
      const m = duelMatch(state.duel); duel = m ? -DUEL_BONUS : DUEL_BONUS;
      duelChip = chip(m ? "def" : "off", `${CALLS[state.duel.off].label.toUpperCase()}/${CALLS[state.duel.def].label.toUpperCase()} ${fmt(duel)}`);
    }
    const fan = fanBonus();
    const [gain, cc] = capIt(die + off + ob + def + db + fan + extra + duel);
    const parts = [
      chip("die", diceTxt + (ot === "flea" ? " ×2" : ot === "screen" && sumDice < 4 ? " → 4" : "")),
      chip("off" + (blitzed ? " strike" : ""), `OFF ${fmt(offRaw)}${state.star[oi] ? "★" : ""}${o.joker ? " 🃏" : ""}`),
    ];
    if (ob) parts.push(chip("off", `🎲 ${fmt(ob)}`));
    parts.push(chip("def", `DEF ${fmt(def)}${dt === "goalline" ? "×2" : ""}${state.star[1 - oi] ? "★" : ""}${d.joker ? " 🃏" : ""}`));
    if (db) parts.push(chip("def", `🎲 ${fmt(db)}`));
    if (duelChip) parts.push(duelChip);
    if (fan) parts.push(chip("gold", `FANS ${fmt(fan)}`));
    notes.forEach(([c, n]) => parts.push(chip(c, n)));
    // Pass mit genau 0 Yards = unvollständig (die Uhr stoppt früh); negative Pass-Yards bleiben ein Sack
    if (call === "pass" && gain === 0) return { gain: 0, incomplete: true, html: saved + parts.join("+") + cc + "=" + chip("bad", "UNVOLLSTÄNDIG") };
    return { gain, html: saved + parts.join("+") + cc + "=" + chip("res", `${fmt(gain)} YD`) };
  }
  function applyPending(cap, prefix = "") { const res = computePlay(state.pending.dice, cap); $("calc").innerHTML = prefix + res.html; finishDown(res); }

  function finishDown(res) {
    const oi = state.offense, o = teams[oi], d = teams[1 - oi];
    const tacNames = [tacKey(oi), tacKey(1 - oi)].filter(Boolean).map(k => TACTICS[k].name);
    const dice = state.pending.dice;
    // Momentaufnahme vor dem Aufräumen – für das Drive-Protokoll (Down-Übersicht)
    const pre = { ...prePlay(), spotNum: state.spot, oi, duel: state.duel, risk: dice.length > 1, dice: [...dice], tacs: tacNames, hail: tacKey(oi) === "hail",
                  offIds: lineup(o, "off"), defIds: lineup(d, "def"), joker: o.joker, star: state.star[oi] };
    [0, 1].forEach(i => { if (state.star[i]) teams[i].exhausted.push(state.star[i]); });
    state.star = [null, null]; discardTactics(); state.duel = null; state.pending = null;
    const downBefore = state.down;
    const msg = `${o.name}, ${ordinal(downBefore)} Down (${dice.length > 1 ? "Risiko" : "Sicher"}: ${dice.join("+")})` + (tacNames.length ? ` [${tacNames.join(" vs. ")}]` : "");
    // Clock Drain: Punkte/Turnover 15 s · unvollständiger Pass 10 s · Lauf/vollendeter Spielzug 40 s
    const ns = state.spot + (res.gain || 0);
    const stops = res.turnover || ns <= 0 || ns >= 100 || (downBefore === 4 && ns < state.fd);
    // Führendes KI-Team spielt die volle Pre-Snap-Zeit aus (+5 s auf jeden laufenden Spielzug)
    const milk = !stops && !res.incomplete && isAI(oi) && clockSit(oi).milk;
    const T = useClock(stops ? CLOCK.stop : res.incomplete ? CLOCK.incomplete : milk ? CLOCK.play + CLOCK.milk : CLOCK.play, milk ? "Uhr runtergespielt" : "");
    state.lastCalc = $("calc").innerHTML;
    rotateToPause();   // alle 4 eingesetzten Karten beider Teams → Pausen-Pool
    if (res.turnover) {
      const int = res.turnover === "int";
      log(msg + (int ? " – INTERCEPTION!" : " – FUMBLE!") + T, oi);
      recordPlay(pre, res, int ? `${d.name} fängt den Ball ab – Ballverlust!` : `Fumble – ${d.name} erobert den Ball.`, "bad");
      endDrive(int ? "Interception" : "Fumble", 100 - state.spot, int
        ? { icon: "🖐️", title: "Interception!", sub: `${d.name} fängt den Pass von ${o.name} ab – Ballverlust!`, kind: "turnover" }
        : { icon: "💥", title: "Turnover!", sub: `Ballverlust durch Fumble – ${d.name} erobert den Ball.`, kind: "turnover" });
      return;
    }
    const newSpot = state.spot + res.gain, m2 = msg + (res.incomplete ? " → unvollständig" : ` → ${fmt(res.gain)} Yards`);
    if (newSpot <= 0) {
      state.spot = 0; d.score += 2; checkComebackBoost();
      log(m2 + ` – SAFETY! +2 für ${d.name}.` + T, 1 - oi);
      recordPlay(pre, res, `In der eigenen Endzone gestoppt – SAFETY, +2 für ${d.name}.`, "bad");
      endDrive("Free Kick nach Safety", SAFETY_SPOT, { icon: "🚨", title: "Safety!", sub: `+2 Punkte für ${d.name} – ${o.name} in der eigenen Endzone gestoppt.`, kind: "score" });
      return;
    }
    state.spot = Math.min(100, newSpot);
    if (state.spot >= 100) {
      o.score += 7; checkComebackBoost();
      log(m2 + " – TOUCHDOWN! (+7)" + T, oi);
      recordPlay(pre, res, `TOUCHDOWN! +7 für ${o.name}.`, "score");
      endDrive("Kickoff nach Touchdown", START_SPOT, { icon: "🏈", title: "Touchdown!", sub: `+7 Punkte für ${o.name}`, kind: "score" });
    } else if (state.spot >= state.fd) {
      state.down = 1; state.fd = state.spot + 10; newDown();
      announce("First Down!", "good");
      log(m2 + ` – FIRST DOWN an ${yardLabel(state.spot)}.` + T, oi);
      recordPlay(pre, res, `FIRST DOWN an ${yardLabel(state.spot)}.`, "good");
      resetPause("First Down");   // Reset: Pausen-Pools beider Teams sofort zurück in den Kader
      openFormation(); state.summary = true; clockCheck(); render();
    } else if (downBefore === 4) {
      log(m2 + " – Turnover on Downs." + T, oi);
      recordPlay(pre, res, `Ball an ${yardLabel(state.spot)} – Turnover on Downs.`, "bad");
      endDrive("Turnover on Downs", 100 - state.spot, { icon: "✋", title: "Turnover on Downs", sub: `${o.name} scheitert im 4. Down – Ballbesitzwechsel.`, kind: "turnover" });
    } else {
      state.down++; newDown();
      log(m2 + `, Ball an ${yardLabel(state.spot)}.` + T, oi);
      recordPlay(pre, res, `Ball an ${yardLabel(state.spot)}.`, res.gain > 0 ? "" : "bad");
      openFormation(); state.summary = true; clockCheck(); render();
    }
    checkComeback();
  }
  function rollDie(cb) {
    state.busy = true; state.justPaused.clear(); render();
    const d6 = rnd6();
    animateDice([d6], () => { cb(d6); setTimeout(() => { state.busy = false; render(); checkComeback(); }, 400); });
  }

  // ================= Aktionen =================
  const actions = {
    // --- Startbildschirm / Modus-Auswahl ---
    reset: () => { state.setup = { step: "mode", running: true }; render(); },
    setupMode: ds => {
      if (ds.v === "online") { state.setup = { ...state.setup, step: "online", err: "" }; return render(); }
      netLeave();
      if (ds.v === "pvp") { newGame("pvp", null); log("Modus: 2 Spieler (lokales Duell)."); render(); }
      else { state.setup = { ...state.setup, step: "side" }; render(); }
    },
    onlineHost: () => onlineHost(),
    onlineJoin: () => onlineJoin(),
    netTest: () => netTest(),
    inviteCopy: () => inviteCopy(),
    inviteShare: () => inviteShare(),
    onlineCancel: () => { netReset(); state.setup = { ...state.setup, step: "online", err: "", status: "" }; render(); },
    setupSide: ds => {
      netLeave();
      const human = Number(ds.v);
      newGame("ai", 1 - human);
      log(`Modus: 1 Spieler – du spielst ${teams[human].name}, der Computer ${teams[1 - human].name}.`);
      render();
    },
    setupBack: () => { state.setup = { ...state.setup, step: "mode" }; render(); },
    setupClose: () => { state.setup = null; render(); },
    layout: ds => setLayout(ds.v),
    fullscreen: () => toggleFullscreen(),
    infoOk: () => { state.info = null; render(); },
    focus: ds => { state.focus = Number(ds.team); render(); },
    peek: ds => { const i = Number(ds.team); state.peek = state.peek === i ? null : i; render(); },
    sound: () => { muted = !muted; try { localStorage.setItem("gd-muted", muted ? "1" : "0"); } catch (e) {} $("soundBtn").textContent = muted ? "🔇" : "🔊"; if (!muted) sfx("info"); },
    kader: ds => { state.kaderView = Number(ds.team); render(); },
    kaderClose: () => { state.kaderView = null; render(); },
    risk: ds => { if (canAct()) { state.risk = ds.v === "1"; render(); } },
    evOk: () => {
      const e = state.event; if (!e) return; state.event = null;
      if (state.periodEnd) { showPeriodEnd(); render(); return; }   // Uhr abgelaufen: erst Halbzeit/Spielende
      startDrive(e.next.team, e.next.spot, e.next.reason); render();
    },
    periodOk: () => {
      const p = state.periodModal; if (!p) return;
      if (p.kind === "twomin") { state.periodModal = null; render(); return; }
      if (p.kind === "half") {
        state.periodModal = null; state.quarter = 3; state.clock = QUARTER_SEC; resetBoard();
        state.timeouts = [TIMEOUTS, TIMEOUTS]; state.stopped = false;
        log(`⏱ 2. Halbzeit – alle Karten zurück im Kader, je ${TIMEOUTS} Timeouts.`);
        startDrive(1 - state.firstReceiver, START_SPOT, "Kickoff 2. Halbzeit");
      } else if (p.kind === "ot") {
        state.periodModal = null; state.quarter = 5; state.clock = QUARTER_SEC; resetBoard();
        state.timeouts = [OT_TIMEOUTS, OT_TIMEOUTS]; state.stopped = false;
        const r = Math.random() < 0.5 ? 0 : 1;
        log(`🪙 Münzwurf: ${teams[r].name} greift in der Overtime zuerst an. Sudden Death!`, r);
        startDrive(r, START_SPOT, "Münzwurf Overtime");
      } else { actions.periodClose(); return; }
      render();
    },
    periodClose: () => { state.periodModal = null; render(); },
    timeout: ds => { const i = Number(ds.team); if (!isAI(i)) takeTimeout(i); },
    call: () => {
      if (!canAct()) return;
      state.peek = null;
      if (state.mode === "ai") {
        const ai = state.ai;
        if (state.offense === ai) {
          // KI greift an: Mensch gibt den Snap frei und sagt seine Abwehr an (KI-Ansage steht schon verdeckt fest)
          if (!state.aiPrepped) return;
          state.call = { step: "pick", who: 1 - ai, off: state.aiCall || aiOffCall(), def: null };
        } else {
          // Mensch greift an: KI stellt ihre Abwehr vor der Ansage auf (Taktik/Star sind öffentlich)
          if (!state.aiDefPrepped) aiDefensePrep();
          state.call = { step: "pick", who: state.offense, off: null, def: null };
        }
        render(); return;
      }
      // Online: jeder wählt auf dem eigenen Display – kein Wegschauen nötig
      if (state.mode === "online") { state.call = { step: "pick", who: state.offense, off: null, def: null }; return render(); }
      state.call = { step: "cover", who: state.offense, off: null, def: null }; render();
    },
    callShow: () => { state.call.step = "pick"; render(); },
    callCancel: () => { state.call = null; render(); },
    // „Zurück“ in der Ansage: Angreifer (bzw. Mensch gegen KI) kehrt komplett zur Vorbereitung zurück;
    // im 2-Spieler-Modus behält der Verteidiger die geheime Ansage des Angreifers und schaut sich nur das Brett an
    callBack: () => {
      const c = state.call; if (!c) return;
      if ((state.mode === "pvp" || state.mode === "online") && c.who !== state.offense) { c.peek = true; render(); }
      else { state.call = null; render(); }
    },
    callResume: () => { if (state.call) { state.call.peek = false; render(); } },
    sumOk: () => { if (!state.summary) return; state.summary = false; render(); checkComeback(); },
    callPick: ds => {
      const c = state.call; if (!c) return;
      if (state.mode === "ai") {
        // KI wählt unabhängig von der Ansage des Menschen (sie sieht sie nicht)
        if (c.who === state.offense) { c.off = ds.v; c.def = aiDefCall(); } else { c.def = ds.v; }
        return startSnap();
      }
      if (c.who === state.offense) { c.off = ds.v; c.who = 1 - state.offense; c.step = state.mode === "online" ? "pick" : "cover"; render(); }
      else { c.def = ds.v; startSnap(); }
    },
    noReact: () => { if (!state.react) return; closeReact(); log(`${defTeam().name} verzichtet auf einen Konter.`, 1 - state.offense); applyPending(null); },
    punt: () => {
      if (!canAct()) return;

      rollDie(d6 => {
        const o = offTeam(), oi = state.offense;
        const dist = 30 + d6 * 3, land = state.spot + dist, tb = land >= 100, recv = tb ? 20 : 100 - land;
        $("calc").innerHTML = chip("die", `🎲 ${d6}`) + chip("off", `PUNT 30+3×${d6}`) + "=" + chip("res", `${dist} YD`);
        const pre = prePlay();
        log(`${o.name} puntet ${dist} Yards.` + useClock(CLOCK.stop), oi);
        pushDrive(pre, `${dist} Yard Punt`, `${o.name} puntet ${dist} Yards${tb ? " – Touchback" : ""}. ${defTeam().name} übernimmt an der eigenen ${recv}.`, [`🎲 ${d6}`], "change");
        endDrive(tb ? "Punt, Touchback" : "Punt", recv, { icon: "🦶", title: "Punt", sub: `${o.name} puntet ${dist} Yards${tb ? " – Touchback" : ""}. Ballbesitzwechsel.`, kind: "change" });
      });
    },
    fg: () => {

        const o = offTeam(), d = defTeam(), oi = state.offense, good = d6 >= th;

        const pre = prePlay(), T = useClock(CLOCK.stop);

          good ? `${o.name} verwandelt aus ${dist} Yards: +3 Punkte.` : `Der Kick aus ${dist} Yards geht daneben – ${d.name} übernimmt.`, [`🎲 ${d6} (nötig ≥ ${th})`], good ? "score" : "bad");
        if (good) {
          o.score += 3; checkComebackBoost();
          log(`${o.name}: Field Goal aus ${dist} Yards ist gut! (+3)` + T, oi);
          endDrive("Kickoff nach Field Goal", START_SPOT, { icon: "🥅", title: "Field Goal!", sub: `+3 Punkte für ${o.name} (${dist} Yards)`, kind: "score" });
        } else {
          log(`${o.name}: Field Goal aus ${dist} Yards verfehlt.` + T, oi);
          endDrive("Field Goal verfehlt", Math.max(20, 100 - state.spot), { icon: "❌", title: "Field Goal verfehlt", sub: `Der Kick aus ${dist} Yards geht daneben – ${d.name} bekommt den Ball.`, kind: "turnover" });
        }
