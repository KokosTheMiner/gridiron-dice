  function capture() { const m = {}; document.querySelectorAll(".team [data-card]").forEach(el => m[el.dataset.card] = el.getBoundingClientRect()); return m; }
  function flip(before) {
    document.querySelectorAll(".team [data-card]").forEach(el => {
      const b = before[el.dataset.card]; if (!b) return;
      const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top; if (!dx && !dy) return;
      el.style.transition = "none"; el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.zIndex = 5;
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = "transform .6s cubic-bezier(.2,.8,.2,1)"; el.style.transform = ""; }));
    });
  }

  // =====================================================================
  // COMPUTER-KI
  // Nach jedem render() prüft scheduleAI(), ob die KI handeln muss, und führt
  // den Zug nach 1–1,5 s aus. Verdeckte Entscheidungen trifft sie, ohne die
  // Ansage des Menschen zu kennen.
  // =====================================================================
  let aiTimer = null;
  // Führt die KI spät im Spiel, lässt sie sich sichtbar mehr Zeit vor dem Snap (volle Pre-Snap-Zeit)
  const aiDelay = () => (state.mode === "ai" && state.offense === state.ai && clockSit(state.ai).milk ? 2000 : 1000) + Math.random() * 500;
  const logistic = x => 1 / (1 + Math.exp(-x));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const toGo = () => (state.fd >= 100 ? 100 - state.spot : state.fd - state.spot);

  function scheduleAI() {
    if (state.mode !== "ai" || aiTimer || !aiJob()) return;
    aiTimer = setTimeout(() => { aiTimer = null; const job = aiJob(); if (job) job(); }, aiDelay());
  }
  // Was muss die KI gerade tun? (null = nichts)
  function aiJob() {
    const ai = state.ai;
    if (state.setup || state.summary || state.event || state.periodModal || state.gameOver || state.busy || state.call || state.kaderView !== null) return null;
    if (state.formation) return isAI(state.formation.queue[0]) ? aiFormation : null;
    if (state.modal) return isAI(state.modal.team) ? aiComeback : null;
    if (state.react) return isAI(1 - state.offense) ? aiReact : null;
    if (state.pending) return null;
    if (canAct() && aiWantsTimeout()) return aiTimeout;
    if (canAct() && state.offense === ai && !state.aiPrepped) return aiOffensePrep;
    return null;
  }

  // Formation: die stärksten verfügbaren (nicht pausierten) Karten
  function aiFormation() {
    actions.fsuggest();
    const f = state.formation, ti = f.queue[0], t = teams[ti], role = roleOf(ti);
    if (needJoker(t, role)) f.joker = aiJoker(t, role, f.sel, ti);
    actions.fconfirm();
  }
  // KI-Joker: bei 3rd/4th Down, in der Red Zone oder in der Schlussphase der stärkste Joker,
  // bei 1st Down ein schwächerer (starke Karten für spätere Downs aufheben) – Würfel-Bonus passend zur Distanz bevorzugt
  function aiJoker(t, role, sel, ti) {
    const g = toGo(), lean = g >= 7 ? "pass" : g <= 3 ? "run" : null;
    const score = id => Math.abs(cards[id].value) + Math.abs(cards[id].bonus) * (lean && cards[id].bonusOn === lean ? 1 : 0.4);
    const ranked = rolePool(t, role).filter(id => !sel.includes(id) && !(isQB(id) && sel.some(isQB))).sort((a, b) => score(b) - score(a));
    const crit = state.down >= 3 || state.spot >= 80 || clockSit(ti).late || clockSit(ti).ot;
    const idx = crit ? 0 : state.down === 1 ? Math.floor(ranked.length * 0.6) : Math.floor(ranked.length * 0.3);
    return ranked[Math.min(idx, ranked.length - 1)] || null;
  }

  // Comeback: Regeneration, wenn eine starke Karte pausiert, sonst Fan-Sturm
  function aiComeback() {
    const t = teams[state.ai];
    const best = byValue(t.pause)[0];
    if (best && Math.abs(cards[best].value) >= 3) { state.modal.step = "regen"; actions.regenPick({ id: best }); }
    else actions.pickCB({ key: "fan" });
  }

  // Angriff: Run oder Pass – eigene Boni, gegnerische Defense-Boni und Situation
  function aiOffCall() {
    const ai = state.ai, f = lineup(teams[ai], "off"), d = teams[1 - ai].defField, g = toGo();   // eigener Joker bekannt, gegnerischer verdeckt
    let pass = bonusSum(f, "pass") + bonusSum(d, "pass") + (hasG(f, "precise") ? 1 : 0);
    let run = bonusSum(f, "run") + bonusSum(d, "run") + (hasG(f, "rush") ? 0.5 : 0);
    if (g >= 8) pass += 1.5;
    if (g <= 3) run += 1.5;
    // Clock Management: in Führung die Uhr mit Läufen herunterspielen, im Rückstand schnell passen
    const cs = clockSit(ai);
    if (cs.milk) run += cs.late ? 3 : 2;      // vorn: Laufspiele lassen die Uhr laufen
    if (cs.hurry) pass += cs.late ? 2.5 : 1.5; // hinten: Pässe – unvollständig stoppt die Uhr
    return Math.random() < clamp(logistic((pass - run) * 0.8), 0.15, 0.85) ? "pass" : "run";   // nicht komplett berechenbar
  }
  // Spielsituation für die KI: Schlussphase (letzte 3 Min. im 4. Viertel / OT) und Punktedifferenz aus Sicht von Team i
  function clockSit(i) {
    const late = state.quarter >= 4 && state.clock <= 180;
    const halfEnd = state.quarter === 2 && state.clock <= 60;
    const lead = teams[i].score - teams[1 - i].score, endgame = state.quarter === 4 && state.clock <= 300;   // letzte 5 Minuten
    return { late, halfEnd, ot: state.quarter === 5, lead, milk: endgame && lead > 0, hurry: endgame && lead < 0 };
  }
  // KI-Timeout: im Rückstand bei wenig Restzeit die Uhr anhalten (als Angriff wie als Abwehr)
  function aiWantsTimeout() {
    const ai = state.ai;
    if (state.mode !== "ai" || !canTimeout(ai)) return false;
    const cs = clockSit(ai);
    if (state.quarter === 4 && cs.lead < 0 && state.clock <= 150) return true;
    return state.quarter === 2 && state.offense === ai && state.spot >= 50 && state.clock <= 60;   // vor der Pause noch punkten
  }
  function aiTimeout() { takeTimeout(state.ai); }
  // Abwehr: errät den wahrscheinlichsten Spielzug aus den offenen Angriffskarten und der Situation
  function aiDefCall() {
    const o = offTeam().offField, g = toGo();
    let pass = bonusSum(o, "pass") + (hasG(o, "precise") ? 1 : 0) + (g >= 8 ? 1.5 : 0) + (state.down >= 3 && g >= 6 ? 1 : 0);
    let run = bonusSum(o, "run") + (hasG(o, "rush") ? 0.5 : 0) + (g <= 3 ? 1.5 : 0);
    return Math.random() < clamp(logistic((pass - run) * 0.8), 0.2, 0.8) ? "passcover" : "runstop";
  }
  // Würfelwahl: Risiko bei 3rd/4th & langer Distanz, Sicher bei kurzer Distanz
  function aiRisk(call) {
    const ai = state.ai, f = lineup(teams[ai], "off"), g = toGo();
    const prot = hasG(f, call === "pass" ? "hands" : "secure");
    const danger = hasG(teams[1 - ai].defField, call === "pass" ? "ballhawk" : "strip");
    let risk = (state.down >= 3 && g >= 7) || (state.down === 4 && g >= 4) || g >= 12;
    if (prot && g >= 5) risk = true;
    if (g <= 3) risk = false;
    if (danger && !prot && g < 10) risk = false;
    if (state.spot <= 8 && !prot) risk = false;              // nicht vor der eigenen Endzone den Ball riskieren
    const cs = clockSit(ai);
    if (cs.late && cs.lead < -8 && state.spot > 8) risk = true;   // spät & deutlich hinten: alles riskieren
    if (cs.milk && !prot) risk = false;                          // letzte 5 Min. in Führung: Ball sichern
    if (cs.ot && !prot && g < 10) risk = false;                  // Sudden Death: kein Ballverlust
    return risk;
  }
  // 4. Down: Punt, Field Goal oder Go for it
  function ai4th() {
    const g = toGo(), spot = state.spot, th = fgThreshold(117 - spot);
    const trail = teams[1 - state.ai].score - teams[state.ai].score;
    const cs = clockSit(state.ai);
    if (cs.ot && th && th <= 5) return "fg";                              // Sudden Death: jedes Field Goal gewinnt
    if (cs.halfEnd && th) return "fg";                                    // vor der Pause die Punkte mitnehmen
    if (cs.late && trail > 0) {                                           // Schlussphase im Rückstand
      if (trail <= 3 && th && th <= 5) return "fg";                       // FG reicht zum Ausgleich/Sieg
      return "go";                                                        // sonst gibt es keinen Ballbesitz mehr
    }
    if (cs.late && trail < 0 && !th) return "punt";                       // in Führung: Feldposition statt Risiko
    if (g <= 1 && spot >= 35) return "go";
    if (th && th <= 4) return g <= 2 && spot >= 80 ? "go" : "fg";
    if (spot >= 50 && g <= 3) return "go";
    if (trail >= 10 && spot >= 45 && g <= 6) return "go";
    if (th) return g <= 2 ? "go" : "fg";
    return "punt";
  }
  // Star-Boost bei wichtigen Downs auf die stärkste unverbrauchte Karte
  function aiStar(ti) {
    const t = teams[ti], f = ti === state.offense ? t.offField : t.defField;
    const avail = f.filter(id => !t.exhausted.includes(id));
    if (!avail.length) return;
    const important = state.down >= 3 || state.spot >= 80 || (ti === state.offense && toGo() <= 2);
    if (important || Math.random() < 0.12) toggleStar(ti, byValue(avail)[0]);
  }
  // Taktik-Karte passend zur Situation
  function aiTactic(ti, call) {
    const t = teams[ti], ok = t.hand.filter(id => !tacBlock(id));
    const has = k => ok.find(id => cards[id].tac === k);
    const g = toGo();
    let pick = null;
    if (ti === state.offense) {
      if (has("hail") && g >= 12 && state.down >= 3) pick = has("hail");
      else if (has("audible") && state.risk) pick = has("audible");
      else if (has("flea") && (state.down >= 3 || g >= 6)) pick = has("flea");
      else if (has("playaction") && call === "pass") pick = has("playaction");
      else if (has("screen") && !state.risk && g <= 4) pick = has("screen");
      else if (has("scout") && t.hand.length <= 3) pick = has("scout");
    } else {
      if (has("goalline") && (state.spot >= 75 || g <= 2 || state.down >= 3)) pick = has("goalline");
      else if (has("blitz") && sum(offTeam().offField) >= 8 && Math.random() < 0.6) pick = has("blitz");
      else if (has("scout") && t.hand.length <= 3) pick = has("scout");
    }
    if (pick && (state.down >= 2 || Math.random() < 0.5)) playTac(pick);
  }
  // KI im Angriff: 4th-Down-Entscheidung, Spielzug verdeckt planen, Würfel, Star, Taktik
  function aiOffensePrep() {
    const ai = state.ai;
    state.aiPrepped = true;
    if (state.down === 4) {
      const choice = ai4th();
      if (choice === "punt") { log(`${teams[ai].name} (KI) entscheidet sich für einen Punt.`, ai); return actions.punt(); }
      if (choice === "fg") { log(`${teams[ai].name} (KI) versucht ein Field Goal.`, ai); return actions.fg(); }
      log(`${teams[ai].name} (KI) geht im 4. Down aufs Ganze!`, ai);
    }
    state.aiCall = aiOffCall();
    state.risk = aiRisk(state.aiCall);
    aiStar(ai);
    aiTactic(ai, state.aiCall);
    log(`${teams[ai].name} (KI) hat den Spielzug verdeckt geplant (${state.risk ? "Risiko 2W6" : "Sicher 1W6"}).`, ai);
    render();
  }
  // KI in der Verteidigung: vor der Ansage Star und Taktik setzen
  function aiDefensePrep() {
    state.aiDefPrepped = true;
    aiStar(state.ai);
    aiTactic(state.ai, null);
  }
  // Konter: Tackle bei großem Raumgewinn / First Down / Touchdown, Challenge bei sehr großem Gewinn
  function aiReact() {
    const t = teams[state.ai];
    const has = k => t.hand.find(id => cards[id].tac === k);
    const gain = computePlay(state.pending.dice).gain;
    const fd = state.spot + gain >= state.fd, td = state.spot + gain >= 100;
    if (has("tackle") && gain > 3 && (fd || td || gain >= 7)) return playTac(has("tackle"));
    if (has("challenge") && (td || gain >= 9)) return playTac(has("challenge"));
    actions.noReact();
  }

  // ================= Bildschirm-Modus =================
  function detectLayout() {
    const w = innerWidth, h = innerHeight;
    if (w < 760 && h > w) return "portrait";
    if (h < 520 && w > h) return "landscape";
    return "desktop";
  }
  let layout = (() => { try { return localStorage.getItem("gd-layout"); } catch (e) { return null; } })() || detectLayout();
  function setLayout(v) {
    layout = ["desktop", "portrait", "landscape"].includes(v) ? v : "desktop";
    document.body.classList.remove("lay-desktop", "lay-portrait", "lay-landscape");
    document.body.classList.add("lay-" + layout);
    try { localStorage.setItem("gd-layout", layout); } catch (e) {}
    $("layoutSel").value = layout;
    if (state) render();
  }
  // Hochformat: welches Team wird groß gezeigt? (eigene Wahl › Mensch gegen KI › Angreifer)
  function focusTeam() {
    if (state.focus !== null && state.focus !== undefined) return state.focus;
    if (isOnline()) return net.me;
    if (state.mode === "ai") return 1 - state.ai;
    if (state.formation) return state.formation.queue[0];
    if (state.peek !== null) return state.peek;
    return state.offense;
  }

  // ================= Großansicht (Maus: Überfahren · Touch: antippen, erneut antippen = auswählen) =================
  let previewId = null;
  function showPreview(el) {
    const id = el.dataset.card; if (!cards[id] || el.classList.contains("back")) return hidePreview();   // verdeckte Karten nie vergrößern
    const p = $("preview");
    if (previewId !== id) { p.innerHTML = cardHTML(id); previewId = id; }
    const w = parseFloat(getComputedStyle(p.firstElementChild).width) || 300, h = w * 1.46;
    const r = el.getBoundingClientRect();
    let x = r.right + 14; if (x + w > innerWidth - 8) x = r.left - w - 14;
    if (x < 8) x = Math.max(8, (innerWidth - w) / 2);          // schmaler Bildschirm: mittig
    const y = Math.max(8, Math.min(innerHeight - h - 8, r.top + r.height / 2 - h / 2));
    p.style.left = x + "px"; p.style.top = y + "px"; p.classList.add("show");
  }
  function hidePreview() { const p = $("preview"); if (p) p.classList.remove("show"); previewId = null; }

  function buildField() {
    let html = "";
    ["top:7%", "top:36%", "bottom:calc(36% - 6px)", "bottom:7%"].forEach(pos => html += `<div class="hash" style="${pos}"></div>`);
    for (let y = 0; y <= 100; y += 5) html += `<div class="yl ${y % 100 === 0 ? "goal" : ""}" style="left:${y}%"></div>`;
    for (let y = 10; y < 100; y += 10) { const n = y <= 50 ? y : 100 - y; html += `<div class="num top" style="left:${y}%">${n}</div><div class="num bot" style="left:${y}%">${n}</div>`; }
    $("turf").insertAdjacentHTML("afterbegin", html);
  }

  // =====================================================================
  // ONLINE-DUELL (PeerJS / WebRTC)
  // Der Host (Spiel erstellen, Heim) führt die komplette Spiellogik aus und schickt nach jedem
  // render() den Spielstand an den Gast. Der Gast stellt nur dar und schickt seine Aktionen an
  // den Host, der jede Aktion gegen den aktuellen Zug prüft (allowedFor). Verdeckte Karten des
  // Gegners werden auf dem eigenen Display nie aufgedeckt.
  // =====================================================================
  const PEER_PREFIX = "gridiron-dice-v1-", SHOT_SEC = 45;

  // ---------- Einladung per Link / QR-Code ----------
  // Öffentliche Adresse des Spiels für Einladungs-Links. Leer lassen = automatisch die Adresse, unter der das
  // Spiel gerade geöffnet ist (funktioniert, sobald die Datei im Internet liegt, z. B. GitHub Pages / Netlify).
  const GAME_URL = "";
  function gameBaseUrl() {
    if (GAME_URL) return GAME_URL.split("#")[0];
    if (!/^https?:$/.test(location.protocol)) return null;            // file:// / data: → für Freunde nicht erreichbar
    return location.origin + location.pathname;
  }
  const inviteUrl = code => { const b = gameBaseUrl(); return b ? `${b}#join=${code}` : null; };
  function qrSVG(text) {
    if (typeof qrcode !== "function") return "";
    try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 5, margin: 3, scalable: true }); } catch (e) { return ""; }
  }
  function inviteHTML(code) {
    const url = inviteUrl(code);
    if (!url) return `<p class="net-note">ℹ️ Einladungs-Links und QR-Code gibt es, sobald das Spiel über eine Internet-Adresse geöffnet wird (nicht als lokale Datei). Bis dahin: Raum-Code weitergeben.</p>`;
    const qr = qrSVG(url);
    return `<div class="invite">
      ${qr ? `<div class="qr" title="Mit der Handy-Kamera scannen">${qr}</div>` : ""}
      <div class="invite-r">
        <p>📱 <b>QR-Code scannen</b> oder Link schicken – das Spiel öffnet sich im Browser und tritt automatisch bei. Keine Installation nötig.</p>
        <input class="invite-url" readonly value="${url}" onclick="this.select()">
        <div class="btn-row">
          <button class="icon-btn" data-action="inviteCopy">🔗 Link kopieren</button>
          ${navigator.share ? `<button class="play-btn" data-action="inviteShare">📤 Teilen</button>` : ""}
        </div>
      </div>
    </div>`;
  }
  async function inviteCopy() {
    const url = inviteUrl(net.code); if (!url) return;
    try { await navigator.clipboard.writeText(url); announceLocal("Link kopiert ✓", "good"); }
    catch (e) { const i = document.querySelector(".invite-url"); if (i) { i.select(); document.execCommand && document.execCommand("copy"); } announceLocal("Link markiert – jetzt kopieren", "info"); }
  }
  async function inviteShare() {
    const url = inviteUrl(net.code); if (!url || !navigator.share) return;
    try { await navigator.share({ title: "Gridiron Dice – Online-Duell", text: `Spiel mit mir Gridiron Dice! Raum ${net.code}:`, url }); } catch (e) {}
  }
  // Beim Öffnen eines Einladungs-Links (#join=GD-1234 oder ?join=GD-1234) automatisch beitreten
  function checkInvite() {
    const m = (location.hash + "&" + location.search).match(/join=(?:GD-?)?(\d{4})/i);
    if (!m) return false;
    const code = "GD-" + m[1];
    try { history.replaceState(null, "", location.pathname); } catch (e) {}   // Link nicht bei jedem Neuladen erneut auslösen
    state.setup = { step: "online", code, err: "" }; render();
    const input = $("joinCode"); if (input) input.value = code;
    const go = (tries = 0) => {
      if (netAvailable()) { onlineJoin(); if (state.setup) state.setup.invited = true; render(); }
      else if (tries < 20) setTimeout(() => go(tries + 1), 250);
      else setupErr("PeerJS konnte nicht geladen werden – bitte Internetverbindung prüfen und neu laden.");
    };
    go();
    return true;
  }
  const hostNow = () => Date.now() - (net.role === "guest" ? net.offset : 0);
  const LOCAL_FIELDS = ["kaderView", "focus", "peek", "info", "setup"];         // reine Ansichts-Zustände pro Gerät
  const LOCAL_ACTIONS = new Set(["reset", "setupMode", "setupSide", "setupBack", "setupClose", "layout", "fullscreen", "infoOk", "focus", "peek",
                                 "sound", "kader", "kaderClose", "periodClose", "onlineHost", "onlineJoin", "onlineCancel", "inviteCopy", "inviteShare", "netTest"]);
  const ACK_ACTIONS = new Set(["evOk", "sumOk", "periodOk"]);                     // brauchen im Online-Duell die Bestätigung beider Spieler
  const netAvailable = () => typeof Peer === "function";

  function netSend(m) { try { if (net.conn && net.conn.open) net.conn.send(m); } catch (e) {} }
  function netReset() {
    clearInterval(net.hb); clearTimeout(net.shotTimer);
    try { if (net.conn) net.conn.close(); } catch (e) {}
    try { if (net.peer) net.peer.destroy(); } catch (e) {}
    Object.assign(net, { peer: null, conn: null, role: null, code: null, fx: [], sendQ: false, shotKey: null, shotTimer: null, started: false, cardsSent: false, cardsRef: null });
  }
  function netLeave() { if (!net.role) return; netSend({ t: "bye" }); setTimeout(netReset, 150); net.role = null; }
  function setupErr(msg, diag = "") { state.setup = { ...(state.setup || {}), step: "online", err: msg, diag, status: "" }; render(); }

  // ---------- Verbindungsaufbau: Server & Diagnose ----------
  // STUN-Server: ermitteln die öffentliche Adresse für die Direktverbindung (kostenlos, ohne Konto).
  // TURN-Server: leiten die Daten weiter, wenn eine Direktverbindung blockiert ist (z. B. gleiches WLAN + Router ohne
  // „Hairpinning“, strenge Firewalls, Mobilfunk-NAT). Die früheren freien TURN-Server (PeerJS, Open Relay) sind abgeschaltet –
  // eigene Zugangsdaten hier eintragen, z. B. vom kostenlosen Kontingent bei metered.ca:
  //   { urls: ["turn:global.relay.metered.ca:80", "turn:global.relay.metered.ca:443?transport=tcp"], username: "…", credential: "…" }
  const TURN_SERVERS = [];
  const ICE_SERVERS = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }, { urls: "stun:stun.cloudflare.com:3478" }, ...TURN_SERVERS];
  const PEER_OPTS = { config: { iceServers: ICE_SERVERS, sdpSemantics: "unified-plan" } };
  const CONNECT_TIMEOUT = 20000, SIGNAL_TIMEOUT = 12000;
  // Tipps, wenn die Direktverbindung nicht zustande kommt
  const DIAG_TIPS = `<ul class="diag">
      <li><b>Brave-Browser:</b> <code>brave://settings/privacy</code> → „WebRTC IP handling policy“ auf <b>„Default“</b> stellen und für die Spielseite die <b>Shields</b> (Löwe) ausschalten.</li>
      <li><b>Gleiches WLAN:</b> manche Router lassen Geräte im eigenen Netz nicht über die Internet-Adresse zueinander. Test: <b>Handy ins Mobilfunknetz</b> (WLAN aus).</li>
      <li><b>Anderer Browser:</b> Chrome, Edge oder Safari ausprobieren – VPN-/Datenschutz-Erweiterungen blockieren WebRTC oft.</li>
      <li><b>Firmen-, Schul- oder Hotel-WLAN:</b> blockieren Direktverbindungen häufig – dann hilft nur ein TURN-Server${TURN_SERVERS.length ? "" : " (im Code bei <code>TURN_SERVERS</code> eintragbar, aktuell keiner eingerichtet)"}.</li>
      <li>„🔍 Verbindungstest“ im Online-Menü zeigt, was dein Gerät erreichen kann.</li></ul>`;
  // Welche Wege hat das eigene Gerät gefunden? (host = lokales Netz, srflx = Internet-Adresse via STUN, relay = TURN)
  function watchCandidates(conn) {
    const types = new Set();
    const hook = () => { const pc = conn.peerConnection; if (!pc) return setTimeout(hook, 50); pc.addEventListener("icecandidate", e => { if (e.candidate) types.add(e.candidate.type); }); };
    hook();
    return types;
  }
  function diagSummary(conn, types) {
    const pc = conn && conn.peerConnection, ice = pc ? pc.iceConnectionState : "–";
    const t = [...types];
    return `<p class="net-note">Technische Details: ICE-Status <b>${ice}</b> · gefundene Wege: <b>${t.length ? t.join(", ") : "keine"}</b>${t.includes("relay") ? "" : " · kein TURN-Weg"}${!t.includes("host") ? " · lokale Adresse verborgen (Datenschutz-Einstellung des Browsers?)" : ""}</p>`;
  }
  function wireConn(conn) {
    net.conn = conn; net.lastSeen = Date.now();
    conn.on("data", m => { if (net.conn !== conn) return; net.lastSeen = Date.now(); onNetData(m); });
    conn.on("close", () => { if (net.conn === conn) netLost("Die Verbindung wurde getrennt"); });
    conn.on("error", () => { if (net.conn === conn) netLost("Verbindungsfehler"); });
    clearInterval(net.hb);
    net.hb = setInterval(() => {   // Herzschlag: erkennt auch stille Abbrüche (Handy gesperrt, WLAN weg)
      netSend({ t: "ping" });
      if (net.started && Date.now() - net.lastSeen > 12000) netLost("Dein Mitspieler antwortet nicht mehr");
    }, 3000);
  }
  // ---------- Verbindungstest (Online-Menü) ----------
  async function probeIce(ms) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS }), types = new Set();
    pc.createDataChannel("test");
    pc.onicecandidate = e => { if (e.candidate) types.add(e.candidate.type); };
    try { await pc.setLocalDescription(await pc.createOffer()); await new Promise(r => setTimeout(r, ms)); } catch (e) {}
    pc.close(); return types;
  }
  function probeSignal() {
    return new Promise(res => {
      if (!netAvailable()) return res(false);
      let p; try { p = new Peer(PEER_OPTS); } catch (e) { return res(false); }
      const done = ok => { clearTimeout(t); try { p.destroy(); } catch (e) {} res(ok); };
      const t = setTimeout(() => done(false), 8000);
      p.on("open", () => done(true)); p.on("error", () => done(false));
    });
  }
  async function netTest() {
    if (!state.setup || (state.setup.test && state.setup.test.running)) return;
    const inp = $("joinCode"); if (inp && inp.value) state.setup.code = inp.value;   // getippten Code behalten
    state.setup.test = { running: true, rows: [] }; render();
    const rows = [], add = (ok, label, hint = "") => rows.push({ ok, label, hint });
    if (typeof RTCPeerConnection === "undefined") add(false, "WebRTC im Browser", "vom Browser oder einer Erweiterung blockiert – kein Online-Duell möglich");
    else {
      add(true, "WebRTC im Browser");
      const [sig, types] = await Promise.all([probeSignal(), probeIce(5000)]);
      add(sig, "Vermittlungs-Server (Raum-Codes)", sig ? "" : "nicht erreichbar – Internet prüfen, Blocker (z. B. Brave Shields) für die Seite ausschalten");
      add(types.has("host"), "Adresse im eigenen Netz", types.has("host") ? "" : "verborgen – Datenschutz-Einstellung des Browsers (Brave: „WebRTC IP handling policy“ auf „Default“)");
      add(types.has("srflx"), "Internet-Adresse (STUN)", types.has("srflx") ? "" : "nicht ermittelbar – UDP wird blockiert (Firewall/VPN); Verbindungen über das Internet scheitern dann");
      add(TURN_SERVERS.length ? types.has("relay") : null, "Weiterleitung (TURN)", TURN_SERVERS.length ? (types.has("relay") ? "" : "eingetragener TURN-Server nicht erreichbar") : "nicht eingerichtet – nur nötig, wenn Direktverbindungen blockiert sind");
    }
    if (state.setup) { state.setup.test = { running: false, rows }; render(); }
  }
  function netTestHTML(s) {
    const t = s.test;
    const btn = `<div class="center-row"><button class="icon-btn" data-action="netTest" ${t && t.running ? "disabled" : ""}>🔍 ${t && t.running ? "Teste Verbindung …" : t ? "Verbindungstest wiederholen" : "Verbindungstest"}</button></div>`;
    if (!t || t.running) return btn;
    const bad = t.rows.filter(r => r.ok === false);
    const verdict = !bad.length ? "✅ Dein Gerät ist bereit. Klappt es trotzdem nicht, liegt es am anderen Gerät oder am gemeinsamen Netz – dort ebenfalls testen."
      : bad.some(r => /WebRTC|Vermittlung/.test(r.label)) ? "❌ Von diesem Gerät aus ist kein Online-Duell möglich – siehe Hinweise."
      : "⚠️ Eingeschränkt: Verbindungen können scheitern – siehe Hinweise.";
    return `<div class="net-test">${t.rows.map(r => `<div class="nt-row"><span>${r.ok === true ? "✅" : r.ok === false ? "❌" : "➖"}</span><div><b>${r.label}</b>${r.hint ? `<small>${r.hint}</small>` : ""}</div></div>`).join("")}
      <p class="nt-verdict">${verdict}</p></div>${btn}`;
  }

  // „Spiel erstellen“: Raum-Code GD-1234, Host spielt Heim
  function onlineHost() {
    if (!netAvailable()) return setupErr("PeerJS konnte nicht geladen werden – bitte Internetverbindung prüfen und neu laden.");
    netReset();
    const code = "GD-" + (1000 + Math.floor(Math.random() * 9000));
    Object.assign(net, { role: "host", me: 0, code });
    state.setup = { step: "hosting", code, status: "Verbinde mit dem Vermittlungs-Server …" }; render();
    const peer = net.peer = new Peer(PEER_PREFIX + code, PEER_OPTS);
    const hostStatus = (txt, diag = "") => { if (net.peer === peer && state.setup && state.setup.step === "hosting") { state.setup.status = txt; state.setup.diag = diag; render(); } };
    const sigTimer = setTimeout(() => { if (net.peer === peer && !peer.open) { netReset(); setupErr("Der Vermittlungs-Server ist nicht erreichbar.", `<p class="net-note">Internetverbindung prüfen. Werbe- oder Tracking-Blocker (auch Brave Shields) können <b>0.peerjs.com</b> blockieren.</p>`); } }, SIGNAL_TIMEOUT);
    peer.on("open", () => { clearTimeout(sigTimer); hostStatus("Warte auf Mitspieler …"); });
    peer.on("connection", conn => {
      if (net.conn && net.conn.open) { conn.on("open", () => { conn.send({ t: "full" }); setTimeout(() => conn.close(), 300); }); return; }   // nur ein Gast
      if (net.conn) { const old = net.conn; net.conn = null; try { old.close(); } catch (e) {} }   // hängender Versuch → durch neuen ersetzen
      wireConn(conn);
      const types = watchCandidates(conn);
      hostStatus("Mitspieler gefunden – baue Direktverbindung auf …");
      const t = setTimeout(() => {
        if (net.conn !== conn || conn.open) return;
        const diag = diagSummary(conn, types);
        net.conn = null; clearInterval(net.hb); try { conn.close(); } catch (e) {}
        hostStatus("⚠️ Dein Mitspieler hat den Raum gefunden, aber die Direktverbindung ist blockiert. Ihr könnt es nach den Tipps einfach erneut versuchen – der Raum bleibt offen.", DIAG_TIPS + diag);
      }, CONNECT_TIMEOUT);
      conn.on("open", () => { clearTimeout(t); startOnlineGame(); });
    });
    peer.on("error", err => {
      if (err.type === "unavailable-id") return onlineHost();                 // Code schon vergeben → neuer Code
      if (net.started) return;                                                // Fehler im laufenden Spiel → Herzschlag/close regeln das
      if (["network", "server-error", "socket-error", "socket-closed"].includes(err.type) || !peer.open) {
        clearTimeout(sigTimer); netReset();
        return setupErr("Verbindung zum Vermittlungs-Server fehlgeschlagen (" + err.type + ").", `<p class="net-note">Internetverbindung prüfen und erneut versuchen. Blocker wie Brave Shields können den Server sperren.</p>`);
      }
      hostStatus("Ein Verbindungsversuch ist fehlgeschlagen (" + err.type + ") – warte auf neuen Versuch …", DIAG_TIPS);
    });
  }
  // „Spiel beitreten“: Gast spielt Gast
  function onlineJoin() {
    const raw = (($("joinCode") || {}).value || "").replace(/\D/g, "");
    if (raw.length !== 4) return setupErr("Bitte den Raum-Code mit 4 Ziffern eingeben, z. B. GD-8492.");
    if (!netAvailable()) return setupErr("PeerJS konnte nicht geladen werden – bitte Internetverbindung prüfen und neu laden.");
    netReset();
    const code = "GD-" + raw;
    Object.assign(net, { role: "guest", me: 1, code });
    state.setup = { step: "joining", code, status: "Verbinde mit dem Vermittlungs-Server …" }; render();
    if (typeof RTCPeerConnection === "undefined") { netReset(); return setupErr("Dein Browser blockiert WebRTC – damit ist kein Online-Duell möglich.", DIAG_TIPS); }
    const peer = net.peer = new Peer(PEER_OPTS);
    const joinStatus = txt => { if (net.peer === peer && state.setup && state.setup.step === "joining") { state.setup.status = txt; render(); } };
    let timer = setTimeout(() => { if (net.peer === peer && !peer.open) { netReset(); setupErr("Der Vermittlungs-Server ist nicht erreichbar.", `<p class="net-note">Internetverbindung prüfen. Werbe- oder Tracking-Blocker (auch Brave Shields) können <b>0.peerjs.com</b> blockieren.</p>`); } }, SIGNAL_TIMEOUT);
    peer.on("open", () => {
      clearTimeout(timer);
      joinStatus(`Suche Raum ${code} …`);
      // Standard-Serialisierung „binary“: PeerJS teilt große Spielstände automatisch in Pakete (JSON wäre auf ~16 KB begrenzt)
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      wireConn(conn);
      const types = watchCandidates(conn);
      setTimeout(() => { if (net.conn === conn && !conn.open) joinStatus("Raum gefunden – baue Direktverbindung auf …"); }, 1500);
      timer = setTimeout(() => {
        if (net.conn !== conn || conn.open || net.started) return;
        const diag = diagSummary(conn, types);
        netReset();
        setupErr(`Raum ${code} gefunden, aber die Direktverbindung zwischen euren Geräten kommt nicht zustande.`, DIAG_TIPS + diag);
      }, CONNECT_TIMEOUT);
      conn.on("open", () => { clearTimeout(timer); joinStatus("Verbunden – das Spiel startet …"); netSend({ t: "hello" }); });
    });
    peer.on("error", err => {
      if (net.started) return;
      clearTimeout(timer); netReset();
      if (err.type === "peer-unavailable") return setupErr(`Raum ${code} wurde nicht gefunden.`, `<p class="net-note">Stimmt der Code? Ist das Spiel beim Ersteller noch geöffnet (Fenster „Spiel erstellt“)? Ein Raum gilt nur, solange dieses Fenster offen ist.</p>`);
      setupErr("Netzwerkfehler (" + err.type + ") – bitte erneut versuchen.", DIAG_TIPS);
    });
  }
  function startOnlineGame() {
    newGame("online", null);
    net.started = true;
    log(`🌐 Online-Duell ${net.code}: Du spielst ${teams[0].name}, dein Mitspieler ${teams[1].name}.`);
    render();
  }
  function onNetData(m) {
    if (!m || !m.t || m.t === "ping") return;
    if (m.t === "bye") return netLost("Dein Mitspieler hat das Spiel verlassen");
    if (net.role === "host") {
      if (m.t === "hello") { net.cardsSent = false; sendState(); }
      else if (m.t === "act" && isOnline()) remoteAct(m.name, m.ds || {});
    } else if (net.role === "guest") {
      if (m.t === "state") applySnapshot(m);
      else if (m.t === "full") { netReset(); setupErr("Dieser Raum ist schon voll."); }
    }
  }
  // Aktion des Gasts auf dem Host ausführen (nur wenn der Gast gerade an der Reihe ist)
  function remoteAct(name, ds) {
    const team = 1 - net.me;
    if (!allowedFor(team, name, ds)) return;
    const keep = state.setup; state.setup = null;                  // offenes Host-Menü darf den Gast nicht blockieren
    try { runAs(team, name, ds); } finally { if (keep && !state.setup) { state.setup = keep; render(); } }
  }
  // Host → Gast: kompletter Spielstand (ohne lokale Ansichts-Zustände) + Log, Rechenzeile, Effekte
  function queueSend() {
    if (net.role !== "host" || !net.started || net.sendQ) return;
    net.sendQ = true;
    Promise.resolve().then(() => { net.sendQ = false; sendState(); });
  }
  function sendState() {
    if (!net.conn || !net.conn.open) return;
    const s = { ...state, justPaused: [...state.justPaused] };
    LOCAL_FIELDS.forEach(k => delete s[k]);
    if (s.react) s.react = { start: s.react.start };
    // Kartendaten ändern sich während der Partie nicht → nur einmal pro Spiel mitschicken
    const m = { t: "state", teams, state: s, log: $("log").innerHTML, calc: $("calc").innerHTML, fx: net.fx.splice(0), now: Date.now() };
    if (!net.cardsSent || net.cardsRef !== cards) { m.cards = cards; net.cardsSent = true; net.cardsRef = cards; }
    netSend(m);
  }
  function applySnapshot(m) {
    const keep = {};
    LOCAL_FIELDS.forEach(k => keep[k] = state && state[k] !== undefined ? state[k] : null);
    if (!net.started) { net.started = true; Object.assign(keep, { setup: null, kaderView: null, focus: null, peek: null, info: null }); }
    if (m.cards) cards = m.cards;
    if (!cards) return;                                              // Kartendaten fehlen noch → auf den nächsten Stand warten
    teams = m.teams;
    state = { ...m.state, ...keep, justPaused: new Set(m.state.justPaused || []) };
    $("log").innerHTML = m.log; $("calc").innerHTML = m.calc;
    net.offset = Date.now() - m.now;
    render();
    (m.fx || []).forEach(f => { if (f.k === "ann") announceLocal(f.text, f.kind); else if (f.k === "sfx") sfx(f.v, true); else if (f.k === "dice") animateDice(f.v, () => {}); });
  }

  // Zentrale Aktions-Weiche: lokal ausführen, an den Host senden oder (Host) mit Rechteprüfung ausführen
  function dispatch(name, ds = {}) {
    if (name !== "__card" && !actions[name]) return;
    if (!isOnline() || LOCAL_ACTIONS.has(name)) return name === "__card" ? onCardClick(ds.id) : actions[name](ds);
    if (!allowedFor(net.me, name, ds)) return;
    if (net.role === "guest") return netSend({ t: "act", name, ds: { ...ds } });
    runAs(net.me, name, ds);
  }
  const dispatchCard = id => dispatch("__card", { id });
  function runAs(team, name, ds) {
    if (name === "__card") return onCardClick(ds.id);
    if (ACK_ACTIONS.has(name)) return ackAs(team, name);
    actions[name](ds);
  }
  function ackAs(team, name) {
    state.acks = state.acks || [false, false];
    state.acks[team] = true;
    if (state.acks[0] && state.acks[1]) { state.acks = [false, false]; actions[name](); } else render();
  }
  // Darf Team `team` diese Aktion gerade ausführen?
  function allowedFor(team, name, ds) {
    const s = state;
    if (s.gameOver) return false;
    switch (name) {
      case "__card": return !!cards[ds.id] && cards[ds.id].owner === team;
      case "call": case "risk": case "punt": case "fg": return s.offense === team;
      case "timeout": case "openCB": return Number(ds.team) === team;
      case "callPick": case "callBack": case "callResume": case "callShow": case "callCancel": return !!s.call && s.call.who === team;
      case "fpick": case "fjoker": case "fshow": case "fsuggest": case "fclear": case "fconfirm": return !!s.formation && s.formation.queue[0] === team;
      case "noReact": return !!s.react && 1 - s.offense === team;
      case "pickCB": case "regenPick": case "closeModal": return !!s.modal && s.modal.team === team;
      case "evOk": return !!s.event;
      case "sumOk": return !!s.summary;
      case "periodOk": return !!s.periodModal && ["half", "ot", "twomin"].includes(s.periodModal.kind);
    }
    return false;
  }
  // „Weiter“-Button: im Online-Duell nach eigenem Klick „Warte auf Gegner“
  function okBtn(action, label) {
    if (isOnline() && state.acks && state.acks[net.me]) return `<button class="play-btn ok-btn" disabled>✓ Warte auf ${teams[1 - net.me].name} …</button>`;
    return `<button class="play-btn ok-btn" data-action="${action}">${label}<small>Enter</small></button>`;
  }
  function netWaitHTML(text, team) {
    return `<div class="overlay ai-wait"><div class="modal narrow t${team}"><div class="peek">🌐</div><h2>${teams[team].name} ist am Zug</h2><p>${text}</p><div class="dots"><i></i><i></i><i></i></div></div></div>`;
  }

  // Verbindung verloren → die KI übernimmt das gegnerische Team für den Rest des Spiels
  function netLost(reason) {
    if (!net.role) return;
    const started = net.started, role = net.role;
    // Host vor Spielbeginn: abgebrochener Versuch des Gasts → Raum bleibt offen für einen neuen Versuch
    if (!started && role === "host" && net.peer && !net.peer.destroyed) {
      net.conn = null; clearInterval(net.hb);
      if (state.setup && state.setup.step === "hosting") { state.setup.status = "Verbindungsversuch abgebrochen – warte auf neuen Versuch …"; render(); }
      return;
    }
    netReset();
    if (!started || !isOnline()) { if (state.setup && ["hosting", "joining"].includes(state.setup.step)) setupErr(reason + "."); return; }
    const opp = 1 - net.me;
    state.mode = "ai"; state.ai = opp; state.acks = [false, false]; state.shot = null;
    if (state.call && state.call.who === opp) state.call = null;
    if (state.call) state.call.peek = false;
    if (role === "guest") {   // der Gast wird zur Spiel-Instanz: hängende Abläufe des Hosts neu anstoßen
      if (state.react) { state.react = null; if (state.pending) setTimeout(() => applyPending(null), 0); }
      else if (state.busy) { state.busy = false; if (state.pending) setTimeout(() => applyPending(null), 0); else if (state.duel) setTimeout(rollPlay, 0); }
    }
    log(`🌐 ${reason} – die KI übernimmt ${teams[opp].name} für den Rest des Spiels.`, opp);
    announce(`🤖 KI übernimmt ${teams[opp].name}`, "info");
    render();
  }

  // ---------- Shot Clock (45 s pro Entscheidung, nur Online) ----------
  // Welche Entscheidung steht gerade an und wer muss sie treffen?
  function decisionNow() {
    const s = state;
    if (!isOnline() || s.gameOver || s.busy || s.setup) return null;
    if (s.summary) return { kind: "ack", act: "sumOk", team: null };
    if (s.periodModal) return ["half", "ot", "twomin"].includes(s.periodModal.kind) ? { kind: "ack", act: "periodOk", team: null } : null;
    if (s.event) return { kind: "ack", act: "evOk", team: null };
    if (s.formation) return { kind: "formation", team: s.formation.queue[0] };
    if (s.modal) return { kind: "comeback", team: s.modal.team };
    if (s.call) return { kind: "call", team: s.call.who };
    if (s.react || s.pending) return null;                       // Konter hat sein eigenes 8-s-Fenster
    if (canAct()) return { kind: "prep", team: s.offense };
    return null;
  }
  function updateShot() {
    const d = decisionNow(), s = state;
    const key = d ? [d.kind, d.team, s.down, s.spot, s.offense, s.quarter, s.clock, s.drive.length, s.formation ? s.formation.queue.length : 0, s.event ? s.event.title : "", s.periodModal ? s.periodModal.kind : ""].join("|") : null;
    if (key === net.shotKey) return;
    net.shotKey = key; clearTimeout(net.shotTimer);
    state.shot = d ? { team: d.team, kind: d.kind, deadline: Date.now() + SHOT_SEC * 1000 } : null;
    if (d) net.shotTimer = setTimeout(() => shotExpire(key), SHOT_SEC * 1000);
  }
  function shotExpire(key) {
    if (key !== net.shotKey || !isOnline()) return;
    const d = decisionNow(); if (!d) return;
    net.shotKey = null;
    autoDecide(d);
  }
  // KI-Funktionen kurz für ein beliebiges Team ausführen (sie lesen state.ai als „KI-Team“)
  function asAI(team, fn) { const old = state.ai; state.ai = team; try { fn(); } finally { state.ai = old; } }
  function autoDecide(d) {
    if (d.kind === "ack") { state.acks = [false, false]; return actions[d.act](); }
    const t = teams[d.team];
    log(`⏱ Shot Clock abgelaufen – die KI entscheidet für ${t.name}.`, d.team);
    announce(`⏱ KI entscheidet für ${t.name}`, "info");
    asAI(d.team, () => {
      if (d.kind === "formation") { state.formation.cover = false; aiFormation(); }
      else if (d.kind === "comeback") aiComeback();
      else if (d.kind === "call") { const c = state.call; c.peek = false; actions.callPick({ v: c.who === state.offense ? aiOffCall() : aiDefCall() }); }
      else if (d.kind === "prep") {
        if (state.down === 4) { const ch = ai4th(); if (ch === "punt") return actions.punt(); if (ch === "fg") return actions.fg(); }
        const call = aiOffCall();
        state.risk = aiRisk(call);
        actions.call();
        if (state.call && state.call.who === state.offense) actions.callPick({ v: call });
      }
    });
  }
  // Anzeige unten links: Verbindung + Shot Clock (läuft auf beiden Geräten lokal mit)
  const SHOT_LABEL = { formation: "Aufstellung", comeback: "Comeback-Wahl", call: "Ansage", prep: "Spielzug vorbereiten", ack: "Weiter" };
  function updateNetbar() {
    const nb = $("netbar"); if (!nb || !state) return;
    const on = isOnline() && !state.setup;
    nb.hidden = !on;
    if (!on) return;
    nb.querySelector(".nb-conn").textContent = `🌐 ${net.code || ""} · ${net.role === "host" ? "Host" : net.role === "guest" ? "Gast" : "getrennt"}`;
    const sh = state.shot, el = nb.querySelector(".nb-shot");
    if (!sh || state.gameOver) { el.textContent = ""; el.className = "nb-shot"; return; }
    const left = Math.max(0, Math.ceil((sh.deadline - hostNow()) / 1000));
    const who = sh.team === null || sh.team === undefined ? "Beide" : sh.team === net.me ? "Du" : teams[sh.team].name;
    el.textContent = `⏱ ${left}s · ${who}: ${SHOT_LABEL[sh.kind] || ""}`;
    el.className = "nb-shot" + (left <= 10 ? " low" : "") + (sh.team === net.me || sh.team === null ? " mine" : "");
  }
  setInterval(updateNetbar, 250);

  // ================= Init =================
  // Touch: 1. Tippen auf eine Karte = Großansicht (mit Auswählen-Button) · 2. Tippen (gleiche Karte, Großansicht oder Button) = auswählen
  // Maus: unverändert – Überfahren = Großansicht, Klick = auswählen
  var lastPointer = "mouse";
  let tapPv = null;   // { id, act } – offene Touch-Großansicht und die Aktion, die beim Bestätigen ausgeführt wird
  document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });
  document.addEventListener("contextmenu", e => { if (lastPointer === "touch" && e.target.closest("[data-card]")) e.preventDefault(); });

  // Was würde ein Klick auf diese Karte auslösen? → { label, run } oder null (nur ansehen)
  function cardAction(c, a) {
    const id = c.dataset.card, card = cards[id];
    if (a && a.contains(c)) {                                    // Karte in einem Auswahl-Button (Formation, Regeneration)
      if (a.disabled) return null;
      const ds = { ...a.dataset }, name = a.dataset.action;
      let label = "✓ Auswählen";
      if (name === "fpick" && state.formation) {
        const f = state.formation, t = teams[f.queue[0]], role = roleOf(f.queue[0]);
        label = f.sel.includes(id) || f.joker === id ? "✕ Entfernen" : f.sel.length < maxPick(t, role) ? "✓ Als Stamm-Karte" : needJoker(t, role) ? "🃏 Als Joker" : "✓ Auswählen";
      } else if (name === "regenPick") label = "♻️ Zurückholen";
      return { label, run: () => dispatch(name, ds) };
    }
    if (!c.closest(".team") || !card) return null;
    const t = teams[card.owner];
    if (t.pause.includes(id) || isAI(card.owner) || (isOnline() && card.owner !== net.me)) return null;
    const run = () => dispatchCard(id);
    if (state.tactic[card.owner] === id) return canAct() ? { label: "↩ Zurücknehmen", run } : null;
    if (t.offField.includes(id) || t.defField.includes(id)) {
      if (!canAct() || t.exhausted.includes(id)) return null;
      return { label: state.star[card.owner] === id ? "★ Star entfernen" : "★ Star-Boost ×2", run };
    }
    if (card.kind === "tac" && t.hand.includes(id)) return tacBlock(id) ? null : { label: "▶ Ausspielen", run };
    return null;
  }
  function showTapPreview(c, act) {
    const id = c.dataset.card, p = $("preview");
    p.innerHTML = cardHTML(id) + `<div class="pv-bar"><button class="icon-btn" data-pv="close">✕ Schließen</button>${act ? `<button class="play-btn" data-pv="ok">${act.label}</button>` : ""}</div>`;
    previewId = id; tapPv = { id, act };
    p.classList.add("show", "tap");
    const w = p.firstElementChild.getBoundingClientRect().width || 260, h = p.getBoundingClientRect().height || w * 1.6;
    p.style.left = Math.max(8, (innerWidth - w) / 2) + "px";
    p.style.top = Math.max(8, (innerHeight - h) / 2) + "px";
  }
  function closeTapPreview() { tapPv = null; const p = $("preview"); p.classList.remove("tap"); hidePreview(); }

  document.addEventListener("click", e => {
    // --- offene Touch-Großansicht ---
    if (tapPv) {
      const inPv = e.target.closest("#preview"), pv = e.target.closest("[data-pv]");
      if (inPv) {
        const act = tapPv.act, onCard = e.target.closest("#preview > .card"), ok = pv && pv.dataset.pv === "ok";
        closeTapPreview();
        if ((onCard || ok) && act) act.run();                  // Tippen auf die Großansicht oder „Auswählen“ = auswählen
        return;                                                // Hintergrund / „Schließen“ = nur schließen
      }
      const c2 = e.target.closest("[data-card]");
      if (c2 && c2.dataset.card === tapPv.id) { const act = tapPv.act; closeTapPreview(); if (act) act.run(); return; }   // gleiche Karte erneut
      closeTapPreview();
      if (!c2) return;                                          // Tippen daneben schließt nur
      // andere Karte: direkt deren Großansicht zeigen (unten weiter)
    }
    const a = e.target.closest("[data-action]");
    const c = e.target.closest("[data-card]");
    // --- Touch: 1. Tippen auf eine (aufgedeckte) Karte öffnet nur die Großansicht ---
    if (lastPointer === "touch" && c && !c.classList.contains("back") && !c.closest("#preview") && (!a || a.contains(c))) {
      return showTapPreview(c, cardAction(c, a));
    }
    if (a) { if (!a.disabled) dispatch(a.dataset.action, { ...a.dataset }); return; }
    const tc = e.target.closest(".team [data-card]");
    if (tc) dispatchCard(tc.dataset.card);
  });
  document.addEventListener("mouseover", e => {
    if (lastPointer === "touch") return;                     // auf Touch-Geräten keine Hover-Vorschau
    const c = e.target.closest("[data-card]");
    if (c && !c.closest("#preview")) showPreview(c); else hidePreview();
  });
  $("layoutSel").addEventListener("change", e => setLayout(e.target.value));

  // ================= Vollbild (jederzeit umschaltbar) =================
  const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function toggleFullscreen() {
    const el = document.documentElement, d = document;
    try {
      if (fsActive()) {
        await (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else if (el.requestFullscreen || el.webkitRequestFullscreen) {
        const req = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" });
        // manche eingebetteten Ansichten antworten nie – nach 1,5 s abbrechen
        await Promise.race([req, new Promise((_, no) => setTimeout(() => fsActive() ? _() : no(new Error("timeout")), 1500))]);
        // Handy: Ausrichtung passend zum gewählten Bildschirmmodus festhalten (wo der Browser es erlaubt)
        if (layout !== "desktop" && screen.orientation && screen.orientation.lock) screen.orientation.lock(layout).catch(() => {});
      } else {
        state.info = "Dein Browser unterstützt keinen Vollbildmodus für Webseiten (z. B. Safari auf dem iPhone). " +
                     "Tipp: Tippe auf <b>Teilen → „Zum Home-Bildschirm“</b> und starte das Spiel von dort – dann läuft es ohne Browserleiste.";
        render();
      }
    } catch (e) {
      state.info = "Der Browser hat den Vollbildmodus nicht gestartet. Öffne das Spiel direkt in Chrome, Edge, Firefox oder Samsung Internet und tippe erneut auf ⛶. " +
                   "Auf dem iPhone: <b>Teilen → „Zum Home-Bildschirm“</b>, dann läuft das Spiel ohne Browserleiste.";
      render();
    }
  }
  function updateFsBtn() {
    const on = fsActive(), b = $("fsBtn");
    b.classList.toggle("on", on);
    b.title = on ? "Vollbild beenden" : "Vollbild aktivieren";
    b.innerHTML = `${on ? "🗗" : "⛶"}<span class="lbl"> Vollbild ${on ? "aus" : "an"}</span>`;
  }
  ["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => {
    updateFsBtn();
    if (!fsActive() && screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
    if (state) render();
  }));
  updateFsBtn();
  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "INPUT") { if (e.key === "Enter" && e.target.id === "joinCode") onlineJoin(); return; }   // Raum-Code tippen
    if (state.summary && !state.setup && (e.key === "Enter" || e.code === "Space")) { e.preventDefault(); dispatch("sumOk"); return; }
    if (state.periodModal && !state.setup && (e.key === "Enter" || e.code === "Space")) { e.preventDefault(); if (["half", "ot", "twomin"].includes(state.periodModal.kind)) dispatch("periodOk"); return; }
    if (state.event && (e.key === "Enter" || e.code === "Space")) { e.preventDefault(); dispatch("evOk"); return; }
    if (e.code === "Space" && canAct()) { e.preventDefault(); dispatch("call"); }
  });
  window.addEventListener("pagehide", () => netSend({ t: "bye" }));   // Tab geschlossen → Mitspieler sofort informieren
  $("soundBtn").textContent = muted ? "🔇" : "🔊";
  buildField();
  buildDice();
  setLayout(layout);
  newGame();
  state.setup = { step: "mode", running: false };   // Startbildschirm
  render();
  checkInvite();                                     // per Einladungs-Link geöffnet? → automatisch beitreten
  window.addEventListener("hashchange", () => { if (!net.started) checkInvite(); });   // Link bei bereits offenem Spiel
