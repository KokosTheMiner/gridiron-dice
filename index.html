    },
    // Aufstellung: die ersten 3 Klicks = Stamm, der 4. = Joker · Klick auf eine gewählte Karte entfernt sie
    fpick: ds => {
      const f = state.formation; if (!f) return; const id = ds.id;
      const ti = f.queue[0], t = teams[ti], role = roleOf(ti);
      if (f.sel.includes(id)) { f.sel = f.sel.filter(x => x !== id); return render(); }
      if (f.joker === id) { f.joker = null; return render(); }
      if (isQB(id)) { f.sel = f.sel.filter(x => !isQB(x)); if (f.joker && isQB(f.joker)) f.joker = null; }   // höchstens 1 QB
      if (f.sel.length < maxPick(t, role)) f.sel.push(id);
      else if (needJoker(t, role)) f.joker = id;                  // Joker-Slot belegen bzw. tauschen
      render();
    },
    fjoker: ds => {   // gewählte Stamm-Karte zum Joker machen (bisheriger Joker rückt in den Stamm)
      const f = state.formation; if (!f || !f.sel.includes(ds.id)) return;
      f.sel = f.sel.filter(x => x !== ds.id); if (f.joker) f.sel.push(f.joker); f.joker = ds.id; render();
    },
    fshow: () => { if (state.formation) { state.formation.cover = false; render(); } },
    fsuggest: () => { const ti = state.formation.queue[0], s = suggest(teams[ti], roleOf(ti)); state.formation.sel = s.sel; state.formation.joker = s.joker; render(); },
    fclear: () => { state.formation.sel = []; state.formation.joker = null; render(); },
    fconfirm: () => {
      const f = state.formation; if (!f) return;
      const ti = f.queue[0], t = teams[ti], role = roleOf(ti);
      if (f.sel.length !== maxPick(t, role) || (needJoker(t, role) && !f.joker)) return;
      const before = capture();
      t.kader = t.kader.filter(id => !f.sel.includes(id) && id !== f.joker);
      if (role === "off") t.offField = [...f.sel]; else t.defField = [...f.sel];
      t.joker = f.joker || null;
      log(`${t.name} stellt die ${role === "off" ? "Offense" : "Defense"} auf: ${names(f.sel)} (${fmt(sum(f.sel))} Base Yards)${t.joker ? " + 🃏 verdeckter Joker" : ""}.`, ti);
      f.queue.shift();
      if (f.queue.length) { f.sel = []; f.joker = null; prepFormation(); } else state.formation = null;
      render(before);
      if (!state.formation) checkComeback();
    },
    openCB: ds => { state.modal = { team: Number(ds.team), step: "choose" }; render(); },
    closeModal: () => { state.modal = null; render(); },
    pickCB: ds => {
      const ti = state.modal.team, t = teams[ti];
      if (ds.key === "regen") { if (t.pause.length) { state.modal.step = "regen"; render(); } return; }
      t.comeback = ds.key; if (ds.key === "kader") draw(t, 1, ti);
      log(`${t.name} spielt die Comeback-Karte „${COMEBACK[ds.key].title}“.`, ti);
      state.modal = null; render(); sfx("td");
    },
    regenPick: ds => {
      const ti = state.modal.team, t = teams[ti], before = capture();
      t.pause = t.pause.filter(id => id !== ds.id); t.kader.push(ds.id); t.comeback = "regen";
      log(`${t.name} spielt „Regeneration“: ${cards[ds.id].pos} zurück in den Kader.`, ti);
      state.modal = null; render(before); sfx("td");
    },
  };
  function onCardClick(id) {
    const c = cards[id]; if (!c) return;
    const t = teams[c.owner];
    if (t.pause.includes(id) || isAI(c.owner)) return;          // KI-Karten sind nicht anklickbar
    if (state.mode === "pvp" && t.hand.includes(id) && state.peek !== c.owner) { state.peek = c.owner; return render(); }   // verdeckte Hand aufdecken
    if (t.offField.includes(id) || t.defField.includes(id)) return toggleStar(c.owner, id);
    if (state.tactic[c.owner] === id) return undoTac(c.owner);
    if (c.kind === "tac" && t.hand.includes(id)) playTac(id);
  }
  function checkComeback() {
    if (state.modal || state.formation || state.call || state.react || state.pending || state.event || state.periodModal || state.periodEnd || state.gameOver || state.summary) return;
    const i = [0, 1].find(eligible); if (i === undefined) return;
    const key = teams[0].score + ":" + teams[1].score; if (teams[i].promptKey === key) return;
    teams[i].promptKey = key; state.modal = { team: i, step: "choose" }; render();
  }
  function checkComebackBoost() {
    const diff = Math.abs(teams[0].score - teams[1].score);
    teams.forEach((t, i) => {
      if (!t.comeback) return;
      const trailing = teams[1 - i].score > t.score;
      if (trailing && diff >= TRAIL_LIMIT) return;
      const k = COMEBACK[t.comeback]; t.comeback = null;
      log(`${t.name}: Comeback-Boost „${k.title}“ deaktiviert (${diff === 0 ? "Gleichstand" : trailing ? `nur noch ${diff} Punkte Rückstand` : `Führung mit ${diff}`}).`, i);
    });
    if (state.modal && !eligible(state.modal.team)) state.modal = null;
  }

  // ================= Karten-Rendering (Sammelkarten nach Vorlage) =================
  const SKIN = ["#8d5524", "#c68642", "#e0ac69", "#a86b3c", "#5c3a21", "#f1c27d"];
  const NUMS = { QB: [1, 19], RB: [20, 39], FB: [40, 49], WR: [10, 19], TE: [80, 89], OL: [60, 79], DE: [90, 99], DT: [90, 99], NT: [90, 99], DL: [90, 99], LB: [50, 59], CB: [20, 39], S: [20, 49] };
  const ICON_CREST = `<svg class="f-crest" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1 L19 4 V12 Q19 20 10 23 Q1 20 1 12 V4 Z" fill="#1d3f8a" stroke="#e8ecf2" stroke-width="1.2"/><path d="M1.6 4.4 L10 1.6 L18.4 4.4 V8 H1.6 Z" fill="#c8202e"/><text x="10" y="17.5" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="700" font-size="7" fill="#fff">GD</text></svg>`;
  const ICON_HELMET = `<svg viewBox="0 0 24 20" aria-hidden="true"><path d="M3 12 Q3 2 13 2 Q22 2 22 11 V14 H15 L14 18 H6 Q3 16 3 12 Z" fill="#cfd3d8"/><path d="M15 9 H23 M15 12.5 H23 M18.5 8 V15" stroke="#7d848c" stroke-width="1.4" fill="none"/><circle cx="9" cy="10" r="1.6" fill="#7d848c"/></svg>`;
  const ICON_CLEAT = `<svg viewBox="0 0 26 15" aria-hidden="true"><path d="M2 10 Q2 4 7 4 L12 2 Q15 6 20 7 Q25 8 25 11 V12 H2 Z" fill="#e8eaed"/><path d="M8 5 L11 8 M10 4 L13 7" stroke="#9aa0a6" stroke-width="1"/><path d="M4 12 v2.5 M9 12 v2.5 M14 12 v2.5 M19 12 v2.5 M23 12 v2.5" stroke="#9aa0a6" stroke-width="1.6"/></svg>`;

  // Stilisierter Spieler in Trikotfarbe des Teams (Offense mit Ball, Defense in Abwehrhaltung)
  function playerSVG(c) {
    const [a, b] = NUMS[c.pos] || [1, 99];
    const num = a + ((c.no * 7) % (b - a + 1));
    const skin = SKIN[c.no % SKIN.length];
    const frontArm = c.kind !== "def"
      ? `<path d="M72 40 Q80 46 79 54 L71 56 Q71 50 68 46 Z" fill="var(--jersey)"/>
         <path d="M79 54 Q78 62 70 64 L64 60 Q70 58 71 55 Z" fill="${skin}"/>
         <ellipse cx="63" cy="59" rx="8.5" ry="5.2" transform="rotate(-28 63 59)" fill="#7b3f16"/>
         <path d="M59 60 L67 55.5" stroke="#fff" stroke-width="1.1"/><circle cx="69.5" cy="63" r="3.6" fill="#1b1b1b"/>`
      : `<path d="M77 42 Q83 50 82 56 L74 58 Q73 52 70 47 Z" fill="var(--jersey)"/>
         <path d="M82 56 Q84 64 80 70 L74 69 Q76 63 74 58 Z" fill="${skin}"/><circle cx="77" cy="71" r="3.6" fill="#1b1b1b"/>`;
    return `<svg class="c-player" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <ellipse cx="50" cy="98.5" rx="27" ry="2.4" fill="#000" opacity=".5"/>
      <path d="M37 70 L33 99 L44 99 L49 78 L52 78 L57 99 L68 99 L63 70 Z" fill="#eceff3"/>
      <path d="M37 70 L33 99 L36.5 99 L40.5 71 Z" fill="#c3c9d2"/>
      <path d="M38.5 72 L35.5 98 M61.5 72 L64.5 98" stroke="var(--jersey)" stroke-width="1.6"/>
      <path d="M23 42 Q17 50 18 56 L26 58 Q27 52 30 48 Z" fill="var(--jersey)"/>
      <path d="M18 56 Q16 64 20 70 L26 69 Q24 63 26 58 Z" fill="${skin}"/><circle cx="23" cy="71" r="3.6" fill="#1b1b1b"/>
      <path d="M26 40 Q32 30 42 29 L58 29 Q68 30 74 40 L72 56 L66 58 L65 72 L35 72 L34 58 L28 56 Z" fill="var(--jersey)"/>
      <path d="M58 29 Q68 30 74 40 L72 56 L66 58 L65 72 L58 72 Z" fill="#000" opacity=".16"/>
      <path d="M28 40 Q34 32 43 31 L44 37 Q36 38 31 45 Z" fill="#fff" opacity=".2"/>
      <path d="M28.5 47 L33 45 M71.5 47 L67 45" stroke="var(--trim)" stroke-width="2"/>
      <path d="M43 29 Q50 34.5 57 29" stroke="var(--trim)" stroke-width="1.6" fill="none"/>
      <text x="50" y="58" text-anchor="middle" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="var(--trim)" stroke="#0007" stroke-width=".6">${num}</text>
      ${frontArm}
      <path d="M45 24 L55 24 L56 31 L44 31 Z" fill="${skin}"/>
      <path d="M33 18 Q33 3 50 2 Q67 3 67 18 Q67 25 63 27 L37 27 Q33 25 33 18 Z" fill="var(--helmet)"/>
      <rect x="41.5" y="14" width="17" height="13" rx="4" fill="${skin}"/>
      <ellipse cx="46" cy="19" rx="1.6" ry="1.1" fill="#1a1a1a"/><ellipse cx="54" cy="19" rx="1.6" ry="1.1" fill="#1a1a1a"/>
      <path d="M48 2.3 H52 V13.5 H48 Z" fill="var(--trim)" opacity=".9"/>
      <path d="M38 8 Q42 4 48 3.5 L47 8 Q42 8 39 12 Z" fill="#fff" opacity=".35"/>
      <circle cx="36.5" cy="18" r="2" fill="#0006"/>
      <path d="M40 21 H60 M41 25 H59 M44.5 15 V28 M55.5 15 V28 M50 21 V28" stroke="#dfe3e8" stroke-width="1.3" fill="none"/>
    </svg>`;
  }

  function cardHTML(id, opt = {}) {
    const c = cards[id];
    const cls = ["card", "t" + c.owner, c.kind === "qb" ? "off qb" : c.kind, c.kind === "tac" && isReact(id) && "react-card",
                 opt.mini && "mini", opt.paused && "paused", opt.paused && state.justPaused.has(id) && "just",
                 opt.playable && "playable", opt.armed && "armed", opt.dim && "dim", opt.starable && "starable", opt.star && "star", opt.tapped && "tapped", opt.joker && "joker"]
                .filter(Boolean).join(" ");
    const no = `#${String(c.no).padStart(2, "0")}/${DECK.length}`;
    const tag = opt.star ? `<span class="tag star-t">★ ×2</span>` : opt.tapped ? `<span class="tag used-t">★ genutzt</span>` : opt.armed ? `<span class="tag armed-t">AKTIV ✕</span>` : opt.joker ? `<span class="tag joker-t">🃏 JOKER</span>` : "";
    const lock = opt.paused ? `<i class="lock">🔒</i>` : "";
    const foot = `<div class="c-foot">${ICON_CREST}<span class="f-icons">${ICON_HELMET}${ICON_CLEAT}</span><span class="f-no">${no}</span></div>`;
    // Schriftgröße des Namens passt sich der Länge an, damit er in die Zeile passt
    const nameHTML = (full, short) => `<div class="c-name" style="--nf:${Math.min(8.6, 88 / (full.length * 0.58)).toFixed(2)}cqw;--sf:${Math.min(12, 92 / (short.length * 0.5)).toFixed(2)}cqw"><span class="full">${full}</span><span class="short">${short}</span></div>`;
    const note = opt.note ? " – " + opt.note : "";

    if (c.kind === "tac") {
      const T = TACTICS[c.tac], react = T.timing === "react";
      const sideIco = T.side === "off" ? "🏈" : T.side === "def" ? "🛡️" : "♾️";
      return `<div class="${cls}" data-card="${id}" title="${T.name}: ${T.text}${note}">${tag}${lock}<div class="c-in">
        <div class="c-head">${nameHTML(T.name, T.name)}<div class="c-sub">${react ? "Konter-Karte" : "Taktik-Karte"} / ${SIDE_LABEL[T.side]}</div></div>
        <div class="c-photo" style="--h:${312 + (c.no % 4) * 8}"><div class="c-icon"><span>${T.icon}</span></div><span class="c-pos">${react ? "KONTER" : "TAKTIK"}</span></div>
        <div class="c-stats">
          <span class="s-ico">${react ? "⚡" : "⏱️"}</span>
          <div class="s-txt"><div class="s-l">Timing:</div><div class="s-v"><span class="full">${react ? "Nach dem Wurf" : "Vor dem Snap"}</span><span class="short">${react ? "Konter" : "Pre-Snap"}</span></div></div>
          <i class="s-div"></i>
          <div class="s-yards"><span class="s-side">${sideIco}</span><span class="s-yl">${SIDE_LABEL[T.side]}</span></div>
        </div>
        <div class="c-goodie"><span class="g-tab">${react ? "KONTER-EFFEKT" : "TAKTIK-EFFEKT"}</span><p class="g-txt"><b>${T.short}</b><span class="gd">: ${T.text}</span></p></div>
        ${foot}</div></div>`;
    }
    const G = GOODIES[c.goodie], isDef = c.kind === "def";
    const what = c.bonusOn === "run" ? "Laufspiele" : "Pass-Spiele";
    const onFull = `${isDef ? "gegen" : "auf"} ${what}`;
    const onShort = c.bonusOn === "run" ? "Lauf" : "Pass";
    const shown = opt.star ? c.value * 2 : c.value;
    const yards = isDef ? fmt(shown) : String(shown);
    const last = c.name.split(" ").pop();
    return `<div class="${cls}" data-card="${id}" title="${c.name} · ${POS_NAME[c.pos]} · Base Yards ${fmt(c.value)} · Würfel-Bonus ${fmt(c.bonus)} ${onFull} · ${G.name}: ${G.text}${note}">${tag}${lock}<div class="c-in">
      <div class="c-head">${nameHTML(c.name, last)}<div class="c-sub">${POS_NAME[c.pos]} / ${isDef ? "Defense" : "Offense"}</div></div>
      <div class="c-photo" style="--h:${208 + (c.no % 5) * 5}">${playerSVG(c)}<span class="c-pos">${c.pos}</span></div>
      <div class="c-stats">
        <i class="die3d"></i>
        <div class="s-txt"><div class="s-l">Würfel-Bonus:</div><div class="s-v"><span class="full">${fmt(c.bonus)} ${onFull}</span><span class="short">${fmt(c.bonus)} ${onShort}</span></div></div>
        <i class="s-div"></i>
        <b class="s-y">Y</b>
        <div class="s-yards"><span class="s-yl">Base<br>Yards:</span><strong class="s-yn">${yards}</strong></div>
      </div>
      <div class="c-goodie"><span class="g-tab">GOODIE-EFFEKT</span><p class="g-txt"><b>${G.name}</b><span class="gd">: ${G.text}</span></p></div>
      ${foot}</div></div>`;
  }

  function teamHTML(i) {
    const t = teams[i], attacking = state.offense === i;
    const field = attacking ? t.offField : t.defField;
    const fan = t.comeback === "fan" ? (attacking ? 1 : -1) : 0;
    const prep = canAct();
    let cb = "";
    if (t.comeback) cb = `<span class="boost-pill" title="${COMEBACK[t.comeback].text}">${COMEBACK[t.comeback].icon} ${COMEBACK[t.comeback].title}${t.comeback === "regen" ? " ✓" : ""}</span>`;
    else if (eligible(i) && (!isOnline() || i === net.me)) cb = `<button class="boost-btn" data-action="openCB" data-team="${i}">⚡ Comeback</button>`;
    const slots = Array.from({ length: ON_FIELD }, (_, k) => {
      const id = field[k];
      if (!id) return `<div class="slot">${state.formation ? "Formation…" : "Frei"}</div>`;
      const tapped = t.exhausted.includes(id);
      const can = prep && !tapped && !isAI(i) && (!isOnline() || i === net.me);
      return cardHTML(id, { star: state.star[i] === id, tapped, starable: can, note: tapped ? "Star-Boost in diesem Drive schon genutzt" : can ? "Klicken: Star-Boost ×2" : "" });
    }).join("");
    // Joker (4. Slot): verdeckt bis zum Snap – sichtbar nur für den eigenen Spieler (KI-Modus) bzw. bei „Aufdecken“ (2 Spieler)
    const ownView = isOnline() ? i === net.me : state.mode === "ai" ? !isAI(i) : state.peek === i;
    const jokerShown = t.joker && (state.reveal || ownView);
    const jokerSlot = !t.joker ? `<div class="slot joker-slot">🃏 ${state.formation ? "Joker …" : "Joker"}</div>`
      : jokerShown ? cardHTML(t.joker, { joker: true, note: state.reveal ? "Joker – beim Snap aufgedeckt" : "Dein Joker – für den Gegner verdeckt bis zum Snap" })
      : backHTML(t.joker, "JOKER");
    const tacSlot = state.tactic[i] ? cardHTML(state.tactic[i], { armed: true }) : `<div class="slot tac-slot">${state.tacUsed[i] ? "Taktik gespielt" : "Taktik-Slot"}</div>`;
    const shownSum = starSum(jokerShown ? [...field, t.joker] : field, state.star[i]) + fan;
    const n = t.pause.length, ov = n > 10 ? -0.68 : n > 6 ? -0.5 : n > 4 ? -0.25 : 0;
    // Verdeckte Hände: KI-Hand immer verdeckt · im 2-Spieler-Modus nur die aufgedeckte Hand sichtbar
    const hidden = isOnline() ? i !== net.me : state.mode === "ai" ? isAI(i) : state.peek !== i;   // Online: nur die eigene Hand ist sichtbar
    const handHTML = t.hand.map(id => { if (hidden) return backHTML(id); const b = tacBlock(id); return cardHTML(id, { playable: !b, note: b }); }).join("") || '<div class="empty">Keine Taktik-Karten</div>';
    const badge = isOnline() ? (i === net.me ? `<span class="who me">🧑 Du</span>` : `<span class="who">🌐 Gegner</span>`)
      : state.mode === "ai" ? (isAI(i) ? `<span class="who ai">🤖 KI</span>` : `<span class="who me">🧑 Du</span>`) : `<span class="who">Spieler ${i + 1}</span>`;
    const peekBtn = state.mode === "pvp" && t.hand.length ? `<button class="peek-btn" data-action="peek" data-team="${i}">${state.peek === i ? "🙈 Verdecken" : "👁 Aufdecken"}</button>` : "";
    const poolHTML = t.pause.map(id => cardHTML(id, { paused: true, mini: true })).join("") || '<span class="empty">leer</span>';
    const cnt = k => t.kader.filter(id => cards[id].kind === k).length;
    // Hochformat: nur das fokussierte Team groß, das andere kompakt (nur Feldkarten)
    const compact = layout === "portrait" && i !== focusTeam();
    return `<section class="team t${i} ${attacking ? "active" : ""} ${compact ? "compact" : ""}">
      <header class="team-head" ${compact ? `data-action="focus" data-team="${i}"` : ""}><div class="team-name">${t.name}</div>${badge}<span class="role ${attacking ? "off" : "def"}">${attacking ? "Angriff" : "Verteidigung"}</span>${cb}<span class="tap-hint">▾ antippen</span><div class="team-score">${t.score}</div></header>
      <div class="field-zone">
        <div class="zone-l">Feld · ${attacking ? "Offense" : "Defense"}
          <span class="r">${prep && field.length ? `<span class="star-hint">★ Klick = ×2</span>` : ""}<span class="sum ${attacking ? "off" : "def"}" title="${t.joker && !jokerShown ? "ohne verdeckten Joker" : "inkl. Joker"}">${fmt(shownSum)}${t.joker && !jokerShown ? "+?" : ""} YD</span></span></div>
        <div class="row">${slots}${jokerSlot}${tacSlot}</div>
      </div>
      <div class="hand-zone">
        <div class="zone-l"><span>Hand ${t.hand.length}/${handLimit(t)} ${peekBtn}</span><span class="r"><span class="stk"><i></i>Deck ${t.deck.length}</span><span class="stk dis"><i></i>Ablage ${t.discard.length}</span></span></div>
        <div class="row hand" style="--n:${Math.max(2, t.hand.length)}">${handHTML}</div>
      </div>
      <div class="bench">
        <div class="pool" style="--ov:${ov}" title="Pausen-Pool: ${n} Karte(n) – zurück bei First Down, Ballbesitzwechsel oder Notfall-Reset"><div class="pool-l">🔒 Pause ${n}<small>bis 1st Down / Wechsel</small></div>${poolHTML}</div>
        <button class="kader-btn" data-action="kader" data-team="${i}">Kader ▸<span class="cnt"><b class="q">${cnt("qb")}</b><b class="o">${cnt("off")}</b><b class="d">${cnt("def")}</b></span></button>
      </div>
    </section>`;
  }

  // Kartenrückseite für verdeckte Handkarten
  function backHTML(id, label = "") {
    const c = cards[id];
    const tip = label ? "Verdeckter Joker – wird beim Snap aufgedeckt" : `Verdeckte Karte${state.mode === "pvp" ? " – klicken zum Aufdecken" : ""}`;
    return `<div class="card back t${c.owner} ${label ? "joker-back" : ""}" data-card="${id}" title="${tip}">${label ? `<span class="tag joker-t">🃏 ${label}</span>` : ""}<div class="c-in back-in">
      <div class="back-logo">${label ? "?" : "GD"}</div><div class="back-txt">GRIDIRON<br>DICE</div></div></div>`;
  }

  function setupHTML() {
    const s = state.setup;
    const logo = `<div class="start-logo">GRIDIRON <span>DICE</span></div>`;
    if (s.step === "online") {
      return `<div class="overlay start"><div class="modal narrow start-box">${logo}
        <h2>🌐 Online-Duell</h2><p>Spiele gegen einen Freund auf einem anderen Gerät – direkt Peer-to-Peer. Jeder sieht nur seine eigenen Handkarten und wählt Aufstellung und Joker geheim.</p>
        <div class="mode-btns"><button class="mode-btn home" data-action="onlineHost"><b>➕ Spiel erstellen</b><span>Du spielst Heim · Raum-Code an deinen Mitspieler geben</span></button></div>
        <div class="join-box"><b>🔑 Spiel beitreten</b><span>Du spielst Gast</span>
          <div class="join-row"><input id="joinCode" inputmode="numeric" maxlength="7" placeholder="GD-8492" autocomplete="off" value="${s.code && s.step === "online" ? s.code : ""}"><button class="play-btn" data-action="onlineJoin">Beitreten</button></div></div>
        ${s.err ? `<p class="net-err">⚠️ ${s.err}</p>${s.diag || ""}` : ""}
        ${netTestHTML(s)}
        <p class="net-note">⏱ Shot Clock: ${SHOT_SEC} s pro Entscheidung – sonst entscheidet die KI. Bei Verbindungsabbruch übernimmt die KI das gegnerische Team.</p>
        <div class="center-row"><button class="icon-btn" data-action="setupBack">← Zurück</button></div>
      </div></div>`;
    }
    if (s.step === "hosting" || s.step === "joining") {
      const host = s.step === "hosting";
      return `<div class="overlay start"><div class="modal narrow start-box">${logo}
        <h2>${host ? "➕ Spiel erstellt" : "🔑 Spiel beitreten"}</h2>
        ${host ? `<p>Schick deinem Mitspieler die Einladung – oder nenn ihm den Raum-Code:</p><div class="room-code">${s.code}</div>${inviteHTML(s.code)}`
               : `<p>${s.invited ? "📨 Einladung angenommen – " : ""}Raum <b>${s.code}</b></p>`}
        <p class="net-status"><span class="dots"><i></i><i></i><i></i></span> ${s.status || ""}</p>${s.diag || ""}
        <div class="center-row"><button class="icon-btn" data-action="onlineCancel">Abbrechen</button></div>
      </div></div>`;
    }
    if (s.step === "side") {
      return `<div class="overlay start"><div class="modal narrow start-box">
        <div class="start-logo">GRIDIRON <span>DICE</span></div>
        <h2>🤖 1 Spieler</h2><p>Mit welchem Team spielst du gegen den Computer?</p>
        <div class="mode-btns">
          <button class="mode-btn home" data-action="setupSide" data-v="0"><b>🏠 Heim</b><span>Blaue Trikots · hat zuerst den Ball</span></button>
          <button class="mode-btn away" data-action="setupSide" data-v="1"><b>✈️ Gast</b><span>Rote Trikots · startet in der Verteidigung</span></button>
        </div>
        <div class="center-row"><button class="icon-btn" data-action="setupBack">← Zurück</button></div>
      </div></div>`;
    }
    return `<div class="overlay start"><div class="modal narrow start-box">
      <div class="start-logo">GRIDIRON <span>DICE</span></div>
      <p>Das taktische Football-Karten-Würfelspiel. Wähle einen Spielmodus:</p>
      <div class="mode-btns">
        <button class="mode-btn" data-action="setupMode" data-v="ai"><b>🤖 1 Spieler</b><span>gegen die Computer-KI</span></button>
        <button class="mode-btn" data-action="setupMode" data-v="pvp"><b>👥 2 Spieler</b><span>Lokales Duell an einem Bildschirm</span></button>
        <button class="mode-btn" data-action="setupMode" data-v="online"><b>🌐 Online-Duell</b><span>Zwei Geräte · Raum-Code · Peer-to-Peer</span></button>
      </div>
      <div class="lay-row">Bildschirm:
        ${[["desktop", "🖥 Desktop"], ["portrait", "📱 Handy Hochformat"], ["landscape", "📱 Handy Querformat"]]
          .map(([v, l]) => `<button class="lay-btn ${layout === v ? "on" : ""}" data-action="layout" data-v="${v}">${l}</button>`).join("")}
        <button class="lay-btn ${fsActive() ? "on" : ""}" data-action="fullscreen">⛶ Vollbild ${fsActive() ? "an" : "aus"}</button>
      </div>
      ${s.running ? `<div class="center-row"><button class="icon-btn" data-action="setupClose">Zurück zum laufenden Spiel</button></div>` : ""}
    </div></div>`;
  }
  function aiWaitHTML(text) {
    return `<div class="overlay ai-wait"><div class="modal narrow t${state.ai}"><div class="peek">🤖</div><h2>Computer am Zug</h2><p>${text}</p><div class="dots"><i></i><i></i><i></i></div></div></div>`;
  }

  function eventHTML() {
    const e = state.event;
    return `<div class="overlay"><div class="modal narrow event ${e.kind}">
      <div class="ev-ic">${e.icon}</div><div class="ev-title">${e.title}</div><div class="ev-sub">${e.sub}</div>
      <div class="ev-score"><span class="h">${teams[0].name}</span><b>${teams[0].score} : ${teams[1].score}</b><span class="g">${teams[1].name}</span></div>
      <ul class="ev-list">${e.lines.map(l => `<li>${l}</li>`).join("")}</ul>
      ${state.drive.length ? `<div class="drv-head">📋 Drive · ${teams[state.offense].name} – ${state.drive.length} Play${state.drive.length === 1 ? "" : "s"} · ${fmt(state.driveYds)} Yards · ${clockStr(state.driveTime)}</div><div class="drv short">${driveRows()}</div>` : ""}
      ${okBtn("evOk", "OK / Weiter")}
    </div></div>`;
  }
  function formationHTML() {
    const f = state.formation, ti = f.queue[0], t = teams[ti], role = roleOf(ti);
    const need = maxPick(t, role), pool = rolePool(t, role), wantJ = needJoker(t, role);
    const sit = `${ordinal(state.down)} & ${state.fd >= 100 ? "Goal" : state.fd - state.spot} · Ball an ${yardLabel(state.spot)} · ${QTR_LABEL[state.quarter - 1]} ${clockStr(state.clock)}`;
    // 2 Spieler: Gegner wegschauen lassen, damit der Joker geheim bleibt
    if (f.cover) return `<div class="overlay secret"><div class="modal narrow t${ti}">
        <div class="peek">🃏</div><h2>${t.name} stellt auf</h2>
        <p><b>${teams[1 - ti].name}</b>, bitte wegschauen! ${t.name} wählt 3 Stamm-Karten und einen <b>verdeckten Joker</b> (${role === "off" ? "Offense" : "Defense"}).</p>
        <p style="opacity:.75">${sit}</p>
        <div class="center-row"><button class="play-btn" data-action="fshow">Ich bin ${t.name} – aufstellen</button></div>
      </div></div>`;
    const btn = id => {
      const st = f.sel.includes(id), jk = f.joker === id;

      : [["🛡️ Defense · DL, LB, DB", byValue(pool)]];
    const paused = t.pause.filter(id => fitsRole(id, role));

      ${groups.map(([title, ids]) => `<h3>${title} (${ids.length})</h3><div class="row">${ids.map(btn).join("") || '<div class="empty">keine</div>'}</div>`).join("")}
      ${paused.length ? `<h3>🔒 Pausen-Pool – gesperrt bis First Down / Ballbesitzwechsel (${paused.length})</h3><div class="row">${paused.map(id => `<div class="pick no">${cardHTML(id, { paused: true })}</div>`).join("")}</div>` : ""}
      <div class="sticky-foot">
        <span class="status">Stamm <b>${f.sel.length}/${need}</b>${wantJ ? ` · Joker <b>${f.joker ? "🃏 ✓" : "–"}</b>` : ""} · Base <b>${fmt(sum(all))} Yards</b> · Würfel-Boni ${role === "off" ? "auf" : "gegen"} Lauf <b>${fmt(run)}</b> · Pass <b>${fmt(pass)}</b></span>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="icon-btn" data-action="fclear">Leeren</button><button class="icon-btn" data-action="fsuggest">Bestvorschlag</button>
          <button class="play-btn" data-action="fconfirm" ${ok ? "" : "disabled"}>Bestätigen</button></span>
      </div>

  }
  function callHTML() {

  function controlsHTML() {

    }

    }

    if (isAI(state.offense)) {

      return `<div class="seg"><button class="${!state.risk ? "on" : ""}" disabled>🎲 Sicher<small>1W6</small></button><button class="${state.risk ? "on risky" : ""}" disabled>🎲🎲 Risiko<small>Wahl der KI</small></button></div>
        <button class="play-btn ${ready ? "ready" : ""}" data-action="call" ${ready ? "" : "disabled"}>${ready ? "🛡️ Abwehr ansagen" : "🤖 KI überlegt …"}<small>${ready ? "Erst Taktik/Star setzen, dann ansagen · Leertaste" : `${teams[state.ai].name} plant den Spielzug`}</small></button>`;

      <button class="${state.risk ? "on risky" : ""}" data-action="risk" data-v="1" ${dis}>🎲🎲 Risiko<small>2W6 · bei 1 Ballverlust</small></button></div>`;
    const call = `<button class="play-btn ${ok ? "ready" : ""}" data-action="call" ${dis}>🎯 ${state.down === 4 ? "Go for it" : "Spielzug ansagen"}<small>${state.down === 4 ? `${state.fd >= 100 ? "Goal" : state.fd - state.spot} Yards nötig · ` : ""}Run/Pass verdeckt · Leertaste</small></button>`;

  }

  function render(before) {

    // Scoreboard: Spieler-Markierung
    [0, 1].forEach(i => $("sbt" + i).querySelector(".sb-name").textContent = teams[i].name + (isOnline() ? (i === net.me ? " 🧑" : " 🌐") : state.mode === "ai" ? (isAI(i) ? " 🤖" : " 🧑") : ""));
    // Timeouts: verbleibende Punkte, Button nur zwischen den Downs für menschliche Teams aktiv
    [0, 1].forEach(i => {
      const b = $("to" + i), left = state.timeouts[i], ok = canTimeout(i) && !isAI(i) && (!isOnline() || i === net.me);
      b.innerHTML = `<span class="to-l">TO</span>` + [0, 1, 2].map(k => `<i class="${k < left ? "" : "used"}"></i>`).join("");
      b.disabled = !ok; b.classList.toggle("live", ok && lateGame());
      b.title = `${teams[i].name}: ${left} Timeout(s) übrig` + (ok ? " – klicken, um die Uhr zu stoppen" : "");

      state.periodModal ? "Pause – bestätigen, um weiterzuspielen." : state.event ? "Ereignis bestätigen, um fortzufahren." :
      isOnline() && canAct() ? (state.offense === net.me ? "Du greifst an: Taktik spielen · ★ Feldkarte = ×2 · Sicher/Risiko · Spielzug ansagen." + (state.down === 4 ? " 4th Down: Go for it, Punt oder FG?" : "")
        : "Der Gegner greift an: Setze deine Abwehr-Taktik und ★ Star-Boost, bevor er ansagt.") :
      state.mode === "pvp" && !state.call && !state.formation && canAct() ? "Handkarten sind verdeckt – „👁 Aufdecken“ nur, wenn der Gegner wegschaut. " +
        "Taktik spielen · ★ Feldkarte = ×2 · Sicher/Risiko · Spielzug ansagen." + (state.down === 4 ? " 4th Down: Go for it, Punt oder FG?" : "") :
      isAI(state.offense) && canAct() ? (state.aiPrepped ? "Der Computer hat seinen Spielzug verdeckt geplant. Setze deine Abwehr-Taktik/Star und sage dann an." : "Der Computer plant seinen Spielzug …") : state.formation ? `Formation: ${teams[state.formation.queue[0]].name} wählt die Feldkarten.` :
      state.call ? "Pre-Snap-Duell: beide wählen verdeckt." : state.react ? `${defTeam().name} darf kontern.` : state.modal || state.busy ? "" :
      "Taktik spielen · ★ Feldkarte klicken = ×2 · Sicher/Risiko · Spielzug ansagen · Maus über Karte = Großansicht." + (state.down === 4 ? " 4th Down: Go for it, Punt oder FG?" : "");
