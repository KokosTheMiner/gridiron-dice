<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1f33">
<title>Tankbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#1d1524;--card:#2c2236;--card2:#372b43;--line:#4a3c58;--tx:#f3ecf8;--mut:#b6a8c4;--acc:#e7b6ec;--acc2:#c58fd0;--ok:#7ed69a;--bad:#ff8f8f;--warn:#ffd27a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
header{position:sticky;top:0;z-index:5;background:#2a1f33;padding:10px 12px 8px;box-shadow:0 2px 8px #0006}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;flex:1}
.top h1 span{color:var(--acc)}
#sync{font-size:12px;color:var(--mut);white-space:nowrap}
#sync.err{color:var(--warn)}
.icbtn{background:var(--card2);border:0;color:var(--tx);border-radius:50%;width:40px;height:40px;font-size:19px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px 12px;color:var(--tx);cursor:pointer;text-align:left}
.chip b{display:block;font-size:15px}
.chip small{color:var(--mut);font-size:12px}
.chip.on{border-color:var(--acc);background:var(--card2)}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:22px}
.kpi b i{font-style:normal;font-size:13px;color:var(--mut);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);border:0;color:var(--mut);padding:9px;border-radius:12px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#2a1f33;font-weight:700}
.entry{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.entry:last-child{border-bottom:0}
.entry .l{flex:1;min-width:0}
.entry .r{text-align:right;white-space:nowrap}
.entry .d{font-weight:600}
.entry .s{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--card2);color:var(--mut);margin-left:4px;vertical-align:1px}
.tag.w{background:#5a4320;color:var(--warn)}
.cons{font-weight:700}
.cons.g{color:var(--ok)} .cons.b{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
.fab{position:fixed;right:18px;bottom:22px;z-index:6;background:var(--acc);color:#2a1f33;border:0;border-radius:20px;padding:16px 22px;font-size:18px;font-weight:700;box-shadow:0 4px 14px #0008;cursor:pointer}
.arch{background:#3d3320;color:var(--warn)}
.arch .btn{color:var(--tx)}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
/* Dialog */
.ov{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.dlg{border-radius:22px}}
.dlg h3{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:18px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.hint{font-size:13px;color:var(--mut);margin-top:4px;min-height:18px}
.hint.w{color:var(--warn)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:16px;color:var(--tx)}
.chk input{width:24px;height:24px;accent-color:var(--acc)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--tx)}
.btn.p{background:var(--acc);color:#2a1f33}
.btn.del{background:#5a2730;color:#ffc4c4;flex:0 0 auto}
.sum{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;justify-content:space-between;font-size:15px}
.sum b{font-size:20px}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow span{flex:1}
.small{font-size:13px;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>⛽ <span>Tankbuch</span></h1>
    <span id="sync">…</span>
    <button class="icbtn" onclick="openSettings()" title="Einstellungen">⚙</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<button class="fab" id="fab" onclick="openEntry()">＋ Tanken</button>

<script>
"use strict";
// ---------- Speicher: offline zuerst (localStorage), Abgleich mit dem Heimserver ----------
const ON_HEIMSERVER = /^(192\.168\.133\.167|heimserver(\.fritz\.box|\.tail3903ae\.ts\.net)?)$/.test(location.hostname);
const DB_BASE = (localStorage.getItem("tb-db") || (ON_HEIMSERVER ? location.origin + "/db" : "https://heimserver.tail3903ae.ts.net/db")) + "/tankbuch/" + (localStorage.getItem("tb-pfad") || "daten");
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

const S = {
  v: lsGet("tb-v", {}),          // Fahrzeuge: id -> {name, typ:'km'|'h', ord}
  e: lsGet("tb-e", {}),          // Tankungen: id -> {v, d, odo, l, ppl, voll, note}
  pending: lsGet("tb-pending", {}), // "v/id" | "e/id" -> Wert oder null (= löschen)
  cur: localStorage.getItem("tb-cur") || "",
  tab: "liste",
};
const save = () => { lsSet("tb-v", S.v); lsSet("tb-e", S.e); lsSet("tb-pending", S.pending); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function put(kind, id, val) {
  if (val === null) delete S[kind][id]; else S[kind][id] = val;
  S.pending[kind + "/" + id] = val;
  save(); render(); sync();
}

let syncing = false;
async function sync() {
  if (syncing) return; syncing = true;
  try {
    for (const [k, val] of Object.entries({ ...S.pending })) {
      const r = await fetch(`${DB_BASE}/${k}.json`, val === null ? { method: "DELETE" } : { method: "PUT", body: JSON.stringify(val) });
      if (!r.ok) throw new Error(r.status);
      if (S.pending[k] === val) delete S.pending[k];
    }
    save();
    const r = await fetch(DB_BASE + ".json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = (await r.json()) || {};
    S.v = d.v || {}; S.e = d.e || {};
    for (const [k, val] of Object.entries(S.pending)) { const [kind, id] = k.split("/"); if (val === null) delete S[kind][id]; else S[kind][id] = val; }
    save(); setSync("ok");
  } catch (err) { setSync("err"); }
  syncing = false; render();
}
function setSync(st) {
  const n = Object.keys(S.pending).length, el = document.getElementById("sync");
  el.className = st === "err" ? "err" : "";
  el.textContent = st === "err" ? (n ? `offline · ${n} warten` : "offline") : "✓ gespeichert";
}

// ---------- Zahlen ----------
const num = s => { if (s === "" || s == null) return NaN; return parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); };
const f = (x, d = 0) => isFinite(x) ? x.toLocaleString("de-AT", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const eur = x => f(x, 2) + " €";
const unit = v => v.typ === "h" ? "h" : "km";
const odoTxt = (v, o) => v.typ === "h" ? f(o, 1) + " h" : f(o) + " km";
const consUnit = v => v.typ === "h" ? "l/h" : "l/100 km";
const dTxt = d => { const [y, m, t] = d.slice(0, 10).split("-"); return `${t}.${m}.${y}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Berechnung (Voll-zu-Voll wie Fuelio) ----------
function calc(vid) {
  const v = S.v[vid]; if (!v) return null;
  const es = Object.entries(S.e).filter(([, e]) => e.v === vid).map(([id, e]) => ({ id, ...e }))
    .sort((a, b) => a.odo - b.odo || a.d.localeCompare(b.d));
  const k = v.typ === "h" ? 1 : 100;
  let lastFull = null, accL = 0, consL = 0, consD = 0, prev = null;
  for (const e of es) {
    e.cost = e.l * e.ppl;
    e.dist = prev ? e.odo - prev.odo : NaN;
    accL += e.l;
    if (e.voll) {
      if (lastFull && e.odo > lastFull.odo) {
        e.consD = e.odo - lastFull.odo; e.consL = accL;
        e.cons = accL / e.consD * k;
        consL += accL; consD += e.consD;
      }
      lastFull = e; accL = 0;
    }
    prev = e;
  }
  const first = es[0], last = es[es.length - 1];
  const totL = es.reduce((s, e) => s + e.l, 0), totC = es.reduce((s, e) => s + e.cost, 0);
  const dist = es.length > 1 ? last.odo - first.odo : NaN;
  const costAfterFirst = totC - (first ? first.cost : 0);
  // Jahre
  const years = {};
  for (const e of es) {
    const y = e.d.slice(0, 4), Y = years[y] ||= { l: 0, c: 0, dist: 0, consL: 0, consD: 0, n: 0 };
    Y.l += e.l; Y.c += e.cost; Y.n++;
    if (isFinite(e.dist)) Y.dist += e.dist;
    if (e.cons) { Y.consL += e.consL; Y.consD += e.consD; }
  }
  return {
    v, es, k, last, totL, totC, dist,
    avg: consD ? consL / consD * k : NaN,
    lastCons: [...es].reverse().find(e => e.cons)?.cons,
    perUnit: dist > 0 ? costAfterFirst / dist * (v.typ === "h" ? 1 : 100) : NaN,
    avgPpl: totL ? totC / totL : NaN,
    years,
  };
}

// ---------- Anzeige ----------
function vehiclesSorted(archiv = false) {
  const lastD = {};
  for (const e of Object.values(S.e)) if (!lastD[e.v] || e.d > lastD[e.v]) lastD[e.v] = e.d;
  return Object.entries(S.v).filter(([, v]) => !!v.archiv === archiv).sort(([a, A], [b, B]) => (A.ord ?? 99) - (B.ord ?? 99) || (lastD[b] || "").localeCompare(lastD[a] || ""));
}

function render() {
  const vs = vehiclesSorted();
  if (!S.v[S.cur]) S.cur = vs.length ? vs[0][0] : (vehiclesSorted(true)[0]?.[0] || "");
  localStorage.setItem("tb-cur", S.cur);
  document.getElementById("chips").innerHTML = vs.map(([id, v]) => {
    const c = calc(id);
    return `<button class="chip ${id === S.cur ? "on" : ""}" onclick="pick('${id}')"><b>${v.typ === "h" ? "🚜" : "🚐"} ${esc(v.name)}</b><small>${c.last ? odoTxt(v, c.last.odo) : "noch leer"}</small></button>`;
  }).join("") + `<button class="chip" onclick="editVehicle()"><b>＋</b><small>Fahrzeug</small></button>`;
  const m = document.getElementById("main");
  document.getElementById("fab").style.display = S.v[S.cur] && !S.v[S.cur].archiv ? "" : "none";
  if (!S.v[S.cur]) {
    m.innerHTML = `<div class="card empty">Noch kein Fahrzeug.<br><br><button class="btn p" onclick="editVehicle()">＋ Fahrzeug anlegen</button><br><br>oder ein Fuelio-Backup laden: <a href="#" onclick="openSettings();return false">⚙ Einstellungen</a></div>`;
    return;
  }
  const c = calc(S.cur), v = c.v, u = unit(v);
  let h = v.archiv ? `<div class="card arch">📦 <b>Im Archiv</b>${v.verkauft ? ` · verkauft ${dTxt(v.verkauft)}` : ""}<div class="btns"><button class="btn" onclick="S.cur='';render()">← Zurück</button><button class="btn" onclick="setArchiv('${S.cur}',false)">↩ Wieder aktiv</button></div></div>` : "";
  h += `<div class="card"><h2>${esc(v.name)} <span class="small">${v.typ === "h" ? "Betriebsstunden" : "Kilometer"}</span></h2><div class="kpis">
    <div class="kpi"><small>Ø Verbrauch</small><b>${f(c.avg, 2)} <i>${consUnit(v)}</i></b></div>
    <div class="kpi"><small>Letzte Messung</small><b>${f(c.lastCons, 2)} <i>${consUnit(v)}</i></b></div>
    <div class="kpi"><small>Kosten</small><b>${f(c.perUnit, 2)} <i>€ / ${v.typ === "h" ? "h" : "100 km"}</i></b></div>
    <div class="kpi"><small>Stand</small><b>${c.last ? odoTxt(v, c.last.odo) : "–"}</b></div>
  </div></div>
  <div class="tabs"><button class="${S.tab === "liste" ? "on" : ""}" onclick="S.tab='liste';render()">Tankungen</button><button class="${S.tab === "stat" ? "on" : ""}" onclick="S.tab='stat';render()">Jahre</button></div>`;
  if (S.tab === "liste") {
    h += `<div class="card">`;
    if (!c.es.length) h += `<div class="empty">Noch keine Tankung – tippe unten auf <b>＋ Tanken</b>.</div>`;
    for (const e of [...c.es].reverse()) {
      const cls = e.cons && isFinite(c.avg) ? (e.cons < c.avg * 0.97 ? "g" : e.cons > c.avg * 1.03 ? "b" : "") : "";
      const warn = e.ppl > 4 || e.ppl < 0.5;
      h += `<div class="entry" onclick="openEntry('${e.id}')"><div class="l">
        <div class="d">${dTxt(e.d)} ${e.voll ? "" : '<span class="tag">teilweise</span>'}${warn ? '<span class="tag w">⚠ Preis prüfen</span>' : ""}</div>
        <div class="s">${odoTxt(v, e.odo)}${isFinite(e.dist) ? ` · +${v.typ === "h" ? f(e.dist, 1) : f(e.dist)} ${u}` : ""}${e.note ? " · " + esc(e.note) : ""}</div>
        <div class="s">${f(e.l, 2)} l × ${f(e.ppl, 3)} €</div></div>
        <div class="r"><div><b>${eur(e.cost)}</b></div>${e.cons ? `<div class="cons ${cls}">${f(e.cons, 2)} ${consUnit(v)}</div>` : ""}</div></div>`;
    }
    h += `</div>`;
  } else {
    const ys = Object.keys(c.years).sort().reverse();
    h += `<div class="card"><table><tr><th>Jahr</th><th>${u}</th><th>Liter</th><th>Kosten</th><th>Ø ${consUnit(v)}</th></tr>`;
    for (const y of ys) { const Y = c.years[y]; h += `<tr><td>${y}</td><td>${v.typ === "h" ? f(Y.dist, 1) : f(Y.dist)}</td><td>${f(Y.l, 0)}</td><td>${f(Y.c, 0)} €</td><td>${Y.consD ? f(Y.consL / Y.consD * c.k, 2) : "–"}</td></tr>`; }
    h += `<tr><th>Gesamt</th><th>${v.typ === "h" ? f(c.dist, 1) : f(c.dist)}</th><th>${f(c.totL, 0)}</th><th>${f(c.totC, 0)} €</th><th>${f(c.avg, 2)}</th></tr></table>
      <p class="small">Ø Dieselpreis: ${f(c.avgPpl, 3)} €/l · ${c.es.length} Tankungen. Verbrauch wird von Volltankung zu Volltankung gerechnet (Teil-Tankungen werden dazugezählt).</p></div>`;
  }
  m.innerHTML = h;
}
function pick(id) { S.cur = id; render(); }

// ---------- Dialoge ----------
function dialog(html) {
  closeDlg();
  const ov = document.createElement("div"); ov.className = "ov"; ov.id = "ov";
  ov.innerHTML = `<div class="dlg">${html}</div>`;
  ov.addEventListener("click", ev => { if (ev.target === ov) closeDlg(); });
  document.body.appendChild(ov);
  return ov;
}
function closeDlg() { document.getElementById("ov")?.remove(); }
const $ = id => document.getElementById(id);
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

function openEntry(id) {
  const e = id ? S.e[id] : null, vid = e ? e.v : S.cur, v = S.v[vid], c = calc(vid);
  const prev = c.es.filter(x => x.id !== id && (!e || x.odo < e.odo)).pop();
  const lastPpl = c.last && !e ? c.last.ppl : "";
  dialog(`<h3>${e ? "Tankung bearbeiten" : "Tanken"} · ${esc(v.name)}</h3>
    <label>${v.typ === "h" ? "Betriebsstunden-Stand (h)" : "Kilometerstand (km)"}</label>
    <input id="fOdo" inputmode="decimal" autocomplete="off" placeholder="${prev ? "zuletzt " + odoTxt(v, prev.odo) : ""}" value="${e ? String(e.odo).replace(".", ",") : ""}">
    <div class="hint" id="hOdo"></div>
    <div class="row"><div><label>Getankt (Liter)</label><input id="fL" inputmode="decimal" autocomplete="off" value="${e ? String(e.l).replace(".", ",") : ""}"></div>
    <div><label>Preis pro Liter (€)</label><input id="fP" inputmode="decimal" autocomplete="off" value="${e ? String(e.ppl).replace(".", ",") : lastPpl ? String(lastPpl).replace(".", ",") : ""}"></div></div>
    <div class="sum"><span>Gesamt</span><b id="fSum">–</b></div>
    <label class="chk"><input type="checkbox" id="fVoll" ${!e || e.voll ? "checked" : ""}> Vollgetankt</label>
    <div class="row"><div><label>Datum</label><input type="datetime-local" id="fD" value="${e ? e.d.slice(0, 16) : nowLocal()}"></div></div>
    <label>Notiz / Tankstelle (optional)</label><input id="fN" value="${esc(e?.note || "")}" style="font-size:16px">
    <div class="btns">${e ? `<button class="btn del" onclick="delEntry('${id}')">🗑</button>` : ""}<button class="btn" onclick="closeDlg()">Abbrechen</button><button class="btn p" onclick="saveEntry('${id || ""}','${vid}')">Speichern</button></div>`);
  const upd = () => {
    const o = num($("fOdo").value), l = num($("fL").value), p = num($("fP").value);
    $("fSum").textContent = isFinite(l) && isFinite(p) ? eur(l * p) : "–";
    const hO = $("hOdo"); hO.className = "hint";
    if (isFinite(o) && prev) {
      const d = o - prev.odo;
      if (d <= 0) { hO.className = "hint w"; hO.textContent = `⚠ kleiner als der letzte Stand (${odoTxt(v, prev.odo)})`; }
      else {
        let t = `+${v.typ === "h" ? f(d, 1) : f(d)} ${unit(v)} seit letzter Tankung`;
        if (isFinite(l) && $("fVoll").checked) {
          // Voll-zu-Voll: Liter seit der letzten Volltankung
          const lf = c.es.filter(x => x.id !== id && x.odo < o && x.voll).pop();
          if (lf) { const lit = c.es.filter(x => x.id !== id && x.odo > lf.odo && x.odo < o).reduce((s, x) => s + x.l, 0) + l; t += ` · ≈ ${f(lit / (o - lf.odo) * c.k, 2)} ${consUnit(v)}`; }
        }
        hO.textContent = t;
      }
    } else hO.textContent = "";
  };
  ["fOdo", "fL", "fP", "fVoll"].forEach(k => $(k).addEventListener("input", upd));
  upd();
  if (!e) setTimeout(() => $("fOdo").focus(), 50);
}
function saveEntry(id, vid) {
  const o = num($("fOdo").value), l = num($("fL").value), p = num($("fP").value);
  if (!isFinite(o) || !isFinite(l) || l <= 0 || !isFinite(p) || p <= 0) { alert("Bitte Stand, Liter und Preis pro Liter eingeben."); return; }
  const val = { v: vid, d: $("fD").value || nowLocal(), odo: o, l, ppl: p, voll: $("fVoll").checked ? 1 : 0 };
  const n = $("fN").value.trim(); if (n) val.note = n;
  closeDlg(); put("e", id || uid(), val);
}
function delEntry(id) { if (confirm("Diese Tankung löschen?")) { closeDlg(); put("e", id, null); } }

function editVehicle(id) {
  const v = id ? S.v[id] : { name: "", typ: "km" };
  dialog(`<h3>${id ? "Fahrzeug bearbeiten" : "Neues Fahrzeug"}</h3>
    <label>Name</label><input id="vN" value="${esc(v.name)}">
    <label>Zähler</label><select id="vT"><option value="km" ${v.typ === "km" ? "selected" : ""}>Kilometer (Auto) – Verbrauch l/100 km</option><option value="h" ${v.typ === "h" ? "selected" : ""}>Betriebsstunden (Traktor) – Verbrauch l/h</option></select>
    ${id && !v.archiv ? `<div class="btns"><button class="btn" onclick="archivDlg('${id}')">📦 Verkauft – ins Archiv</button></div>` : ""}
    ${id && v.archiv ? `<div class="btns"><button class="btn" onclick="setArchiv('${id}',false)">↩ Aus dem Archiv holen</button></div>` : ""}
    <div class="btns">${id ? `<button class="btn del" onclick="delVehicle('${id}')">🗑</button>` : ""}<button class="btn" onclick="closeDlg()">Abbrechen</button><button class="btn p" id="vS">Speichern</button></div>`);
  $("vS").onclick = () => {
    const name = $("vN").value.trim(); if (!name) return alert("Bitte einen Namen eingeben.");
    const nid = id || uid(); closeDlg(); S.cur = nid; put("v", nid, { ...v, name, typ: $("vT").value });
  };
  if (!id) setTimeout(() => $("vN").focus(), 50);
}
function archivDlg(id) {
  dialog(`<h3>📦 ${esc(S.v[id].name)} ins Archiv</h3>
    <p class="small">Das Fahrzeug verschwindet aus der oberen Liste. Alle Tankungen bleiben erhalten und sind unter ⚙ → Archiv weiter ansehbar.</p>
    <label>Verkauft am (optional)</label><input type="date" id="aD" value="${nowLocal().slice(0, 10)}">
    <div class="btns"><button class="btn" onclick="closeDlg()">Abbrechen</button><button class="btn p" onclick="setArchiv('${id}',true,document.getElementById('aD').value)">Ins Archiv</button></div>`);
}
function setArchiv(id, on, datum) {
  const v = { ...S.v[id] };
  if (on) { v.archiv = 1; if (datum) v.verkauft = datum; else delete v.verkauft; if (S.cur === id) S.cur = ""; }
  else { delete v.archiv; delete v.verkauft; S.cur = id; S.tab = "liste"; }
  closeDlg(); put("v", id, v);
}
function delVehicle(id) {
  const n = Object.values(S.e).filter(e => e.v === id).length;
  if (!confirm(`„${S.v[id].name}" mit ${n} Tankungen wirklich löschen?`)) return;
  closeDlg();
  for (const [eid, e] of Object.entries(S.e)) if (e.v === id) { delete S.e[eid]; S.pending["e/" + eid] = null; }
  put("v", id, null);
}

function openSettings() {
  const vs = vehiclesSorted();
  dialog(`<h3>⚙ Einstellungen</h3>
    <b>Fahrzeuge</b>
    ${vs.map(([id, v], i) => `<div class="vrow"><span>${v.typ === "h" ? "🚜" : "🚐"} ${esc(v.name)} <span class="small">(${v.typ === "h" ? "Betriebsstunden" : "km"})</span></span>
      <button class="icbtn" onclick="moveV('${id}',-1)" ${i ? "" : "disabled"}>↑</button><button class="icbtn" onclick="closeDlg();editVehicle('${id}')">✎</button></div>`).join("")}
    <div class="btns"><button class="btn" onclick="closeDlg();editVehicle()">＋ Fahrzeug</button></div>
    <br><b>📦 Archiv (verkaufte Fahrzeuge)</b>
    ${vehiclesSorted(true).map(([id, v]) => `<div class="vrow"><span>${v.typ === "h" ? "🚜" : "🚐"} ${esc(v.name)}${v.verkauft ? ` <span class="small">verkauft ${dTxt(v.verkauft)}</span>` : ""}</span>
      <button class="icbtn" title="Ansehen" onclick="closeDlg();S.cur='${id}';S.tab='liste';render()">👁</button><button class="icbtn" onclick="closeDlg();editVehicle('${id}')">✎</button></div>`).join("") || `<p class="small">Leer. Ein verkauftes Fahrzeug kommt über ✎ → „Verkauft – ins Archiv“ hierher.</p>`}
    <br><b>Fuelio-Backup übernehmen</b>
    <p class="small">In Fuelio: Menü → Sicherung → Backup erstellen. Die Datei <i>…fuelio.zip</i> hier auswählen. Schon übernommene Tankungen werden nicht doppelt angelegt.</p>
    <input type="file" id="fz" accept=".zip,.csv" style="font-size:14px">
    <br><br><b>Sicherung</b>
    <div class="btns"><button class="btn" onclick="exportJson()">⬇ Als Datei sichern</button></div>
    <p class="small">Daten liegen auf dem Heimserver (${esc(DB_BASE.replace(/^https?:\/\//, ""))}) und zusätzlich auf diesem Gerät. Ohne Verbindung wird später automatisch hochgeladen.</p>
    <div class="btns"><button class="btn p" onclick="closeDlg()">Fertig</button></div>`);
  $("fz").onchange = ev => ev.target.files[0] && importFuelio(ev.target.files[0]);
}
function moveV(id, d) {
  const vs = vehiclesSorted().map(([i]) => i), i = vs.indexOf(id);
  vs.splice(i, 1); vs.splice(i + d, 0, id);
  vs.forEach((vid, n) => { if (S.v[vid].ord !== n) { S.v[vid] = { ...S.v[vid], ord: n }; S.pending["v/" + vid] = S.v[vid]; } });
  save(); render(); sync(); openSettings();
}
function exportJson() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ v: S.v, e: S.e }, null, 1)], { type: "application/json" }));
  a.download = `tankbuch-${new Date().toISOString().slice(0, 10)}.json`; a.click();
}

// ---------- Fuelio-Import (ZIP mit vehicle-*.csv) ----------
async function unzip(buf) {
  const dv = new DataView(buf), out = {};
  let eocd = buf.byteLength - 22; while (eocd > 0 && dv.getUint32(eocd, true) !== 0x06054b50) eocd--;
  let p = dv.getUint32(eocd + 16, true); const n = dv.getUint16(eocd + 10, true);
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nl));
    p += 46 + nl + xl + cl;
    if (!/\.csv$/i.test(name)) continue;
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    const data = new Uint8Array(buf, start, csize);
    const raw = method === 0 ? data : new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    out[name] = new TextDecoder().decode(raw);
  }
  return out;
}
function parseCsv(t) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function fuelioVehicle(text) {
  const rows = parseCsv(text), sec = {}; let cur = null, head = null;
  for (const r of rows) {
    if (r.length === 1 && r[0].startsWith("## ")) { cur = r[0].slice(3); sec[cur] = []; head = null; continue; }
    if (!cur || (r.length === 1 && r[0] === "")) continue;
    if (!head) { head = r; continue; }
    sec[cur].push(Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
  }
  const V = sec.Vehicle?.[0]; if (!V) return null;
  const log = (sec.Log || []).map(r => ({
    guid: r.guid, uid: r.UniqueId, d: r.Data.replace(" ", "T").slice(0, 16), odo: parseFloat(r["Odo (km)"]), l: parseFloat(r["Fuel (litres)"]),
    total: parseFloat(r["Price (optional)"]), ppl: parseFloat(r.VolumePrice), voll: r.Full === "1" ? 1 : 0,
    note: [r["City (optional)"], r["Notes (optional)"]].map(s => (s || "").trim()).filter(s => s && s !== "GPS").join(" · "),
  })).filter(x => isFinite(x.odo) && isFinite(x.l) && x.l > 0);
  const tractor = /traktor|schlepper/i.test(V.Description + V.Name) || /^(ihc|ls|steyr|fendt|deutz|john deere|case|massey|kubota|lindner)\b/i.test(V.Name.trim());
  // ältere Fuelio-Sicherungen haben keine guid → Kennung aus dem Namen bzw. der Eintragsnummer bilden
  const key = V.guid || "n-" + V.Name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-");
  log.forEach((x, i) => { if (!x.guid) x.guid = key + "-" + (x.uid || x.d.replace(/\D/g, "") || i); });
  return { guid: key, name: V.Name.trim(), tractor, log };
}
async function importFuelio(file) {
  let files;
  try { files = /\.csv$/i.test(file.name) ? { [file.name]: await file.text() } : await unzip(await file.arrayBuffer()); }
  catch (err) { alert("Datei konnte nicht gelesen werden: " + err.message); return; }
  const vs = Object.entries(files).filter(([n]) => /vehicle/i.test(n)).map(([, t]) => fuelioVehicle(t)).filter(Boolean);
  if (!vs.length) { alert("Keine Fahrzeuge im Backup gefunden."); return; }
  dialog(`<h3>Fuelio-Backup übernehmen</h3>
    <p class="small">Bei Traktoren hast du in Fuelio die Betriebsstunden × 100 eingegeben – für diese Fahrzeuge wird der Stand durch 100 geteilt.</p>
    ${vs.map((v, i) => `<div class="vrow"><span><b>${esc(v.name)}</b><br><span class="small">${v.log.length} Tankungen</span></span>
      <span><label class="chk" style="margin:0 0 6px"><input type="checkbox" id="imT${i}" ${v.tractor ? "checked" : ""}> Traktor (h, ÷100)</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="imA${i}"> 📦 Archiv</label></span></div>`).join("")}
    <div class="btns"><button class="btn" onclick="closeDlg()">Abbrechen</button><button class="btn p" id="imGo">Übernehmen</button></div>`);
  $("imGo").onclick = () => {
    let nNew = 0, nUpd = 0;
    vs.forEach((fv, i) => {
      const h = $("imT" + i).checked, vid = "f-" + fv.guid;
      const old = S.v[vid];
      const val = { ...(old || {}), name: old?.name || fv.name, typ: h ? "h" : "km" };
      if ($("imA" + i).checked) val.archiv = 1;
      S.v[vid] = val; S.pending["v/" + vid] = val;
      for (const r of fv.log) {
        const eid = "f-" + r.guid;
        const ppl = isFinite(r.ppl) && r.ppl > 0 ? r.ppl : r.total / r.l;
        const ev = { v: vid, d: r.d, odo: h ? Math.round(r.odo) / 100 : r.odo, l: r.l, ppl: Math.round(ppl * 1000) / 1000, voll: r.voll };
        if (r.note) ev.note = r.note;
        S.e[eid] ? nUpd++ : nNew++;
        S.e[eid] = ev; S.pending["e/" + eid] = ev;
      }
    });
    save(); closeDlg(); render(); sync();
    alert(`Übernommen: ${vs.length} Fahrzeuge, ${nNew} neue Tankungen${nUpd ? `, ${nUpd} aktualisiert` : ""}.`);
  };
}

// ---------- Start ----------
render(); setSync(Object.keys(S.pending).length ? "err" : "ok"); sync();
setInterval(sync, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
addEventListener("online", sync);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
