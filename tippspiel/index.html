<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Tippspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --pix:"Press Start 2P",monospace; --txt:"VT323",ui-monospace,monospace;
  --panel:#1f2740; --panel2:#262f4d; --hi:#46527a; --lo:#0f1326; --ink:#0b0f2e;
  --yellow:#ffd400; --cyan:#2ce8f5; --magenta:#ff3eb5; --lime:#7dff3c; --orange:#ff8a00;
  --red:#ff2a2a; --green:#33e05a; --white:#f4f6ff; --muted:#a9b4ff; --gold:#ffcf3a; --half:#c08bff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--white);font:21px/1.15 var(--txt);
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,#1f7a2e 0 60px,#26893a 60px 120px);
  background-attachment:fixed;min-height:100vh;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:20px var(--txt);background:#000;color:var(--lime);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:8px 10px;width:100%;border-radius:0}
a{color:var(--cyan)}

/* ---------- Retro-Bausteine ---------- */
.panel{background:var(--panel);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:4px 4px 0 rgba(0,0,0,.5);border-radius:8px}
.panel.game,.panel.tbl-wrap{overflow:hidden}
.panel.tbl-wrap{overflow-x:auto}
.rbtn{font:11px/1.2 var(--pix);text-transform:uppercase;padding:11px 14px;min-height:42px;color:#000;
  background:var(--b,#c8c8c8);border:3px solid;border-color:var(--bh,#fff) var(--bl,#444) var(--bl,#444) var(--bh,#fff);box-shadow:3px 3px 0 #000}
.rbtn:active:not(:disabled),.rbtn.on{border-color:var(--bl,#444) var(--bh,#fff) var(--bh,#fff) var(--bl,#444);transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.rbtn:disabled{opacity:.45;cursor:default}
.y{--b:#ffd400;--bh:#fff59a;--bl:#8a6f00}
.c{--b:#2ce8f5;--bh:#c4fbff;--bl:#0a6d75}
.m{--b:#ff3eb5;--bh:#ffb3e1;--bl:#7a0a50}
.l{--b:#7dff3c;--bh:#d5ffb8;--bl:#2e7a0a}
.r{--b:#ff4a4a;--bh:#ffb0b0;--bl:#7a0a0a}
.g{--b:#b9b9c9;--bh:#fff;--bl:#4a4a5a}
/* dezente Menüfarben */
.ny{--b:#d8bb52;--bh:#f1e2a8;--bl:#6e5a14}
.nc{--b:#6fb7c0;--bh:#c3e6ea;--bl:#2b5a60}
.nm{--b:#c47aa3;--bh:#ecc6dc;--bl:#5e2a48}
.nl{--b:#8fbf6a;--bh:#d3e9c3;--bl:#3d5e26}
nav .rbtn{border-radius:6px} nav .rbtn.on{filter:brightness(1.12) saturate(1.15)}
/* TV-Sender */
.tvs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1}
.tv{display:inline-block;font:8px/1 var(--pix);padding:4px 5px;border-radius:4px;color:#fff;border:1px solid rgba(0,0,0,.6);text-shadow:1px 1px 0 rgba(0,0,0,.6);white-space:nowrap}
.tv-rtl{background:linear-gradient(90deg,#e4002b,#e4002b 33%,#f6b900 33% 66%,#0058a3 66%)}
.tv-rtlp{background:#1b1b1b;color:#ff5aa0;border-color:#ff5aa0}
.tv-nitro{background:#c8102e}
.tv-sky{background:linear-gradient(135deg,#0072c9,#7b2fbe)}
.tv-gp{background:#3a3f55}
.tv-x{background:#555b75}
.tv.maybe{opacity:.7;border-style:dashed;border-color:#ccc}
.tvedit{background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;font-size:16px}
.led{font-family:var(--txt);color:var(--orange);text-shadow:0 0 8px rgba(255,120,0,.8);background:#120700;border:3px solid;border-color:#000 #3a2a10 #3a2a10 #000;padding:2px 8px}

/* ---------- Kopf ---------- */
header{position:sticky;top:0;z-index:10;background:#000;border-bottom:4px solid var(--yellow);box-shadow:0 4px 0 var(--red)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{flex:1;min-width:0}
.logo h1{margin:0;font:18px/1.3 var(--pix);color:var(--yellow);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .sub{color:var(--cyan);font-size:19px;margin-top:4px;letter-spacing:1px}
#userChip{font-size:9px;padding:9px 10px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px 12px}
nav .rbtn{font-size:10px;padding:10px 4px;white-space:nowrap}
nav .rbtn .ic{display:block;font-size:18px;margin-bottom:4px}

main{max-width:1180px;margin:0 auto;padding:6px 16px 120px}

/* ---------- Wochenleiste & Status ---------- */
.weekbar{display:flex;gap:8px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap}
.weekbar select{width:auto;flex:1;min-width:150px;font-size:22px;color:var(--yellow)}
.weekbar .rbtn{padding:8px 14px}
.status{padding:12px;margin-bottom:14px}
.status .lockline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:22px}
.badge{font:10px/1 var(--pix);padding:7px 9px;color:#000;border:2px solid #000;white-space:nowrap}
.b-open{background:var(--lime)} .b-closed{background:var(--red);color:#fff} .b-done{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stat{background:#000;border:3px solid;border-color:#000 #333 #333 #000;padding:6px 8px;text-align:center}
.stat .k{font:8px/1.3 var(--pix);color:var(--muted);text-transform:uppercase}
.stat .v{font-size:32px;line-height:1;margin-top:4px;color:var(--orange);text-shadow:0 0 8px rgba(255,120,0,.7)}
.stat .v.cy{color:var(--cyan);text-shadow:0 0 8px rgba(44,232,245,.6)}
.stat .v.gd{color:var(--gold);text-shadow:0 0 8px rgba(255,207,58,.6)}
.stat .v.pu{color:var(--half);text-shadow:0 0 8px rgba(192,139,255,.6)}
.stat .v.gr{color:var(--lime);text-shadow:0 0 8px rgba(125,255,60,.6)}
.hint{margin-top:10px;font-size:20px;color:var(--yellow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:18px;color:var(--muted);margin:4px 2px 10px}
.legend i{display:inline-block;width:16px;height:16px;vertical-align:-2px;margin-right:5px;border:2px solid #000}

/* ---------- Spieltag ---------- */
.day{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font:11px/1.3 var(--pix);color:var(--yellow);text-transform:uppercase}
.day::before{content:"";width:14px;height:14px;background:var(--magenta);box-shadow:3px 3px 0 #000}
.day::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--yellow) 0 8px,transparent 8px 14px)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.game{padding:0;position:relative}
.game.dbl{border-color:#e8d48a #6e5a14 #6e5a14 #e8d48a;background:#36321f}
.game.half{border-color:#cdb6ec #43305e #43305e #cdb6ec;background:#2d2645}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.75);font-size:20px}
.ghead .t{color:var(--cyan)}
.ghead .st{font:9px/1 var(--pix);padding:5px 6px;color:#000;background:var(--cyan)}
.ghead .st.live{background:var(--red);color:#fff;animation:blink 1s steps(2) infinite}
.ghead .st.fin{background:#888}
.ghead .st.mul{background:var(--gold)} .ghead .st.mul.h{background:var(--half)}
@keyframes blink{50%{opacity:.35}}
.match{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:stretch;padding:10px 10px 4px}
.vs{align-self:center;justify-self:center;font:9px var(--pix);color:#000;background:var(--yellow);width:26px;height:26px;display:grid;place-items:center;border:2px solid #000;border-radius:50%;box-shadow:2px 2px 0 #000}

.team{position:relative;overflow:hidden;min-height:116px;padding:20px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px;
  background:var(--c1);border:2px solid #000;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),3px 3px 0 #000;transition:transform .08s}
.team::before{content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(115deg,transparent 0 56%,var(--c2) 56% 67%,var(--c3) 67% 73%,transparent 73%)}
.team::after{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 4px)}
.team>*{position:relative;z-index:1}
.team.home{box-shadow:0 0 0 4px var(--red),inset 0 0 0 2px rgba(255,255,255,.2),5px 5px 0 #000}
.team .tag{position:absolute;top:0;left:0;font:7px/1 var(--pix);padding:5px 6px;background:#000;color:#ccc;z-index:2;border-radius:0 0 6px 0}
.team.home .tag{background:var(--red);color:#fff}
.team .crest{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #000;display:grid;place-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.team .crest img{width:32px;height:32px}
.team b{font:12px/1.2 var(--pix);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;margin-top:4px}
.team small{font-size:17px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;text-align:center;line-height:1}
.team .score{margin-top:3px;font-size:28px;line-height:1;min-width:46px;text-align:center;border-radius:4px}
.team.won .score{color:var(--lime);text-shadow:0 0 8px rgba(125,255,60,.8)}
.team:disabled{cursor:default}
.team:not(:disabled):hover{transform:translateY(-2px)}
.team.dim{filter:grayscale(.6) brightness(.7)}
.team.sel{outline:3px solid var(--yellow);outline-offset:-8px}
.team .pick{position:absolute;right:0;bottom:0;font:7px/1 var(--pix);background:var(--yellow);color:#000;padding:5px 6px;z-index:2;border-radius:6px 0 0 0}
.team .stamp{position:absolute;top:4px;right:6px;z-index:3;font:20px var(--pix);text-shadow:2px 2px 0 #000}
.team.right .stamp{color:var(--lime)} .team.wrong .stamp{color:var(--red)}
.team.right{outline-color:var(--lime)} .team.wrong{outline-color:var(--red)}

.odds{padding:4px 10px 0;font-size:18px;color:var(--muted)}
.obar{display:flex;height:20px;border:2px solid #000;border-radius:5px;overflow:hidden;margin-bottom:4px;font:8px/1 var(--pix)}
.obar span{display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.obar .a{background:var(--ca)} .obar .h{background:var(--ch);flex:1;justify-content:flex-end}
.fav{color:var(--gold)}
.mods{display:flex;gap:8px;align-items:center;padding:10px}
.mods .rbtn{font-size:8px;padding:7px 9px;min-height:34px;border-radius:5px}
.pts{margin-left:auto;font:14px var(--pix);text-shadow:2px 2px 0 #000}
.pts.gp{color:var(--lime)} .pts.rp{color:var(--red)}

/* ---------- Speicherleiste ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#000;border-top:4px solid var(--yellow);padding:10px 16px;display:flex;justify-content:center;gap:14px;align-items:center}
.savebar .msg{font-size:20px;color:var(--muted)}
.savebar .msg.dirty{color:var(--yellow);animation:blink 1.2s steps(2) infinite}

/* ---------- Tabellen ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font:8px/1.4 var(--pix);color:var(--yellow);background:#000;padding:9px 6px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0}
td{padding:6px 7px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--lo);font-size:21px}
tbody tr:nth-child(odd) td{background:var(--panel)} tbody tr:nth-child(even) td{background:var(--panel2)}
.l{text-align:left}
.stick{position:sticky;left:0;z-index:1}
th.stick{z-index:2}
tr.me td{background:#4a3a00!important}
.rank{display:inline-block;min-width:34px;font:11px/1 var(--pix);padding:6px 4px;color:#000;background:#9aa4d8;border:2px solid #000}
.rk1 .rank{background:var(--gold)} .rk2 .rank{background:#d8dde8} .rk3 .rank{background:#d08a4a}
td.ptsc{font-size:28px;color:var(--yellow);text-shadow:0 0 6px rgba(255,212,0,.6)}
.chip{display:inline-block;font:9px/1 var(--pix);padding:5px 5px;color:#fff;background:var(--c1);border:2px solid #000;text-shadow:1px 1px 0 #000;position:relative}
.chip.ok{box-shadow:0 0 0 2px var(--lime)}
.chip.no{filter:grayscale(.8) brightness(.6)}
.chip sup{font:7px var(--pix);background:var(--gold);color:#000;padding:2px;margin-left:3px;text-shadow:none}
.chip sup.h{background:var(--half)}
.dash{color:#6b74b8}
.vtoggle{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.vtoggle span{color:var(--cyan);font:9px var(--pix);text-transform:uppercase}
.vtoggle .rbtn{font-size:8px;padding:8px 10px;min-height:34px;border-radius:5px}
.wk-hoch th{padding:6px 2px;font-size:7px;vertical-align:bottom}
.wk-hoch th .rank{min-width:22px;font-size:8px;padding:3px 2px}
.wk-hoch th .pn{font:15px/1 var(--txt);color:var(--white);text-transform:none;margin:3px auto 0;max-width:40px;overflow:hidden;text-overflow:clip}
.wk-hoch th .pp{font:20px/1 var(--txt);color:var(--yellow);margin-top:2px}
.wk-hoch th.meh{background:#4a3a00}
.wk-hoch td{padding:6px 2px 3px;font-size:17px}
.wk-hoch .chip{font:15px/1 var(--txt);padding:2px 3px;border-width:1px;border-radius:3px}
.wk-hoch .chip sup{position:absolute;top:-7px;right:-7px;font:11px/1 var(--txt);padding:1px 2px;margin:0;border-radius:3px;z-index:1}
.gcell{text-align:left;padding:3px 4px!important}
.gcell .gl{display:flex;align-items:center;gap:1px;font-size:15px;white-space:nowrap}
.gcell .gl img{width:14px;height:14px}
.gcell .gl i{font-style:normal;color:var(--muted);margin:0 2px}
.gcell .gr{font-size:15px;color:var(--muted);line-height:1}
.gcell .gr .w{color:var(--lime)}
.chip{border-radius:4px}
.fillv{color:var(--cyan);font-style:italic}
.card label{display:block;color:var(--cyan);margin:10px 0 4px}
.adm-pl{display:flex;flex-direction:column;gap:6px}
.adm-row{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:6px}
.adm-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .rbtn{font-size:8px;padding:7px 8px;min-height:32px;border-radius:5px}
.th-team{display:flex;flex-direction:column;align-items:center;gap:2px}
.th-team img{width:22px;height:22px}
.th-res{font:18px var(--txt);color:var(--white)} .th-res .w{color:var(--lime)}
.trophy{color:var(--gold)}
.winner{padding:12px;margin-bottom:14px;text-align:center;font:12px/1.6 var(--pix);color:var(--gold);text-shadow:2px 2px 0 #000;background:#3a2a00}

/* ---------- Karten / Modal ---------- */
.card{padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font:12px/1.4 var(--pix);color:var(--yellow);text-shadow:2px 2px 0 #000}
.card ul,.card ol{margin:0;padding-left:22px} .card li{margin:6px 0}
.card code{background:#000;color:var(--lime);padding:1px 5px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .row>*{flex:1;min-width:140px}
.muted{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,20,.8);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:420px;padding:18px}
.modal h3{margin:0 0 12px;font:13px/1.4 var(--pix);color:var(--yellow);text-shadow:2px 2px 0 #000}
.modal label{display:block;color:var(--cyan);margin:10px 0 4px}
.modal hr{border:0;border-top:3px dashed var(--hi);margin:18px 0}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:45;display:none;font:10px/1.4 var(--pix);background:var(--yellow);color:#000;padding:12px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;max-width:90vw;text-align:center}
.loading{padding:40px;text-align:center;font:11px var(--pix);color:var(--yellow)}
details summary{cursor:pointer;color:var(--cyan)}

/* ---------- Handy ---------- */
@media (max-width:640px){
  body{font-size:20px}
  header{position:static}
  .hwrap{padding:8px 10px;gap:8px}
  .logo h1{font-size:12px}
  .logo .sub{font-size:17px}
  nav{padding:8px 10px 10px;gap:6px}
  nav .rbtn{font-size:8px;padding:8px 2px}
  nav .rbtn .ic{font-size:20px}
  main{padding:4px 10px 110px}
  .games{grid-template-columns:1fr}
  .match{grid-template-columns:1fr 26px 1fr;gap:6px;padding:10px 8px 4px}
  .vs{width:26px;height:26px;font-size:9px}
  .team{min-height:108px}
  .team b{font-size:11px}
  .team small{font-size:16px}
  .ghead{flex-wrap:wrap;gap:6px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:4px}
  .stat.cdw{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:12px}
  .stat .k{font-size:7px}
  .stat .v{font-size:26px}
  .stat.cdw .v{margin-top:0}
  .status{padding:10px}
  .status .lockline{font-size:19px;gap:8px}
  .weekbar{flex-wrap:nowrap;gap:6px}
  .weekbar select{min-width:0;font-size:20px}
  .weekbar .rbtn{padding:8px 10px}
  .legend{font-size:16px;gap:10px}
  .savebar{padding:8px 10px;gap:10px}
  .savebar .msg{font-size:17px}
  td{font-size:19px;padding:5px 5px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><h1>🏈 NFL TIPPSPIEL</h1><div class="sub" id="sub">LADE SPIELPLAN …</div></div>
    <button id="userChip" class="rbtn nc" style="border-radius:6px">Anmelden</button>
  </div>
  <nav>
    <button class="rbtn ny" data-tab="tippen"><span class="ic">🏈</span>Tippen</button>
    <button class="rbtn nc" data-tab="woche"><span class="ic">📋</span>Woche</button>
    <button class="rbtn nm" data-tab="tabelle"><span class="ic">🏆</span>Tabelle</button>
    <button class="rbtn nl" data-tab="setup"><span class="ic">📜</span>Regeln</button>
  </nav>
</header>
<main id="view"><div class="loading">LADE NFL-SPIELPLAN …</div></main>
<div id="savebar" class="savebar" hidden></div>
<div id="modal" class="modal-bg"><div class="modal panel" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   KONFIGURATION – hier anpassen
   ===================================================================== */
const CONFIG = {
  // Firebase Realtime Database URL (leer = lokaler Testmodus, nur dieses Gerät)
  FIREBASE_URL: "https://nfl-tippspiel-df32c-default-rtdb.europe-west1.firebasedatabase.app",
  GROUP: "freunde",      // Name der Tipprunde (mehrere Runden in einer DB möglich)
  LOCK_MINUTES: 60,      // Sperre X Minuten vor dem ersten Spiel der Woche
  DOUBLE_MAX: 2,         // Anzahl Doppelt-Spiele
  HALF_MAX: 1,           // Anzahl Halb-Spiele
  REFRESH_SECONDS: 60    // Live-Aktualisierung
};
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";

// Teamfarben: [Hauptfarbe, Zweitfarbe, Akzent]
const TEAMC = {
  ARI:["97233F","000000","FFB612"], ATL:["A71930","000000","A5ACAF"], BAL:["241773","000000","9E7C0C"],

/* ---------------- TV-Sender im deutschsprachigen Raum (Saison 2026/27) ----------------
   Regeln nach Anstoßzeit (deutsche Zeit). RTL (frei) + Sky (Pay) haben die Rechte.
   sure:false = Sender zeigt in diesem Slot nur 1 von mehreren Spielen -> mit "?" markiert.
   Genaue Sender pro Spiel kann der Admin im Spiel per ✎ eintragen (überschreibt die Regel). */
const berlinFmt = new Intl.DateTimeFormat("en-GB", {timeZone:"Europe/Berlin", weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false});
function tvFor(ev, key) {
  const o = S.tv?.["e" + ev.id];
  if (o) return o.split(",").map(s => s.trim()).filter(Boolean).map(n => ({n, sure: true}));
  const p = Object.fromEntries(berlinFmt.formatToParts(new Date(ev.date)).map(x => [x.type, x.value]));
  const h = (+p.hour % 24) + (+p.minute) / 60, wd = p.weekday;
  if (key === "3-5") return [{n:"RTL", sure:true}, {n:"Sky", sure:true}];          // Super Bowl
  if (h < 6) return [{n:"RTL", sure:true}, {n:"Sky", sure:true}];                    // Thursday/Sunday/Monday Night
  if (ev.neutral && h < 18) return [{n:"RTL", sure:true}];                          // Europa-Spiele
  if (wd === "Sun" && h >= 18.5 && h < 20.5) return [{n:"Sky Konferenz", sure:true}, {n:"RTL / RTL+", sure:false}];
  if (wd === "Sun" && h >= 21.5 && h < 23.5) return [{n:"Sky Konferenz", sure:true}, {n:"RTL", sure:false}];
  if (wd === "Thu" && h >= 17) return [{n:"NITRO", sure:false}];                    // Thanksgiving-Nachmittag
  return [{n:"Sky", sure:false}];
}

  remote: () => !!dbUrl,

  async get(path, base = this.root()) {
    if (this.remote()) {
      const r = await fetch(`${dbUrl}/${base}/${path}.json`);
      if (!r.ok) throw new Error("Datenbank-Fehler " + r.status);
      return await r.json();
    }
    let o = JSON.parse(localStorage.getItem("tip-local") || "{}");
    for (const p of `${base}/${path}`.split("/")) o = o?.[p];
    return o ?? null;
  },
  async keys(path, base = this.root()) {
    if (this.remote()) {
      const r = await fetch(`${dbUrl}/${base}/${path}.json?shallow=true`);
      if (!r.ok) throw new Error("Datenbank-Fehler " + r.status);
      return Object.keys((await r.json()) || {});
    }
    return Object.keys((await this.get(path, base)) || {});
  },
  async put(path, val, base = this.root()) {
    if (this.remote()) {
      const r = await fetch(`${dbUrl}/${base}/${path}.json`, {method:"PUT", body:JSON.stringify(val)});
      if (!r.ok) throw new Error("Datenbank-Fehler " + r.status);
      return await r.json();
    }
    const all = JSON.parse(localStorage.getItem("tip-local") || "{}");
    const parts = `${base}/${path}`.split("/");

    const json = JSON.stringify(val).replace(/\{"\.sv":"timestamp"\}/g, Date.now());
    if (val === null) delete o[parts.at(-1)]; else o[parts.at(-1)] = JSON.parse(json);
    localStorage.setItem("tip-local", JSON.stringify(all));

  }

function mlToProb(ml) { const n = parseInt(ml, 10); if (!n) return null; return n < 0 ? -n / (-n + 100) : 100 / (n + 100); }

function parseEvent(e) {
  const c = e.competitions[0];
  const team = x => ({
    abbr: x.team.abbreviation, name: x.team.shortDisplayName, logo: x.team.logo,
    color: x.team.color, alt: x.team.alternateColor,
    score: x.score, record: x.records?.[0]?.summary || "", winner: !!x.winner
  });
  const home = team(c.competitors.find(x => x.homeAway === "home"));
  const away = team(c.competitors.find(x => x.homeAway === "away"));
  const st = e.status.type;
  let winner = null;
  if (st.completed) winner = home.winner ? home.abbr : away.winner ? away.abbr : "TIE";
  let odds = null;
  const o = (c.odds || [])[0];
  if (o) {
    const mlH = o.moneyline?.home?.close?.odds, mlA = o.moneyline?.away?.close?.odds;
    let pH = mlToProb(mlH), pA = mlToProb(mlA);
    if (pH && pA) { const s = pH + pA; pH /= s; pA /= s; }
    odds = {
      provider: o.provider?.name || "Buchmacher", details: o.details, ou: o.overUnder, mlH, mlA, pH, pA,
      fav: o.homeTeamOdds?.favorite ? home.abbr : o.awayTeamOdds?.favorite ? away.abbr : null
    };
  }
  return {
    id: e.id, date: new Date(e.date).getTime(), state: st.state, completed: st.completed,
    detail: st.shortDetail, home, away, winner, odds, neutral: c.neutralSite
  };
}

const sbCache = {};
async function loadWeek(key, force = false) {

    const c = localStorage.getItem(lsKey);
    if (c) return (sbCache[key] = JSON.parse(c));
  }
  const [t, w] = key.split("-");
  const r = await fetch(`${ESPN}?seasontype=${t}&week=${w}&dates=${S.season}`);
  if (!r.ok) throw new Error("ESPN nicht erreichbar (" + r.status + ")");
  const d = await r.json();
  const events = (d.events || []).map(parseEvent).sort((a, b) => a.date - b.date);
  const wk = {
    key, events,
    lock: events.length ? events[0].date - CONFIG.LOCK_MINUTES * 60000 : null,
    done: events.length > 0 && events.every(e => e.completed)
  };
  sbCache[key] = wk;
  if (wk.done) localStorage.setItem(lsKey, JSON.stringify(wk));
  return wk;
}

/* ---------------- Wertung ---------------- */
const isLocked = wk => wk.lock !== null && Date.now() >= wk.lock;
function multiplier(tip, eid) {
  if ((tip.dbl || []).includes(eid)) return 2;
  if (tip.half === eid) return 0.5;
  return 1;
}
function scoreTip(tip, wk) {
  const res = {pts: 0, correct: 0, decided: 0, picked: 0, late: false, per: {}};
  if (!tip) return res;
  res.late = !!(tip.ts && wk.lock && tip.ts > wk.lock);
  for (const ev of wk.events) {
    const pick = tip.picks?.["e" + ev.id];
    if (pick) res.picked++;
    if (!ev.completed) continue;
    res.decided++;
    const ok = !!pick && pick === ev.winner && !res.late;
    const p = ok ? multiplier(tip, ev.id) : 0;
    res.per[ev.id] = {ok, p, pick};
    if (ok) { res.correct++; res.pts += p; }
  }
  return res;
}

/* ---------------- Ersatzpunkte ----------------
   Gilt ab der ersten getippten Woche der Runde, für gesperrte Wochen:
   - Hat in einer Woche jemand getippt: Wer erst später eingestiegen ist, bekommt den
     Durchschnitt der vergebenen Punkte dieser Woche ("Ø").
   - Hat in einer Woche niemand getippt: ALLE bekommen die halbe mögliche Punktzahl,
     aufgerundet auf eine ganze Zahl ("~"). */
function maxPoints(n) {
  const d = Math.min(n, CONFIG.DOUBLE_MAX), h = Math.min(Math.max(n - d, 0), CONFIG.HALF_MAX);
  return (n - d - h) + 2 * d + 0.5 * h;
}
const joinedAfter = (pid, wk) => wk.lock !== null && (S.players[pid]?.joined || 0) > wk.lock;
// liefert für einen Spieler ohne Tipp {p, kind:"avg"|"half"} oder null
function fillFor(pid, wk, tipsMap) {
  if (!isLocked(wk) || !wk.events.length) return null;
  const pts = Object.entries(tipsMap || {}).filter(([id]) => S.players[id]).map(([, t]) => scoreTip(t, wk).pts);
  if (!pts.length) return {p: Math.ceil(maxPoints(wk.events.length) / 2), kind: "half"};
  if (!joinedAfter(pid, wk)) return null;
  return {p: Math.round(pts.reduce((a, b) => a + b, 0) / pts.length * 10) / 10, kind: "avg"};
}
const fillTxt = f => f.kind === "avg"
  ? `<span class="fillv" title="Später eingestiegen – Durchschnitt der Woche">Ø${fmtPts(f.p)}</span>`
  : `<span class="fillv" title="Niemand hat getippt – halbe Punktzahl für alle">~${fmtPts(f.p)}</span>`;

async function hash(s) {
  if (crypto?.subtle) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return "x" + h;
}

function countdown(ms) {

  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1000) % 60;
  return (d ? `${d}T ` : "") + `${pad(h)}:${pad(m)}:${pad(s)}`;
}

  let lastDay = "";

    const pick = S.me ? src.picks?.["e" + ev.id] : null;
    const isD = !!S.me && (src.dbl || []).includes(ev.id), isH = !!S.me && src.half === ev.id;
    const canEdit = !!S.me && !locked;
    const teamBtn = (t, side) => {
      let cls = "team" + (side === "home" ? " home" : "");
      if (pick === t.abbr) cls += " sel"; else if (pick) cls += " dim";
      if (ev.completed && ev.winner === t.abbr) cls += " won";
      let stamp = "";
      if (pick === t.abbr && ev.completed) { const ok = ev.winner === t.abbr && !sc?.late; cls += ok ? " right" : " wrong"; stamp = ok ? "✔" : "✘"; }
      const showScore = ev.state !== "pre";
      return `<button class="${cls}" style="${tvars(t)}" data-e="${ev.id}" data-t="${t.abbr}" ${canEdit ? "" : "disabled"} aria-label="${esc(t.name)} ${side === "home" ? "(Heim)" : "(Gast)"}">
        <span class="tag">${side === "home" ? "HEIM" : "GAST"}</span>
        ${stamp ? `<span class="stamp">${stamp}</span>` : ""}
        <span class="crest"><img src="${t.logo}" alt="" loading="lazy"></span>
        <b>${t.abbr}</b><small>${esc(t.name)}</small>${t.record ? `<small>${t.record}</small>` : ""}
        ${showScore ? `<span class="score led">${t.score}</span>` : ""}
        ${pick === t.abbr ? `<span class="pick">TIPP</span>` : ""}</button>`;
    };
    let st;
    if (ev.state === "in") st = `<span class="st live">● LIVE ${esc(ev.detail)}</span>`;
    else if (ev.completed) st = `<span class="st fin">${ev.winner === "TIE" ? "Remis" : "Endstand"}</span>`;
    else if (isD) st = `<span class="st mul">2× Doppelt</span>`;
    else if (isH) st = `<span class="st mul h">½ Halb</span>`;
    else st = ev.neutral ? `<span class="st">Neutral</span>` : "";
    let ptsHtml = "";
    if (sc && sc.per[ev.id]) { const p = sc.per[ev.id]; ptsHtml = `<span class="pts ${p.ok ? "gp" : "rp"}">${p.ok ? "+" + fmtPts(p.p) : "0"}</span>`; }
    html += `<div class="panel game ${isD ? "dbl" : ""} ${isH ? "half" : ""}">
      <div class="ghead"><span class="t">${fmtTime.format(ev.date)}</span>
        <span class="tvs">${tvFor(ev, S.key).map(t => `<span class="tv ${tvClass(t.n)} ${t.sure ? "" : "maybe"}" title="${t.sure ? "Live" : "Zeigt in diesem Slot 1 Spiel – welches, steht im TV-Plan"}">${esc(t.n)}${t.sure ? "" : "?"}</span>`).join("")}
        ${isAdmin() ? `<button class="tvedit" data-tv="${ev.id}" title="Sender eintragen">✎</button>` : ""}</span>${st}</div>
      <div class="match">${teamBtn(ev.away, "away")}<span class="vs">@</span>${teamBtn(ev.home, "home")}</div>
      ${oddsHtml(ev)}
      ${S.me ? `<div class="mods">
        <button class="rbtn y ${isD ? "on" : ""}" data-mod="d" data-e="${ev.id}" ${canEdit ? "" : "disabled"}>2× Doppelt</button>
        <button class="rbtn m ${isH ? "on" : ""}" data-mod="h" data-e="${ev.id}" ${canEdit ? "" : "disabled"}>½ Halb</button>
        ${ptsHtml}</div>` : `<div style="height:10px"></div>`}
    </div>`;
  }
  if (lastDay) html += `</div>`;
  $("#view").innerHTML = html;
  bindWeekBar();
  if ($("#loginBtn")) $("#loginBtn").onclick = openLogin;

  document.querySelectorAll(".team[data-e]").forEach(b => b.onclick = () => {
    const k = "e" + b.dataset.e;
    if (d.picks[k] === b.dataset.t) delete d.picks[k]; else d.picks[k] = b.dataset.t;
    S.dirty = true; render();
  });
  document.querySelectorAll("[data-tv]").forEach(b => b.onclick = async () => {
    const k = "e" + b.dataset.tv;
    const v = prompt("TV-Sender für dieses Spiel (mit Komma trennen, z.B. RTL, Sky).\nLeer lassen = automatische Regel.", S.tv[k] || "");
    if (v === null) return;
    try {
      await DB.put(`tv/${S.key}/${k}`, v.trim() || null);
      if (v.trim()) S.tv[k] = v.trim(); else delete S.tv[k];
      toast("Sender gespeichert"); render();
    } catch (e) { toast("Fehler: " + e.message); }
  });
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => {
    const id = b.dataset.e;
    if (b.dataset.mod === "d") {
      if (d.dbl.includes(id)) d.dbl = d.dbl.filter(x => x !== id);
      else { if (d.dbl.length >= CONFIG.DOUBLE_MAX) return toast(`Maximal ${CONFIG.DOUBLE_MAX} Doppelt-Spiele`); d.dbl.push(id); if (d.half === id) d.half = null; }
    } else {
      if (d.half === id) d.half = null;
      else { d.half = id; d.dbl = d.dbl.filter(x => x !== id); }
    }
    S.dirty = true; render();
  });

  const sb = $("#savebar");
  if (S.me && !locked && wk.events.length) {
    sb.hidden = false;
    sb.innerHTML = `<span class="msg ${S.dirty ? "dirty" : ""}">${S.dirty ? "▶ Nicht gespeichert!" : myTip ? "✔ Gespeichert" : "Noch nichts gespeichert"}</span>
      <button class="rbtn y" id="saveBtn" ${S.dirty ? "" : "disabled"}>💾 Speichern</button>`;
    $("#saveBtn").onclick = saveTips;
  } else sb.hidden = true;
}

function pickChip(ev, pick, mult, state) {
  const t = pick === ev.home.abbr ? ev.home : ev.away;
  const sup = mult === 2 ? `<sup>2×</sup>` : mult === 0.5 ? `<sup class="h">½</sup>` : "";
  return `<span class="chip ${state}" style="${tvars(t)}">${pick}${sup}</span>`;
}

function renderWoche() {
  const wk = S.week, locked = isLocked(wk);
  const fillAllowed = S.firstKey && weekOrder(S.key) >= weekOrder(S.firstKey);
  const rows = Object.keys(S.players).map(id => {
    const tip = S.tips[id], sc = scoreTip(tip, wk);
    const fill = !tip && fillAllowed ? fillFor(id, wk, S.tips) : null;
    return {id, name: S.players[id].name, tip, sc, fill, pts: tip ? sc.pts : (fill?.p ?? 0)};
  }).sort((a, b) => b.pts - a.pts || b.sc.correct - a.sc.correct || a.name.localeCompare(b.name));
  const best = Math.max(0, ...rows.filter(r => r.tip).map(r => r.sc.pts));
  const ptsTxt = r => r.tip ? fmtPts(r.sc.pts) : r.fill ? fillTxt(r.fill) : "–";
  const fillLegend = (rows.some(r => r.fill?.kind === "avg") ? "<span>Ø = Durchschnitt (später eingestiegen)</span>" : "")
    + (rows.some(r => r.fill?.kind === "half") ? "<span>~ = halbe Punktzahl (niemand hat getippt)</span>" : "");
  const toggle = `<div class="vtoggle"><span>Ansicht</span>
    <button class="rbtn ${S.view === "hoch" ? "nc on" : "g"}" data-view="hoch">📱 Hochformat</button>
    <button class="rbtn ${S.view === "quer" ? "nc on" : "g"}" data-view="quer"><span style="display:inline-block;transform:rotate(90deg)">📱</span> Querformat</button></div>`;
  let html = toggle + weekBar() + `<div class="panel status"><div class="lockline">${lockLine()}</div>
    ${!locked ? `<div class="hint">Die Tipps der anderen werden erst nach der Sperre sichtbar.</div>` : ""}
    ${!wk.done && locked ? `<div class="hint">Punkte sind vorläufig, bis alle Spiele beendet sind.</div>` : ""}</div>`;
  if (wk.done && best > 0) {
    const winners = rows.filter(r => r.tip && r.sc.pts === best).map(r => esc(r.name)).join(", ");
    html += `<div class="panel winner">🏆 Wochensieg: ${winners}<br>${fmtPts(best)} Punkte</div>`;
  }
  // Ränge
  let rk = 0, pv = null;
  rows.forEach((r, i) => { if (r.pts !== pv) { rk = i + 1; pv = r.pts; } r.rank = rk; });
  const cell = (r, ev) => {
    const pick = r.tip?.picks?.["e" + ev.id];
    if (!r.tip || !pick) return `<td class="dash">–</td>`;
    if (!(locked || r.id === S.me)) return `<td style="color:var(--lime)">✓</td>`;
    const state = ev.completed ? (r.sc.per[ev.id]?.ok ? "ok" : "no") : "";
    return `<td>${pickChip(ev, pick, multiplier(r.tip, ev.id), state)}</td>`;
  };

  if (S.view === "hoch") {
    // Hochformat: Spiele untereinander, Tipper nebeneinander
    html += `<div class="panel tbl-wrap"><table class="wk-hoch"><thead><tr><th class="stick l">Spiel</th>`;
    rows.forEach(r => html += `<th class="${r.id === S.me ? "meh" : ""} rk${r.rank}" title="${esc(r.name)}"><span class="rank">${r.rank}</span><div class="pn">${esc(r.name.slice(0, 6))}</div><div class="pp">${ptsTxt(r)}</div></th>`);
    html += `</tr></thead><tbody>`;
    for (const ev of wk.events) {
      const res = ev.state !== "pre" ? `<span class="${ev.winner === ev.away.abbr ? "w" : ""}">${ev.away.score}</span>:<span class="${ev.winner === ev.home.abbr ? "w" : ""}">${ev.home.score}</span>` : fmtTime.format(ev.date);
      html += `<tr><td class="stick l gcell"><div class="gl"><img src="${ev.away.logo}" alt="">${ev.away.abbr}<i>@</i><img src="${ev.home.logo}" alt="">${ev.home.abbr}</div><div class="gr">${res}</div></td>`;
      rows.forEach(r => html += cell(r, ev));
      html += `</tr>`;
    }
    if (!rows.length) html += `<tr><td colspan="2" class="muted">Noch keine Tipper angemeldet.</td></tr>`;
    html += `</tbody></table></div>`;
    html += `<div class="legend"><span><i style="background:var(--lime)"></i>grün = richtig</span><span><i style="background:#555"></i>grau = falsch</span><span><i style="background:var(--gold)"></i>2×</span><span><i style="background:var(--half)"></i>½</span>${fillLegend}</div>`;
    $("#view").innerHTML = html;
    bindWeekBar(); bindView();
    return;
  }

  html += `<div class="panel tbl-wrap"><table><thead><tr><th class="stick l">Tipper</th><th>Pkt</th><th>✔</th>`;
  for (const ev of wk.events) {
    const res = ev.state !== "pre"
      ? `<span class="th-res"><span class="${ev.winner === ev.away.abbr ? "w" : ""}">${ev.away.score}</span>:<span class="${ev.winner === ev.home.abbr ? "w" : ""}">${ev.home.score}</span></span>` : "";
    html += `<th title="${esc(ev.away.name)} @ ${esc(ev.home.name)}"><div class="th-team"><img src="${ev.away.logo}" alt="">${ev.away.abbr}<span>@</span><img src="${ev.home.logo}" alt="">${ev.home.abbr}${res}</div></th>`;
  }
  html += `</tr></thead><tbody>`;
  rows.forEach(r => {
    const rank = r.rank;
    const showPicks = locked || r.id === S.me;
    const crown = wk.done && r.tip && r.sc.pts === best && best > 0 ? " 🏆" : "";
    html += `<tr class="${r.id === S.me ? "me" : ""} rk${rank}"><td class="stick l"><span class="rank">${rank}</span> ${esc(r.name)}${crown}${r.sc.late ? ' <span style="color:var(--red)" title="nach Sperre gespeichert">⚠</span>' : ""}</td>
      <td class="ptsc">${ptsTxt(r)}</td><td>${r.tip ? `${r.sc.correct}/${r.sc.decided}` : "–"}</td>`;
    for (const ev of wk.events) {
      const pick = r.tip?.picks?.["e" + ev.id];
      if (!r.tip || !pick) { html += `<td class="dash">–</td>`; continue; }
      if (!showPicks) { html += `<td style="color:var(--lime)">✓</td>`; continue; }
      const state = ev.completed ? (r.sc.per[ev.id]?.ok ? "ok" : "no") : "";
      html += `<td>${pickChip(ev, pick, multiplier(r.tip, ev.id), state)}</td>`;
    }
    html += `</tr>`;
  });
  if (!rows.length) html += `<tr><td colspan="${wk.events.length + 3}" class="muted">Noch keine Tipper angemeldet.</td></tr>`;
  html += `</tbody></table></div>
    <div class="legend"><span><i style="background:var(--lime)"></i>grüner Rahmen = richtig</span><span><i style="background:#555"></i>grau = falsch</span><span><i style="background:var(--gold)"></i>2×</span><span><i style="background:var(--half)"></i>½</span>${fillLegend}</div>`;
  $("#view").innerHTML = html;
  bindWeekBar(); bindView();
}
function bindView() {
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    S.view = b.dataset.view; localStorage.setItem("tip-view", S.view); render();
  });
}

async function renderTabelle() {
  $("#view").innerHTML = `<div class="loading">BERECHNE TABELLE …</div>`;
  let all;
  try { all = (await DB.get("tips")) || {}; } catch (e) { $("#view").innerHTML = `<div class="panel card">${esc(e.message)}</div>`; return; }
  // Wochen von der ersten getippten Woche bis zur letzten getippten bzw. aktuellen Woche
  const tipped = Object.keys(all).sort((a, b) => weekOrder(a) - weekOrder(b));
  let keys = [], weeks = [];
  if (tipped.length) {
    const from = weekOrder(tipped[0]), to = Math.max(weekOrder(tipped.at(-1)), weekOrder(S.curKey));
    const cand = WEEKS.map(w => w.key).filter(k => weekOrder(k) >= from && weekOrder(k) <= to);
    const loaded = await Promise.all(cand.map(k => loadWeek(k, k === S.curKey).catch(() => null)));
    cand.forEach((k, i) => { const wk = loaded[i]; if (wk && wk.events.length && (all[k] || isLocked(wk))) { keys.push(k); weeks.push(wk); } });
  }
  const st = {};
  for (const id of Object.keys(S.players)) st[id] = {id, name: S.players[id].name, pts: 0, correct: 0, decided: 0, wins: 0, per: {}, fills: 0};
  keys.forEach((k, i) => {
    const wk = weeks[i];
    let best = 0; const scores = {};
    for (const [pid, tip] of Object.entries(all[k] || {})) {
      if (!st[pid]) continue;
      const sc = scoreTip(tip, wk); scores[pid] = sc.pts;
      st[pid].pts += sc.pts; st[pid].correct += sc.correct; st[pid].decided += sc.decided;
      st[pid].per[k] = {p: sc.pts}; best = Math.max(best, sc.pts);
    }
    if (wk.done && best > 0) for (const [pid, p] of Object.entries(scores)) if (p === best) st[pid].wins++;
    // Ersatzpunkte (später eingestiegen bzw. niemand hat getippt)
    for (const pid of Object.keys(st)) {
      if (st[pid].per[k]) continue;
      const f = fillFor(pid, wk, all[k]);
      if (!f) continue;
      st[pid].per[k] = {p: f.p, fill: f}; st[pid].pts += f.p; st[pid].fills++;
    }
  });
  const rows = Object.values(st).sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.correct - a.correct || a.name.localeCompare(b.name));
  const lead = rows[0]?.pts || 0;
  let html = `<div class="panel card"><h3>🏆 Saison ${S.season} – Gesamtstand</h3><span class="muted">Wochensiege zählen nur für abgeschlossene Wochen. * = Woche läuft noch.</span></div>
    <div class="panel tbl-wrap"><table><thead><tr><th class="stick l">Tipper</th><th>Punkte</th><th>Rückst.</th><th>Siege</th><th>Quote</th>`;
  keys.forEach((k, i) => html += `<th title="${weekLabel(k)}">${weekShort(k)}${weeks[i] && !weeks[i].done ? "*" : ""}</th>`);
  html += `</tr></thead><tbody>`;
  let rank = 0, prev = null;
  rows.forEach((r, i) => {
    if (r.pts !== prev) { rank = i + 1; prev = r.pts; }
    const q = r.decided ? Math.round(r.correct / r.decided * 100) + "%" : "–";
    html += `<tr class="${r.id === S.me ? "me" : ""} rk${rank}"><td class="stick l"><span class="rank">${rank}</span> ${esc(r.name)}</td>
      <td class="ptsc">${fmtPts(r.pts)}</td><td class="muted">${r.pts === lead ? "–" : "−" + fmtPts(lead - r.pts)}</td>
      <td>${r.wins ? (r.wins > 3 ? "🏆×" + r.wins : "🏆".repeat(r.wins)) : "0"}</td><td>${q}</td>`;
    keys.forEach(k => {
      const c = r.per[k];
      html += `<td>${!c ? '<span class="dash">–</span>' : c.fill ? fillTxt(c.fill) : fmtPts(c.p)}</td>`;
    });
    html += `</tr>`;
  });
  if (!rows.length) html += `<tr><td colspan="${5 + keys.length}" class="muted">Noch keine Tipper.</td></tr>`;
  html += `</tbody></table></div>`;
  const fl = rows.flatMap(r => Object.values(r.per).filter(c => c.fill).map(c => c.fill.kind));
  if (fl.length) html += `<div class="legend">${fl.includes("avg") ? "<span>Ø = Durchschnitt der Woche (später eingestiegen)</span>" : ""}${fl.includes("half") ? "<span>~ = halbe mögliche Punktzahl (niemand hat getippt)</span>" : ""}</div>`;
  if (S.tab === "tabelle") $("#view").innerHTML = html;
}

  </div>`;
}

function bindAdmin() {
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on("#adSet", async () => {
    const a = $("#adP1").value, b = $("#adP2").value;
    if (a.length < 6) return toast("PIN zu kurz (mind. 6 Zeichen)");
    if (a !== b) return toast("PINs stimmen nicht überein");
    const h = await adminHash(a);
    try {
      if (await DB.get("admin/pin", GROUP_BASE())) { toast("Es gibt schon einen Admin"); await reloadData(); return render(); }
      await DB.put("admin/pin", h, GROUP_BASE());
    } catch (e) { return toast("Fehler: " + e.message); }
    S.adminPin = h; localStorage.setItem("tip-adm", h); toast("Du bist jetzt Admin ✓"); render();
  });
  on("#adLogin", async () => {
    const h = await adminHash($("#adPin").value);
    if (h !== S.adminPin) return toast("Falsche Admin-PIN");
    localStorage.setItem("tip-adm", h); toast("Admin angemeldet ✓"); render();
  });
  if (!adminIn()) return;
  $("#admTv").onchange = e => { localStorage.setItem("tip-admin", e.target.checked ? "1" : "0"); toast(e.target.checked ? "✎ Sender-Eingabe an" : "Sender-Eingabe aus"); };
  on("#adOut", () => { localStorage.removeItem("tip-adm"); localStorage.removeItem("tip-admin"); toast("Admin abgemeldet"); render(); });
  on("#adChg", async () => {
    const a = prompt("Neue Admin-PIN (mind. 6 Zeichen):");
    if (a === null) return;
    if (a.length < 6) return toast("PIN zu kurz");
    const h = await adminHash(a);
    try { await DB.put("admin/pin", h, GROUP_BASE()); } catch (e) { return toast("Fehler: " + e.message); }
    S.adminPin = h; localStorage.setItem("tip-adm", h); toast("Admin-PIN geändert ✓");
  });
  document.querySelectorAll("[data-pin]").forEach(b => b.onclick = async () => {
    const id = b.dataset.pin, p = S.players[id];
    const pin = prompt(`Neue PIN für ${p.name} (mind. 4 Zeichen):`);
    if (pin === null) return;
    if (pin.length < 4) return toast("PIN zu kurz");
    try { await DB.put(`players/${id}/pin`, await hash(id + pin)); } catch (e) { return toast("Fehler: " + e.message); }
    p.pin = await hash(id + pin); toast(`Neue PIN für ${p.name} gespeichert`);
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const id = b.dataset.del, p = S.players[id];
    if (!confirm(`${p.name} wirklich löschen?\nDer Spieler verschwindet aus allen Tabellen. Das kann nicht rückgängig gemacht werden.`)) return;
    try { await DB.put(`players/${id}`, null); } catch (e) { return toast("Fehler: " + e.message); }
    delete S.players[id];
    if (S.me === id) setMe(null);
    toast(`${p.name} gelöscht`); render();
  });
  $("#dbSave").onclick = async () => {
    const u = $("#dbIn").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\/.+/.test(u)) return toast("Bitte gültige https-URL eingeben");
    try {
      const r = await fetch(`${u}/tippspiel/${CONFIG.GROUP}/ping.json`, {method:"PUT", body: JSON.stringify(SERVER_TS)});
      if (!r.ok) throw new Error("Status " + r.status);
    } catch (e) { return toast("Verbindung fehlgeschlagen: " + e.message); }
    dbUrl = u; localStorage.setItem("tip-db", u); toast("Datenbank verbunden ✓"); await reloadData(); updateHeader(); render();
  };
  $("#dbLocal").onclick = async () => { dbUrl = ""; localStorage.removeItem("tip-db"); toast("Lokaler Testmodus"); await reloadData(); updateHeader(); render(); };
}

function render() {
  document.querySelectorAll("nav .rbtn").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  if (S.tab !== "tippen") $("#savebar").hidden = true;
  if (!S.week) return;
  ({tippen: renderTippen, woche: renderWoche, tabelle: renderTabelle, setup: renderSetup})[S.tab]();
}
document.querySelectorAll("nav .rbtn").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

/* ---------------- Laden ---------------- */
async function reloadData() {
  const [players, tips, tv, tipKeys, adminPin] = await Promise.all([DB.get("players"), DB.get(`tips/${S.key}`), DB.get(`tv/${S.key}`).catch(() => null), DB.keys("tips").catch(() => []), DB.get("admin/pin", GROUP_BASE()).catch(() => null)]);
  S.players = players || {}; S.tips = tips || {}; S.tv = tv || {}; S.adminPin = adminPin || null;
  S.firstKey = tipKeys.sort((a, b) => weekOrder(a) - weekOrder(b))[0] || null;
  if (S.me && !S.players[S.me]) { S.me = null; localStorage.removeItem("tip-me"); }
  if (!S.dirty) resetDraft();
}
async function selectWeek(key) {
  if (S.dirty && !confirm("Ungespeicherte Tipps verwerfen?")) return render();
  S.dirty = false; S.key = key; updateHeader();
  $("#view").innerHTML = `<div class="loading">LADE ${weekLabel(key).toUpperCase()} …</div>`;
  try {
    S.week = await loadWeek(key, !sbCache[key]?.done);
    await reloadData();
  } catch (e) { $("#view").innerHTML = `<div class="panel card">Fehler: ${esc(e.message)}</div>`; return; }
  if (S.tab === "tabelle" || S.tab === "setup") S.tab = "tippen";
  render();
}

async function init() {
  updateHeader();
  try {
    const d = await (await fetch(ESPN)).json();
    S.season = d.season.year;
    const t = d.season.type, w = d.week?.number || 1;
    S.curKey = t === 2 ? `2-${w}` : t === 3 ? (w === 4 ? "3-5" : `3-${w}`) : t === 1 ? "2-1" : "3-5";
    if (!WEEKS.some(x => x.key === S.curKey)) S.curKey = "2-1";
  } catch (e) {
    $("#view").innerHTML = `<div class="panel card">ESPN-Daten konnten nicht geladen werden: ${esc(e.message)}</div>`; return;
  }
  await selectWeek(S.curKey);
  updateHeader();

  setInterval(() => {
    if (!S.week || S.week.lock === null) return;
    const el = $("#cd"); const left = S.week.lock - Date.now();
    if (el) el.textContent = countdown(left);
    if (left <= 0 && left > -1500 && S.tab === "tippen") render();
  }, 1000);
  setInterval(async () => {
    if (!S.week || S.week.done || document.hidden || S.tab === "setup" || S.tab === "tabelle") return;
    try { S.week = await loadWeek(S.key, true); await reloadData(); if (!S.dirty || S.tab !== "tippen") render(); } catch {}
  }, CONFIG.REFRESH_SECONDS * 1000);
}
init();
</script>
</body>
