  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(VW * s) + 'px';
  cv.style.height = Math.floor(VH * s) + 'px';

const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let AC = null;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.08, slide = 0) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
let noiseBuf = null;
function noise(d, v = 0.3) {
  if (!AC) return;
  if (!noiseBuf) {
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const dt = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) dt[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 800;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}
const arp = (fs, d, step, type = 'triangle', v = 0.07) => fs.forEach((f, i) => setTimeout(() => tone(f, d, type, v), i * step));
const SFX = {
  jump: () => tone(380, 0.12, 'square', 0.04, 1.9),

  rainbow: () => tone(520, 0.2, 'triangle', 0.06, 2.2),
  bomb: () => tone(180, 0.08, 'square', 0.05),
  boom: () => { noise(0.5, 0.4); tone(80, 0.4, 'sine', 0.25, 0.4); },
  hit: () => tone(180, 0.3, 'sawtooth', 0.1, 0.35),
  kill: () => tone(600, 0.15, 'square', 0.05, 0.3),

const keysRaw = {}, keyLatch = {};
// keys liefert true, solange gedrückt ODER seit dem letzten Spielschritt kurz angetippt
const keys = new Proxy(keysRaw, { get: (o, k) => !!(o[k] || keyLatch[k]) });
addEventListener('keydown', e => {
  if (!e.repeat) keyLatch[e.code] = true;

  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keysRaw[e.code] = false; });

let PADS = [];
function readPads() {
  const a = [];
  const gp = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of gp) if (p && p.connected) a.push(p);
  PADS = a;
}
const EMPTY = () => ({ l: 0, r: 0, u: 0, d: 0, jump: 0, fire: 0, bomb: 0, start: 0 });
function kbState(set) {
  const k = keys;
  if (set === 1) return { l: k.KeyA, r: k.KeyD, u: k.KeyW, d: k.KeyS, jump: k.KeyW || k.Space, fire: k.KeyF, bomb: k.KeyG, start: k.Escape };
  return { l: k.ArrowLeft, r: k.ArrowRight, u: k.ArrowUp, d: k.ArrowDown, jump: k.ArrowUp, fire: k.KeyK || k.Numpad1 || k.Period, bomb: k.KeyL || k.Numpad2 || k.Comma, start: k.KeyP };
}
function padState(i) {
  const s = EMPTY(), p = PADS[i];
  if (!p) return s;
  const b = j => p.buttons[j] && p.buttons[j].pressed;
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  s.l = ax < -0.4 || b(14); s.r = ax > 0.4 || b(15);
  s.u = ay < -0.55 || b(12); s.d = ay > 0.55 || b(13);
  s.jump = b(0); s.fire = b(2) || b(5) || b(7); s.bomb = b(1) || b(3) || b(4) || b(6); s.start = b(9);
  return s;
}
const DEVICES = [
  { id: 'kb1+pad0', name: 'Tastatur WASD + Gamepad 1' },
  { id: 'kb2+pad1', name: 'Tastatur Pfeile + Gamepad 2' },
  { id: 'kb1', name: 'Tastatur WASD' },
  { id: 'kb2', name: 'Tastatur Pfeile' },
  { id: 'pad0', name: 'Gamepad 1' },
  { id: 'pad1', name: 'Gamepad 2' },
];
function devState(id) {
  const s = EMPTY();
  for (const part of id.split('+')) {
    const t = part === 'kb1' ? kbState(1) : part === 'kb2' ? kbState(2) : padState(+part[3]);
    for (const k in s) s[k] = s[k] || !!t[k];
  }
  return s;
}
class Ctrl {
  constructor(dev) { this.dev = dev; this.cur = devState(dev); this.prev = this.cur; }
  poll() { this.prev = this.cur; this.cur = devState(this.dev); }
  down(k) { return !!this.cur[k]; }
  hit(k) { return !!this.cur[k] && !this.prev[k]; }
}
function menuState() {
  const k = keys, s = { l: k.KeyA || k.ArrowLeft, r: k.KeyD || k.ArrowRight, u: k.KeyW || k.ArrowUp, d: k.KeyS || k.ArrowDown,
    ok: k.Enter || k.Space || k.KeyF || k.KeyK || k.NumpadEnter, back: k.Escape || k.KeyP };
  for (let i = 0; i < PADS.length; i++) {
    const p = padState(i);
    s.l = s.l || p.l; s.r = s.r || p.r; s.u = s.u || p.u; s.d = s.d || p.d;
    s.ok = s.ok || p.jump; s.back = s.back || p.start;
  }
  for (const key in s) s[key] = !!s[key];
  return s;
}
let menuPrev = {};
function menuEdge() {
  const c = menuState(), h = {};
  for (const k in c) h[k] = c[k] && !menuPrev[k];
  menuPrev = c; return h;
}
function resetMenuEdge() { readPads(); menuPrev = menuState(); }

const lc = lvlCv.getContext('2d');

// ================== Level-Generator ==================
function genLevel(stage) {
  const t = []; for (let y = 0; y < GH; y++) t.push(new Uint8Array(GW));
  for (let x = 0; x < GW; x++) { t[0][x] = 1; t[GH - 1][x] = 1; }
  for (let y = 0; y < GH; y++) { t[y][0] = 1; t[y][GW - 1] = 1; }
  const rows = []; for (let y = GH - 5; y >= 5; y -= 4) rows.push(y);
  for (const y of rows) {
    let x = 1 + ri(0, 3);
    while (x < GW - 1) {
      const len = ri(4, 11);
      const brickSeg = R() < 0.1 + Math.min(0.2, stage * 0.02);
      for (let k = 0; k < len && x < GW - 1; k++, x++) t[y][x] = brickSeg && R() < 0.7 ? 3 : 2;
      x += ri(2, 5);
    }
    // massive Blöcke (Mauerstücke)
    if (R() < 0.6) {
      const bx = ri(4, GW - 5);
      if (t[y][bx]) { t[y - 1][bx] = 1; if (R() < 0.5) t[y - 2][bx] = 1; }
    }
  }
  // Ziegel (zerstörbar) auf Plattformen und Boden
  const brickChance = 0.05 + Math.min(0.06, stage * 0.008);
  for (let y = 2; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) {
    if (t[y][x] !== 0) continue;
    const below = t[y + 1][x];
    if (!below) continue;
    if (y === GH - 2 && (x < 7 || x > GW - 8)) continue;
    if (R() < brickChance) { t[y][x] = 3; if (R() < 0.35 && y > 2 && t[y - 1][x] === 0) t[y - 1][x] = 3; }
  }
  // Punkte
  const dots = []; let dotCount = 0;
  for (let y = 0; y < GH; y++) dots.push(new Uint8Array(GW));
  for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) {
    if (t[y][x] === 0 && t[y + 1][x] && R() < 0.85) { dots[y][x] = 1; dotCount++; }
  }
  // Power-Pillen (je Viertel eine)
  const quads = [[1, 1, GW / 2, GH / 2], [GW / 2, 1, GW - 1, GH / 2], [1, GH / 2, GW / 2, GH - 1], [GW / 2, GH / 2, GW - 1, GH - 1]];
  for (const [x0, y0, x1, y1] of quads) {
    const c = [];
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (dots[y][x] === 1) c.push([x, y]);
    if (c.length) { const [x, y] = pick(c); dots[y][x] = 2; }
  }
  // Gegner-Portale im oberen Bereich
  const cand = [];
  for (const y of rows) if (y <= 17) for (let x = 3; x < GW - 3; x++)
    if (t[y][x] && t[y - 1][x] === 0 && t[y - 2][x] === 0) cand.push({ x: x * TS + TS / 2, y: y * TS });
  shuffle(cand);
  const portals = [];
  for (const c of cand) { if (portals.every(p => Math.abs(p.x - c.x) > 10 * TS || Math.abs(p.y - c.y) > 3 * TS)) portals.push(c); if (portals.length >= 4) break; }
  if (!portals.length) portals.push({ x: WW / 2, y: 5 * TS });
  const spawn = [{ x: 3 * TS, y: (GH - 1) * TS }, { x: (GW - 4) * TS, y: (GH - 1) * TS }];
  return { t, dots, dotCount, portals, spawn };
}
const tileAt = (x, y) => (x < 0 || y < 0 || x >= GW || y >= GH) ? 1 : L.t[y][x];
const solidAt = (x, y) => { const t = tileAt(x, y); return t === 1 || t === 3; };

function renderLevel() { lc.clearRect(0, 0, WW, WH); for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) drawTile(x, y); }
function drawTile(x, y) {
  const t = L.t[y][x], px = x * TS, py = y * TS;
  lc.clearRect(px, py, TS, TS);
  if (!t) return;
  if (t === 1) {
    lc.fillStyle = TH.wall; lc.fillRect(px, py, TS, TS);
    lc.fillStyle = TH.wallHi; lc.fillRect(px, py, TS, 4); lc.fillRect(px, py, 4, TS);
    lc.fillStyle = 'rgba(0,0,0,.28)'; lc.fillRect(px, py + TS - 4, TS, 4); lc.fillRect(px + TS - 4, py, 4, TS);
    lc.fillStyle = 'rgba(255,255,255,.08)'; lc.fillRect(px + 9, py + 9, 6, 6); lc.fillRect(px + 18, py + 17, 5, 5);
  } else if (t === 2) {
    lc.fillStyle = TH.plat; lc.fillRect(px, py, TS, 15);
    lc.fillStyle = TH.platHi; lc.fillRect(px, py, TS, 4);
    lc.fillStyle = 'rgba(0,0,0,.22)'; lc.fillRect(px, py + 13, TS, 2);
    lc.fillStyle = 'rgba(255,255,255,.35)';
    lc.beginPath(); lc.arc(px + 8, py + 9, 2, 0, 7); lc.arc(px + 24, py + 9, 2, 0, 7); lc.fill();
    lc.fillStyle = 'rgba(0,0,0,.12)'; lc.fillRect(px, py + 15, TS, 3);
  } else if (t === 3) {
    lc.fillStyle = '#e8b089'; lc.fillRect(px, py, TS, TS);
    lc.fillStyle = '#b8582c';
    lc.fillRect(px + 1, py + 1, 14, 9); lc.fillRect(px + 17, py + 1, 14, 9);
    lc.fillRect(px, py + 12, 7, 9); lc.fillRect(px + 9, py + 12, 14, 9); lc.fillRect(px + 25, py + 12, 7, 9);
    lc.fillRect(px + 1, py + 23, 14, 8); lc.fillRect(px + 17, py + 23, 14, 8);
    lc.fillStyle = 'rgba(255,255,255,.18)';
    lc.fillRect(px + 1, py + 1, 14, 2); lc.fillRect(px + 17, py + 1, 14, 2); lc.fillRect(px + 9, py + 12, 14, 2); lc.fillRect(px + 1, py + 23, 14, 2); lc.fillRect(px + 17, py + 23, 14, 2);
  }
}

function placeAtSpawn(p) {

  p.x = s.x + (TS - p.w) / 2; p.y = s.y - p.h; p.vx = 0; p.vy = 0;
}
function respawnPlayer(p) { placeAtSpawn(p); p.dead = false; p.hp = p.maxHp; p.inv = 3; burst(p.x + p.w / 2, p.y + p.h / 2, p.color, 24, 200); }
function hurtPlayer(p, srcX) {
  if (p.dead || p.out || p.inv > 0 || S !== 'play') return false;
  if (p.shield) { p.shield = false; p.shieldT = p.st.shieldCd; p.inv = 1; SFX.shield(); floatText(p.x + p.w / 2, p.y - 6, 'Schild!', '#7ff'); return true; }
  p.hp--; p.inv = 1.6; SFX.hit(); shake = Math.max(shake, 0.25);
  p.vx = (p.x + p.w / 2 < srcX ? -1 : 1) * 320; p.vy = -380;
  burst(p.x + p.w / 2, p.y + p.h / 2, '#ff4060', 12, 180);
  if (p.hp <= 0) killPlayer(p);
  return true;
}
function killPlayer(p) {
  p.dead = true; p.lives--; SFX.die();
  burst(p.x + p.w / 2, p.y + p.h / 2, p.color, 40, 300);
  if (p.lives <= 0) { p.out = true; floatText(p.x + p.w / 2, p.y - 10, p.name + ' ist raus!', '#f66'); }
  else p.respawn = 2.5;
}

function updatePlayer(p, dt) {
  if (p.out) return;
  if (p.dead) { p.respawn -= dt; if (p.respawn <= 0) respawnPlayer(p); return; }
  const c = p.ctrl, st = p.st;
  p.inv = Math.max(0, p.inv - dt); p.fireT -= dt; p.dropT -= dt;
  if (st.regen) {
    if (p.hp < p.maxHp) { p.regenT += dt; if (p.regenT >= st.regen) { p.regenT = 0; p.hp++; floatText(p.x + p.w / 2, p.y - 6, '+1 ❤', '#f8a'); } }
    else p.regenT = 0;
  }
  if (st.shieldCd && !p.shield) { p.shieldT -= dt; if (p.shieldT <= 0) { p.shield = true; } }

  const dir = (c.down('r') ? 1 : 0) - (c.down('l') ? 1 : 0);
  if (dir) {
    const acc = p.onGround ? 2600 : 1700, target = dir * st.speed;
    p.vx += Math.sign(target - p.vx) * Math.min(Math.abs(target - p.vx), acc * dt);
    p.facing = dir;
  } else {
    const fr = p.onGround ? 2600 : 700;
    p.vx -= Math.sign(p.vx) * Math.min(Math.abs(p.vx), fr * dt);
  }
  if (p.onGround) { p.airJ = st.airJumps; p.coyote = 0.09; } else p.coyote -= dt;
  if (c.hit('jump')) p.jumpBuf = 0.12; else p.jumpBuf -= dt;
  if (p.jumpBuf > 0) {
    if (c.down('d') && p.onGround && p.groundType === 'plat') { p.dropT = 0.22; p.y += 2; p.onGround = false; p.jumpBuf = 0; }
    else if (p.onGround || p.coyote > 0) { p.vy = -st.jump; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; SFX.jump(); }
    else if (p.airJ > 0) { p.airJ--; p.vy = -st.jump * 0.88; p.jumpBuf = 0; SFX.jump(); burst(p.x + p.w / 2, p.y + p.h, '#fff', 8, 120); }
  }
  // Regenbogen zum Absturz bringen
  if (p.onRainbow && c.hit('d')) { crashRainbow(p.onRainbow); p.onRainbow = null; p.onGround = false; }
  if (c.hit('fire') && p.fireT <= 0) { shootRainbow(p); p.fireT = st.fireCd; }
  if (c.hit('bomb')) placeBomb(p);

  p.vy += GRAV * dt * (!c.down('jump') && p.vy < -150 ? 2.2 : 1);
  p.vy = Math.min(MAXFALL, p.vy);
  moveEntity(p, dt, true, true);
  p.anim += Math.abs(p.vx) * dt;
  collectDots(p);
  for (const k of pickups) if (!k.dead && ov(p, k)) takePickup(p, k);
}

// ================== Physik ==================
function moveEntity(e, dt, platforms, rbs) {
  e.hitWall = 0;
  const dx = e.vx * dt;
  if (dx) {
    e.x += dx;
    const y0 = Math.floor(e.y / TS), y1 = Math.floor((e.y + e.h - 0.01) / TS);
    if (dx > 0) {
      const tx = Math.floor((e.x + e.w) / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { e.x = tx * TS - e.w - 0.01; e.vx = 0; e.hitWall = 1; break; }
    } else {
      const tx = Math.floor(e.x / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { e.x = (tx + 1) * TS + 0.01; e.vx = 0; e.hitWall = -1; break; }
    }
  }
  const oldB = e.y + e.h, dy = e.vy * dt;
  e.wasGround = e.onGround;
  e.y += dy; e.onGround = false; e.onRainbow = null;
  const x0 = Math.floor(e.x / TS), x1 = Math.floor((e.x + e.w - 0.01) / TS);
  if (dy >= 0) {
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (t === 1 || t === 3 || (t === 2 && platforms && (e.dropT || 0) <= 0 && oldB <= ty * TS + 0.5)) {
        e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; e.groundType = t === 2 ? 'plat' : 'solid'; break;
      }
    }
    if (rbs) {
      const fx = e.x + e.w / 2;
      for (const r of rainbows) {
        if (r.crash || r.grow < 1) continue;
        const sy = rbSurface(r, fx);
        if (sy === null) continue;
        if (oldB <= sy + (e.wasGround ? 16 : 10) && e.y + e.h >= sy) { e.y = sy - e.h; e.vy = 0; e.onGround = true; e.groundType = 'rainbow'; e.onRainbow = r; break; }
      }
    }
  } else {
    const ty = Math.floor(e.y / TS);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; break; }
  }
}

// ================== Regenbögen ==================
function shootRainbow(p) {
  SFX.rainbow();
  for (let k = 0; k < p.st.rbCount; k++) {
    const rx = (72 + k * 30) * p.st.rbSize, ry = (50 + k * 24) * p.st.rbSize;
    const cx = p.x + p.w / 2 + p.facing * (rx - 2);
    rainbows.push({ cx, by: p.y + p.h, rx, ry, dir: p.facing, grow: 0, life: 4.5, crash: false, vy: 0, fallen: 0, hit: new Set(), owner: p, dmg: p.st.rbDmg * p.st.dmg, formDone: false });
  }
  const mine = rainbows.filter(r => r.owner === p);
  let extra = mine.length - 5 * p.st.rbCount;
  for (let i = 0; i < rainbows.length && extra > 0; i++) if (rainbows[i].owner === p) { rainbows.splice(i, 1); i--; extra--; }
}
function rbSurface(r, x) {
  const dx = (x - r.cx) / r.rx;
  if (Math.abs(dx) > 0.985) return null;
  return r.by - r.ry * Math.sqrt(1 - dx * dx);
}
function crashRainbow(r) { if (r.crash) return; r.crash = true; r.vy = -120; r.hit = new Set(); r.life = Math.max(r.life, 2); SFX.rainbow(); }
function rbHitsEnemy(r, e, upto) {
  if (e.x > r.cx + r.rx + 10 || e.x + e.w < r.cx - r.rx - 10 || e.y > r.by + 10 || e.y + e.h < r.by - r.ry - 14) return false;
  for (let s = 0; s <= upto + 0.001; s += 0.04) {
    const th = r.dir > 0 ? Math.PI + s * Math.PI : 2 * Math.PI - s * Math.PI;
    const px = r.cx + (r.rx - 8) * Math.cos(th), py = r.by + (r.ry - 8) * Math.sin(th);
    if (px > e.x - 7 && px < e.x + e.w + 7 && py > e.y - 7 && py < e.y + e.h + 7) return true;
  }
  return false;
}
function updateRainbows(dt) {
  for (let i = rainbows.length - 1; i >= 0; i--) {
    const r = rainbows[i];
    r.life -= dt;
    if (!r.crash) {
      const g0 = r.grow;
      r.grow = Math.min(1, r.grow + dt * 4.5);
      if (!r.formDone) {
        for (const e of enemies) if (!e.dead && e.spawnT <= 0 && !r.hit.has(e) && rbHitsEnemy(r, e, r.grow)) { r.hit.add(e); damageEnemy(e, r.dmg, r.owner); }
        if (g0 >= 1) r.formDone = true;
      }
    } else {
      r.vy = Math.min(MAXFALL, r.vy + GRAV * dt);
      r.by += r.vy * dt; r.fallen += Math.max(0, r.vy * dt);
      for (const e of enemies) if (!e.dead && !r.hit.has(e) && rbHitsEnemy(r, e, 1)) { r.hit.add(e); damageEnemy(e, r.dmg * 2, r.owner); burst(e.x + e.w / 2, e.y + e.h / 2, pick(RB_COLORS), 10, 200); }
      if ((r.fallen > 40 && solidAt(Math.floor(r.cx / TS), Math.floor(r.by / TS))) || r.by > WH) {
        for (let k = 0; k < 6; k++) burst(r.cx + (k - 2.5) * r.rx / 3, r.by - 10, RB_COLORS[k], 5, 160);
        rainbows.splice(i, 1); continue;
      }
    }
    if (r.life <= 0) rainbows.splice(i, 1);
  }
}

// ================== Bomben ==================
function placeBomb(p) {
  if (bombs.filter(b => b.owner === p).length >= p.st.bombs) return;
  const tx = Math.floor((p.x + p.w / 2) / TS), ty = Math.floor((p.y + p.h - 1) / TS);
  if (solidAt(tx, ty)) return;
  if (bombs.some(b => Math.floor(b.x / TS) === tx && Math.floor(b.y / TS) === ty)) return;
  bombs.push({ x: tx * TS + TS / 2, y: ty * TS + TS / 2, vy: 0, t: 2.2, owner: p, range: p.st.range, dmg: 3 * p.st.dmg });
  SFX.bomb();
}
function updateBombs(dt) {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.t -= dt;
    // fallen bis Boden
    const ty = Math.floor((b.y + TS / 2) / TS), tx = Math.floor(b.x / TS);
    const below = tileAt(tx, ty);
    const standing = below && Math.abs((b.y + TS / 2) - ty * TS) < 0.5;
    if (!standing) {
      const oldB = b.y + TS / 2;
      b.vy = Math.min(MAXFALL, b.vy + GRAV * dt); b.y += b.vy * dt;
      const nty = Math.floor((b.y + TS / 2) / TS);
      for (let yy = Math.floor(oldB / TS); yy <= nty; yy++) {
        if (tileAt(tx, yy) && oldB <= yy * TS + 0.5) { b.y = yy * TS - TS / 2; b.vy = 0; break; }
      }
    }
    if (b.t <= 0) { bombs.splice(i, 1); explode(b); }
  }
}
function explode(b) {
  const tx = Math.floor(b.x / TS), ty = Math.floor(b.y / TS);
  SFX.boom(); shake = Math.max(shake, 0.35);
  const ex = { owner: b.owner, dmg: b.dmg, hitE: new Set(), hitP: new Set() };
  addFlame(tx, ty, ex, 0);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    for (let k = 1; k <= b.range; k++) {
      const x = tx + dx * k, y = ty + dy * k, t = tileAt(x, y);
      if (t === 1) break;
      if (t === 3) { destroyBrick(x, y); addFlame(x, y, ex, k); break; }
      addFlame(x, y, ex, k);
    }
  }
}
function addFlame(tx, ty, ex, k) { flames.push({ tx, ty, ex, t: 0.55, delay: k * 0.025 }); }
function destroyBrick(x, y) {
  L.t[y][x] = 0; drawTile(x, y);
  const cx = x * TS + TS / 2, cy = y * TS + TS / 2;
  for (let i = 0; i < 10; i++) particles.push({ x: cx, y: cy, vx: (R() - 0.5) * 300, vy: -R() * 300, life: 0.8, max: 0.8, c: R() < 0.5 ? '#b8582c' : '#e8b089', s: 5, g: 1 });
  if (R() < 0.28) spawnPickup(cx, cy, R() < 0.22 ? 'heart' : 'fruit');
}
function updateFlames(dt) {
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    if (f.delay > 0) { f.delay -= dt; continue; }
    f.t -= dt;
    if (f.t <= 0) { flames.splice(i, 1); continue; }
    if (f.t < 0.1) continue;
    const box = { x: f.tx * TS + 4, y: f.ty * TS + 4, w: TS - 8, h: TS - 8 };
    for (const e of enemies) if (!e.dead && !f.ex.hitE.has(e) && ov(box, e)) { f.ex.hitE.add(e); damageEnemy(e, f.ex.dmg, f.ex.owner); }
    for (const p of P) if (!p.dead && !p.out && !p.st.fireproof && !f.ex.hitP.has(p) && ov(box, p)) { f.ex.hitP.add(p); hurtPlayer(p, f.tx * TS + TS / 2); }
    for (const b of bombs) if (Math.floor(b.x / TS) === f.tx && Math.floor(b.y / TS) === f.ty) b.t = Math.min(b.t, 0.06);
  }
}

// ================== Gegner ==================
const ETYPES = {
  walker: { w: 26, h: 22, hp: 2, spd: 70, score: 100, color: '#ff4d6d' },
  hopper: { w: 24, h: 24, hp: 3, spd: 0, score: 150, color: '#4fd84f' },
  ghost: { w: 26, h: 28, hp: 3, spd: 52, score: 200, color: '#ff6ad5' },
  brute: { w: 34, h: 32, hp: 7, spd: 48, score: 400, color: '#8a5cff' },
  bat: { w: 26, h: 16, hp: 2, spd: 95, score: 250, color: '#6a3a8a' },
};
const GHOST_COLORS = ['#ff4b4b', '#ff8ad8', '#3fe8ff', '#ffaa3f'];
function spawnEnemy(px, py) {
  const st = game.stage;
  const pool = ['walker', 'walker', 'hopper', 'ghost'];
  if (st >= 2) pool.push('ghost', 'hopper');
  if (st >= 3) pool.push('brute');
  if (st >= 4) pool.push('bat', 'bat');
  if (st >= 6) pool.push('brute', 'ghost');
  const type = pick(pool), d = ETYPES[type];
  const hpMul = 1 + 0.3 * (st - 1), spMul = Math.min(1.8, 1 + 0.07 * (st - 1));
  const e = { type, x: px - d.w / 2, y: py - d.h, w: d.w, h: d.h, vx: 0, vy: 0, hp: d.hp * hpMul, maxHp: d.hp * hpMul, spd: d.spd * spMul,
    score: d.score, color: type === 'ghost' ? pick(GHOST_COLORS) : d.color, dir: R() < 0.5 ? -1 : 1, t: R() * 2, think: 1, onGround: false,
    flash: 0, thornT: 0, spawnT: 0.6, dead: false, willDrop: undefined };
  enemies.push(e);
}
function nearestPlayer(e) {
  let best = null, bd = 1e9;
  for (const p of P) {
    if (p.dead || p.out) continue;
    const d = Math.hypot(p.x - e.x, p.y - e.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function damageEnemy(e, dmg, by) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.12;
  if (e.hp <= 0) killEnemy(e, by, false);
  else SFX.pick();
}
function killEnemy(e, by, eaten) {
  e.dead = true;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  let pts = e.score * (1 + 0.15 * (game.stage - 1));
  if (eaten) { pts = 200 * Math.pow(2, Math.min(4, game.powerChain)); game.powerChain++; SFX.eat(); }
  else SFX.kill();
  addScore(pts, by, cx, cy - 10);
  burst(cx, cy, eaten ? '#9fb0ff' : e.color, 22, 240);
  if (R() < 0.22) spawnPickup(cx, cy, R() < 0.18 ? 'heart' : 'fruit');
}
function updateEnemy(e, dt) {
  e.flash -= dt; e.thornT -= dt; e.t += dt;
  if (e.spawnT > 0) { e.spawnT -= dt; return; }
  const fr = game.power > 0, tgt = nearestPlayer(e);
  const spd = e.spd * (fr ? 0.55 : 1);
  if (e.type === 'walker' || e.type === 'brute') {
    if (e.onGround) {
      const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      const ahead = tileAt(Math.floor(fx / TS), Math.floor((e.y + e.h + 4) / TS));
      if (!ahead) { if (e.willDrop === undefined) e.willDrop = R() < 0.3; if (!e.willDrop) e.dir *= -1; }
      else e.willDrop = undefined;
      e.think -= dt;
      if (e.think <= 0) {
        e.think = 1.2 + R() * 2;
        if (tgt && Math.abs((tgt.y + tgt.h) - (e.y + e.h)) < 48) { const want = Math.sign(tgt.x - e.x) || 1; e.dir = fr ? -want : want; }
      }
      e.vx = e.dir * spd;
    }
    e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
    moveEntity(e, dt, true, false);
    if (e.hitWall) e.dir = -e.hitWall;
  } else if (e.type === 'hopper') {
    if (e.onGround) {
      e.vx *= 0.85;
      e.think -= dt;
      if (e.think <= 0) {
        e.think = 1.0 + R() * 1.2;
        const s = tgt ? (Math.sign(tgt.x - e.x) || 1) : e.dir;
        e.vy = -(480 + R() * 300); e.vx = (fr ? -s : s) * (110 + R() * 70) * Math.min(1.6, 1 + 0.06 * (game.stage - 1));
      }
    }
    e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
    moveEntity(e, dt, true, false);
    if (e.hitWall) e.vx = -e.hitWall * 60;
  } else {
    // fliegende Gegner: Geister & Fledermäuse, fliegen durch alles
    let dx, dy;
    if (tgt) { dx = tgt.x + tgt.w / 2 - (e.x + e.w / 2); dy = tgt.y + tgt.h / 2 - (e.y + e.h / 2); }
    else { dx = Math.cos(e.t * 0.5) * 100; dy = Math.sin(e.t * 0.7) * 100; }
    const d = Math.hypot(dx, dy) || 1, s = fr ? -0.8 : 1;
    let tvx = dx / d * spd * s, tvy = dy / d * spd * s;
    if (e.type === 'bat') { tvx += -dy / d * Math.sin(e.t * 4) * 70; tvy += dx / d * Math.sin(e.t * 4) * 70; }
    const k = Math.min(1, dt * (e.type === 'bat' ? 2.5 : 1.2));
    e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
    e.x += e.vx * dt; e.y += (e.vy + Math.sin(e.t * 3) * 18) * dt;
    e.x = clamp(e.x, TS, WW - TS - e.w); e.y = clamp(e.y, TS, WH - TS - e.h);
    if (Math.abs(e.vx) > 5) e.dir = Math.sign(e.vx);
  }
}
function updateSpawning(dt) {
  game.spawnT -= dt;
  if (enemies.length + portalFx.length < game.maxE && game.spawnT <= 0) {
    game.spawnT = Math.max(1.1, 3.6 - game.stage * 0.25) * (game.initial > 0 ? 0.25 : 1);
    if (game.initial > 0) game.initial--;
    const ok = L.portals.filter(pt => P.every(p => p.dead || p.out || Math.hypot(p.x - pt.x, p.y - pt.y) > 220));
    const pt = pick(ok.length ? ok : L.portals);
    portalFx.push({ x: pt.x, y: pt.y, t: 1 });
  }
  for (let i = portalFx.length - 1; i >= 0; i--) {
    const f = portalFx[i]; f.t -= dt;
    if (f.t <= 0) { portalFx.splice(i, 1); spawnEnemy(f.x, f.y); }
  }
}
function contacts() {
  for (const e of enemies) {
    if (e.dead || e.spawnT > 0) continue;
    for (const p of P) {
      if (p.dead || p.out || e.dead) continue;
      const pb = { x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 4 };
      if (!ov(pb, e)) continue;
      if (game.power > 0) { killEnemy(e, p, true); continue; }
      // Draufspringen
      if (p.vy > 120 && p.y + p.h - e.y < 16) {
        p.vy = -460; damageEnemy(e, 1 * p.st.dmg, p); burst(p.x + p.w / 2, p.y + p.h, '#fff', 8, 140); continue;
      }
      hurtPlayer(p, e.x + e.w / 2);
      if (p.st.thorns && e.thornT <= 0) { e.thornT = 0.5; damageEnemy(e, p.st.thorns * 1.5 * p.st.dmg, p); }
    }
  }
}

// ================== Punkte, Items ==================
function collectDots(p) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2, rad = 18 + p.st.magnet, r2 = rad * rad;
  const x0 = Math.max(1, Math.floor((cx - rad) / TS)), x1 = Math.min(GW - 2, Math.floor((cx + rad) / TS));
  const y0 = Math.max(1, Math.floor((cy - rad) / TS)), y1 = Math.min(GH - 2, Math.floor((cy + rad) / TS));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const d = L.dots[ty][tx]; if (!d) continue;
    const dx = tx * TS + TS / 2 - cx, dy = ty * TS + TS / 2 - cy;
    if (dx * dx + dy * dy > r2) continue;
    L.dots[ty][tx] = 0; L.dotCount--;
    if (p.st.magnet && dx * dx + dy * dy > 400) particles.push({ x: tx * TS + 16, y: ty * TS + 16, tp: p, life: 0.5, max: 0.5, c: '#fff6a8', s: 4 });
    if (d === 1) {
      addScore(10, p);
      if (game.time - dotSfxT > 0.06) { SFX.dot(); dotSfxT = game.time; }
    } else {
      addScore(50, p, tx * TS + 16, ty * TS);
      game.power = 8 * p.st.pellet; game.powerMax = game.power; game.powerChain = 0; SFX.pellet();
      floatText(tx * TS + 16, ty * TS - 16, 'POWER!', '#8cf');
    }
  }
  if (L.dotCount <= 0 && S === 'play') stageClear();
}
function spawnPickup(x, y, kind) {
  pickups.push({ x: x - 11, y: y - 11, w: 22, h: 22, vx: (R() - 0.5) * 120, vy: -300, kind, life: 12, dead: false,
    icon: FRUITS[(game.stage - 1 + ri(0, 2)) % FRUITS.length], val: 300 + game.stage * 100 });
}
function takePickup(p, k) {
  k.dead = true; SFX.pick();
  if (k.kind === 'heart') {
    if (p.hp < p.maxHp) { p.hp++; floatText(k.x + 11, k.y, '+1 ❤', '#f8a'); }
    else addScore(250, p, k.x + 11, k.y);
  } else addScore(k.val, p, k.x + 11, k.y);
}
function updatePickups(dt) {
  for (const k of pickups) {
    k.life -= dt; if (k.life <= 0) k.dead = true;
    k.vy = Math.min(MAXFALL, k.vy + GRAV * dt);
    if (k.onGround) k.vx *= 0.9;
    moveEntity(k, dt, true, false);
  }
  pickups = pickups.filter(k => !k.dead);
}
function addScore(n, p, x, y) {
  const v = Math.round(n * (p ? p.st.score : 1));
  game.score += v;
  if (x !== undefined) floatText(x, y, '+' + v, '#fff');
  while (game.score >= game.next) {
    game.level++; game.prevNeed = game.next; game.next += 700 + 450 * game.level; game.pendingLevels++;
  }
}
function floatText(x, y, txt, c) { texts.push({ x, y, txt, c, t: 1.1 }); }
function burst(x, y, c, n, sp) {

function update(dt) {
  readPads();

  for (const p of P) p.ctrl.poll();
  if (S === 'play') {
    const m = menuEdge();

      const i = menu.sel === 'p1' ? 0 : 1;

  const x0 = Math.max(0, Math.floor(cam.x / TS)), x1 = Math.min(GW - 1, Math.ceil((cam.x + vw) / TS));
  const y0 = Math.max(0, Math.floor(cam.y / TS)), y1 = Math.min(GH - 1, Math.ceil((cam.y + vh) / TS));
  const srcX = x0 * TS, srcY = y0 * TS, srcW = (x1 - x0 + 1) * TS, srcH = (y1 - y0 + 1) * TS;
  ctx.drawImage(lvlCv, srcX, srcY, srcW, srcH, srcX, srcY, srcW, srcH);
  // Punkte
  ctx.fillStyle = '#fff6a8'; ctx.strokeStyle = 'rgba(80,40,0,.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  const pel = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = L.dots[y][x];
    if (d === 1) { const px = x * TS + 16, py = y * TS + 18; ctx.moveTo(px + 4, py); ctx.arc(px, py, 4, 0, 7); }
    else if (d === 2) pel.push([x, y]);
  }
  ctx.fill(); ctx.stroke();
  for (const [x, y] of pel) {
    const pr = 9 + Math.sin(game.time * 6) * 2, px = x * TS + 16, py = y * TS + 16;
    ctx.fillStyle = 'rgba(140,200,255,.35)'; ctx.beginPath(); ctx.arc(px, py, pr + 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
    ctx.fillStyle = '#8cf'; ctx.beginPath(); ctx.arc(px, py, pr * 0.55, 0, 7); ctx.fill();
  }
  // Portale
  for (const f of portalFx) {
    const s = 1 - f.t;
    ctx.save(); ctx.translate(f.x, f.y - 16); ctx.rotate(game.time * 6);
    ctx.strokeStyle = '#c04aff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.ellipse(0, 0, 18 * s + 4, 12 * s + 3, 0, 0, 5); ctx.stroke();
    ctx.strokeStyle = '#ff8ae0'; ctx.beginPath(); ctx.ellipse(0, 0, 10 * s + 2, 7 * s + 2, 0, 1, 6); ctx.stroke();
    ctx.restore();
  }
  for (const k of pickups) {
    if (k.life < 3 && Math.floor(k.life * 8) % 2) continue;
    const bob = Math.sin(game.time * 5 + k.x) * 2;
    if (k.kind === 'heart') heart(k.x + 11, k.y + 12 + bob, 22, '#ff3b6b', '#fff');
    else { ctx.font = '22px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k.icon, k.x + 11, k.y + 12 + bob); }
  }
  for (const r of rainbows) drawRainbow(r);
  for (const b of bombs) drawBomb(b);
  for (const e of enemies) drawEnemy(e);
  for (const p of P) drawPlayer(p);
  drawFlames();
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life / (q.max * 0.5)));
    ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t * 2); txt(t.txt, t.x, t.y, 14, t.c, 'center', 900); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawPlayerHUD(p, v) {
  const hw = Math.max(230, 92 + p.maxHp * 22);
  const x = (P.length > 1 && p.i === 1) ? v.x + v.w - hw - 12 : v.x + 12, y = v.y + 10;
  ctx.fillStyle = 'rgba(10,8,30,.7)'; rr(x, y, hw, 40, 10); ctx.fill();
  drawBlob(x + 20, y + 21, 11, p.color, p.color2, 1, p.i);
  for (let i = 0; i < p.maxHp; i++) heart(x + 46 + i * 22, y + 15, 18, i < p.hp ? '#ff3b6b' : 'rgba(255,255,255,.18)', i < p.hp ? '#fff' : null);
  txt('×' + p.lives, x + 46, y + 31, 12, '#fff', 'left', 800, false);
  const nb = p.st.bombs - bombs.filter(b => b.owner === p).length;
  txt('💣' + nb + '/' + p.st.bombs, x + 82, y + 31, 12, '#fff', 'left', 700, false);
  txt('🔥' + p.st.range, x + 140, y + 31, 12, '#fff', 'left', 700, false);
  if (p.st.shieldCd) txt(p.shield ? '🛡️' : '⏳', x + 180, y + 31, 12, '#fff', 'left', 700, false);
  if (p.dead && !p.out) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(v.x, v.y + v.h / 2 - 40, v.w, 80); txt('Gleich geht\'s weiter … ' + Math.ceil(p.respawn), v.x + v.w / 2, v.y + v.h / 2, 28, '#fff'); }
  if (p.out && P.length > 1 && S !== 'gameover') { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(v.x, v.y + v.h / 2 - 50, v.w, 100); txt(p.name + ' ist raus', v.x + v.w / 2, v.y + v.h / 2 - 12, 30, '#f88'); txt('Kommt in der nächsten Welt zurück!', v.x + v.w / 2, v.y + v.h / 2 + 22, 18, '#fff'); }
}
function drawTopHUD() {
  const w = 500, x = VW / 2 - w / 2, y = 6, h = 52;
  ctx.fillStyle = 'rgba(10,8,30,.78)'; rr(x, y, w, h, 12); ctx.fill();
  txt('WELT ' + game.stage, x + 16, y + 18, 16, '#9fe', 'left', 900, false);
  txt('● ' + L.dotCount, x + 16, y + 38, 14, '#fff6a8', 'left', 800, false);
  txt(String(game.score).padStart(7, '0'), VW / 2, y + 22, 26, '#fff', 'center', 900, false);
  txt('LEVEL ' + game.level, x + w - 16, y + 18, 16, '#ffcf4a', 'right', 900, false);
  const bw = 150, bx = x + w - 16 - bw, by = y + 34;
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(bx, by, bw, 9, 4); ctx.fill();
  const f = clamp((game.score - game.prevNeed) / (game.next - game.prevNeed), 0, 1);
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0); RB_COLORS.forEach((c, i) => gg.addColorStop(i / 5, c));
  ctx.fillStyle = gg; rr(bx, by, Math.max(4, bw * f), 9, 4); ctx.fill();
  txt('nächstes Level: ' + game.next, VW / 2, y + 44, 11, 'rgba(255,255,255,.6)', 'center', 600, false);
  if (game.power > 0) {
    const pw = 300 * game.power / game.powerMax;
    ctx.fillStyle = 'rgba(10,8,30,.7)'; rr(VW / 2 - 154, y + h + 4, 308, 14, 7); ctx.fill();
    ctx.fillStyle = Math.floor(game.time * 8) % 2 && game.power < 2 ? '#fff' : '#4a6bff'; rr(VW / 2 - 150, y + h + 7, pw, 8, 4); ctx.fill();
    txt('POWER – Gegner fressen!', VW / 2, y + h + 28, 13, '#8cf', 'center', 900);
  }
}
function drawLevelUp(p, v) {
  const ch = p.choice;
  ctx.fillStyle = 'rgba(8,4,24,.72)'; ctx.fillRect(v.x, v.y, v.w, v.h);
  const cx = v.x + v.w / 2;
  if (!ch) { txt('Warte …', cx, v.y + v.h / 2, 26, '#fff'); return; }
  txt('LEVEL UP!', cx, v.y + 130, 48, '#ffcf4a');
  txt((P.length > 1 ? p.name + ': ' : '') + 'Wähle ein Upgrade', cx, v.y + 178, 20, '#fff', 'center', 700);
  if (ch.done) { txt('✔ Gewählt – warte auf Mitspieler …', cx, v.y + v.h / 2 + 20, 22, '#8f8'); return; }
  const n = ch.opts.length, cw = Math.min(200, (v.w - 60) / 3 - 14), chh = 250, gap = 14;
  const total = n * cw + (n - 1) * gap;
  for (let i = 0; i < n; i++) {
    const u = ch.opts[i], sel = i === ch.sel;
    const x = cx - total / 2 + i * (cw + gap), y = v.y + 220 - (sel ? 10 : 0);
    ctx.save();
    if (sel) { ctx.shadowColor = '#ffcf4a'; ctx.shadowBlur = 25; }
    ctx.fillStyle = sel ? '#3a2a7a' : '#221a4a'; rr(x, y, cw, chh, 16); ctx.fill();
    ctx.restore();
    ctx.lineWidth = sel ? 4 : 2; ctx.strokeStyle = sel ? '#ffcf4a' : 'rgba(255,255,255,.25)'; rr(x, y, cw, chh, 16); ctx.stroke();
    ctx.font = '52px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(u.icon, x + cw / 2, y + 58);
    txt(u.name, x + cw / 2, y + 116, cw < 180 ? 16 : 18, '#fff', 'center', 900, false);
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.8)';
    wrapText(u.desc, x + cw / 2, y + 150, cw - 22, 19);
    const lv = p.upg[u.id] || 0;
    txt('Stufe ' + lv + ' → ' + (lv + 1) + ' / ' + u.max, x + cw / 2, y + chh - 22, 13, '#ffcf4a', 'center', 800, false);
  }
  const dev = p.ctrl.dev;
  const hint = dev.startsWith('pad') ? '◀ ▶ wählen · A bestätigen' : dev.startsWith('kb1') ? 'A / D wählen · F oder Leertaste bestätigen' : '← → wählen · K oder ↑ bestätigen';
  txt(hint, cx, v.y + 520, 15, 'rgba(255,255,255,.75)', 'center', 700);
}
function drawGame() {
  const vs = viewsList();
  for (const v of vs) drawWorld(v);
  if (vs.length > 1) { ctx.fillStyle = '#0b0820'; ctx.fillRect(VW / 2 - 2, 0, 4, VH); }
  for (const v of vs) drawPlayerHUD(P[v.i], v);
  drawTopHUD();
  if (game.banner > 0 && S === 'play') {
    ctx.globalAlpha = Math.min(1, game.banner);
    txt('WELT ' + game.stage, VW / 2, VH / 2 - 30, 64, '#fff');
    txt(TH.name, VW / 2, VH / 2 + 25, 26, '#ffcf4a');
    txt('Friss alle Punkte!', VW / 2, VH / 2 + 62, 18, '#fff', 'center', 700);
    ctx.globalAlpha = 1;
  }
  if (S === 'levelup') for (const v of vs) drawLevelUp(P[v.i], v);
  if (S === 'stageclear') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, VH / 2 - 80, VW, 160);
    txt('WELT ' + game.stage + ' GESCHAFFT!', VW / 2, VH / 2 - 20, 56, '#ffcf4a');
    txt('Bonus +' + 500 * game.stage, VW / 2, VH / 2 + 36, 26, '#fff');
  }
  if (S === 'pause') {
    ctx.fillStyle = 'rgba(8,4,24,.75)'; ctx.fillRect(0, 0, VW, VH);
    txt('PAUSE', VW / 2, 200, 64, '#fff');
    ['Weiter spielen', 'Zum Hauptmenü'].forEach((s, i) => txt((pauseSel === i ? '▶ ' : '') + s, VW / 2, 300 + i * 50, 28, pauseSel === i ? '#ffcf4a' : '#aaa'));
    drawControls(VW / 2, 470);
  }
  if (S === 'gameover') {
    ctx.fillStyle = 'rgba(8,4,24,' + Math.min(0.8, stateT) + ')'; ctx.fillRect(0, 0, VW, VH);
    txt('GAME OVER', VW / 2, 220, 80, '#ff4b6b');
    txt('Punkte: ' + game.score, VW / 2, 320, 34, '#fff');
    txt('Welt ' + game.stage + ' · Level ' + game.level, VW / 2, 365, 24, '#ffcf4a');
    txt((game.score >= HI ? '★ Neuer Rekord! ★' : 'Rekord: ' + HI), VW / 2, 415, 24, '#9fe');
    if (stateT > 1.5) txt('Drücke Enter / A für das Menü', VW / 2, 520, 20, '#fff', 'center', 700);
  }
}
function drawControls(cx, y) {
  const lines = [
    ['Tastatur 1', 'A/D laufen · W/Leertaste springen · F Regenbogen · G Bombe · Esc Pause'],
    ['Tastatur 2', '←/→ laufen · ↑ springen · K (Num1) Regenbogen · L (Num2) Bombe · P Pause'],
    ['Gamepad', 'Stick/Steuerkreuz · A springen · X/RB Regenbogen · B/LB Bombe · Start Pause'],
    ['Tricks', 'Unten + Springen = durch Plattform fallen · Auf Regenbogen stehen + Unten = Regenbogen stürzt ab'],
  ];
  ctx.fillStyle = 'rgba(10,8,30,.6)'; rr(cx - 470, y - 22, 940, lines.length * 28 + 20, 12); ctx.fill();
  lines.forEach(([a, b], i) => {
    txt(a, cx - 450, y + i * 28, 15, '#ffcf4a', 'left', 900, false);
    txt(b, cx - 340, y + i * 28, 15, '#fff', 'left', 600, false);
  });
}
function drawMenu() {
  const t = menu.t;
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#1a1050'); g.addColorStop(1, '#5a2a8a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // Deko-Regenbögen
  for (let k = 0; k < 3; k++) {
    const cx = 200 + k * 440 + Math.sin(t * 0.5 + k) * 30, by = VH + 40;
    ctx.globalAlpha = 0.25; ctx.lineWidth = 10;
    for (let i = 0; i < 6; i++) { ctx.strokeStyle = RB_COLORS[i]; ctx.beginPath(); ctx.ellipse(cx, by, 260 - i * 10, 200 - i * 10, 0, Math.PI, 2 * Math.PI); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 40; i++) { const x = (i * 97 + t * 30) % VW, y = (i * 53) % 300 + 20; ctx.fillStyle = 'rgba(255,246,168,.6)'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
  // Titel
  ctx.save();
  ctx.font = '900 76px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(VW / 2 - 450, 0, VW / 2 + 450, 0);
  RB_COLORS.forEach((c, i) => tg.addColorStop(((i / 6) + t * 0.1) % 1, c));
  ctx.lineWidth = 12; ctx.strokeStyle = '#1a0830'; ctx.lineJoin = 'round';
  const ty = 90 + Math.sin(t * 2) * 4;
  ctx.strokeText('REGENBOGEN-RABAUKEN', VW / 2, ty); ctx.fillStyle = tg; ctx.fillText('REGENBOGEN-RABAUKEN', VW / 2, ty);
  ctx.restore();
  txt('Punkte fressen · Regenbögen schießen · Bomben legen', VW / 2, 150, 20, '#fff', 'center', 700);
  drawBlob(VW / 2 - 120, 205 + Math.abs(Math.sin(t * 4)) * -12, 22, '#ffb020', '#c85a00', 1, 0);
  drawBlob(VW / 2 + 120, 205 + Math.abs(Math.sin(t * 4 + 1)) * -12, 22, '#3fe0ff', '#1a7fa0', -1, 1);

  const items = menu.mode === 2 ? ['mode', 'p1', 'p2', 'start'] : ['mode', 'p1', 'start'];
  const label = id => id === 'mode' ? 'Spieler: ' + (menu.mode === 1 ? '1 Spieler' : '2 Spieler (geteilter Bildschirm)')
    : id === 'p1' ? 'Spieler 1: ' + DEVICES.find(d => d.id === menu.dev[0]).name
    : id === 'p2' ? 'Spieler 2: ' + DEVICES.find(d => d.id === menu.dev[1]).name : '▶  SPIEL STARTEN  ◀';
  items.forEach((id, i) => {
    const y = 270 + i * 46, sel = menu.sel === id;
    if (sel) { ctx.fillStyle = 'rgba(255,207,74,.18)'; rr(VW / 2 - 330, y - 20, 660, 40, 10); ctx.fill(); }
    const s = id === 'start' ? label(id) : (sel ? '◀  ' : '') + label(id) + (sel ? '  ▶' : '');
    txt(s, VW / 2, y, id === 'start' ? 28 : 21, sel ? '#ffcf4a' : '#ddd', 'center', 800);
  });
  txt('Gamepads erkannt: ' + PADS.length + (PADS.length ? ' (' + PADS.map((p, i) => (i + 1) + ': ' + p.id.split('(')[0].trim().slice(0, 22)).join(', ') + ')' : ' – Taste am Pad drücken, um es zu aktivieren'),
    VW / 2, 470, 14, PADS.length ? '#8f8' : '#aaa', 'center', 600, false);
  drawControls(VW / 2, 530);
  txt('Ziel: Alle Punkte einer Welt fressen. Power-Pillen machen Gegner essbar. Punkte bringen Level-Ups – dann wählst du 1 von 3 Upgrades!', VW / 2, 668, 14, '#ccc', 'center', 600, false);
  txt('Rekord: ' + HI, VW / 2, 696, 14, '#9fe', 'center', 700, false);
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (S === 'menu') drawMenu(); else drawGame();
}

// ================== Hauptschleife ==================
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  let d = (now - last) / 1000; last = now;
  if (d > 0.25) d = 0.25;
  acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; for (const k in keyLatch) delete keyLatch[k]; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
