function hash(x, y, i = 0) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(i, 1442695041) + (L ? L.seed : 0)) | 0;

}

let AC = null;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.08, slide = 0) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
let noiseBuf = null;
function noise(d, v = 0.3) {
  if (!AC) return;
  if (!noiseBuf) {
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const dt = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) dt[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 800;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}

const EMPTY = () => ({ l: 0, r: 0, u: 0, d: 0, jump: 0, fire: 0, bomb: 0, start: 0 });
function kbState(set) {
  const k = keys;
  if (set === 1) return { l: k.KeyA, r: k.KeyD, u: k.KeyW, d: k.KeyS, jump: k.KeyW || k.Space, fire: k.KeyF, bomb: k.KeyG, start: k.Escape };
  return { l: k.ArrowLeft, r: k.ArrowRight, u: k.ArrowUp, d: k.ArrowDown, jump: k.ArrowUp, fire: k.KeyK || k.Numpad1 || k.Period, bomb: k.KeyL || k.Numpad2 || k.Comma, start: k.KeyP };
}
function padState(i) {
  const s = EMPTY(), p = PADS[i];
  if (!p) return s;
  const b = j => p.buttons[j] && p.buttons[j].pressed;
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  s.l = ax < -0.4 || b(14); s.r = ax > 0.4 || b(15);
  s.u = ay < -0.55 || b(12); s.d = ay > 0.55 || b(13);
  s.jump = b(0); s.fire = b(2) || b(5) || b(7); s.bomb = b(1) || b(3) || b(4) || b(6); s.start = b(9);
  // Nicht-Standard-Pads (z. B. Thrustmaster): Steuerkreuz als "Hat"-Achse (meist Achse 9)
  const hv = p.mapping !== 'standard' ? p.axes[9] : undefined;
  if (hv !== undefined && hv >= -1.05 && hv <= 1.05) {
    const dir = Math.round((hv + 1) / (2 / 7)); // 0=hoch, 2=rechts, 4=runter, 6=links
    s.u = s.u || dir === 7 || dir === 0 || dir === 1;
    s.r = s.r || (dir >= 1 && dir <= 3);
    s.d = s.d || (dir >= 3 && dir <= 5);
    s.l = s.l || (dir >= 5 && dir <= 7);
  }
  for (const k in s) s[k] = !!s[k];
  return s;
}
const DEVICES = [
  { id: 'kb1+pad0', name: 'Tastatur WASD + Gamepad 1' },
  { id: 'kb2+pad1', name: 'Tastatur Pfeile + Gamepad 2' },
  { id: 'kb1', name: 'Tastatur WASD' },
  { id: 'kb2', name: 'Tastatur Pfeile' },
  { id: 'pad0', name: 'Gamepad 1' },

function devState(id) {
  const s = EMPTY();
  for (const part of id.split('+')) {
    const t = part === 'kb1' ? kbState(1) : part === 'kb2' ? kbState(2) : padState(+part[3]);
    for (const k in s) s[k] = s[k] || !!t[k];
  }
  return s;
}
class Ctrl {
  constructor(dev) { this.dev = dev; this.cur = devState(dev); this.prev = this.cur; }
  poll() { this.prev = this.cur; this.cur = devState(this.dev); }
  down(k) { return !!this.cur[k]; }
  hit(k) { return !!this.cur[k] && !this.prev[k]; }
}
function menuState() {
  const k = keys, s = { l: k.KeyA || k.ArrowLeft, r: k.KeyD || k.ArrowRight, u: k.KeyW || k.ArrowUp, d: k.KeyS || k.ArrowDown,
    ok: k.Enter || k.Space || k.KeyF || k.KeyK || k.NumpadEnter, back: k.Escape || k.KeyP };
  for (let i = 0; i < PADS.length; i++) {
    const p = padState(i);
    s.l = s.l || p.l; s.r = s.r || p.r; s.u = s.u || p.u; s.d = s.d || p.d;
    s.ok = s.ok || p.jump; s.back = s.back || p.start;
  }
  for (const key in s) s[key] = !!s[key];
  return s;
}
let menuPrev = {};
function menuEdge() {

}

const glowCache = {};

}

function resetScarf(h) { const ax = h.x + h.w / 2 - h.facing * 3, ay = h.y + h.h - 19; for (const q of h.scarf) { q.x = q.px = ax; q.y = q.py = ay; } }

function updatePlayer(p, dt) {

// ================== Physik ==================
function moveEntity(e, dt, platforms, rbs) {

  if (dx) {
    e.x += dx;
    const y0 = Math.floor(e.y / TS), y1 = Math.floor((e.y + e.h - 0.01) / TS);
    if (dx > 0) {
      const tx = Math.floor((e.x + e.w) / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { e.x = tx * TS - e.w - 0.01; e.vx = 0; e.hitWall = 1; break; }
    } else {
      const tx = Math.floor(e.x / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { e.x = (tx + 1) * TS + 0.01; e.vx = 0; e.hitWall = -1; break; }
    }
  }
  const oldB = e.y + e.h, dy = e.vy * dt;
  e.wasGround = e.onGround;
  e.y += dy; e.onGround = false; e.onRainbow = null;
  const x0 = Math.floor(e.x / TS), x1 = Math.floor((e.x + e.w - 0.01) / TS);
  if (dy >= 0) {
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (t === 1 || t === 3 || (t === 2 && platforms && (e.dropT || 0) <= 0 && oldB <= ty * TS + 0.5)) {
        e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; e.groundType = t === 2 ? 'plat' : 'solid'; break;
      }
    }
    if (rbs) {
      const fx = e.x + e.w / 2;
      for (const r of rainbows) {
        if (r.crash || r.grow < 1) continue;
        const sy = rbSurface(r, fx);
        if (sy === null) continue;
        if (oldB <= sy + (e.wasGround ? 16 : 10) && e.y + e.h >= sy) { e.y = sy - e.h; e.vy = 0; e.onGround = true; e.groundType = 'rainbow'; e.onRainbow = r; break; }
      }
    }
  } else {
    const ty = Math.floor(e.y / TS);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; break; }
  }
}

// ================== Regenbögen ==================
function shootRainbow(p) {
  SFX.rainbow();
  for (let k = 0; k < p.st.rbCount; k++) {
    const rx = (72 + k * 30) * p.st.rbSize, ry = (50 + k * 24) * p.st.rbSize;
    const cx = p.x + p.w / 2 + p.facing * (rx - 2);
    rainbows.push({ cx, by: p.y + p.h, rx, ry, dir: p.facing, grow: 0, life: 4.5, crash: false, vy: 0, fallen: 0, hit: new Set(), owner: p, dmg: p.st.rbDmg * p.st.dmg, formDone: false });
  }
  const mine = rainbows.filter(r => r.owner === p);
  let extra = mine.length - 5 * p.st.rbCount;
  for (let i = 0; i < rainbows.length && extra > 0; i++) if (rainbows[i].owner === p) { rainbows.splice(i, 1); i--; extra--; }
}

}

  for (let s = 0; s <= upto + 0.001; s += 0.04) {
    const [px, py] = rbPoint(r, s);
    if (px > e.x - 7 && px < e.x + e.w + 7 && py > e.y - 7 && py < e.y + e.h + 7) return true;

}
function updateRainbows(dt) {

}

// ================== Bomben ==================
function placeBomb(p) {

  const tx = Math.floor((p.x + p.w / 2) / TS), ty = Math.floor((p.y + p.h - 1) / TS);

      const nty = Math.floor((b.y + TS / 2) / TS);

function explode(b) {

    for (let k = 1; k <= b.range; k++) {
      const x = tx + dx * k, y = ty + dy * k, t = tileAt(x, y);

  particles.push({ type: 'flash', x: cx, y: cy, s: 50 + b.range * 20, life: 0.25, max: 0.25 });
  ring(cx, cy, 30 + b.range * TS, '#fff3c0');
  for (let i = 0; i < 18; i++) { const a = R() * 6.28, s = 150 + R() * 250; particles.push({ type: 'spark', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5, s: 3 + R() * 2, c: R() < 0.5 ? '#ffd84a' : '#ff7a2a', g: 0.6 }); }
}
function addFlame(tx, ty, ex, k) {
  flames.push({ tx, ty, ex, t: 0.55, delay: k * 0.025 });
  for (let i = 0; i < 2; i++) particles.push({ type: 'dust', x: tx * TS + 16 + (R() - 0.5) * 18, y: ty * TS + 16 + (R() - 0.5) * 18, vx: (R() - 0.5) * 40, vy: -20 - R() * 40, life: 0.8 + R() * 0.6, max: 1.4, s: 7 + R() * 5, c: 'rgba(70,60,80,1)', delay: 0.2 });
}
function destroyBrick(x, y) {

function updateFlames(dt) {
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    if (f.delay > 0) { f.delay -= dt; continue; }
    f.t -= dt;
    if (f.t <= 0) { flames.splice(i, 1); continue; }
    if (f.t < 0.1) continue;
    const box = { x: f.tx * TS + 4, y: f.ty * TS + 4, w: TS - 8, h: TS - 8 };
    for (const e of enemies) if (!e.dead && !f.ex.hitE.has(e) && ov(box, e)) { f.ex.hitE.add(e); damageEnemy(e, f.ex.dmg, f.ex.owner); }

    spawnT: 2, maxE: 4, initial: 0, banner: 0, cams: [] };

    if (c.hit('r')) { ch.sel = (ch.sel + 1) % ch.opts.length; SFX.menu(); }

function update(dt) {

  for (const p of P) p.ctrl.poll();

  txt('🔥' + p.st.range, x + 142, y + 35, 12, '#fff', 'left', 700, false);
  if (p.st.shieldCd) txt(p.shield ? '🛡️' : '⏳', x + 182, y + 35, 12, '#fff', 'left', 700, false);
  if (p.dead && !p.out) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(v.x, v.y + v.h / 2 - 40, v.w, 80); txt('Gleich geht\'s weiter … ' + Math.ceil(p.respawn), v.x + v.w / 2, v.y + v.h / 2, 28, '#fff'); }
  if (p.out && P.length > 1 && S !== 'gameover') { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(v.x, v.y + v.h / 2 - 50, v.w, 100); txt(p.name + ' ist raus', v.x + v.w / 2, v.y + v.h / 2 - 12, 30, '#f88'); txt('Kommt in der nächsten Welt zurück!', v.x + v.w / 2, v.y + v.h / 2 + 22, 18, '#fff'); }
}
function drawTopHUD() {
  const w = 500, x = VW / 2 - w / 2, y = 6, h = 54;
  panel(x, y, w, h);
  txt('WELT ' + game.stage, x + 16, y + 18, 16, '#9fe', 'left', 900, false);
  ctx.drawImage(COIN[(game.time * 8 | 0) & 7], x + 14, y + 30);
  txt('' + L.dotCount, x + 38, y + 40, 14, '#ffe58a', 'left', 800, false);
  txt(String(game.score).padStart(7, '0'), VW / 2, y + 23, 26, '#fff', 'center', 900, false);
  txt('LEVEL ' + game.level, x + w - 16, y + 18, 16, '#ffcf4a', 'right', 900, false);
  const bw = 150, bx = x + w - 16 - bw, by = y + 34;
  rr(bx - 1.5, by - 1.5, bw + 3, 12, 6); ctx.fillStyle = '#0a0418'; ctx.fill();
  const f = clamp((game.score - game.prevNeed) / (game.next - game.prevNeed), 0, 1);
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0); RB_COLORS.forEach((c, i) => gg.addColorStop(i / 5, c));

  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(bx + 3, by + 1, Math.max(0, bw * f - 6), 2);
  txt('nächstes Level: ' + game.next, VW / 2, y + 45, 11, 'rgba(255,255,255,.6)', 'center', 600, false);
  if (game.power > 0) {
    const pw = 300 * game.power / game.powerMax;
    panel(VW / 2 - 156, y + h + 4, 312, 16, 8);
    rr(VW / 2 - 150, y + h + 8, pw, 8, 4); ctx.fillStyle = Math.floor(game.time * 8) % 2 && game.power < 2 ? '#fff' : '#5a7bff'; ctx.fill();
    txt('POWER – Gegner fressen!', VW / 2, y + h + 32, 13, '#9df', 'center', 900);
  }
}
function drawLevelUp(p, v) {
  const ch = p.choice, t = now();
  ctx.fillStyle = 'rgba(8,4,24,.72)'; ctx.fillRect(v.x, v.y, v.w, v.h);
  const cx = v.x + v.w / 2;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25;
  for (let i = 0; i < 12; i++) { ctx.save(); ctx.translate(cx, v.y + 130); ctx.rotate(t * 0.3 + i * Math.PI / 6); ctx.fillStyle = '#ffcf4a'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, -400); ctx.lineTo(30, -400); ctx.fill(); ctx.restore(); }
  ctx.restore();
  if (!ch) { txt('Warte …', cx, v.y + v.h / 2, 26, '#fff'); return; }
  ctx.save(); ctx.translate(cx, v.y + 130); const sc = 1 + Math.sin(t * 4) * 0.04; ctx.scale(sc, sc); txt('LEVEL UP!', 0, 0, 52, '#ffcf4a'); ctx.restore();
  txt((P.length > 1 ? p.name + ': ' : '') + 'Wähle ein Upgrade', cx, v.y + 180, 20, '#fff', 'center', 700);
  if (ch.done) { txt('✔ Gewählt – warte auf Mitspieler …', cx, v.y + v.h / 2 + 20, 22, '#8f8'); return; }
  const n = ch.opts.length, cw = Math.min(200, (v.w - 60) / 3 - 14), chh = 250, gap = 14;
  const total = n * cw + (n - 1) * gap;
  for (let i = 0; i < n; i++) {
    const u = ch.opts[i], sel = i === ch.sel;
    const x = cx - total / 2 + i * (cw + gap), y = v.y + 222 - (sel ? 10 + Math.sin(t * 5) * 3 : 0);
    ctx.save();
    if (sel) { ctx.shadowColor = '#ffcf4a'; ctx.shadowBlur = 28; }
    rr(x, y, cw, chh, 16);
    const g = ctx.createLinearGradient(0, y, 0, y + chh); g.addColorStop(0, sel ? '#5a3aa8' : '#2c2058'); g.addColorStop(1, sel ? '#2a1a6a' : '#181034');
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    ctx.lineWidth = sel ? 4 : 2.5; ctx.strokeStyle = sel ? '#ffcf4a' : '#0a0418'; rr(x, y, cw, chh, 16); ctx.stroke();
    rr(x + 8, y + 12, cw - 16, 92, 12); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
    ctx.font = '52px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(u.icon, x + cw / 2, y + 58);
    txt(u.name, x + cw / 2, y + 122, cw < 180 ? 16 : 18, '#fff', 'center', 900, true);
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    wrapText(u.desc, x + cw / 2, y + 154, cw - 22, 19);
    const lv = p.upg[u.id] || 0;
    for (let k = 0; k < Math.min(u.max, 9); k++) {
      const dx = x + cw / 2 + (k - (Math.min(u.max, 9) - 1) / 2) * 12;
      ctx.beginPath(); ctx.arc(dx, y + chh - 24, 4, 0, 7); ctx.fillStyle = k < lv ? '#ffcf4a' : k === lv ? (Math.floor(t * 4) % 2 ? '#fff' : '#ffcf4a') : 'rgba(255,255,255,.18)'; ctx.fill();
    }
  }
  const dev = p.ctrl.dev;
  const hint = dev.startsWith('pad') ? '◀ ▶ wählen · A bestätigen' : dev.startsWith('kb1') ? 'A / D wählen · F oder Leertaste bestätigen' : '← → wählen · K oder ↑ bestätigen';
  txt(hint, cx, v.y + 520, 15, 'rgba(255,255,255,.8)', 'center', 700);
}
function drawGame() {
  const vs = viewsList();
  for (const v of vs) drawWorld(v);
  if (vs.length > 1) {
    ctx.fillStyle = '#0a0418'; ctx.fillRect(VW / 2 - 3, 0, 6, VH);
    const g = ctx.createLinearGradient(0, 0, 0, VH); RB_COLORS.forEach((c, i) => g.addColorStop(i / 5, c));
    ctx.fillStyle = g; ctx.fillRect(VW / 2 - 1, 0, 2, VH);
  }
  for (const v of vs) drawPlayerHUD(P[v.i], v);
  drawTopHUD();
  if (game.banner > 0 && S === 'play') {
    const k = Math.min(1, game.banner), sl = Math.max(0, game.banner - 2.4) * 600;
    ctx.globalAlpha = k;
    txt('WELT ' + game.stage, VW / 2 - sl, VH / 2 - 30, 68, '#fff');
    txt(TH.name, VW / 2 + sl, VH / 2 + 26, 28, '#ffcf4a');
    txt('Sammle alle Münzen!', VW / 2, VH / 2 + 64, 18, '#fff', 'center', 700);
    ctx.globalAlpha = 1;
  }
  if (S === 'levelup') for (const v of vs) drawLevelUp(P[v.i], v);
  if (S === 'stageclear') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, VH / 2 - 80, VW, 160);
    ctx.save(); ctx.translate(VW / 2, VH / 2 - 20); const sc = 1 + Math.sin(game.time * 5) * 0.04; ctx.scale(sc, sc); txt('WELT ' + game.stage + ' GESCHAFFT!', 0, 0, 56, '#ffcf4a'); ctx.restore();
    txt('Bonus +' + 500 * game.stage, VW / 2, VH / 2 + 36, 26, '#fff');
  }
  if (S === 'pause') {
    ctx.fillStyle = 'rgba(8,4,24,.75)'; ctx.fillRect(0, 0, VW, VH);
    txt('PAUSE', VW / 2, 200, 64, '#fff');
    ['Weiter spielen', 'Zum Hauptmenü'].forEach((s, i) => txt((pauseSel === i ? '▶ ' : '') + s, VW / 2, 300 + i * 50, 28, pauseSel === i ? '#ffcf4a' : '#aaa'));
    drawControls(VW / 2, 470);
  }
  if (S === 'gameover') {
    ctx.fillStyle = 'rgba(8,4,24,' + Math.min(0.8, stateT) + ')'; ctx.fillRect(0, 0, VW, VH);
    txt('GAME OVER', VW / 2, 220, 80, '#ff4b6b');
    txt('Punkte: ' + game.score, VW / 2, 320, 34, '#fff');
    txt('Welt ' + game.stage + ' · Level ' + game.level, VW / 2, 365, 24, '#ffcf4a');
    txt((game.score >= HI ? '★ Neuer Rekord! ★' : 'Rekord: ' + HI), VW / 2, 415, 24, '#9fe');
    if (stateT > 1.5) txt('Drücke Enter / A für das Menü', VW / 2, 520, 20, '#fff', 'center', 700);
  }
  if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.6, flashT * 3) + ')'; ctx.fillRect(0, 0, VW, VH); }
}
function drawControls(cx, y) {
  const lines = [
    ['Tastatur 1', 'A/D laufen · W/Leertaste springen · F Regenbogen · G Bombe · Esc Pause'],
    ['Tastatur 2', '←/→ laufen · ↑ springen · K (Num1) Regenbogen · L (Num2) Bombe · P Pause'],
    ['Gamepad', 'Stick/Steuerkreuz · A springen · X/RB Regenbogen · B/LB Bombe · Start Pause'],
    ['Tricks', 'Unten + Springen = durch Plattform fallen · Auf Regenbogen stehen + Unten = Regenbogen stürzt ab'],
  ];
  panel(cx - 470, y - 22, 940, lines.length * 28 + 18);
  lines.forEach(([a, b], i) => {
    txt(a, cx - 450, y + i * 28, 15, '#ffcf4a', 'left', 900, false);
    txt(b, cx - 340, y + i * 28, 15, '#fff', 'left', 600, false);
  });
}
function drawIsland(x, y, w) {
  const path = () => {
    ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + w + 4, y - 4); ctx.lineTo(x + w + 4, y + 8); ctx.lineTo(x + w - 4, y + 16);
    const n = Math.floor(w / 9);
    for (let i = n; i >= 0; i--) { const px = x + 4 + (w - 8) * i / n, d = (i % 2 ? 22 + ((i * 37) % 23) : 12) * Math.sin(Math.PI * (0.15 + 0.7 * i / n)); ctx.lineTo(px, y + 14 + d); }
    ctx.lineTo(x - 4, y + 8); ctx.closePath();
  };
  path(); ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = OUT; ctx.stroke();
  const g = ctx.createLinearGradient(0, y, 0, y + 50); g.addColorStop(0, TH.dirt); g.addColorStop(0.3, TH.dirt); g.addColorStop(0.6, TH.dirtDark); g.addColorStop(1, TH.under);
  path(); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = TH.grass; rr(x - 4, y - 4, w + 8, 11, 4); ctx.fill();
  ctx.fillStyle = TH.grassHi; ctx.fillRect(x - 2, y - 4, w + 4, 3);
  const t = menu.t;
  const pd = new Path2D();
  for (let bx = x + 3; bx < x + w - 2; bx += 5) { const s = Math.sin(t * 2.4 + bx * 0.09) * 2 + Math.sin(t * 0.8) * 1.5, hh = 6 + ((bx * 13) % 7); pd.moveTo(bx - 2, y - 3); pd.quadraticCurveTo(bx + s * 0.4, y - 3 - hh * 0.55, bx + s, y - 3 - hh); pd.quadraticCurveTo(bx + 1 + s * 0.4, y - 3 - hh * 0.5, bx + 2, y - 3); }
  ctx.fillStyle = TH.grassDark; ctx.fill(pd);
}
function drawMenu() {
  const t = menu.t;
  const v = { x: 0, y: 0, w: VW, h: VH };
  drawBackdrop(v, { x: t * 50, y: WH - VH }, 1);
  ctx.fillStyle = 'rgba(10,4,30,.25)'; ctx.fillRect(0, 0, VW, VH);
  // Titel
  ctx.save();
  ctx.font = '900 78px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(VW / 2 - 460, 0, VW / 2 + 460, 0);
  for (let i = 0; i <= 12; i++) tg.addColorStop(i / 12, RB_COLORS[(i + Math.floor(t * 6)) % 6]);
  ctx.lineJoin = 'round';
  const ty = 82 + Math.sin(t * 2) * 4;
  ctx.lineWidth = 16; ctx.strokeStyle = '#0a0418'; ctx.strokeText('REGENBOGEN-RABAUKEN', VW / 2, ty + 5);
  ctx.lineWidth = 12; ctx.strokeStyle = '#1a0830'; ctx.strokeText('REGENBOGEN-RABAUKEN', VW / 2, ty);
  ctx.fillStyle = tg; ctx.fillText('REGENBOGEN-RABAUKEN', VW / 2, ty);
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff'; ctx.save(); ctx.beginPath(); ctx.rect(0, ty - 40, VW, 30); ctx.clip(); ctx.fillText('REGENBOGEN-RABAUKEN', VW / 2, ty); ctx.restore();
  ctx.restore();
  txt('Münzen sammeln · Regenbögen schießen · Bomben legen', VW / 2, 140, 20, '#fff', 'center', 700);
  // Bühne mit Figuren
  drawIsland(VW / 2 - 200, 236, 400);
  const ghost = { type: 'ghost', x: VW / 2 - 200 + mod(t * 40, 60), y: 180 + Math.sin(t * 2) * 8, w: 26, h: 28, color: '#ff4b5c', dark: '#a82030', dir: 1, t, flash: 0, hp: 1, maxHp: 1, spawnT: 0 };
  const mine = { type: 'mine', x: VW / 2 + 170, y: 170 + Math.sin(t * 1.6) * 10, w: 26, h: 26, color: '#4a3a6a', dark: '#22183a', dir: -1, t, flash: 0, hp: 1, maxHp: 1, spawnT: 0, rot: t * 1.5, mx: 0.7 };
  drawEnemy(ghost); drawEnemy(mine);
  for (const h of menu.heroes) drawHero(h);
  const items = menu.mode === 2 ? ['mode', 'p1', 'p2', 'start'] : ['mode', 'p1', 'start'];
  const label = id => id === 'mode' ? 'Spieler: ' + (menu.mode === 1 ? '1 Spieler' : '2 Spieler (geteilter Bildschirm)')
    : id === 'p1' ? 'Spieler 1: ' + DEVICES.find(d => d.id === menu.dev[0]).name
    : id === 'p2' ? 'Spieler 2: ' + DEVICES.find(d => d.id === menu.dev[1]).name : '▶  SPIEL STARTEN  ◀';
  panel(VW / 2 - 350, 290, 700, items.length * 44 + 16);
  items.forEach((id, i) => {
    const y = 314 + i * 44, sel = menu.sel === id;
    if (sel) { rr(VW / 2 - 335, y - 19, 670, 38, 10); ctx.fillStyle = 'rgba(255,207,74,.2)'; ctx.fill(); }
    const s = id === 'start' ? label(id) : (sel ? '◀  ' : '') + label(id) + (sel ? '  ▶' : '');
    txt(s, VW / 2, y, id === 'start' ? 28 : 21, sel ? '#ffcf4a' : '#e8e8f0', 'center', 800);
  });
  txt('Gamepads erkannt: ' + PADS.length + (PADS.length ? ' (' + PADS.map((p, i) => (i + 1) + ': ' + p.id.split('(')[0].trim().slice(0, 22)).join(', ') + ')' : ' – Taste am Pad drücken, um es zu aktivieren'),
    VW / 2, 500, 14, PADS.length ? '#8f8' : '#eee', 'center', 700, true);
  drawControls(VW / 2, 548);
  txt('Ziel: Alle Münzen einer Welt sammeln. Power-Kristalle machen Gegner essbar. Punkte bringen Level-Ups – dann wählst du 1 von 3 Upgrades!', VW / 2, 682, 14, '#fff', 'center', 700, true);
  txt('Rekord: ' + HI, VW / 2, 704, 14, '#9fe', 'center', 800, true);
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (S === 'menu') drawMenu(); else drawGame();
}

// ================== Hauptschleife ==================
makeBackground();
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(nowT) {
  let d = (nowT - last) / 1000; last = nowT;
  if (d > 0.25) d = 0.25;
  acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; for (const k in keyLatch) delete keyLatch[k]; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
